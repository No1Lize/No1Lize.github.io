<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>VCIQ 独立阅读</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --paper: #ffffff;
      --ink: #111714;
      --muted: #66706b;
      --faint: #8b948f;
      --line: #dfe4df;
      --line-soft: #ebeeeb;
      --green: #2f7d4e;
      --green-dark: #1e633c;
      --green-soft: #e7f2e9;
      --shadow: 0 18px 55px rgba(27, 45, 35, 0.08);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 72% -10%, rgba(56, 132, 82, 0.08), transparent 32rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 246, 243, 0.93);
      backdrop-filter: blur(16px);
    }

    .reader-header-inner {
      width: min(1520px, calc(100% - 44px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--green);
      color: var(--green-dark);
      background: var(--paper);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand-copy strong {
      display: block;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0.03em;
    }

    .brand-copy span {
      display: block;
      margin-top: 2px;
      color: var(--faint);
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: 0.12em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      flex: 0 0 auto;
    }

    .favorite-button,
    .original-link {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
    }

    .favorite-button {
      border-color: #9ec3a9;
      color: var(--green-dark);
      background: var(--green-soft);
      font-weight: 650;
    }

    .favorite-button:hover,
    .favorite-button[data-saved="true"] {
      border-color: var(--green);
      color: #fff;
      background: var(--green);
    }

    .favorite-button:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    .original-link:hover {
      border-color: var(--green);
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .reader-main {
      width: min(1340px, calc(100% - 44px));
      margin: 0 auto;
      padding: 52px 0 76px;
    }

    .loading,
    .error-state {
      min-height: 58vh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
      text-align: center;
      color: var(--muted);
    }

    .loading strong,
    .error-state strong {
      color: var(--ink);
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 24px;
      font-weight: 500;
    }

    .article-header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 4px 0 34px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .article-kicker {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1120px;
      margin: 0 auto 22px;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(34px, 4.1vw, 58px);
      font-weight: 500;
      line-height: 1.24;
      letter-spacing: -0.035em;
    }

    .article-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid #a7cbb1;
      color: var(--green-dark);
      background: var(--green-soft);
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(270px, 0.65fr);
      gap: 18px;
      margin-top: 28px;
    }

    .summary-card,
    .benefit-card,
    .content-card {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
    }

    .summary-card,
    .benefit-card {
      padding: 26px 28px;
    }

    .summary-card {
      border-left: 3px solid var(--green);
    }

    .card-label,
    .section-label {
      margin: 0 0 13px;
      color: var(--green);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .summary-text {
      margin: 0;
      color: #27302c;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 17px;
      line-height: 1.95;
    }

    .benefit-list,
    .signal-list,
    .source-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .benefit-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .benefit-list li {
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: #fafbf9;
      color: #3d4842;
      font-size: 11px;
    }

    .content-stack {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .content-card {
      padding: 28px;
      box-shadow: none;
    }

    .content-card h2 {
      margin: 0 0 14px;
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 25px;
      font-weight: 500;
    }

    .content-card p {
      margin: 0;
      color: #4f5b55;
      font-size: 14px;
      line-height: 1.9;
    }

    .signal-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .signal-list li {
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line-soft);
      background: #fafbf9;
      color: #425049;
      font-size: 12px;
    }

    .source-list {
      display: grid;
      gap: 9px;
    }

    .source-list a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line-soft);
      background: #fafbf9;
      color: #34413a;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .source-list a:hover {
      border-color: #a7cbb1;
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .source-list small {
      color: var(--faint);
      white-space: nowrap;
    }

    .quality-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      color: var(--faint);
      font-size: 10px;
    }

    .quality-row span {
      padding: 3px 7px;
      border: 1px solid var(--line);
      background: #fafbf9;
    }

    .back-home {
      margin-top: 22px;
      color: var(--green-dark);
      font-size: 12px;
    }

    @media (max-width: 820px) {
      .reader-header-inner,
      .reader-main { width: min(100% - 26px, 1340px); }
      .brand-copy span { display: none; }
      .summary-grid { grid-template-columns: 1fr; }
      .signal-list { grid-template-columns: 1fr; }
      h1 { font-size: clamp(30px, 8vw, 44px); }
    }

    @media (max-width: 560px) {
      .reader-header-inner { min-height: 58px; gap: 10px; }
      .brand-copy { display: none; }
      .favorite-button,
      .original-link { min-height: 34px; padding: 6px 9px; font-size: 11px; }
      .favorite-button svg { width: 14px; height: 14px; }
      .reader-main { padding-top: 34px; }
      .summary-card,
      .benefit-card,
      .content-card { padding: 21px; }
      .article-meta { gap: 7px 10px; }
    }
  </style>
</head>
<body>
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="brand" href="../" aria-label="返回 VCIQ 首页">
        <span class="brand-mark">V</span>
        <span class="brand-copy">
          <strong>Vertical Capital Intelligence</strong>
          <span>原文提炼 · 投资启示 · 事实边界</span>
        </span>
      </a>
      <div class="header-actions">
        <button class="favorite-button" id="favorite-button" type="button" disabled aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
          </svg>
          <span id="favorite-label">收藏</span>
        </button>
        <a class="original-link" id="original-link" href="../" target="_blank" rel="noreferrer">返回原文 ↗</a>
      </div>
    </div>
  </header>

  <main class="reader-main" id="reader-main">
    <div class="loading">
      <strong>正在载入独立阅读页</strong>
      <span>读取标题、摘要与可追溯信源。</span>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "vciq:favorites:v1";
      const CHANGED_EVENT = "vciq:favorites-changed";
      const params = new URLSearchParams(window.location.search);
      const requestedUrl = params.get("url") || "";
      const requestedTitle = params.get("title") || "";
      const requestedFavoriteId = params.get("fid") || "";
      const main = document.getElementById("reader-main");
      const favoriteButton = document.getElementById("favorite-button");
      const favoriteLabel = document.getElementById("favorite-label");
      const originalLink = document.getElementById("original-link");
      let activeFavorite = null;

      function clean(value) {
        return typeof value === "string"
          ? value.normalize("NFKC").replace(/\s+/g, " ").trim()
          : "";
      }

      function safeHttp(value) {
        try {
          const url = new URL(clean(value));
          return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        } catch {
          return "";
        }
      }

      function unique(values, limit = 24) {
        const seen = new Set();
        const result = [];
        for (const raw of values || []) {
          const value = clean(raw);
          const key = value.toLocaleLowerCase("zh-CN");
          if (!value || seen.has(key)) continue;
          seen.add(key);
          result.push(value);
          if (result.length >= limit) break;
        }
        return result;
      }

      function stableId(title, url) {
        const input = `article|${title}|${url}`;
        let hash = 2166136261;
        for (let index = 0; index < input.length; index += 1) {
          hash ^= input.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return `homepage:article:${(hash >>> 0).toString(36)}`;
      }

      function channelFor(article) {
        const type = clean(article.type);
        if (/人物观点|采访|演讲|公开对话/.test(type)) {
          return { channel: "people", channelLabel: "人物研究" };
        }
        if (/IPO|财报|监管文件/.test(type)) {
          return { channel: "ipo", channelLabel: "上市跟踪" };
        }
        if (/融资|产业投资|并购/.test(type)) {
          return { channel: "institutions", channelLabel: "投资机构" };
        }
        if (/技术突破|产品发布|论文/.test(type)) {
          return { channel: "technology", channelLabel: "新兴科技" };
        }
        if (/政策|报告|公告/.test(type)) {
          return { channel: "reports", channelLabel: "研究报告" };
        }
        return { channel: "companies", channelLabel: "创业案例" };
      }

      function parseFavorites() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          const items = Array.isArray(parsed)
            ? parsed
            : parsed && Array.isArray(parsed.items)
              ? parsed.items
              : [];
          return items.filter((item) => item && typeof item === "object" && clean(item.id));
        } catch {
          return [];
        }
      }

      function writeFavorites(items) {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({ schemaVersion: 1, items: items.slice(0, 300) }),
        );
        window.dispatchEvent(new CustomEvent(CHANGED_EVENT));
      }

      function isSaved() {
        return Boolean(activeFavorite && parseFavorites().some((item) => item.id === activeFavorite.id));
      }

      function paintFavoriteButton() {
        const saved = isSaved();
        favoriteButton.disabled = !activeFavorite;
        favoriteButton.dataset.saved = saved ? "true" : "false";
        favoriteButton.setAttribute("aria-pressed", saved ? "true" : "false");
        favoriteLabel.textContent = saved ? "已收藏" : "收藏";
        favoriteButton.title = saved ? "取消收藏" : "收藏进 08 收藏频道";
      }

      function toggleFavorite() {
        if (!activeFavorite) return;
        const current = parseFavorites();
        const exists = current.some((item) => item.id === activeFavorite.id);
        writeFavorites(
          exists
            ? current.filter((item) => item.id !== activeFavorite.id)
            : [{ ...activeFavorite, savedAt: new Date().toISOString() }, ...current],
        );
        paintFavoriteButton();
      }

      function create(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function addMeta(container, value, tagged = false) {
        const text = clean(value);
        if (!text) return;
        container.appendChild(create("span", tagged ? "meta-tag" : "", text));
      }

      function sourceRows(article, originalUrl) {
        const rows = [];
        const primaryName = clean(article.source && article.source.name) || "原始来源";
        if (originalUrl) {
          rows.push({
            name: primaryName,
            url: originalUrl,
            level: clean(article.source && article.source.level),
          });
        }
        for (const source of Array.isArray(article.relatedSources) ? article.relatedSources : []) {
          const url = safeHttp(source && source.url);
          if (!url) continue;
          rows.push({
            name: clean(source.name || source.title) || new URL(url).hostname,
            url,
            level: clean(source.level || source.platform),
          });
        }
        const seen = new Set();
        return rows.filter((row) => {
          const key = row.url.toLocaleLowerCase("en-US");
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        }).slice(0, 12);
      }

      function resolveOriginalUrl(article) {
        return safeHttp(
          article.originalUrl ||
          article.canonicalUrl ||
          (article.source && article.source.originalUrl) ||
          (article.source && article.source.url) ||
          requestedUrl,
        );
      }

      function fallbackArticle() {
        const url = safeHttp(requestedUrl);
        return {
          id: stableId(clean(requestedTitle) || "公开情报", url),
          title: clean(requestedTitle) || "公开情报独立阅读页",
          summary: "该条目来自首页公开信源。当前数据快照未找到完整结构化记录，可通过右上角“返回原文”查看来源内容。",
          type: "公司动态",
          region: "全球",
          sector: "科技投资",
          company: "科技产业",
          publishedAt: "",
          importance: 0,
          source: {
            name: url ? new URL(url).hostname.replace(/^www\./, "") : "公开信源",
            url,
            level: "原始材料",
          },
          qualitySignals: ["保留原始来源链接", "未补写来源中不存在的事实"],
        };
      }

      function renderError(message) {
        main.replaceChildren();
        const wrapper = create("div", "error-state");
        wrapper.appendChild(create("strong", "", "无法打开该阅读页"));
        wrapper.appendChild(create("span", "", message));
        const home = create("a", "back-home", "← 返回 VCIQ 首页");
        home.href = "../";
        wrapper.appendChild(home);
        main.appendChild(wrapper);
      }

      function renderArticle(article) {
        const title = clean(article.title) || clean(requestedTitle) || "公开情报";
        const summary = clean(article.summary) || "该来源暂未提供可用摘要，请通过右上角返回原文核验。";
        const originalUrl = resolveOriginalUrl(article);
        const channel = channelFor(article);
        const beneficiaries = unique([
          clean(article.company),
          ...(Array.isArray(article.mentionedCompanies) ? article.mentionedCompanies : []),
          ...(Array.isArray(article.institutions) ? article.institutions : []),
          ...(Array.isArray(article.mentionedPeople) ? article.mentionedPeople : []),
        ], 16);
        const signals = unique([
          ...(Array.isArray(article.qualitySignals) ? article.qualitySignals : []),
          ...(Array.isArray(article.matchedTrackingTerms) ? article.matchedTrackingTerms.map((item) => `命中追踪词：${item}`) : []),
        ], 12);
        const sources = sourceRows(article, originalUrl);
        const favoriteId = clean(requestedFavoriteId) || stableId(title, originalUrl || requestedUrl);
        const pageHref = `${window.location.pathname}${window.location.search}`;

        activeFavorite = {
          id: favoriteId,
          href: pageHref,
          title,
          summary,
          ...channel,
          keywords: unique([
            clean(article.type),
            clean(article.sector),
            ...(Array.isArray(article.matchedTrackingTerms) ? article.matchedTrackingTerms : []),
            ...(Array.isArray(article.mentionedCompanies) ? article.mentionedCompanies : []),
            ...(Array.isArray(article.mentionedPeople) ? article.mentionedPeople : []),
          ], 40),
          sectors: unique([clean(article.sector)], 20),
          sources: sources.map((source) => ({
            name: source.name,
            url: source.url,
            ...(source.level ? { level: source.level } : {}),
          })),
          ...(clean(article.region) ? { region: clean(article.region) } : {}),
          ...(clean(article.company) ? { company: clean(article.company) } : {}),
        };

        document.title = `${title} | VCIQ 独立阅读`;
        originalLink.href = originalUrl || "../";
        originalLink.style.display = originalUrl ? "inline-flex" : "none";
        paintFavoriteButton();

        main.replaceChildren();

        const header = create("section", "article-header");
        header.appendChild(create("p", "article-kicker", "VCIQ · Independent Reading"));
        header.appendChild(create("h1", "", title));
        const meta = create("div", "article-meta");
        addMeta(meta, article.type || "公开情报", true);
        addMeta(meta, article.source && article.source.name);
        addMeta(meta, clean(article.publishedAt).replaceAll("-", "."));
        addMeta(meta, article.region);
        addMeta(meta, article.sector);
        header.appendChild(meta);
        main.appendChild(header);

        const summaryGrid = create("section", "summary-grid");
        const summaryCard = create("article", "summary-card");
        summaryCard.appendChild(create("p", "card-label", "深度摘要"));
        summaryCard.appendChild(create("p", "summary-text", summary));
        summaryGrid.appendChild(summaryCard);

        const benefitCard = create("aside", "benefit-card");
        benefitCard.appendChild(create("p", "card-label", "潜在受益方"));
        const benefitList = create("ul", "benefit-list");
        const benefitValues = beneficiaries.length
          ? beneficiaries
          : unique([article.sector, article.company, "相关产业链"], 8);
        for (const item of benefitValues) {
          benefitList.appendChild(create("li", "", item));
        }
        benefitCard.appendChild(benefitList);
        summaryGrid.appendChild(benefitCard);
        main.appendChild(summaryGrid);

        const stack = create("section", "content-stack");
        const eventCard = create("article", "content-card");
        eventCard.appendChild(create("p", "section-label", "核心事件"));
        eventCard.appendChild(create("h2", "", title));
        eventCard.appendChild(create("p", "", summary));
        const quality = create("div", "quality-row");
        addMeta(quality, article.qualityStatus);
        if (Number.isFinite(Number(article.qualityScore))) {
          addMeta(quality, `质量分 ${Number(article.qualityScore)}`);
        }
        if (Number.isFinite(Number(article.importance)) && Number(article.importance) > 0) {
          addMeta(quality, `重要度 ${Number(article.importance)}`);
        }
        eventCard.appendChild(quality);
        stack.appendChild(eventCard);

        if (signals.length) {
          const signalCard = create("article", "content-card");
          signalCard.appendChild(create("p", "section-label", "事实边界与追踪信号"));
          const list = create("ul", "signal-list");
          for (const signal of signals) list.appendChild(create("li", "", signal));
          signalCard.appendChild(list);
          stack.appendChild(signalCard);
        }

        if (sources.length) {
          const sourceCard = create("article", "content-card");
          sourceCard.appendChild(create("p", "section-label", "可追溯信源"));
          const list = create("ul", "source-list");
          for (const source of sources) {
            const item = create("li", "");
            const link = create("a", "");
            link.href = source.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.appendChild(create("span", "", source.name));
            link.appendChild(create("small", "", source.level || "查看来源 ↗"));
            item.appendChild(link);
            list.appendChild(item);
          }
          sourceCard.appendChild(list);
          stack.appendChild(sourceCard);
        }

        main.appendChild(stack);
      }

      async function load() {
        try {
          const response = await fetch("../data/articles.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`数据返回 ${response.status}`);
          const payload = await response.json();
          const articles = Array.isArray(payload.articles) ? payload.articles : [];
          const targetUrl = safeHttp(requestedUrl);
          const targetTitle = clean(requestedTitle);
          const article =
            articles.find((item) =>
              safeHttp(item && item.source && item.source.url) === targetUrl &&
              (!targetTitle || clean(item && item.title) === targetTitle),
            ) ||
            articles.find((item) => safeHttp(item && item.source && item.source.url) === targetUrl) ||
            articles.find((item) => targetTitle && clean(item && item.title) === targetTitle) ||
            fallbackArticle();
          renderArticle(article);
        } catch (error) {
          if (requestedUrl || requestedTitle) {
            renderArticle(fallbackArticle());
            return;
          }
          renderError(error instanceof Error ? error.message : "文章数据读取失败。请返回首页重新打开。" );
        }
      }

      favoriteButton.addEventListener("click", toggleFavorite);
      window.addEventListener("storage", paintFavoriteButton);
      load();
    })();
  </script>
</body>
</html>
