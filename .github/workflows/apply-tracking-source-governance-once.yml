name: Apply tracking source governance once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/apply-tracking-source-governance-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tracking-source-governance-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/tracking-source-recursion-20260804' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tracking-source-recursion-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch discovery and source-health integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: replacement point not found: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Governance must never delete two owner-entered duplicates. It only
          # removes automatic records that collide with an owner record, or
          # automatic duplicates among themselves.
          replace_once(
              'tools/tracking_source_governance.py',
              '''        source["_index"] = index\n        source["_originalUrl"] = str(source.get("url") or "")''',
              '''        source["_index"] = index\n        source["_originalName"] = str(source.get("name") or "")\n        source["_originalUrl"] = str(source.get("url") or "")''',
          )
          replace_once(
              'tools/tracking_source_governance.py',
              '''    for rows in grouped.values():\n        ranked = sorted(\n            rows,\n            key=lambda row: _source_score(row, int(row.get("_index") or 0)),\n            reverse=True,\n        )\n        winner = ranked[0]\n        keep_ids.add(int(winner.get("_index") or 0))\n        for duplicate in ranked[1:]:\n            duplicate["_removalReason"] = "canonical-duplicate"\n            removed_sources.append(duplicate)\n            duplicate_removed += 1\n            if discovery_suffix_count(duplicate.get("name")) > 1:\n                recursive_removed += 1''',
              '''    for rows in grouped.values():\n        manual_rows = [row for row in rows if not is_auto_source(row)]\n        if manual_rows:\n            for manual in manual_rows:\n                keep_ids.add(int(manual.get("_index") or 0))\n            duplicates = [row for row in rows if is_auto_source(row)]\n        else:\n            ranked = sorted(\n                rows,\n                key=lambda row: _source_score(row, int(row.get("_index") or 0)),\n                reverse=True,\n            )\n            winner = ranked[0]\n            keep_ids.add(int(winner.get("_index") or 0))\n            duplicates = ranked[1:]\n        for duplicate in duplicates:\n            duplicate["_removalReason"] = "canonical-duplicate"\n            removed_sources.append(duplicate)\n            duplicate_removed += 1\n            if discovery_suffix_count(duplicate.get("_originalName")) > 1:\n                recursive_removed += 1''',
          )
          replace_once(
              'tools/tracking_source_governance.py',
              '''    seen: dict[tuple[str, str, str, str], str] = {}\n    configured_ids: set[str] = set()''',
              '''    seen: dict[tuple[str, str, str, str], dict[str, Any]] = {}\n    configured_ids: set[str] = set()''',
          )
          replace_once(
              'tools/tracking_source_governance.py',
              '''        previous = seen.get(key)\n        if previous:\n            errors.append(f"{source_id}: duplicates canonical source {previous}")\n        else:\n            seen[key] = source_id''',
              '''        previous = seen.get(key)\n        if previous and (is_auto_source(source) or is_auto_source(previous)):\n            errors.append(\n                f"{source_id}: duplicates canonical source {previous.get('id', '')}"\n            )\n        elif previous is None:\n            seen[key] = source''',
          )

          # Discovery provenance boundary and canonical host/sector dedupe.
          expand = Path('tools/expand_tracking_entities.py')
          text = expand.read_text(encoding='utf-8')
          import_point = 'from urllib.request import Request, urlopen\n\nROOT = Path(__file__).resolve().parent.parent\n'
          import_block = '''from urllib.request import Request, urlopen\n\ntry:\n    from .tracking_source_governance import (\n        canonical_source_host,\n        looks_like_derived_source_name,\n        strip_discovery_source_suffix,\n    )\nexcept ImportError:\n    from tracking_source_governance import (\n        canonical_source_host,\n        looks_like_derived_source_name,\n        strip_discovery_source_suffix,\n    )\n\nROOT = Path(__file__).resolve().parent.parent\n'''
          if import_point not in text:
              raise SystemExit('expand import point not found')
          text = text.replace(import_point, import_block, 1)
          text = text.replace(
              '''def source_host(url: str) -> str:\n    host = urlparse(url).netloc.lower()\n    return host[4:] if host.startswith("www.") else host''',
              '''def source_host(url: str) -> str:\n    return canonical_source_host(url)''',
              1,
          )
          text = text.replace(
              '''        source = article.get("source") or {}\n        source_name = str(source.get("name") or source.get("platform") or "")\n        host = source_host(str(source.get("url") or ""))\n        region = str(article.get("region") or "全球")''',
              '''        source = article.get("source") or {}\n        source_name = str(source.get("name") or source.get("platform") or "")\n        source_id = str(source.get("id") or source.get("sourceId") or "")\n        derived_source = source_id.startswith("source-auto-") or looks_like_derived_source_name(source_name)\n        host = source_host(str(source.get("url") or ""))\n        region = str(article.get("region") or "全球")''',
              1,
          )
          text = text.replace(
              '''            if host and host not in DENY_SOURCE_HOSTS:\n                srow = row["sources"].setdefault(''',
              '''            if host and host not in DENY_SOURCE_HOSTS and not derived_source:\n                srow = row["sources"].setdefault(''',
              1,
          )
          text = text.replace(
              '''        existing_hosts = {\n            source_host(str(source.get("url") or ""))\n            for source in config.get("sources", [])\n        }''',
              '''        existing_hosts = {\n            source_host(str(source.get("url") or ""))\n            for source in config.get("sources", [])\n            if normalize_term(str(source.get("sector") or ""))\n            == normalize_term(str(track.get("name") or ""))\n        }''',
              1,
          )
          text = text.replace(
              '''            name = clean_candidate(top_names[0][0]) if top_names else host''',
              '''            name = strip_discovery_source_suffix(\n                clean_candidate(top_names[0][0]) if top_names else host\n            )''',
              1,
          )
          text = text.replace(
              '''                    "id": f"source-auto-media-{slugify(host)}",''',
              '''                    "id": (\n                        f"source-auto-media-{slugify(host)}-"\n                        f"{slugify(str(track.get('slug') or track.get('name') or 'track'))}"\n                    ),''',
              1,
          )
          text = text.replace(
              '''                "evidence": ["wikidata-official-site"],''',
              '''                "evidence": [\n                    "corpus-proven-publisher"\n                    if str(source.get("sourceCategory") or "") == "media"\n                    else "wikidata-official-site"\n                ],''',
              1,
          )
          expand.write_text(text, encoding='utf-8')

          # Source health ignores retired automatic source IDs while retaining
          # missing owner/fixed sources as before.
          health = Path('tools/update_source_health.py')
          text = health.read_text(encoding='utf-8')
          text = text.replace(
              '''DEFAULT_POLICY_PATH = ROOT / "config" / "source_health_policy.json"\nDEFAULT_SUMMARY_PATH = Path("/tmp/source-health-issue.md")''',
              '''DEFAULT_POLICY_PATH = ROOT / "config" / "source_health_policy.json"\nDEFAULT_TRACKING_CONFIG_PATH = ROOT / "config" / "user_tracking.json"\nDEFAULT_SUMMARY_PATH = Path("/tmp/source-health-issue.md")''',
              1,
          )
          text = text.replace(
              '''    manual_reviews: dict[str, dict[str, Any]] | None = None,\n) -> tuple[dict[str, Any], dict[str, Any]]:''',
              '''    manual_reviews: dict[str, dict[str, Any]] | None = None,\n    configured_source_ids: set[str] | None = None,\n) -> tuple[dict[str, Any], dict[str, Any]]:''',
              1,
          )
          text = text.replace(
              '''        source_id = _source_id(raw_status)\n        if not source_id:\n            continue\n        seen_ids.add(source_id)''',
              '''        source_id = _source_id(raw_status)\n        if not source_id:\n            continue\n        if (\n            configured_source_ids is not None\n            and source_id.startswith("source-auto-")\n            and source_id not in configured_source_ids\n        ):\n            continue\n        seen_ids.add(source_id)''',
              1,
          )
          text = text.replace(
              '''    for source_id, raw_previous in previous_sources.items():\n        if source_id in seen_ids or not isinstance(raw_previous, dict):\n            continue''',
              '''    for source_id, raw_previous in previous_sources.items():\n        if source_id in seen_ids or not isinstance(raw_previous, dict):\n            continue\n        if (\n            configured_source_ids is not None\n            and source_id.startswith("source-auto-")\n            and source_id not in configured_source_ids\n        ):\n            continue''',
              1,
          )
          text = text.replace(
              '''    parser.add_argument("--reviews", type=Path, default=DEFAULT_REVIEW_PATH)\n    parser.add_argument("--summary", type=Path, default=DEFAULT_SUMMARY_PATH)''',
              '''    parser.add_argument("--reviews", type=Path, default=DEFAULT_REVIEW_PATH)\n    parser.add_argument(\n        "--tracking-config",\n        type=Path,\n        default=DEFAULT_TRACKING_CONFIG_PATH,\n    )\n    parser.add_argument("--summary", type=Path, default=DEFAULT_SUMMARY_PATH)''',
              1,
          )
          text = text.replace(
              '''    manual_reviews = review_index(load_review_manifest(args.reviews))\n\n    state, summary = update_health(\n        previous_payload,\n        article_payload,\n        policy,\n        manual_reviews=manual_reviews,\n    )''',
              '''    manual_reviews = review_index(load_review_manifest(args.reviews))\n    tracking_payload = _read_json(args.tracking_config, {})\n    configured_source_ids = {\n        str(source.get("id") or "")\n        for source in tracking_payload.get("sources", [])\n        if isinstance(source, dict) and str(source.get("id") or "").startswith("source-auto-")\n    }\n\n    state, summary = update_health(\n        previous_payload,\n        article_payload,\n        policy,\n        manual_reviews=manual_reviews,\n        configured_source_ids=configured_source_ids,\n    )''',
              1,
          )
          health.write_text(text, encoding='utf-8')

          # Regression for removed automatic IDs while preserving owner sources.
          source_health_test = Path('tests/test_source_health.py')
          text = source_health_test.read_text(encoding='utf-8')
          method = '''    def test_removed_auto_source_status_and_history_are_not_preserved(self) -> None:\n        previous = {\n            "sources": {\n                "source-auto-media-retired": {\n                    "id": "source-auto-media-retired",\n                    "collectionState": "quarantined",\n                    "alertActive": True,\n                },\n                "owner-source": {\n                    "id": "owner-source",\n                    "collectionState": "quarantined",\n                    "alertActive": True,\n                },\n            }\n        }\n        article_payload = {\n            "sourceStatus": [\n                {\n                    "id": "source-auto-media-retired",\n                    "status": "error",\n                    "error": "HTTP 403",\n                }\n            ],\n            "articles": [],\n        }\n        state, _ = update_health(\n            previous,\n            article_payload,\n            DEFAULT_POLICY,\n            now=datetime(2026, 8, 4, tzinfo=UTC),\n            configured_source_ids=set(),\n        )\n        self.assertNotIn("source-auto-media-retired", state["sources"])\n        self.assertIn("owner-source", state["sources"])\n        self.assertTrue(state["sources"]["owner-source"]["missingFromCurrentRun"])\n\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit('source health test insertion point not found')
          if 'test_removed_auto_source_status_and_history_are_not_preserved' not in text:
              text = text.replace(marker, '\n\n' + method + 'if __name__ == "__main__":\n', 1)
          source_health_test.write_text(text, encoding='utf-8')
          PY

      - name: Patch discovery and refresh workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tracking-discovery.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''          python -m py_compile tools/enrich_tracking_institutions.py\n          python -m py_compile tools/enrich_tracking_people_from_sample_companies.py''',
              '''          python -m py_compile tools/tracking_source_governance.py\n          python -m py_compile tools/enrich_tracking_institutions.py\n          python -m py_compile tools/enrich_tracking_people_from_sample_companies.py''',
              1,
          )
          text = text.replace(
              '''            tests.test_tracking_institution_people \\\n            tests.test_tracking_sample_company_people \\\n            tests.test_tracking_person_channels''',
              '''            tests.test_tracking_source_governance \\\n            tests.test_tracking_institution_people \\\n            tests.test_tracking_sample_company_people \\\n            tests.test_tracking_person_channels''',
              1,
          )
          expand_marker = '''      - name: Expand tracking entities from public web sources\n        id: expand'''
          governance_before = '''      - name: Normalize automatic sources before discovery\n        id: source-governance-before\n        shell: bash\n        run: |\n          set -euo pipefail\n          python tools/tracking_source_governance.py | tee /tmp/source-governance-before.json\n          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/source-governance-before.json'))['changed']).lower())")\n          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"\n\n'''
          if expand_marker not in text:
              raise SystemExit('tracking discovery expand marker not found')
          text = text.replace(expand_marker, governance_before + expand_marker, 1)
          changes_marker = '''      - name: Consolidate discovery changes\n        id: changes'''
          governance_after = '''      - name: Normalize automatic sources after discovery\n        id: source-governance-after\n        shell: bash\n        run: |\n          set -euo pipefail\n          python tools/tracking_source_governance.py | tee /tmp/source-governance-after.json\n          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/source-governance-after.json'))['changed']).lower())")\n          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"\n\n'''
          if changes_marker not in text:
              raise SystemExit('tracking discovery changes marker not found')
          text = text.replace(changes_marker, governance_after + changes_marker, 1)
          text = text.replace(
              '''          if [ "${{ steps.expand.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.directory.outputs.changed }}" = "true" ] ||''',
              '''          if [ "${{ steps.source-governance-before.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.expand.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.directory.outputs.changed }}" = "true" ] ||''',
              1,
          )
          text = text.replace(
              '''             [ "${{ steps.team.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.channels.outputs.changed }}" = "true" ]; then''',
              '''             [ "${{ steps.team.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.channels.outputs.changed }}" = "true" ] || \\\n             [ "${{ steps.source-governance-after.outputs.changed }}" = "true" ]; then''',
              1,
          )
          text = text.replace(
              '''          npm run validate:tracking\n          npm run validate:taxonomy''',
              '''          python tools/tracking_source_governance.py --check\n          npm run validate:tracking\n          npm run validate:taxonomy''',
              1,
          )
          text = text.replace(
              '''            git add config/user_tracking.json config/tracking_auto_discovery.json''',
              '''            git add \\\n              config/user_tracking.json \\\n              config/tracking_auto_discovery.json \\\n              public/data/source_health.json''',
              1,
          )
          text = text.replace(
              '''            git reset --hard origin/main\n\n            if [ "$DISCOVERY_MODE" = "seed-only" ]; then''',
              '''            git reset --hard origin/main\n            python tools/tracking_source_governance.py \\\n              | tee /tmp/source-governance-before-replay.json\n\n            if [ "$DISCOVERY_MODE" = "seed-only" ]; then''',
              1,
          )
          text = text.replace(
              '''            python tools/enrich_tracking_person_channels.py \\\n              --max-tracks 20 | tee /tmp/channel-discovery-replay.json\n\n            npm run validate:tracking''',
              '''            python tools/enrich_tracking_person_channels.py \\\n              --max-tracks 20 | tee /tmp/channel-discovery-replay.json\n            python tools/tracking_source_governance.py \\\n              | tee /tmp/source-governance-after-replay.json\n\n            python tools/tracking_source_governance.py --check\n            npm run validate:tracking''',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/scheduled-sync.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''      - tools/update_source_health.py\n      - tools/source_evidence.py''',
              '''      - tools/update_source_health.py\n      - tools/tracking_source_governance.py\n      - tools/source_evidence.py''',
              1,
          )
          text = text.replace(
              '''            tools/update_source_health.py \\\n            tools/source_evidence.py''',
              '''            tools/update_source_health.py \\\n            tools/tracking_source_governance.py \\\n            tools/source_evidence.py''',
              1,
          )
          text = text.replace(
              '''            tests.test_source_health \\\n            tests.test_source_evidence''',
              '''            tests.test_source_health \\\n            tests.test_tracking_source_governance \\\n            tests.test_source_evidence''',
              1,
          )
          text = text.replace(
              '''      - name: Start a clean full-source status ledger\n        run: python tools/prepare_full_refresh.py''',
              '''      - name: Require a normalized automatic source registry\n        run: python tools/tracking_source_governance.py --check\n      - name: Start a clean full-source status ledger\n        run: python tools/prepare_full_refresh.py''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply governance to current source registry and health state
        run: |
          python tools/tracking_source_governance.py | tee /tmp/source-governance.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/source-governance.json'))
          assert result['changed'] is True
          assert result['errors'] == []
          assert result['sourceCountAfter'] < result['sourceCountBefore']
          assert result['duplicatesRemoved'] + result['deadAutoSourcesRemoved'] > 0
          assert result['renamed'] > 0
          assert result['healthRowsRemoved'] > 0
          PY
          python tools/tracking_source_governance.py --check

      - name: Run source governance and health tests
        run: |
          python -m py_compile \
            tools/tracking_source_governance.py \
            tools/expand_tracking_entities.py \
            tools/update_source_health.py
          python -m unittest \
            tests.test_tracking_source_governance \
            tests.test_source_health
          npm run validate:tracking
          npm run validate:taxonomy

      - name: Run complete regression suite
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit governance implementation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/tracking_source_governance.py \
            tools/expand_tracking_entities.py \
            tools/update_source_health.py \
            tests/test_tracking_source_governance.py \
            tests/test_source_health.py \
            .github/workflows/tracking-discovery.yml \
            .github/workflows/scheduled-sync.yml \
            config/user_tracking.json \
            config/tracking_auto_discovery.json \
            public/data/source_health.json
          git rm -f .github/workflows/apply-tracking-source-governance-once.yml
          git commit -m "fix: govern and deduplicate automatic tracking sources"
          git pull --rebase origin fix/tracking-source-recursion-20260804
          git push origin HEAD:fix/tracking-source-recursion-20260804
