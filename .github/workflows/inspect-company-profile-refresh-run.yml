name: Inspect company profile refresh run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/inspect-company-profile-refresh-run.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.head_ref == 'ops/verify-company-profile-refresh-20260803'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Export recent production and active runs
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --workflow company-profile-incremental-refresh.yml \
            --branch main \
            --limit 10 \
            --json databaseId,createdAt,updatedAt,status,conclusion,headSha,event,url \
            > /tmp/company-profile-incremental-runs.json
          gh run list \
            --limit 50 \
            --json databaseId,name,workflowName,createdAt,updatedAt,status,conclusion,headBranch,headSha,event,url \
            > /tmp/all-recent-runs.json
          python - <<'PY'
          import json

          rows = json.load(open('/tmp/all-recent-runs.json', encoding='utf-8'))
          active = [row for row in rows if row.get('status') != 'completed']
          json.dump(active, open('/tmp/active-runs.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(active, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: company-profile-incremental-runs
          path: |
            /tmp/company-profile-incremental-runs.json
            /tmp/active-runs.json
          retention-days: 1
