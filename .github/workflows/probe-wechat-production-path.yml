name: One-time probe production WeChat sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-wechat-production-path.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe three registered accounts
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import crawl_articles
          from tools import crawl_with_tracking
          from tools import wechat_public_sources
          from tools import wechat_registry_bridge
          from tools import wechat_sogou_bridge
          from tools import wechat_source_registry

          tracking = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          specs = wechat_source_registry.generated_wechat_sources(
              crawl_with_tracking._enabled_tracks(tracking), crawl_with_tracking
          )
          wanted = {
              ('qbitai', 'AI / AGI'),
              ('icbank', '半导体'),
              ('gg-lithium', '新能源'),
          }
          selected = []
          for spec in specs:
              key = (str(spec.get('accountConfigId') or ''), str(spec.get('sector') or ''))
              if key in wanted:
                  item = dict(spec)
                  item['maxItems'] = 1
                  item['maxArticleAgeDays'] = 45
                  selected.append(item)

          wechat_registry_bridge.install(wechat_public_sources)
          wechat_sogou_bridge.install(wechat_public_sources)
          results = []
          for spec in selected:
              try:
                  articles, status = wechat_public_sources.crawl_wechat_source(
                      spec, crawl_articles.DEFAULT_USER_AGENT, crawl_articles
                  )
                  results.append({
                      'accountConfigId': spec.get('accountConfigId'),
                      'name': spec.get('name'),
                      'sector': spec.get('sector'),
                      'status': status,
                      'articles': [
                          {
                              'title': article.get('title'),
                              'publishedAt': article.get('publishedAt'),
                              'wechatAccount': article.get('wechatAccount'),
                              'sector': article.get('sector'),
                              'company': article.get('company'),
                              'mentionedCompanies': article.get('mentionedCompanies', []),
                              'mentionedPeople': article.get('mentionedPeople', []),
                              'matchedTrackingTerms': article.get('matchedTrackingTerms', []),
                              'summary': article.get('summary'),
                              'url': article.get('source', {}).get('url'),
                              'provider': article.get('wechatDiscoveryProvider'),
                          }
                          for article in articles
                      ],
                  })
              except Exception as exc:
                  results.append({
                      'accountConfigId': spec.get('accountConfigId'),
                      'name': spec.get('name'),
                      'sector': spec.get('sector'),
                      'error': f'{type(exc).__name__}: {exc}',
                  })
          Path('diagnostics/wechat-production-probe.json').write_text(
              json.dumps({'selectedCount': len(selected), 'results': results}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-production-probe.json
          git commit -m "ci: record production WeChat source probe"
          git pull --rebase origin main
          git push origin HEAD:main
