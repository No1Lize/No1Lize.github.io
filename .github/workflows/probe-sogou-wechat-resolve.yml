name: One-time probe resolved Sogou WeChat links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-sogou-wechat-resolve.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve one result
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import html
          import http.cookiejar
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def get(url, referer=""):
              request = urllib.request.Request(url, headers={
                  "User-Agent": ua,
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.6",
                  **({"Referer": referer} if referer else {}),
              })
              with opener.open(request, timeout=15) as response:
                  return response.status, response.geturl(), response.read().decode(response.headers.get_content_charset() or "utf-8", errors="replace")

          home = "https://weixin.sogou.com/"
          get(home)
          search_url = "https://weixin.sogou.com/weixin?type=2&query=" + urllib.parse.quote("量子位 大模型") + "&page=1"
          _, _, body = get(search_url, home)
          match = re.search(r'<a[^>]+href="([^"]+)"[^>]+(?:id="sogou_vr_11002601_title_\d+"|uigs="article_title_\d+")', body, flags=re.I | re.S)
          result = {"found": bool(match)}
          if match:
              raw = html.unescape(match.group(1))
              parts = urllib.parse.urlsplit(urllib.parse.urljoin(search_url, raw))
              query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
              encoded = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), ""))
              result["rawUrl"] = raw
              result["encodedUrl"] = encoded
              try:
                  status, final_url, link_body = get(encoded, search_url)
                  result.update({
                      "httpStatus": status,
                      "finalUrl": final_url,
                      "length": len(link_body),
                      "captcha": any(marker in link_body for marker in ("请输入验证码", "antispider", "VerifyCode", "正常行为不是自动程序")),
                      "directUrls": re.findall(r"https?://mp\.weixin\.qq\.com/(?:s|s\?)[^'\"<>\s]+", html.unescape(link_body), flags=re.I)[:5],
                      "urlAssignments": re.findall(r"(?:url|jump_url)\s*\+?=\s*['\"](.*?)['\"]", link_body, flags=re.I | re.S)[:20],
                      "locations": re.findall(r"(?:location(?:\.href|\.replace)?|window\.location)\s*\(?\s*['\"](.*?)['\"]", link_body, flags=re.I | re.S)[:10],
                      "scriptSample": re.sub(r"\s+", " ", link_body)[:2500],
                  })
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}: {exc}"
          Path("diagnostics/sogou-wechat-resolve.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sogou-wechat-resolve.json
          git commit -m "ci: record resolved Sogou WeChat link probe"
          git pull --rebase origin main
          git push origin HEAD:main
