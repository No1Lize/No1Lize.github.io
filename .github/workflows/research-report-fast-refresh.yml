name: Isolated all-company research PDF refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-report-fast-refresh.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: research-report-fast-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_REPORTS_PER_COMPANY: "3"
      RESEARCH_REPORTS_MAX_TOTAL: "48"
      RESEARCH_REPORT_MAX_BYTES: "16777216"
      RESEARCH_REPORT_MAX_ARCHIVE_BYTES: "125829120"
      RESEARCH_REPORT_SEARCH_RESULTS: "14"
      RESEARCH_REPORT_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl and validate all tracked companies
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python tools/crawl_research_reports.py > .github/diagnostics/research-report-fast-crawl.log 2>&1
          CRAWL=$?
          python -m unittest tests.test_research_reports > .github/diagnostics/research-report-fast-tests.log 2>&1
          TESTS=$?
          python - <<'PY' > .github/diagnostics/research-report-fast-index.log 2>&1
          import json
          from pathlib import Path

          config = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('public/data/research_reports.json').read_text(encoding='utf-8'))
          companies = [item for item in config.get('listedCompanies', []) if item.get('enabled', True)]
          statuses = payload.get('sourceStatus', [])
          assert payload.get('trackedCompanies') == len(companies), (payload.get('trackedCompanies'), len(companies))
          assert len(statuses) == len(companies), (len(statuses), len(companies))
          assert set(payload.get('marketCounts', {})) == {'A股', '港股', '美股'}
          for report in payload.get('reports', []):
              path = Path('public') / report['localPdfUrl'].lstrip('/')
              data = path.read_bytes()
              assert data.lstrip().startswith(b'%PDF-'), path
              assert b'%%EOF' in data[-8192:], path
              assert path.stat().st_size == report['fileSizeBytes'], path
          print(json.dumps({
              'trackedCompanies': payload.get('trackedCompanies'),
              'marketCounts': payload.get('marketCounts'),
              'reportCounts': {
                  market: sum(1 for report in payload.get('reports', []) if report.get('market') == market)
                  for market in ('A股', '港股', '美股')
              },
              'reports': len(payload.get('reports', [])),
              'archiveBytes': payload.get('archiveBytes', 0),
              'statuses': {status.get('status'): sum(1 for item in statuses if item.get('status') == status.get('status')) for status in statuses},
          }, ensure_ascii=False, indent=2))
          PY
          INDEX=$?
          cat > .github/diagnostics/research-report-fast-refresh.json <<EOF
          {"crawl":$CRAWL,"tests":$TESTS,"index":$INDEX,"commit":"$GITHUB_SHA","runId":"$GITHUB_RUN_ID"}
          EOF
          echo "crawl=$CRAWL" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated archive and diagnostics
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/research-report-fast-*.log \
            .github/diagnostics/research-report-fast-refresh.json
          VALID=false
          if [ "${{ steps.check.outputs.crawl }}" = "0" ] && \
             [ "${{ steps.check.outputs.tests }}" = "0" ] && \
             [ "${{ steps.check.outputs.index }}" = "0" ]; then
            git add public/data/research_reports.json public/research-reports
            VALID=true
          fi
          git commit -m "data: publish isolated all-company research PDF refresh" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "valid=$VALID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: Trigger Pages
        if: steps.publish.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Fail invalid refresh
        if: steps.check.outputs.crawl != '0' || steps.check.outputs.tests != '0' || steps.check.outputs.index != '0'
        run: exit 1
