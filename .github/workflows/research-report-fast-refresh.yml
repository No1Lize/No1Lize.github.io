name: Isolated all-company research PDF refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-report-fast-refresh.yml
      - tools/crawl_research_reports.py
      - tools/research_report_adapters.py
      - tools/research_report_registry.py
      - tests/test_research_reports.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: research-report-fast-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REFRESH_REVISION: "final-v4"
      RESEARCH_REPORTS_PER_COMPANY: "3"
      RESEARCH_REPORTS_MAX_TOTAL: "48"
      RESEARCH_REPORT_MAX_BYTES: "16777216"
      RESEARCH_REPORT_MAX_ARCHIVE_BYTES: "125829120"
      RESEARCH_REPORT_SEARCH_RESULTS: "14"
      RESEARCH_REPORT_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl and validate all tracked companies
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python tools/crawl_research_reports.py > .github/diagnostics/research-report-fast-crawl.log 2>&1
          CRAWL=$?
          python -m unittest tests.test_research_reports > .github/diagnostics/research-report-fast-tests.log 2>&1
          TESTS=$?
          python - <<'PY' > .github/diagnostics/research-report-fast-index.log 2>&1
          import json
          from pathlib import Path

          config = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('public/data/research_reports.json').read_text(encoding='utf-8'))
          companies = [item for item in config.get('listedCompanies', []) if item.get('enabled', True)]
          statuses = payload.get('sourceStatus', [])
          reports = payload.get('reports', [])
          assert payload.get('trackedCompanies') == len(companies), (payload.get('trackedCompanies'), len(companies))
          assert len(statuses) == len(companies), (len(statuses), len(companies))
          assert set(payload.get('marketCounts', {})) == {'A股', '港股', '美股'}
          reject_terms = (
              'certificate', 'iso 9001', 'form of proxy', 'annual general meeting',
              'poll results', 'monthly return', 'next day disclosure', 'notice of agm',
              '委任表格', '股东大会通知', '月报表', '翌日披露报表',
          )
          for report in reports:
              path = Path('public') / report['localPdfUrl'].lstrip('/')
              data = path.read_bytes()
              assert data.lstrip().startswith(b'%PDF-'), path
              assert b'%%EOF' in data[-8192:], path
              assert path.stat().st_size == report['fileSizeBytes'], path
              combined = f"{report.get('title', '')} {report.get('sourcePageUrl', '')}".casefold()
              assert not any(term.casefold() in combined for term in reject_terms), report.get('title')
          report_counts = {
              market: sum(1 for report in reports if report.get('market') == market)
              for market in ('A股', '港股', '美股')
          }
          assert report_counts['A股'] > 0
          assert report_counts['港股'] > 0
          assert report_counts['美股'] > 0
          print(json.dumps({
              'revision': 'final-v4',
              'trackedCompanies': payload.get('trackedCompanies'),
              'marketCounts': payload.get('marketCounts'),
              'reportCounts': report_counts,
              'reports': len(reports),
              'archiveBytes': payload.get('archiveBytes', 0),
              'statuses': {kind: sum(1 for item in statuses if item.get('status') == kind) for kind in ('ok', 'retained', 'empty', 'failed')},
              'adapterCoverage': {
                  'verified-direct': sum(1 for item in statuses if 'verified-direct' in item.get('adapters', [])),
                  'SEC': sum(1 for item in statuses if 'SEC' in item.get('adapters', [])),
                  'company-domain': sum(1 for item in statuses if 'company-domain' in item.get('adapters', [])),
              },
          }, ensure_ascii=False, indent=2))
          PY
          INDEX=$?
          cat > .github/diagnostics/research-report-fast-refresh.json <<EOF
          {"revision":"final-v4","crawl":$CRAWL,"tests":$TESTS,"index":$INDEX,"commit":"$GITHUB_SHA","runId":"$GITHUB_RUN_ID"}
          EOF
          echo "crawl=$CRAWL" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated archive and diagnostics
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/research-report-fast-*.log \
            .github/diagnostics/research-report-fast-refresh.json
          VALID=false
          if [ "${{ steps.check.outputs.crawl }}" = "0" ] && \
             [ "${{ steps.check.outputs.tests }}" = "0" ] && \
             [ "${{ steps.check.outputs.index }}" = "0" ]; then
            git add public/data/research_reports.json public/research-reports
            VALID=true
          fi
          git commit -m "data: publish final all-company research PDF archive" || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "valid=$VALID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: Trigger Pages
        if: steps.publish.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Fail invalid refresh
        if: steps.check.outputs.crawl != '0' || steps.check.outputs.tests != '0' || steps.check.outputs.index != '0'
        run: exit 1
