name: Refresh tracking discovery once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl only the four per-track discovery routes
        run: python tools/crawl_with_wechat_registry.py --source discovery
      - name: Enrich and validate the current tracking snapshot
        run: |
          python tools/migrate_article_entities.py
          python tools/enrich_tracking_snapshot.py
          python tools/snapshot_retention.py
          python tools/crawl_articles.py --validate-only
          python tools/validate_user_source_coverage.py
          node scripts/validate-tracking-snapshot.mjs
          python tools/reconcile_entity_resolution.py --check
          python tools/build_resolved_company_candidates.py --check
          python tools/company_profile_refresh_queue.py --check
      - name: Commit focused refresh against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refresh-tracking-discovery-main-once.yml
          python tools/run_pipeline.py finalize \
            public-intelligence-frequent-refresh \
            --quality-gate passed
          git add \
            public/data/articles.json \
            public/data/data_lineage.json \
            public/data/pipeline_health.json \
            .github/workflows/refresh-tracking-discovery-main-once.yml
          git commit -m 'data: refresh tracking discovery after entity reconciliation'

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/migrate_article_entities.py
            python tools/enrich_tracking_snapshot.py
            python tools/snapshot_retention.py
            python tools/crawl_articles.py --validate-only
            python tools/validate_user_source_coverage.py
            node scripts/validate-tracking-snapshot.mjs
            python tools/reconcile_entity_resolution.py --check
            python tools/build_resolved_company_candidates.py --check
            python tools/company_profile_refresh_queue.py --check
            python tools/run_pipeline.py finalize \
              public-intelligence-frequent-refresh \
              --quality-gate passed
            git add \
              public/data/articles.json \
              public/data/data_lineage.json \
              public/data/pipeline_health.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
