name: Apply venture team and product semantic fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-venture-team-product-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: venture-team-product-source-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply permanent semantic fixes
        run: python tools/apply_venture_team_product_semantics_fix.py
      - name: Verify focused regressions
        run: |
          python -m py_compile tools/refine_venture_research_evidence.py
          python -m unittest tests.test_refine_venture_research_evidence
      - name: Reprocess and validate formal snapshot
        run: |
          python tools/refine_venture_research_evidence.py
          python tools/refine_venture_research_evidence.py --check
          python tools/normalize_venture_profiles.py
          python tools/stabilize_venture_profiles.py
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
          python tools/crawl_venture_profiles.py --validate-only
          python tools/enrich_venture_profiles.py --validate-only
          python tools/refine_venture_research_evidence.py --check
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_refine_venture_research_evidence \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics \
            tests.test_stabilize_venture_profiles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend consumption
        run: |
          npm install
          node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
      - name: Commit source, tests and validated data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_venture_team_product_semantics_fix.py
          rm -f .github/workflows/apply-venture-team-product-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/refine_venture_research_evidence.py \
            tests/test_refine_venture_research_evidence.py \
            public/data/venture_profiles.json
          git add -u \
            tools/apply_venture_team_product_semantics_fix.py \
            .github/workflows/apply-venture-team-product-fix.yml
          git commit -m 'fix: require biographical team evidence and real product highlights'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 5
          done
          gh workflow run pages.yml --ref main
          gh workflow run refresh-venture-profiles.yml --ref main
