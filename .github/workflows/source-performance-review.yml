name: Monthly source performance review

on:
  schedule:
    - cron: "30 8 1 * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-performance-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source performance and manual review rules
        run: |
          python -m py_compile \
            tools/source_performance.py \
            tools/source_quality_reviews.py \
            tools/source_performance_review.py \
            tools/update_source_health.py
          python -m unittest \
            tests.test_source_performance \
            tests.test_source_quality_reviews \
            tests.test_source_performance_review \
            tests.test_source_health_performance
          python - <<'PY'
          from tools.source_quality_reviews import load_review_manifest
          load_review_manifest()
          PY

      - name: Generate monthly review queue
        run: |
          python tools/source_performance_review.py
          python tools/source_performance_review.py --check

      - name: Commit changed review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/source_performance_review.json \
            docs/source-performance-review.md
          if git diff --cached --quiet; then
            echo "No source-performance review changes."
            exit 0
          fi
          git commit -m "data: refresh monthly source performance review"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python tools/source_performance_review.py
            python tools/source_performance_review.py --check
            git add \
              public/data/source_performance_review.json \
              docs/source-performance-review.md
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done

      - name: Sync monthly review issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[月度审查] 信源效能与降级建议'
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq '.[] | select(.title == "[月度审查] 信源效能与降级建议") | .number' \
            | head -n 1)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file docs/source-performance-review.md
          else
            gh issue create --title "$TITLE" --body-file docs/source-performance-review.md
          fi
