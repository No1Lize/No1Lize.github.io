name: Diagnose homepage refresh status

on:
  pull_request:
    paths:
      - components/dashboard.tsx
      - components/daily-headlines.tsx
      - components/homepage-channel-updates.tsx
      - components/homepage-columns.module.css
      - lib/use-articles.ts
      - lib/snapshot-freshness.ts
      - tests/snapshot-freshness.test.ts
      - .github/workflows/diagnose-homepage-refresh-status.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run complete unit suite
        id: complete
        continue-on-error: true
        run: npm run test:unit > unit-test.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-homepage-unit-log
          path: unit-test.log
          if-no-files-found: error
