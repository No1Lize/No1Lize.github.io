name: Apply venture semantic filter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-venture-semantic-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate semantic filters
        run: |
          python tools/apply_venture_semantic_filter_patch.py
          python -m py_compile tools/venture_profile_extraction.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/venture_profile_extraction.py
          git commit -m 'fix: reject venture team and product navigation noise'
          git pull --rebase origin main
          git push origin HEAD:main
