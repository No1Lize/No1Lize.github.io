name: Apply research PDF relevance filter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-research-pdf-quality-filter.yml
      - tools/apply_research_pdf_quality_filter.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-research-pdf-quality-filter
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic quality filter
        run: python tools/apply_research_pdf_quality_filter.py
      - name: Run research report tests
        run: python -m unittest tests.test_research_reports
      - name: Commit quality filter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research_report_adapters.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: exclude non-research PDFs from listed-company archive"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
