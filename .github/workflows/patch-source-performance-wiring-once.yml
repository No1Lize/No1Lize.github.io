name: Patch source performance wiring once

on:
  push:
    branches: [feat/source-performance-review]
    paths:
      - .github/workflows/patch-source-performance-wiring-once.yml

permissions:
  contents: write

concurrency:
  group: patch-source-performance-wiring-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-performance-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refine performance accounting and complete production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          performance_path = Path('tools/source_performance.py')
          text = performance_path.read_text(encoding='utf-8')
          if '\nimport re\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport re\n',
                  1,
              )

          start = text.index('def annotate_publication_metrics(')
          end = text.index('\ndef new_article_metrics(', start)
          accounting_block = r'''def _title_fingerprint(article: dict[str, Any]) -> str:
    title = re.sub(
        r"[^\w\u4e00-\u9fff]+",
        "",
        str(article.get("title") or "").casefold(),
    )
    if not title:
        return ""
    company = str(article.get("companySlug") or article.get("company") or "")
    published_at = str(article.get("publishedAt") or "")
    return "|".join((company, published_at, title))


def _article_keys(article: dict[str, Any]) -> tuple[str, ...]:
    keys: list[str] = []
    source = article.get("source") if isinstance(article.get("source"), dict) else {}
    url = _normalized_url(source.get("url"))
    fingerprint = _title_fingerprint(article)
    if url:
        keys.append(f"url:{url}")
    if fingerprint:
        keys.append(f"fingerprint:{fingerprint}")
    article_id = str(article.get("id") or "").strip()
    if not keys and article_id:
        keys.append(f"id:{article_id}")
    return tuple(keys)


def _current_candidate_groups(
    incoming: list[dict[str, Any]],
    statuses: list[dict[str, Any]],
) -> tuple[dict[str, list[dict[str, Any]]], set[str]]:
    grouped: dict[str, list[dict[str, Any]]] = defaultdict(list)
    for article in incoming:
        if not isinstance(article, dict):
            continue
        source_id = _source_id(article)
        if source_id:
            grouped[source_id].append(article)

    status_by_id = {
        _source_id(status): status
        for status in statuses
        if isinstance(status, dict) and _source_id(status)
    }
    selected: dict[str, list[dict[str, Any]]] = {}
    estimated_ids: set[str] = set()
    for source_id, group in grouped.items():
        status = status_by_id.get(source_id, {})
        if status.get("newAccepted") is None:
            selected[source_id] = group
            continue
        expected = _integer(status.get("newAccepted"))
        if expected <= 0:
            selected[source_id] = []
            continue

        verified_values = [
            str(article.get("lastVerifiedAt") or "")
            for article in group
            if str(article.get("lastVerifiedAt") or "")
        ]
        latest_verified = max(verified_values) if verified_values else ""
        current = [
            article
            for article in group
            if latest_verified
            and str(article.get("lastVerifiedAt") or "") == latest_verified
        ]
        if len(current) >= expected:
            selected[source_id] = current[:expected]
        else:
            # Legacy rows should already have observation metadata. If they do
            # not, use the bounded expected count and explicitly mark the metric
            # as estimated rather than treating retained history as new output.
            selected[source_id] = group[:expected]
            estimated_ids.add(source_id)
    return selected, estimated_ids


def annotate_publication_metrics(
    incoming: list[dict[str, Any]],
    published: list[dict[str, Any]],
    statuses: list[dict[str, Any]],
    *,
    withheld_source_ids: Iterable[str] = (),
) -> list[dict[str, Any]]:
    """Annotate current-run candidate, publication and deduplication counts.

    Adaptive sources may carry bounded historical rows in ``incoming``. Their
    ``newAccepted`` count and current ``lastVerifiedAt`` values isolate the
    current crawl batch. A candidate is a duplicate only when it repeats a URL
    or crawler title fingerprint, or loses to the same identity from another
    source. Other unpublished candidates are recorded separately as dropped.
    """

    withheld_ids = {str(value) for value in withheld_source_ids if str(value)}
    current_groups, estimated_ids = _current_candidate_groups(incoming, statuses)

    published_by_source: dict[str, set[str]] = defaultdict(set)
    published_global: set[str] = set()
    for article in published:
        if not isinstance(article, dict):
            continue
        source_id = _source_id(article)
        keys = _article_keys(article)
        if source_id:
            published_by_source[source_id].update(keys)
        published_global.update(keys)

    for status in statuses:
        if not isinstance(status, dict):
            continue
        source_id = _source_id(status)
        if not source_id:
            continue
        candidates = current_groups.get(source_id, [])
        candidate_count = len(candidates)
        seen_keys: set[str] = set()
        unique_candidates: list[tuple[str, ...]] = []
        intrinsic_duplicates = 0
        for article in candidates:
            keys = _article_keys(article)
            if keys and any(key in seen_keys for key in keys):
                intrinsic_duplicates += 1
                continue
            unique_candidates.append(keys)
            seen_keys.update(keys)

        if source_id in withheld_ids:
            published_count = 0
            duplicate_count = 0
            dropped_count = 0
            withheld_count = candidate_count
        else:
            published_count = 0
            cross_source_duplicates = 0
            dropped_count = 0
            same_source_keys = published_by_source.get(source_id, set())
            for keys in unique_candidates:
                if keys and any(key in same_source_keys for key in keys):
                    published_count += 1
                elif keys and any(key in published_global for key in keys):
                    cross_source_duplicates += 1
                else:
                    dropped_count += 1
            duplicate_count = intrinsic_duplicates + cross_source_duplicates
            withheld_count = 0

        denominator = candidate_count - withheld_count
        status["candidateCount"] = candidate_count
        status["uniqueCandidateCount"] = len(unique_candidates)
        status["publishedCount"] = published_count
        status["duplicateCount"] = duplicate_count
        status["droppedCount"] = dropped_count
        status["withheldCount"] = withheld_count
        status["publicationRate"] = _ratio(published_count, denominator)
        status["duplicateRate"] = _ratio(duplicate_count, denominator)
        status["dropRate"] = _ratio(dropped_count, denominator)
        if source_id in estimated_ids:
            status["candidateMetricEstimated"] = True
        else:
            status.pop("candidateMetricEstimated", None)
    return statuses

'''
          text = text[:start] + accounting_block + text[end + 1:]

          text = text.replace(
              '    accepted = _integer(status.get("accepted"))\n',
              '    accepted = _integer(\n        status.get("newAccepted")\n        if status.get("newAccepted") is not None\n        else status.get("accepted")\n    )\n',
              1,
          )
          text = text.replace(
              '        "withheld": _integer(status.get("withheldCount")),\n',
              '        "withheld": _integer(status.get("withheldCount")),\n        "dropped": _integer(status.get("droppedCount")),\n',
              1,
          )
          text = text.replace(
              '        "withheld": sum(_integer(item.get("withheld")) for item in samples),\n',
              '        "withheld": sum(_integer(item.get("withheld")) for item in samples),\n        "dropped": sum(_integer(item.get("dropped")) for item in samples),\n',
              1,
          )
          text = text.replace(
              '        "duplicateRate": _ratio(totals["duplicates"], duplicate_denominator),\n',
              '        "duplicateRate": _ratio(totals["duplicates"], duplicate_denominator),\n        "dropRate": _ratio(totals["dropped"], duplicate_denominator),\n',
              1,
          )
          performance_path.write_text(text, encoding='utf-8')

          health_path = Path('tools/update_source_health.py')
          health = health_path.read_text(encoding='utf-8')
          if '"droppedCount": _integer(raw_status.get("droppedCount")),' not in health:
              health = health.replace(
                  '            "duplicateCount": _integer(raw_status.get("duplicateCount")),\n',
                  '            "duplicateCount": _integer(raw_status.get("duplicateCount")),\n            "droppedCount": _integer(raw_status.get("droppedCount")),\n',
                  1,
              )
          health_path.write_text(health, encoding='utf-8')

          review_path = Path('tools/source_performance_review.py')
          review = review_path.read_text(encoding='utf-8')
          if '"dropRate": performance.get("dropRate"),' not in review:
              review = review.replace(
                  '            "duplicateRate": performance.get("duplicateRate"),\n',
                  '            "duplicateRate": performance.get("duplicateRate"),\n            "dropRate": performance.get("dropRate"),\n',
                  1,
              )
          review_path.write_text(review, encoding='utf-8')

          test_path = Path('tests/test_source_performance.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          extra_tests = r'''
    def test_unique_unpublished_candidate_is_dropped_not_duplicate(self) -> None:
        statuses = [{"id": "source-a"}]
        annotate_publication_metrics(
            [
                {
                    "id": "unique",
                    "sourceId": "source-a",
                    "title": "Unique event",
                    "publishedAt": "2026-08-04",
                    "source": {"url": "https://example.com/unique"},
                }
            ],
            [],
            statuses,
        )
        self.assertEqual(statuses[0]["duplicateCount"], 0)
        self.assertEqual(statuses[0]["droppedCount"], 1)
        self.assertEqual(statuses[0]["dropRate"], 1.0)

    def test_cross_source_identity_is_counted_as_duplicate(self) -> None:
        candidate = {
            "id": "candidate",
            "sourceId": "source-a",
            "title": "Same event",
            "publishedAt": "2026-08-04",
            "source": {"url": "https://example.com/same"},
        }
        published = {
            **candidate,
            "id": "winner",
            "sourceId": "source-b",
        }
        statuses = [{"id": "source-a"}]
        annotate_publication_metrics([candidate], [published], statuses)
        self.assertEqual(statuses[0]["publishedCount"], 0)
        self.assertEqual(statuses[0]["duplicateCount"], 1)
        self.assertEqual(statuses[0]["droppedCount"], 0)

    def test_adaptive_retained_history_is_not_counted_as_current_candidates(self) -> None:
        current = {
            "id": "current",
            "sourceId": "adaptive",
            "title": "Current event",
            "publishedAt": "2026-08-04",
            "lastVerifiedAt": "2026-08-04T01:00:00Z",
            "source": {"url": "https://example.com/current"},
        }
        retained = {
            "id": "retained",
            "sourceId": "adaptive",
            "title": "Retained event",
            "publishedAt": "2026-07-01",
            "lastVerifiedAt": "2026-07-01T01:00:00Z",
            "source": {"url": "https://example.com/retained"},
        }
        statuses = [{"id": "adaptive", "newAccepted": 1, "accepted": 2}]
        annotate_publication_metrics(
            [current, retained],
            [current, retained],
            statuses,
        )
        self.assertEqual(statuses[0]["candidateCount"], 1)
        self.assertEqual(statuses[0]["publishedCount"], 1)
        self.assertFalse(statuses[0].get("candidateMetricEstimated", False))

'''
          if 'test_unique_unpublished_candidate_is_dropped_not_duplicate' not in tests:
              if marker not in tests:
                  raise SystemExit('source performance test marker not found')
              test_path.write_text(tests.replace(marker, extra_tests + marker, 1), encoding='utf-8')

          health_test_path = Path('tests/test_source_health_performance.py')
          health_tests = health_test_path.read_text(encoding='utf-8')
          retained_test = r'''
    def test_retained_previous_batch_is_not_counted_as_productive(self) -> None:
        previous = {
            "generatedAt": "2026-08-01T00:00:00+00:00",
            "sources": {
                "source-a": {
                    "id": "source-a",
                    "name": "Source A",
                    "platform": "专业媒体",
                    "evidenceGrade": "C",
                    "collectionState": "active",
                    "priority": "normal",
                    "alertActive": False,
                    "consecutiveFailures": 0,
                    "firstObservedAt": "2026-07-01T00:00:00+00:00",
                    "lastProductiveAt": "2026-07-31T00:00:00+00:00",
                }
            },
        }
        state, _ = update_health(
            previous,
            {
                "sourceStatus": [
                    {
                        "id": "source-a",
                        "name": "Source A",
                        "platform": "专业媒体",
                        "status": "partial",
                        "accepted": 3,
                        "retainedPrevious": True,
                    }
                ],
                "articles": [
                    {
                        "sourceId": "source-a",
                        "source": {"evidenceGrade": "C"},
                    }
                ],
            },
            DEFAULT_POLICY,
            now=datetime(2026, 8, 2, tzinfo=UTC),
        )
        entry = state["sources"]["source-a"]
        self.assertEqual(entry["lastProductiveAt"], "2026-07-31T00:00:00+00:00")
        self.assertEqual(entry["performance"]["productiveRuns"], 0)

'''
          if 'test_retained_previous_batch_is_not_counted_as_productive' not in health_tests:
              if marker not in health_tests:
                  raise SystemExit('source health performance test marker not found')
              health_test_path.write_text(
                  health_tests.replace(marker, retained_test + marker, 1),
                  encoding='utf-8',
              )
          PY

      - name: Validate refined accounting
        run: |
          python -m py_compile \
            tools/source_performance.py \
            tools/update_source_health.py \
            tools/source_performance_review.py
          python -m unittest \
            tests.test_source_performance \
            tests.test_source_health_performance \
            tests.test_source_performance_review \
            tests.test_source_performance_workflow

      - name: Commit refinements and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-source-performance-wiring-once.yml
          git add \
            tools/source_performance.py \
            tools/update_source_health.py \
            tools/source_performance_review.py \
            tests/test_source_performance.py \
            tests/test_source_health_performance.py
          git commit -m "fix: measure current source candidates without inflating duplicates"
          git pull --rebase origin feat/source-performance-review
          git push origin HEAD:feat/source-performance-review
