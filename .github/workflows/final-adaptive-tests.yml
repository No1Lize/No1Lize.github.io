name: Final adaptive crawler tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-adaptive-tests.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run syntax and unit tests
        shell: bash
        run: |
          set +e
          REPORT="diagnostics/final-adaptive-tests.txt"
          mkdir -p diagnostics
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "===== py_compile ====="
            python -m py_compile \
              tools/adaptive_public_sources.py \
              tools/robust_web_fallback.py \
              tools/probe_user_sources.py \
              tools/validate_user_source_coverage.py \
              tools/eastmoney_transport.py
            echo "exit_code=$?"
            echo
            echo "===== full_unittest ====="
            python -m unittest discover -s tests -p "test_*.py"
            echo "exit_code=$?"
          } >"$REPORT" 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "ci: record final adaptive crawler tests"
          git pull --rebase origin main
          git push origin HEAD:main
