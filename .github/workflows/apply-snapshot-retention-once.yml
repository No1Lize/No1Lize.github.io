name: Apply rolling snapshot retention once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-snapshot-retention-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-snapshot-retention-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply and validate rolling retention
        run: |
          python -m py_compile tools/crawl_articles.py tools/snapshot_retention.py
          python -m unittest tests.test_snapshot_retention
          python tools/snapshot_retention.py
          python tools/snapshot_retention.py --check
          python tools/crawl_articles.py --validate-only
      - name: Commit formal snapshot and remove one-time workflow
        id: update
        run: |
          rm -f .github/workflows/apply-snapshot-retention-once.yml
          if git diff --quiet -- public/data/articles.json .github/workflows/apply-snapshot-retention-once.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json .github/workflows/apply-snapshot-retention-once.yml
          git commit -m "data: activate rolling article snapshot retention"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish retained snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
