name: Refresh professional venture sources once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-professional-venture-sources-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: professional-venture-source-refresh-once
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh public professional-source evidence
        env:
          PROFESSIONAL_SOURCE_ENABLE_PAID: "false"
          PROFESSIONAL_SOURCE_PUBLIC_DISCOVERY: "true"
          PROFESSIONAL_SOURCE_MAX_COMPANIES: "20"
          PROFESSIONAL_SOURCE_INCLUDE_EXTERNAL_INVESTMENTS: "false"
          PROFESSIONAL_SOURCE_INCLUDE_BENEFICIARIES: "false"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python -m py_compile tools/enrich_professional_venture_sources.py
          python -m unittest -v tests.test_professional_venture_sources
          python tools/enrich_professional_venture_sources.py --max-companies 20
          python tools/enrich_professional_venture_sources.py --validate-only

          python - <<'PY'
          import datetime as dt
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          snapshot_path = root / 'public/data/venture_profiles.json'
          payload = json.loads(snapshot_path.read_text(encoding='utf-8'))
          status_counts = Counter()
          source_records = Counter()
          companies_with_jingdata = []
          companies_with_equity = []
          companies = payload.get('companies') or {}
          for slug, profile in companies.items():
              if not isinstance(profile, dict):
                  continue
              equity = profile.get('equityProfile') or {}
              if isinstance(equity, dict) and (
                  equity.get('shareholders')
                  or equity.get('changes')
                  or equity.get('registeredCapital')
                  or equity.get('creditCode')
              ):
                  companies_with_equity.append(slug)
              for source in profile.get('professionalSources') or []:
                  if not isinstance(source, dict):
                      continue
                  name = str(source.get('name') or '')
                  status = str(source.get('status') or '')
                  status_counts[f'{name}:{status}'] += 1
                  source_records[name] += int(source.get('records') or 0)
                  if name == '鲸准' and status == 'success':
                      companies_with_jingdata.append(slug)
          report = {
              'generatedAt': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'snapshotGeneratedAt': payload.get('professionalSourceGeneratedAt'),
              'paidApiEnabled': False,
              'qccPaidCalls': 0,
              'tianyanchaPaidCalls': 0,
              'companyProfileCount': len(companies),
              'professionalStatusCount': len(payload.get('professionalSourceStatus') or []),
              'statusCounts': dict(sorted(status_counts.items())),
              'sourceRecordCounts': dict(sorted(source_records.items())),
              'companiesWithJingdataPublicPages': sorted(set(companies_with_jingdata)),
              'companiesWithStructuredEquity': sorted(set(companies_with_equity)),
          }
          output = root / 'diagnostics/professional-venture-source-refresh.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY

          npx tsc --noEmit
          node --import tsx --test tests/professional-venture-data.test.ts
          npm run build:pages
      - name: Publish only the generated data files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          publish_file() {
            local path="$1"
            local message="$2"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${path}"
            local sha
            sha="$(gh api "${endpoint}?ref=main" --jq '.sha' 2>/dev/null || true)"
            local request
            request="$(mktemp)"
            python - "$path" "$message" "$sha" "$request" <<'PY'
          import base64
          import json
          import sys

          path, message, sha, request_path = sys.argv[1:]
          payload = {
              'message': message,
              'content': base64.b64encode(open(path, 'rb').read()).decode(),
              'branch': 'main',
          }
          if sha:
              payload['sha'] = sha
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          PY
            gh api --method PUT "$endpoint" --input "$request" >/dev/null
            rm -f "$request"
          }

          publish_file \
            public/data/venture_profiles.json \
            'data: refresh professional financing and equity sources'
          publish_file \
            diagnostics/professional-venture-source-refresh.json \
            'diagnostics: record professional venture source refresh'

          workflow_path='.github/workflows/refresh-professional-venture-sources-once.yml'
          workflow_endpoint="repos/${GITHUB_REPOSITORY}/contents/${workflow_path}"
          workflow_sha="$(gh api "${workflow_endpoint}?ref=main" --jq '.sha')"
          request="$(mktemp)"
          python - "$workflow_sha" "$request" <<'PY'
          import json
          import sys

          sha, request_path = sys.argv[1:]
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump({
                  'message': 'chore: remove one-time professional source refresh',
                  'sha': sha,
                  'branch': 'main',
              }, handle)
          PY
          gh api --method DELETE "$workflow_endpoint" --input "$request" >/dev/null
          rm -f "$request"

          gh workflow run pages.yml --ref main
