name: Refresh professional venture sources once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-professional-venture-sources-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: professional-venture-source-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Refresh public professional-source evidence and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PROFESSIONAL_SOURCE_ENABLE_PAID: "false"
          PROFESSIONAL_SOURCE_PUBLIC_DISCOVERY: "true"
          PROFESSIONAL_SOURCE_MAX_COMPANIES: "20"
          PROFESSIONAL_SOURCE_INCLUDE_EXTERNAL_INVESTMENTS: "false"
          PROFESSIONAL_SOURCE_INCLUDE_BENEFICIARIES: "false"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m py_compile tools/enrich_professional_venture_sources.py
            python -m unittest -v tests.test_professional_venture_sources
            python tools/enrich_professional_venture_sources.py --max-companies 20
            python tools/enrich_professional_venture_sources.py --validate-only

            python - <<'PY'
          import datetime as dt
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          snapshot_path = root / 'public/data/venture_profiles.json'
          payload = json.loads(snapshot_path.read_text(encoding='utf-8'))
          status_counts = Counter()
          source_records = Counter()
          companies_with_jingdata = []
          companies_with_equity = []
          companies = payload.get('companies') or {}
          for slug, profile in companies.items():
              if not isinstance(profile, dict):
                  continue
              equity = profile.get('equityProfile') or {}
              if isinstance(equity, dict) and (
                  equity.get('shareholders')
                  or equity.get('changes')
                  or equity.get('registeredCapital')
                  or equity.get('creditCode')
              ):
                  companies_with_equity.append(slug)
              for source in profile.get('professionalSources') or []:
                  if not isinstance(source, dict):
                      continue
                  name = str(source.get('name') or '')
                  status = str(source.get('status') or '')
                  status_counts[f'{name}:{status}'] += 1
                  source_records[name] += int(source.get('records') or 0)
                  if name == '鲸准' and status == 'success':
                      companies_with_jingdata.append(slug)
          report = {
              'generatedAt': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'snapshotGeneratedAt': payload.get('professionalSourceGeneratedAt'),
              'paidApiEnabled': False,
              'qccPaidCalls': 0,
              'tianyanchaPaidCalls': 0,
              'companyProfileCount': len(companies),
              'professionalStatusCount': len(payload.get('professionalSourceStatus') or []),
              'statusCounts': dict(sorted(status_counts.items())),
              'sourceRecordCounts': dict(sorted(source_records.items())),
              'companiesWithJingdataPublicPages': sorted(set(companies_with_jingdata)),
              'companiesWithStructuredEquity': sorted(set(companies_with_equity)),
          }
          output = root / 'diagnostics/professional-venture-source-refresh.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY

            npx tsc --noEmit
            node --import tsx --test tests/professional-venture-data.test.ts
            npm run build:pages

            rm -f .github/workflows/refresh-professional-venture-sources-once.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/venture_profiles.json diagnostics/professional-venture-source-refresh.json
            git add -u .github/workflows/refresh-professional-venture-sources-once.yml
            git commit -m 'data: refresh professional financing and equity sources'
            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            sleep 6
          done
          exit 1
