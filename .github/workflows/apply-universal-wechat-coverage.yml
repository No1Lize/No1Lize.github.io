name: Apply universal WeChat public-index fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-universal-wechat-coverage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add shared public-index fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          bridge = Path("tools/wechat_registry_bridge.py")
          text = bridge.read_text(encoding="utf-8")

          loader = '''def _load_public_indexes(path: Path = PUBLIC_INDEX_PATH) -> dict[str, list[str]]:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              if not isinstance(payload, dict) or int(payload.get("schemaVersion", 0)) != 1:
                  return {}
              accounts = payload.get("accounts", {})
              if not isinstance(accounts, dict):
                  return {}
              result = {
                  str(account_id): _unique(
                      str(url)
                      for url in urls
                      if isinstance(urls, list)
                      and str(url).startswith(("https://", "http://"))
                  )
                  for account_id, urls in accounts.items()
                  if isinstance(urls, list)
              }
              global_indexes = payload.get("globalIndexes", [])
              if isinstance(global_indexes, list):
                  result["*"] = _unique(
                      str(url)
                      for url in global_indexes
                      if str(url).startswith(("https://", "http://"))
                  )
              return result
          '''
          loader = re.sub(r"^ {10}", "", loader, flags=re.MULTILINE)
          text, count = re.subn(
              r"def _load_public_indexes\(.*?\n\nclass PublicIndexParser",
              loader + "\n\nclass PublicIndexParser",
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("failed to replace public index loader")

          generated = '''    def generated_wechat_sources(tracks: Any, tracking: Any) -> list[dict[str, Any]]:
              specs = original_generate(tracks, tracking)
              for spec in specs:
                  account_id = str(spec.get("accountConfigId") or "")
                  shared = index_map.get("*", []) if spec.get("genericDiscovery") else []
                  spec["publicIndexUrls"] = _unique(
                      [*index_map.get(account_id, []), *shared]
                  )
              return specs
          '''
          generated = re.sub(r"^ {10}", "", generated, flags=re.MULTILINE)
          text, count = re.subn(
              r"    def generated_wechat_sources\(tracks: Any, tracking: Any\).*?        return specs",
              generated.rstrip(),
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("failed to replace generated source wrapper")
          bridge.write_text(text, encoding="utf-8")

          index_path = Path("config/wechat_public_indexes.json")
          payload = json.loads(index_path.read_text(encoding="utf-8"))
          payload["globalIndexes"] = ["https://weixin.imaseo.com/"]
          index_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_wechat_public_index_fallback.py")
          test = test_path.read_text(encoding="utf-8")
          if "test_generic_track_receives_shared_public_index" not in test:
              anchor = "    def test_index_parser_keeps_only_matching_account_and_relevant_titles(self) -> None:\n"
              addition = '''    def test_generic_track_receives_shared_public_index(self) -> None:
                  tracking = crawl_with_tracking.load_tracking()
                  tracks = crawl_with_tracking._enabled_tracks(tracking)
                  specs = wechat.generated_wechat_sources(tracks, crawl_with_tracking)
                  spec = next(
                      item
                      for item in specs
                      if item.get("genericDiscovery")
                      and item.get("sector") == "商业航天"
                  )
                  self.assertIn("https://weixin.imaseo.com/", spec["publicIndexUrls"])
                  self.assertNotIn("expectedAccounts", spec)

              '''
              addition = re.sub(r"^ {14}", "", addition, flags=re.MULTILINE)
              if anchor not in test:
                  raise SystemExit("public index test anchor missing")
              test = test.replace(anchor, addition + anchor, 1)
              test_path.write_text(test, encoding="utf-8")

          Path(".github/workflows/apply-universal-wechat-coverage.yml").unlink()
          PY

      - name: Validate universal fallback
        run: |
          python -m py_compile \
            tools/wechat_source_registry.py \
            tools/wechat_sogou_index.py \
            tools/wechat_registry_bridge.py \
            tools/wechat_public_sources.py
          python -m unittest \
            tests.test_wechat_source_registry \
            tests.test_wechat_sogou_index \
            tests.test_wechat_public_index_fallback \
            tests.test_wechat_public_sources
          python - <<'PY'
          from tools import crawl_with_tracking
          from tools import refresh_wechat_snapshot

          tracking = crawl_with_tracking.load_tracking()
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = refresh_wechat_snapshot.configured_sources()
          expected = {track["name"] for track in tracks}
          generic = {
              spec["sector"]: spec
              for spec in specs
              if spec.get("genericDiscovery")
          }
          missing = sorted(expected - set(generic))
          missing_indexes = sorted(
              sector
              for sector, spec in generic.items()
              if not spec.get("publicIndexUrls")
          )
          if missing or missing_indexes:
              raise SystemExit(
                  f"missing generic sources={missing}, missing indexes={missing_indexes}"
              )
          print(f"validated {len(expected)} enabled tracks and {len(specs)} sources")
          PY

      - name: Commit universal fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add shared public-index fallback to every WeChat track"
          git pull --rebase origin main
          python -m unittest \
            tests.test_wechat_source_registry \
            tests.test_wechat_sogou_index \
            tests.test_wechat_public_index_fallback
          git push origin HEAD:main
