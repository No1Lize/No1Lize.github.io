name: Fix candidate review lint once

on:
  push:
    branches: [feat/tracking-company-candidate-review-20260805]
    paths:
      - .github/workflows/fix-candidate-review-lint-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracking-company-candidate-review-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive review selection and drafts without state effects
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/tracking-company-candidate-review.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''  type CompanyCandidate,\n  type CompanyCandidateSnapshot,''',
              '''  type CompanyCandidateSnapshot,''',
              1,
          )
          text = text.replace(
              '''  const [note, setNote] = useState("");\n  const [mergedSlug, setMergedSlug] = useState("");''',
              '''  const [drafts, setDrafts] = useState<\n    Record<string, { note: string; mergedSlug: string }>\n  >({});''',
              1,
          )
          text = text.replace(
              '''  const selected = useMemo(\n    () =>\n      candidates.find((candidate) => candidate.decisionKey === selectedKey) ??\n      filtered[0] ??\n      candidates[0],\n    [candidates, filtered, selectedKey],\n  );''',
              '''  const selected = useMemo(\n    () =>\n      filtered.find((candidate) => candidate.decisionKey === selectedKey) ??\n      filtered[0],\n    [filtered, selectedKey],\n  );\n  const selectedDecision = selected\n    ? decisionForCompanyCandidate(selected, manifest)\n    : undefined;\n  const selectedDraft = selected ? drafts[selected.decisionKey] : undefined;\n  const note = selectedDraft?.note ?? selectedDecision?.note ?? selected?.note ?? "";\n  const mergedSlug =\n    selectedDraft?.mergedSlug ??\n    selectedDecision?.mergedSlug ??\n    selected?.mergedSlug ??\n    "";''',
              1,
          )
          text = text.replace(
              '''    if (saved) void loadReviewData(saved);''',
              '''    if (saved) {\n      window.setTimeout(() => void loadReviewData(saved), 0);\n    }''',
              1,
          )
          old_effects = '''  useEffect(() => {\n    if (!filtered.length) return;\n    if (!filtered.some((candidate) => candidate.decisionKey === selectedKey)) {\n      setSelectedKey(filtered[0].decisionKey);\n    }\n  }, [filtered, selectedKey]);\n\n  useEffect(() => {\n    if (!selected) {\n      setNote("");\n      setMergedSlug("");\n      return;\n    }\n    const decision = decisionForCompanyCandidate(selected, manifest);\n    setNote(decision?.note ?? selected.note ?? "");\n    setMergedSlug(decision?.mergedSlug ?? selected.mergedSlug ?? "");\n  }, [manifest, selected]);\n\n'''
          if old_effects not in text:
              raise SystemExit('review draft effects not found')
          text = text.replace(old_effects, '', 1)
          text = text.replace(
              '''                onMergedSlugChange={setMergedSlug}\n                onNoteChange={setNote}''',
              '''                onMergedSlugChange={(value) =>\n                  setDrafts((current) => ({\n                    ...current,\n                    [selected.decisionKey]: {\n                      note,\n                      mergedSlug: value,\n                    },\n                  }))\n                }\n                onNoteChange={(value) =>\n                  setDrafts((current) => ({\n                    ...current,\n                    [selected.decisionKey]: {\n                      note: value,\n                      mergedSlug,\n                    },\n                  }))\n                }''',
              1,
          )
          text = text.replace(
              '''function currentToken() {\n  return window.sessionStorage.getItem(TOKEN_SESSION_KEY)?.trim() ?? "";\n}\n''',
              '''function currentToken() {\n  return window.sessionStorage.getItem(TOKEN_SESSION_KEY)?.trim() ?? "";\n}\n\nfunction sourceHost(url: string) {\n  try {\n    return new URL(url).hostname;\n  } catch {\n    return "公开来源";\n  }\n}\n''',
              1,
          )
          text = text.replace(
              '''              <span>{selected.sourceHosts[index] ?? new URL(url).hostname}</span>''',
              '''              <span>{sourceHost(url)}</span>''',
              1,
          )
          text = text.replace(
              '''      setStatus("请先在页面上方完成管理员登录。 ");''',
              '''      setStatus("请先在页面上方完成管理员登录。");''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify frontend and crawler regression
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tracking-company-candidate-review.tsx
          git rm .github/workflows/fix-candidate-review-lint-once.yml
          git commit -m "fix: derive candidate review state without effects"
          git pull --rebase origin feat/tracking-company-candidate-review-20260805
          git push origin HEAD:feat/tracking-company-candidate-review-20260805
