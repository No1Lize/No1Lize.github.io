name: Check venture page inspection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-inspect-venture-pages.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record workflow status and failed log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p diagnostics
          gh run list --workflow inspect-venture-pages.yml --limit 3 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url > diagnostics/venture-pages-inspect-status.json
          RUN_ID="$(python -c 'import json; p=json.load(open("diagnostics/venture-pages-inspect-status.json")); print(p[0]["databaseId"] if p else "")')"
          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --log-failed > diagnostics/venture-pages-inspect-failure.txt 2>&1 || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/venture-pages-inspect-status.json diagnostics/venture-pages-inspect-failure.txt
          git commit -m 'ci: record venture page inspection status'
          git pull --rebase origin main
          git push origin HEAD:main
