name: Verify market detail UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-market-detail-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-market-detail-ui
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test rendered market profile quality
        run: node --import tsx --test tests/market-profile-data.test.ts
      - name: Build static site
        run: GITHUB_PAGES=true npx next build
      - name: Record verification
        run: |
          mkdir -p .github/diagnostics
          cat > .github/diagnostics/market-detail-ui-validation.json <<EOF
          {
            "marketProfileRenderTests": 0,
            "pagesBuild": 0,
            "commit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/market-detail-ui-validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record market detail UI validation"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
