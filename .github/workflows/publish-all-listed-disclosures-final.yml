name: Publish final all-listed disclosure snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-all-listed-disclosures-final.yml
      - tools/sec_configured_disclosures.py
      - tests/test_sec_configured_disclosures.py
      - tests/test_scheduled_sync_workflow.py
      - config/listed_company_disclosure_sources.json

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-all-listed-disclosures-final
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build complete official disclosure snapshot
        id: verify
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/all-listed-company-disclosures-final.log
          python -m py_compile \
            tools/crawl_listed_company_disclosures.py \
            tools/cninfo_structured_disclosures.py \
            tools/sec_structured_disclosures.py \
            tools/sec_configured_disclosures.py \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          compile_exit=$?
          python -m unittest \
            tests.test_listed_company_disclosures \
            tests.test_cninfo_structured_disclosures \
            tests.test_sec_structured_disclosures \
            tests.test_sec_configured_disclosures \
            tests.test_scheduled_sync_workflow \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          test_exit=$?
          python tools/bootstrap_listed_company_disclosures.py \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          bootstrap_exit=$?
          python tools/crawl_listed_company_disclosures.py \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          exchange_exit=$?
          python tools/cninfo_structured_disclosures.py --require-events \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          cninfo_exit=$?
          python tools/sec_configured_disclosures.py --require-events \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          sec_exit=$?
          python tools/sec_configured_disclosures.py --check --require-events \
            >> diagnostics/all-listed-company-disclosures-final.log 2>&1
          check_exit=$?

          COMPILE_EXIT=$compile_exit TEST_EXIT=$test_exit \
          BOOTSTRAP_EXIT=$bootstrap_exit EXCHANGE_EXIT=$exchange_exit \
          CNINFO_EXIT=$cninfo_exit SEC_EXIT=$sec_exit CHECK_EXIT=$check_exit \
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          snapshot = json.loads(Path("public/data/listed_company_disclosures.json").read_text(encoding="utf-8"))
          log = Path("diagnostics/all-listed-company-disclosures-final.log").read_text(
              encoding="utf-8", errors="replace"
          )
          codes = {
              "compile": int(os.environ["COMPILE_EXIT"]),
              "tests": int(os.environ["TEST_EXIT"]),
              "bootstrap": int(os.environ["BOOTSTRAP_EXIT"]),
              "exchange": int(os.environ["EXCHANGE_EXIT"]),
              "cninfo": int(os.environ["CNINFO_EXIT"]),
              "sec": int(os.environ["SEC_EXIT"]),
              "check": int(os.environ["CHECK_EXIT"]),
          }
          statuses = [s for s in snapshot.get("sourceStatus", []) if isinstance(s, dict)]
          sec_statuses = [s for s in statuses if str(s.get("id", "")).startswith("sec-disclosure-")]
          companies = snapshot.get("companies", {})
          passed = (
              all(code == 0 for code in codes.values())
              and int(snapshot.get("companyCount", 0)) == 15
              and len(companies) == 15
              and len(sec_statuses) == 10
              and all(s.get("cikResolved") is True for s in sec_statuses)
              and all(s.get("cikSource") == "configured-official-registry" for s in sec_statuses)
              and all(int(s.get("accepted", 0) or 0) > 0 for s in sec_statuses)
          )
          report = {
              "generatedAt": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "passed": passed,
              "exitCodes": codes,
              "snapshot": {
                  "generatedAt": snapshot.get("generatedAt"),
                  "companyCount": snapshot.get("companyCount", 0),
                  "eventCount": snapshot.get("eventCount", 0),
                  "companySlugs": sorted(companies),
                  "cninfoStructured": snapshot.get("cninfoStructured", {}),
                  "secStructured": snapshot.get("secStructured", {}),
                  "secStatuses": [
                      {
                          "companySlug": s.get("companySlug"),
                          "ticker": s.get("ticker"),
                          "status": s.get("status"),
                          "cik": s.get("cik"),
                          "cikSource": s.get("cikSource"),
                          "cikResolved": s.get("cikResolved"),
                          "scanned": s.get("scanned", 0),
                          "accepted": s.get("accepted", 0),
                          "errors": s.get("errors", []),
                      }
                      for s in sec_statuses
                  ],
              },
              "logTail": log.splitlines()[-180:],
          }
          Path("diagnostics/all-listed-company-disclosures-final.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["snapshot"], ensure_ascii=False))
          print(f"passed={str(passed).lower()}")
          PY
          passed=$(python - <<'PY'
          import json
          print(str(json.load(open("diagnostics/all-listed-company-disclosures-final.json"))["passed"]).lower())
          PY
          )
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit formal data or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-all-listed-disclosures-final.yml
          git add \
            diagnostics/all-listed-company-disclosures-final.json \
            diagnostics/all-listed-company-disclosures-final.log
          if [ "${{ steps.verify.outputs.passed }}" = "true" ]; then
            git add public/data/listed_company_disclosures.json
            message="data: publish disclosures for all 15 listed companies"
          else
            git restore public/data/listed_company_disclosures.json
            message="diagnostics: record final listed-company disclosure failure"
          fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Publish company pages
        if: steps.verify.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
