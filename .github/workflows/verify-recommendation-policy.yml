name: One-time recommendation policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-recommendation-policy.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm install > recommendation-policy-test.log 2>&1
          install_status=$?
          test_status=99
          if [ "$install_status" -eq 0 ]; then
            npm run test:unit >> recommendation-policy-test.log 2>&1
            test_status=$?
          fi
          export INSTALL_STATUS="$install_status"
          export TEST_STATUS="$test_status"
          export TEST_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = Path("recommendation-policy-test.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          install_status = int(os.environ["INSTALL_STATUS"])
          test_status = int(os.environ["TEST_STATUS"])
          target = Path("diagnostics/recommendation-policy-status.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(
                  {
                      "commit": os.environ["TEST_SHA"],
                      "installStatus": install_status,
                      "testStatus": test_status,
                      "passed": install_status == 0 and test_status == 0,
                      "logTail": lines[-100:],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/recommendation-policy-status.json
          git commit -m "ci: record recommendation policy verification" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
