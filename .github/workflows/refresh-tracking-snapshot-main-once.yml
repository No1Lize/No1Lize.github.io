name: Refresh main tracking snapshot once

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record pre-refresh article baseline
        run: python tools/prepare_frequent_refresh.py
      - name: Crawl current public intelligence routes
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python tools/crawl_with_wechat_registry.py --source news
      - name: Re-enrich snapshot against current tracking config
        run: |
          python tools/migrate_article_entities.py
          python tools/enrich_tracking_snapshot.py
          python tools/snapshot_retention.py
          python tools/finalize_frequent_refresh.py
      - name: Verify refreshed snapshot
        run: |
          python tools/validate_professional_media_snapshot.py --require-articles
          python tools/snapshot_retention.py --check
          python tools/crawl_articles.py --validate-only
          python tools/validate_user_source_coverage.py
          node scripts/validate-tracking-snapshot.mjs
          python tools/reconcile_entity_resolution.py --check
          python tools/build_resolved_company_candidates.py --check
          python tools/company_profile_refresh_queue.py --check
      - name: Commit, rebase latest main, and revalidate before push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refresh-tracking-snapshot-main-once.yml

          python tools/run_pipeline.py finalize \
            public-intelligence-frequent-refresh \
            --quality-gate passed

          git add \
            public/data/articles.json \
            public/data/data_lineage.json \
            public/data/pipeline_health.json \
            .github/workflows/refresh-tracking-snapshot-main-once.yml
          git commit -m 'data: refresh tracking snapshot after entity reconciliation'

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/migrate_article_entities.py
            python tools/enrich_tracking_snapshot.py
            python tools/snapshot_retention.py
            python tools/validate_professional_media_snapshot.py --require-articles
            python tools/snapshot_retention.py --check
            python tools/crawl_articles.py --validate-only
            python tools/validate_user_source_coverage.py
            node scripts/validate-tracking-snapshot.mjs
            python tools/reconcile_entity_resolution.py --check
            python tools/build_resolved_company_candidates.py --check
            python tools/company_profile_refresh_queue.py --check
            python tools/run_pipeline.py finalize \
              public-intelligence-frequent-refresh \
              --quality-gate passed
            git add \
              public/data/articles.json \
              public/data/data_lineage.json \
              public/data/pipeline_health.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
