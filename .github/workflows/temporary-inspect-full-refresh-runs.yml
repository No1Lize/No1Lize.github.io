name: Temporary inspect full refresh runs

# Run the complete Python suite against the direct-source regression fix branch.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read

jobs:
  validate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-direct-source-regressions-20260728
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete Python test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee full-python-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-source-full-python-tests
          path: full-python-tests.log
          if-no-files-found: error
      - name: Enforce test result
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success"
