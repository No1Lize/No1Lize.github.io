name: Temporary inspect full refresh runs

# Locate the production refresh triggered by merged PR 98.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-bytedance-production-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect scheduled sync runs
        run: |
          set -euo pipefail
          gh run list \
            --workflow scheduled-sync.yml \
            --limit 12 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url,displayTitle \
            > refresh-runs.json
          cat refresh-runs.json
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-production-refresh-queue
          path: refresh-runs.json
          if-no-files-found: error
