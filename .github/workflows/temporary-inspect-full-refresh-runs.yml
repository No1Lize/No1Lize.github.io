name: Temporary inspect full refresh runs

# Inspect the public ByteDance company article API payload.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read

jobs:
  inspect-bytedance-article-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and summarize article API
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          curl -L --fail --retry 2 -A "$ua" -H 'Referer: https://www.bytedance.com/zh/news' \
            'https://www.bytedance.com/api/articles?limit=12&offset=0' \
            -D diagnostics/headers.txt -o diagnostics/articles.json
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('diagnostics/articles.json').read_text(encoding='utf-8'))
          def shape(v, depth=0):
              if depth>5: return type(v).__name__
              if isinstance(v,dict): return {k:shape(val,depth+1) for k,val in list(v.items())[:30]}
              if isinstance(v,list): return [shape(v[0],depth+1)] if v else []
              return type(v).__name__
          Path('diagnostics/shape.json').write_text(json.dumps(shape(data),ensure_ascii=False,indent=2),encoding='utf-8')
          sample=data
          for key in ('data','result','articles','list'):
              if isinstance(sample,dict) and key in sample:
                  sample=sample[key]
          if isinstance(sample,list): sample=sample[:3]
          Path('diagnostics/sample.json').write_text(json.dumps(sample,ensure_ascii=False,indent=2)[:30000],encoding='utf-8')
          PY
          head -30 diagnostics/headers.txt
          cat diagnostics/shape.json
          cat diagnostics/sample.json
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-article-api-diagnostics
          path: diagnostics
          if-no-files-found: error
