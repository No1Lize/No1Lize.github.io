name: Temporary inspect full refresh runs

# Validate PR 98 branch with live official sources and the complete Python suite.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read

jobs:
  validate-bytedance-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bytedance-doubao-volcengine-official-sources-20260728
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run focused tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python -m py_compile \
            tools/bytedance_official_sources.py \
            tools/validate_bytedance_official_live.py \
            tools/eastmoney_transport.py
          python -m unittest -v \
            tests.test_bytedance_official_sources \
            tests.test_official_company_registry_dynamic \
            tests.test_official_company_registry_production \
            2>&1 | tee diagnostics/focused-tests.log
      - name: Require original official articles
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/validate_bytedance_official_live.py \
            --output diagnostics/bytedance-official-live-report.json \
            2>&1 | tee diagnostics/live-validation.log
      - name: Run complete Python test suite
        id: full-tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' \
            2>&1 | tee diagnostics/full-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-official-branch-validation
          path: diagnostics
          if-no-files-found: error
      - name: Enforce validation results
        if: steps.live.outcome != 'success' || steps.full-tests.outcome != 'success'
        run: exit 1
