name: Temporary inspect full refresh runs

# Capture the focused ByteDance production publish failure.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-focused-publish-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download failed log
        run: |
          set -euo pipefail
          gh run view 30319618795 --log-failed > failed.log
          tail -n 260 failed.log | tee failed-tail.log
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-focused-publish-failure
          path: |
            failed.log
            failed-tail.log
          if-no-files-found: error
