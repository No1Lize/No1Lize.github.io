name: Temporary inspect full refresh runs

# Locate the final production refresh after direct-source regression tests were merged.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-final-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect refresh queue
        run: |
          set -euo pipefail
          gh run list \
            --workflow scheduled-sync.yml \
            --limit 10 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url,displayTitle \
            > refresh-queue.json
          cat refresh-queue.json
      - uses: actions/upload-artifact@v4
        with:
          name: final-refresh-queue
          path: refresh-queue.json
          if-no-files-found: error
