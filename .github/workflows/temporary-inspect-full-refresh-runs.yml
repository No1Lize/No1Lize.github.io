name: Temporary inspect full refresh runs

# Probe ByteDance Next.js data routes and page bundle endpoints.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read

jobs:
  inspect-bytedance-next-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Next.js data and bundle endpoints
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          curl -L --fail --retry 2 -A "$ua" 'https://www.bytedance.com/zh/news' -o diagnostics/news.html
          python - <<'PY' > diagnostics/vars.env
          from pathlib import Path
          import json, re
          text = Path('diagnostics/news.html').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'<script[^>]*id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('missing __NEXT_DATA__')
          data = json.loads(m.group(1))
          chunk = re.search(r'https://[^"\']+/pages/news-[^"\']+\.js', text)
          print(f"BUILD_ID={data['buildId']}")
          print(f"ASSET_PREFIX={data.get('assetPrefix','')}")
          print(f"NEWS_CHUNK={chunk.group(0) if chunk else ''}")
          PY
          cat diagnostics/vars.env
          source diagnostics/vars.env
          for url in \
            "https://www.bytedance.com/_next/data/${BUILD_ID}/zh/news.json?locale=zh" \
            "${ASSET_PREFIX}/_next/data/${BUILD_ID}/zh/news.json?locale=zh" \
            "$NEWS_CHUNK"; do
            safe=$(printf '%s' "$url" | sha256sum | cut -c1-12)
            printf '\n### %s\n' "$url" | tee -a diagnostics/probe.txt
            curl -L -A "$ua" -sS -D "diagnostics/${safe}.headers" "$url" -o "diagnostics/${safe}.body" || true
            head -n 1 "diagnostics/${safe}.headers" | tee -a diagnostics/probe.txt
            wc -c "diagnostics/${safe}.body" | tee -a diagnostics/probe.txt
          done
          python - <<'PY'
          from pathlib import Path
          import re
          lines = []
          for path in Path('diagnostics').glob('*.body'):
              text = path.read_text(encoding='utf-8', errors='replace')
              lines.append(f'## {path.name} bytes={len(text)}')
              for pattern in (
                  r'https?://[^"\'<>\\ ]+',
                  r'/(?:api|news|articles?)[^"\'<>\\ ]+',
                  r'fetch\([^)]{0,300}\)',
                  r'axios[^;]{0,300}',
              ):
                  seen = []
                  for value in re.findall(pattern, text, flags=re.I):
                      value = value[:500]
                      if value not in seen:
                          seen.append(value)
                  lines.extend(seen[:120])
          Path('diagnostics/endpoints.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
          sed -n '1,500p' diagnostics/probe.txt
          sed -n '1,800p' diagnostics/endpoints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-next-data-diagnostics
          path: diagnostics
          if-no-files-found: error
