name: Temporary inspect full refresh runs

# Cancel obsolete refreshes that predate the Google registry repair.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: write

jobs:
  prune-obsolete-refreshes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel obsolete pre-fix runs
        run: |
          set -euo pipefail
          for run_id in 30278141149 30280630134; do
            status="$(gh run view "$run_id" --json status --jq .status 2>/dev/null || true)"
            case "$status" in
              queued|pending|in_progress|waiting|requested)
                gh run cancel "$run_id"
                ;;
              *)
                echo "Run $run_id is already $status; no cancellation needed."
                ;;
            esac
          done
      - name: Record current refresh queue
        run: |
          gh run list \
            --workflow scheduled-sync.yml \
            --limit 10 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url,displayTitle \
            > refresh-queue.json
          cat refresh-queue.json
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-run-queue
          path: refresh-queue.json
          if-no-files-found: error
