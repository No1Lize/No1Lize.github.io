name: Temporary inspect full refresh runs

# Fix one test fixture on the dedicated branch. Never merge this workflow.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: write

jobs:
  fix-installer-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bytedance-doubao-volcengine-official-sources-20260728
      - name: Mark the mock original as not installed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_bytedance_official_sources.py')
          text=path.read_text(encoding='utf-8')
          old='        original = Mock(return_value=([{"id": "generic"}], {"status": "ok"}))\n        module = SimpleNamespace(crawl_company=original)\n'
          new='        original = Mock(return_value=([{"id": "generic"}], {"status": "ok"}))\n        original._bytedance_structured_sources = False\n        module = SimpleNamespace(crawl_company=original)\n'
          if old not in text:
              raise SystemExit('fixture marker missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m unittest -v tests.test_bytedance_official_sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_bytedance_official_sources.py
          git commit -m 'test: fix structured source installer fixture'
          git push origin HEAD:fix/bytedance-doubao-volcengine-official-sources-20260728
