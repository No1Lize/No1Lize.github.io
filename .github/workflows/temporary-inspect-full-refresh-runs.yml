name: Temporary inspect full refresh runs

# Inspect public official pages before adding dedicated source adapters.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read

jobs:
  inspect-bytedance-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official pages and extract endpoint clues
        run: |
          set -euo pipefail
          mkdir -p diagnostics/raw
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          curl -L --fail --retry 2 -A "$ua" 'https://www.bytedance.com/zh/news' -o diagnostics/raw/bytedance.html
          curl -L --fail --retry 2 -A "$ua" 'https://seed.bytedance.com/zh/blog' -o diagnostics/raw/doubao-seed.html
          curl -L --fail --retry 2 -A "$ua" 'https://www.volcengine.com/news' -o diagnostics/raw/volcengine.html
          python - <<'PY'
          from pathlib import Path
          import re

          out = []
          patterns = (
              r'https?://[^"\'<>\\ ]+',
              r'/(?:api|news|blog|article|articles)[^"\'<>\\ ]+',
              r'__NEXT_DATA__',
              r'__NUXT__',
              r'window\.__[^= ]+',
          )
          for path in sorted(Path('diagnostics/raw').glob('*.html')):
              text = path.read_text(encoding='utf-8', errors='replace')
              out.append(f'## {path.name} bytes={len(text)}')
              found = []
              for pattern in patterns:
                  found.extend(re.findall(pattern, text, flags=re.IGNORECASE))
              clean = []
              for value in found:
                  value = value.replace('&amp;', '&')[:500]
                  if value not in clean:
                      clean.append(value)
              out.extend(clean[:400])
              out.append('')
          Path('diagnostics/clues.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          sed -n '1,500p' diagnostics/clues.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-official-page-diagnostics
          path: diagnostics
          if-no-files-found: error
