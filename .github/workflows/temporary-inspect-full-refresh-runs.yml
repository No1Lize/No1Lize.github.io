name: Temporary inspect full refresh runs

# Download the failed test output from the post-Google-registry production run.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-failed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect failed test diagnostics
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run view 30281512666 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url,jobs \
            > diagnostics/run.json
          gh run view 30281512666 --log-failed \
            > diagnostics/failed.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: post-registry-failed-test
          path: diagnostics
          if-no-files-found: error
