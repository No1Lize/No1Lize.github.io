name: Temporary inspect full refresh runs

# Verify main data, deployed Pages data and the latest Pages workflow.
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-inspect-full-refresh-runs.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify-bytedance-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare repository and deployed data
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            "https://vciq.github.io/data/articles.json?verify=$(date +%s)" \
            -o diagnostics/deployed-articles.json
          gh run list --workflow pages.yml --limit 8 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url,displayTitle \
            > diagnostics/pages-runs.json
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          slugs = ('official-bytedance', 'official-doubao', 'official-volcengine')
          def summarize(path):
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
              rows = payload.get('articles', [])
              counts = Counter(str(row.get('sourceId', '')) for row in rows)
              return {
                  'generatedAt': payload.get('generatedAt'),
                  'articleCount': payload.get('articleCount', len(rows)),
                  'sources': {
                      slug: {
                          'count': counts[slug],
                          'samples': [
                              {
                                  'title': row.get('title'),
                                  'publishedAt': row.get('publishedAt'),
                                  'url': row.get('source', {}).get('url'),
                              }
                              for row in rows
                              if row.get('sourceId') == slug
                          ][:3],
                      }
                      for slug in slugs
                  },
              }

          report = {
              'repository': summarize('public/data/articles.json'),
              'deployed': summarize('diagnostics/deployed-articles.json'),
              'pagesRuns': json.loads(Path('diagnostics/pages-runs.json').read_text()),
          }
          report['ok'] = all(
              report['repository']['sources'][slug]['count'] > 0
              and report['deployed']['sources'][slug]['count'] > 0
              and report['repository']['sources'][slug]['count']
                  == report['deployed']['sources'][slug]['count']
              for slug in slugs
          ) and any(
              run.get('conclusion') == 'success'
              for run in report['pagesRuns']
          )
          Path('diagnostics/verification.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not report['ok']:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bytedance-publication-verification
          path: diagnostics/verification.json
          if-no-files-found: error
