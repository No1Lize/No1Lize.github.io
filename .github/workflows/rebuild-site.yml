name: Rebuild public snapshot
on:
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]
permissions:
  contents: read
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
