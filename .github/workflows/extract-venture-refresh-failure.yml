name: Extract venture refresh failure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-venture-refresh-failure.yml

permissions:
  contents: write
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract failed log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh run view 30164136696 --log-failed > diagnostics/venture-refresh-failure.txt 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/venture-refresh-failure.txt
          git commit -m 'ci: record venture refresh failure'
          git pull --rebase origin main
          git push origin HEAD:main
