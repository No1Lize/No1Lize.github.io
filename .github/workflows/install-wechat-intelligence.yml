name: One-time install sector-aware WeChat intelligence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-wechat-intelligence.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('tools/wechat_public_sources.py')
          text = module.read_text(encoding='utf-8')
          text = text.replace(
              '''def _key(value: Any) -> str:\n    return _clean(value, 200).normalize("NFKC") if False else _clean(value, 200).casefold()\n\n\n''',
              '',
          )
          text = text.replace(
              '''        people = _unique(\n            _person_name(value) for value in track.get("people", []) if _person_name(value)\n        , 20)''',
              '''        people = _unique(\n            (\n                _person_name(value)\n                for value in track.get("people", [])\n                if _person_name(value)\n            ),\n            20,\n        )''',
          )
          text = text.replace(
              '''        original_crawl_source = tracking.crawler._crawl_config_source\n        if getattr(original_crawl_source, "_wechat_source_dispatch", False):''',
              '''        original_crawl_source = tracking.crawler._crawl_config_source\n        original_load_payload = tracking.crawler.load_existing_payload\n\n        def load_existing_payload(*args: Any, **kwargs: Any) -> dict[str, Any]:\n            payload = original_load_payload(*args, **kwargs)\n            payload["articles"] = [\n                article\n                for article in payload.get("articles", [])\n                if str(article.get("sourceId", "")) != "wechat-public-index"\n            ]\n            payload["sourceStatus"] = [\n                status\n                for status in payload.get("sourceStatus", [])\n                if str(status.get("id", "")) != "wechat-public-index"\n            ]\n            return payload\n\n        tracking.crawler.load_existing_payload = load_existing_payload\n        if getattr(original_crawl_source, "_wechat_source_dispatch", False):''',
          )
          text = text.replace(
              '''    status = (\n        "ok"\n        if accepted and failures == 0\n        else "partial"\n        if accepted\n        else "error"\n        if failures\n        else "empty"\n    )\n    return accepted, crawler._status(''',
              '''    status = "ok" if accepted and failures == 0 else "partial" if accepted else "error"\n    effective_failures = failures if accepted else max(1, failures)\n    return accepted, crawler._status(''',
          )
          text = text.replace(
              '''        failed=failures,\n        platform="微信",\n        error=(\n            "Public WeChat pages could not be read; previous snapshot retained"\n            if failures and not accepted\n            else None\n        ),''',
              '''        failed=effective_failures,\n        platform="微信",\n        error=(\n            "No verified public WeChat articles discovered; previous snapshot retained"\n            if not accepted\n            else None\n        ),''',
          )
          module.write_text(text, encoding='utf-8')

          wrapper = Path('tools/crawl_with_source_categories.py')
          text = wrapper.read_text(encoding='utf-8')
          text = text.replace(
              '''    from . import tracking_taxonomy\n    from . import x_rate_limit''',
              '''    from . import tracking_taxonomy\n    from . import wechat_public_sources\n    from . import x_rate_limit''',
          )
          text = text.replace(
              '''    import tracking_taxonomy\n    import x_rate_limit''',
              '''    import tracking_taxonomy\n    import wechat_public_sources\n    import x_rate_limit''',
          )
          text = text.replace(
              '''    x_rate_limit.install(tracking.crawler)\n    tracking._custom_sources = _custom_sources''',
              '''    x_rate_limit.install(tracking.crawler)\n    wechat_public_sources.install(tracking)\n    tracking._custom_sources = _custom_sources''',
          )
          wrapper.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/scheduled-sync.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '      - tools/generic_web_sources.py\n'
          if '      - tools/wechat_public_sources.py\n' not in text:
              if anchor not in text:
                  raise SystemExit('scheduled workflow anchor not found')
              text = text.replace(anchor, anchor + '      - tools/wechat_public_sources.py\n', 1)
          workflow.write_text(text, encoding='utf-8')

          frontend = Path('lib/use-articles.ts')
          text = frontend.read_text(encoding='utf-8')
          text = text.replace(
              '''  eventClusterId?: string;\n};''',
              '''  eventClusterId?: string;\n  wechatAccount?: string;\n  mentionedCompanies?: string[];\n  mentionedPeople?: string[];\n  matchedTrackingTerms?: string[];\n};''',
          )
          text = text.replace(
              '''  eventClusterId: z.string().optional(),\n});''',
              '''  eventClusterId: z.string().optional(),\n  wechatAccount: z.string().optional(),\n  mentionedCompanies: z.array(z.string()).optional(),\n  mentionedPeople: z.array(z.string()).optional(),\n  matchedTrackingTerms: z.array(z.string()).optional(),\n});''',
          )
          frontend.write_text(text, encoding='utf-8')
          PY

      - name: Verify Python crawler
        run: |
          python -m py_compile tools/wechat_public_sources.py tools/crawl_with_source_categories.py
          python -m unittest tests.test_wechat_public_sources
          python -m unittest discover -s tests -p "test_*.py"
      - name: Verify frontend types
        run: |
          npm install
          npx tsc --noEmit
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_public_sources.py tools/crawl_with_source_categories.py \
            tests/test_wechat_public_sources.py lib/use-articles.ts \
            .github/workflows/scheduled-sync.yml
          git commit -m "feat: crawl sector WeChat articles with company and person entities"
          git pull --rebase origin main
          git push origin HEAD:main
