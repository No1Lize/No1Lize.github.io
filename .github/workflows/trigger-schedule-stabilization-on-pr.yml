name: Trigger schedule stabilization on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-schedule-stabilization.yml
      - .github/workflows/trigger-schedule-stabilization-on-pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'ops/schedule-stabilization-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-stabilization-20260803
          fetch-depth: 0

      - name: Execute the reviewed branch patch
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('.github/workflows/apply-schedule-stabilization.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          raw_code = source[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_code.splitlines()
          ) + "\n"
          code = code.replace(
              '.replace("              ", "    ", 1)',
              '.replace("              ", "    ")',
          )
          exec(compile(code, '<schedule-stabilization>', 'exec'))

          def enforce_schedule(raw_path: str, block: str) -> None:
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(?ms)^  schedule:\n.*?(?=^  [A-Za-z_][A-Za-z0-9_-]*:|^permissions:)',
                  block.rstrip() + '\n',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{raw_path}: could not enforce schedule block')
              path.write_text(updated, encoding='utf-8')

          schedules = {
              '.github/workflows/frequent-intelligence-refresh.yml': '''  schedule:
            # Lightweight user-visible intelligence checks. The 06:17 run is
            # intentionally omitted to leave a clean window for the full refresh.
            - cron: "17 0,2,4,8,10,12,14,16,18,20,22 * * *"
              timezone: "Asia/Taipei"''',
              '.github/workflows/scheduled-sync.yml': '''  schedule:
            # One complete, quality-gated refresh after the US market close.
            - cron: "30 6 * * *"
              timezone: "Asia/Taipei"''',
              '.github/workflows/research-report-refresh.yml': '''  schedule:
            # PDF archives are comparatively heavy and change less frequently.
            - cron: "15 11 * * 2,5"
              timezone: "Asia/Taipei"''',
              '.github/workflows/refresh-venture-profiles.yml': '''  schedule:
            - cron: "15 9 * * *"
              timezone: "Asia/Taipei"''',
              '.github/workflows/tracking-discovery.yml': '''  schedule:
            # Discover entities before the next daily full refresh consumes them.
            - cron: "0 3 * * 0"
              timezone: "Asia/Taipei"''',
              '.github/workflows/star-market-investor-refresh.yml': '''  schedule:
            - cron: "10 3 * * 1"
              timezone: "Asia/Taipei"''',
              '.github/workflows/refresh-institution-rankings.yml': '''  schedule:
            - cron: "10 13 * * 1"
              timezone: "Asia/Taipei"''',
              '.github/workflows/security.yml': '''  schedule:
            - cron: "40 13 * * 1"
              timezone: "Asia/Taipei"''',
          }
          for raw_path, block in schedules.items():
              normalized = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in block.splitlines()
              )
              enforce_schedule(raw_path, normalized)

          for raw_path in (
              '.github/workflows/refresh-all-track-wechat.yml',
              '.github/workflows/star-market-investor-refresh.yml',
          ):
              path = Path(raw_path)
              path.write_text(
                  path.read_text(encoding='utf-8').rstrip() + '\n',
                  encoding='utf-8',
              )
          PY

          rm .github/workflows/trigger-schedule-stabilization-on-pr.yml

      - name: Validate stabilization invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python - <<'PY'
          from pathlib import Path

          pages_targets = (
              '.github/workflows/frequent-intelligence-refresh.yml',
              '.github/workflows/scheduled-sync.yml',
              '.github/workflows/wechat-sync.yml',
              '.github/workflows/refresh-all-track-wechat.yml',
              '.github/workflows/market-profile-refresh.yml',
              '.github/workflows/refresh-listed-company-disclosures.yml',
              '.github/workflows/research-report-refresh.yml',
              '.github/workflows/refresh-venture-profiles.yml',
              '.github/workflows/star-market-investor-refresh.yml',
          )
          for raw_path in pages_targets:
              text = Path(raw_path).read_text(encoding='utf-8')
              assert 'gh workflow run pages.yml --ref main' not in text, raw_path
              print(f'pages dispatch removed: {raw_path}')

          required = {
              '.github/workflows/scheduled-sync.yml': (
                  'queue: max',
                  'cron: "30 6 * * *"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/frequent-intelligence-refresh.yml': (
                  'cron: "17 0,2,4,8,10,12,14,16,18,20,22 * * *"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/research-report-refresh.yml': (
                  'cron: "15 11 * * 2,5"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/refresh-venture-profiles.yml': (
                  'cron: "15 9 * * *"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/tracking-discovery.yml': (
                  'cron: "0 3 * * 0"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/star-market-investor-refresh.yml': (
                  'cron: "10 3 * * 1"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/refresh-institution-rankings.yml': (
                  'cron: "10 13 * * 1"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/security.yml': (
                  'cron: "40 13 * * 1"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/web-test.yml': ('paths-ignore:',),
          }
          for raw_path, needles in required.items():
              text = Path(raw_path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{raw_path}: missing {needle}'
                  print(f'found {needle!r} in {raw_path}')
          PY

      - name: Commit stabilization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: stabilize background refresh schedules"
          git push origin HEAD:ops/schedule-stabilization-20260803
