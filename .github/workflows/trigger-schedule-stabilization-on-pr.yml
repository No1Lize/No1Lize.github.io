name: Trigger schedule stabilization on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-schedule-stabilization.yml
      - .github/workflows/trigger-schedule-stabilization-on-pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'ops/schedule-stabilization-20260803' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-stabilization-20260803
          fetch-depth: 0

      - name: Execute the reviewed branch patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-schedule-stabilization.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          raw_code = source[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_code.splitlines()
          ) + "\n"
          code = code.replace(
              '.replace("              ", "    ", 1)',
              '.replace("              ", "    ")',
          )
          exec(compile(code, '<schedule-stabilization>', 'exec'))

          for raw_path in (
              '.github/workflows/refresh-all-track-wechat.yml',
              '.github/workflows/star-market-investor-refresh.yml',
          ):
              path = Path(raw_path)
              path.write_text(
                  path.read_text(encoding='utf-8').rstrip() + '\n',
                  encoding='utf-8',
              )
          PY

          rm .github/workflows/trigger-schedule-stabilization-on-pr.yml

      - name: Validate stabilization invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python - <<'PY'
          from pathlib import Path

          pages_targets = (
              '.github/workflows/frequent-intelligence-refresh.yml',
              '.github/workflows/scheduled-sync.yml',
              '.github/workflows/wechat-sync.yml',
              '.github/workflows/refresh-all-track-wechat.yml',
              '.github/workflows/market-profile-refresh.yml',
              '.github/workflows/refresh-listed-company-disclosures.yml',
              '.github/workflows/research-report-refresh.yml',
              '.github/workflows/refresh-venture-profiles.yml',
              '.github/workflows/star-market-investor-refresh.yml',
          )
          for raw_path in pages_targets:
              text = Path(raw_path).read_text(encoding='utf-8')
              assert 'gh workflow run pages.yml --ref main' not in text, raw_path
              print(f'pages dispatch removed: {raw_path}')

          required = {
              '.github/workflows/scheduled-sync.yml': (
                  'queue: max',
                  'cron: "30 6 * * *"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/frequent-intelligence-refresh.yml': (
                  'cron: "17 0,2,4,8,10,12,14,16,18,20,22 * * *"',
                  'timezone: "Asia/Taipei"',
              ),
              '.github/workflows/web-test.yml': ('paths-ignore:',),
          }
          for raw_path, needles in required.items():
              text = Path(raw_path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{raw_path}: missing {needle}'
                  print(f'found {needle!r} in {raw_path}')
          PY

      - name: Commit stabilization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: stabilize background refresh schedules"
          git push origin HEAD:ops/schedule-stabilization-20260803
