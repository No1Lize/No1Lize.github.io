name: Validate venture team data publication

on:
  pull_request:
    branches: [main]
    paths:
      - .venture-team-data-trigger
      - .github/workflows/venture-team-data-pr.yml

permissions:
  contents: write

concurrency:
  group: venture-team-data-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run venture regressions
        run: |
          python -m py_compile \
            tools/refine_venture_research_evidence.py \
            tools/normalize_venture_profiles.py \
            tools/finalize_venture_profiles.py \
            tools/enforce_venture_entity_semantics.py \
            tools/stabilize_venture_profiles.py
          python -m unittest \
            tests.test_refine_venture_research_evidence \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics \
            tests.test_stabilize_venture_profiles \
            tests.test_venture_semantic_rebase
      - name: Reprocess formal snapshot to shared fixed point
        shell: bash
        run: |
          set -euo pipefail
          converged=false
          for pass in $(seq 1 8); do
            cp public/data/venture_profiles.json /tmp/before.json
            python tools/refine_venture_research_evidence.py
            python tools/normalize_venture_profiles.py
            python tools/stabilize_venture_profiles.py
            if cmp -s /tmp/before.json public/data/venture_profiles.json; then
              converged=true
              echo "Venture pipeline converged on pass ${pass}."
              break
            fi
          done
          test "$converged" = true
          python tools/refine_venture_research_evidence.py --check
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend data consumption
        run: |
          npm install
          node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
      - name: Commit formal data only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/venture-team-data-pr.yml .venture-team-data-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/venture_profiles.json
          git add -u .github/workflows/venture-team-data-pr.yml .venture-team-data-trigger
          git commit -m 'data: remove navigation phrases from venture teams'
          git push origin HEAD:${{ github.head_ref }}
