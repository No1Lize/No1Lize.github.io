name: Owner-triggered venture sanitation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: owner-triggered-venture-sanitation
  cancel-in-progress: false

jobs:
  sanitize:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[automation] Normalize venture snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize and validate committed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m py_compile \
              tools/venture_profile_extraction.py \
              tools/crawl_venture_profiles.py \
              tools/enrich_venture_profiles.py \
              tools/normalize_venture_profiles.py \
              tools/sanitize_venture_profiles.py \
              tools/sanitize_venture_narratives.py
            python -m unittest \
              tests.test_venture_profile_extraction \
              tests.test_venture_profile_noise_filters \
              tests.test_venture_profile_enrichment \
              tests.test_normalize_venture_profiles \
              tests.test_venture_profile_postprocess \
              tests.test_venture_narrative_sanitizer

            python tools/normalize_venture_profiles.py
            python tools/sanitize_venture_profiles.py
            python tools/sanitize_venture_narratives.py
            python tools/normalize_venture_profiles.py --check
            python tools/sanitize_venture_profiles.py --check
            python tools/sanitize_venture_narratives.py --check
            python tools/crawl_venture_profiles.py --validate-only
            python tools/enrich_venture_profiles.py --validate-only
            git diff --check

            git rm .github/workflows/issue-trigger-venture-sanitize.yml
            git add public/data/venture_profiles.json
            git commit -m "data: normalize startup and institution profiles"
            if git push origin HEAD:main; then
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
              gh workflow run pages.yml --ref main
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
