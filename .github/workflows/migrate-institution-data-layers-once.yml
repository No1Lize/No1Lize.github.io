name: Migrate institution data layers once

on:
  push:
    branches: [feat/institution-auditable-data-layers]
    paths:
      - .github/workflows/migrate-institution-data-layers-once.yml

permissions:
  contents: write

concurrency:
  group: migrate-institution-data-layers-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/institution-auditable-data-layers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Export hardcoded rankings to audited JSON and install typed loader
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source_path = Path('lib/institution-ranking-data.ts')
          source = source_path.read_text(encoding='utf-8')
          array_names = {
              '早期投资': 'qingkeEarly',
              '创业投资': 'qingkeVc',
              '私募股权': 'qingkePe',
              '国资投资': 'qingkeState',
              '战略投资者/CVC': 'qingkeCvc',
              '并购投资': 'qingkeMna',
          }
          category_meta = {
              '早期投资': {'id': 'qingke-2025-early', 'stages': '天使/种子', 'sectors': ['科技创业', '硬科技', '企业服务'], 'title': '2025年中国早期投资机构30强', 'ordered': True},
              '创业投资': {'id': 'qingke-2025-vc', 'stages': '早期至成长期', 'sectors': ['科技', '医疗', '先进制造'], 'title': '2025年中国创业投资机构50强', 'ordered': True},
              '私募股权': {'id': 'qingke-2025-pe', 'stages': '成长期/Pre-IPO', 'sectors': ['科技', '医疗', '消费'], 'title': '2025年中国私募股权投资机构50强', 'ordered': True},
              '国资投资': {'id': 'qingke-2025-state', 'stages': '全阶段', 'sectors': ['硬科技', '先进制造', '区域产业'], 'title': '2025年中国国资投资机构50强', 'ordered': False},
              '战略投资者/CVC': {'id': 'qingke-2025-cvc', 'stages': '战略投资', 'sectors': ['产业协同', '硬科技', '数字化'], 'title': '2025年中国战略投资者/CVC30强', 'ordered': False},
              '并购投资': {'id': 'qingke-2025-mna', 'stages': '并购/控股投资', 'sectors': ['并购整合', '科技', '消费'], 'title': '2025年中国并购投资机构10强', 'ordered': False},
          }

          def strings_for(name: str) -> list[str]:
              match = re.search(rf'const {re.escape(name)} = \[(.*?)\] as const;', source, flags=re.S)
              if not match:
                  raise SystemExit(f'missing ranking array: {name}')
              return [
                  json.loads(item.group(0))
                  for item in re.finditer(r'"(?:\\.|[^"\\])*"', match.group(1))
              ]

          categories = []
          for category, array_name in array_names.items():
              meta = category_meta[category]
              entries = []
              for index, raw in enumerate(strings_for(array_name), start=1):
                  full_name, separator, display_name = raw.partition('|')
                  name = display_name if separator else full_name
                  entry = {'name': name}
                  if separator:
                      entry['fullName'] = full_name
                  if meta['ordered']:
                      entry['rank'] = index
                  entries.append(entry)
              categories.append({
                  'id': meta['id'],
                  'publisher': '清科',
                  'year': 2025,
                  'category': category,
                  'title': meta['title'],
                  'ordered': meta['ordered'],
                  'sourceId': 'qingke-2025-equity-investment',
                  'stages': meta['stages'],
                  'sectors': meta['sectors'],
                  'entries': entries,
              })

          expected = {
              '早期投资': 30,
              '创业投资': 50,
              '私募股权': 50,
              '国资投资': 50,
              '战略投资者/CVC': 30,
              '并购投资': 10,
          }
          actual = {item['category']: len(item['entries']) for item in categories}
          if actual != expected:
              raise SystemExit(f'ranking count mismatch: {actual!r}')

          ranking_payload = {
              'schemaVersion': 1,
              'dataVersion': '2025.1',
              'updatedAt': '2026-08-04',
              'description': 'Auditable institution ranking records. Qingke is the primary structured ranking source; ChinaVenture is retained as a classification reference and is not merged into Qingke ranks.',
              'sources': [
                  {
                      'id': 'qingke-2025-equity-investment',
                      'publisher': '清科研究中心 / 投资界',
                      'year': 2025,
                      'title': '清科2025中国股权投资年度排名总榜单',
                      'url': 'https://news.pedaily.cn/202512/559270.shtml',
                      'role': 'primary-ranking-source',
                      'categories': ['早期投资30强', '创业投资50强', '私募股权50强', '国资投资50强', '战略投资者/CVC30强', '并购投资10强'],
                  },
                  {
                      'id': 'chinaventure-2025-rankings',
                      'publisher': '投中研究院 / 投中网',
                      'year': 2025,
                      'title': '投中2025年度榜单',
                      'url': 'https://www.chinaventure.com.cn/rank/210/list.html',
                      'role': 'classification-reference',
                      'categories': ['创业投资TOP100', '私募股权TOP100', '早期投资TOP50', '中资/外资VC', '中资/外资PE', '企业直投', '人工智能与大数据', '半导体与集成电路', '先进制造与高科技', '商业航天与军民融合', '碳中和'],
                  },
              ],
              'categories': categories,
          }
          Path('config/institution_rankings.json').write_text(
              json.dumps(ranking_payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          loader = r'''import rawRankingData from "@/config/institution_rankings.json";
          import { institutionCatalog } from "./catalog-data";

          export type InstitutionRankingRecord = {
            publisher: "清科";
            year: 2025;
            category: InstitutionRankingCategory;
            title: string;
            rank?: number;
            ordered: boolean;
            sourceId: string;
            sourceUrl: string;
          };

          export type InstitutionRankingCategory =
            | "早期投资"
            | "创业投资"
            | "私募股权"
            | "国资投资"
            | "战略投资者/CVC"
            | "并购投资"
            | "海外代表";

          export type InstitutionDirectoryEntry = {
            name: string;
            fullName?: string;
            region: "中国" | "美国";
            type: string;
            stages: string;
            sectors: string[];
            profileSlug?: string;
            officialUrl?: string;
            rankings: InstitutionRankingRecord[];
          };

          type RankingSource = {
            id: string;
            publisher: string;
            year: number;
            title: string;
            url: string;
            role: "primary-ranking-source" | "classification-reference";
            categories: string[];
          };

          type RankingCategoryRecord = {
            id: string;
            publisher: "清科";
            year: 2025;
            category: Exclude<InstitutionRankingCategory, "海外代表">;
            title: string;
            ordered: boolean;
            sourceId: string;
            stages: string;
            sectors: string[];
            entries: { name: string; fullName?: string; rank?: number }[];
          };

          type RankingPayload = {
            schemaVersion: number;
            dataVersion: string;
            updatedAt: string;
            description: string;
            sources: RankingSource[];
            categories: RankingCategoryRecord[];
          };

          const rankingData = rawRankingData as RankingPayload;
          const sourceById = new Map(rankingData.sources.map((source) => [source.id, source]));

          export const institutionRankingDataVersion = rankingData.dataVersion;
          export const institutionRankingUpdatedAt = rankingData.updatedAt;
          export const institutionRankingSources = rankingData.sources;

          const profileAliases: Record<string, string> = {
            真格基金: "zhenfund",
            IDG资本: "idg-capital",
            深创投集团: "scgc",
            启明创投: "qiming",
            君联资本: "legend-capital",
            达晨财智: "fortune-capital",
            高榕创投: "gaorong",
            经纬创投: "matrix-china",
            红杉中国: "hongshan",
            高瓴投资: "hillhouse",
          };

          const directory = new Map<string, InstitutionDirectoryEntry>();

          for (const category of rankingData.categories) {
            const source = sourceById.get(category.sourceId);
            if (!source) throw new Error(`Missing institution ranking source: ${category.sourceId}`);
            category.entries.forEach((entry, index) => {
              const current = directory.get(entry.name);
              const ranking: InstitutionRankingRecord = {
                publisher: category.publisher,
                year: category.year,
                category: category.category,
                title: category.title,
                rank: category.ordered ? entry.rank ?? index + 1 : undefined,
                ordered: category.ordered,
                sourceId: category.sourceId,
                sourceUrl: source.url,
              };
              if (current) {
                current.rankings.push(ranking);
                current.sectors = [...new Set([...current.sectors, ...category.sectors])];
                if (!current.fullName && entry.fullName) current.fullName = entry.fullName;
                return;
              }
              directory.set(entry.name, {
                name: entry.name,
                fullName: entry.fullName,
                region: "中国",
                type:
                  category.category === "战略投资者/CVC"
                    ? "产业资本/CVC"
                    : category.category === "国资投资"
                      ? "国资投资机构"
                      : category.category === "并购投资"
                        ? "并购投资机构"
                        : category.category,
                stages: category.stages,
                sectors: [...category.sectors],
                profileSlug: profileAliases[entry.name],
                rankings: [ranking],
              });
            });
          }

          for (const institution of institutionCatalog) {
            const matchedName =
              institution.name === "IDG 资本"
                ? "IDG资本"
                : institution.name === "深创投"
                  ? "深创投集团"
                  : institution.name === "高瓴"
                    ? "高瓴投资"
                    : institution.name;
            const existing = directory.get(matchedName);
            if (existing) {
              existing.profileSlug = institution.slug;
              existing.officialUrl = institution.source.url;
              existing.type = institution.type;
              existing.stages = institution.stages;
              existing.sectors = institution.sectors;
              continue;
            }
            directory.set(institution.name, {
              name: institution.name,
              fullName: institution.englishName,
              region: institution.region,
              type: institution.type,
              stages: institution.stages,
              sectors: institution.sectors,
              profileSlug: institution.slug,
              officialUrl: institution.source.url,
              rankings: [],
            });
          }

          export const institutionDirectory = [...directory.values()].sort((left, right) => {
            const leftRank = Math.min(...left.rankings.map((item) => item.rank ?? 999), 999);
            const rightRank = Math.min(...right.rankings.map((item) => item.rank ?? 999), 999);
            return (
              Number(Boolean(right.rankings.length)) - Number(Boolean(left.rankings.length)) ||
              leftRank - rightRank ||
              left.name.localeCompare(right.name, "zh-CN")
            );
          });

          export const institutionDirectoryStats = {
            total: institutionDirectory.length,
            china: institutionDirectory.filter((item) => item.region === "中国").length,
            us: institutionDirectory.filter((item) => item.region === "美国").length,
            detailedProfiles: institutionDirectory.filter((item) => item.profileSlug).length,
            rankedRecords: institutionDirectory.reduce(
              (total, item) => total + item.rankings.length,
              0,
            ),
          };

          export const institutionRankingCategories: InstitutionRankingCategory[] = [
            "早期投资",
            "创业投资",
            "私募股权",
            "国资投资",
            "战略投资者/CVC",
            "并购投资",
            "海外代表",
          ];

          export function getInstitutionRankingEntry(name: string) {
            const normalized =
              name === "深创投"
                ? "深创投集团"
                : name === "高瓴"
                  ? "高瓴投资"
                  : name;
            return institutionDirectory.find((item) => item.name === normalized);
          }
          '''
          source_path.write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in loader.splitlines()).strip() + '\n',
              encoding='utf-8',
          )
          PY

      - name: Install and generate independent data layers
        run: |
          npm ci
          node --import tsx scripts/build-institution-data-layers.ts

      - name: Verify migration and static site
        run: |
          node --import tsx --test tests/institution-entity-registry.test.ts
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          python - <<'PY'
          import json
          from pathlib import Path
          rankings = json.loads(Path('config/institution_rankings.json').read_text())
          entities = json.loads(Path('public/data/institution_entities.json').read_text())
          events = json.loads(Path('public/data/institution_events.json').read_text())
          equity = json.loads(Path('public/data/institution_equity_relationships.json').read_text())
          assert sum(len(item['entries']) for item in rankings['categories']) == 220
          assert entities['stats']['entities'] == 216
          assert entities['stats']['rankingRecords'] == 220
          assert events['eventCount'] == len(events['events'])
          assert equity['verifiedRelationshipCount'] == len(equity['relationships'])
          assert equity['needsReviewCount'] == len(equity['candidates'])
          assert equity['rejectedCount'] == len(equity['rejected'])
          PY

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/institution_rankings.json \
            lib/institution-ranking-data.ts \
            public/data/institution_entities.json \
            public/data/institution_events.json \
            public/data/institution_equity_relationships.json
          git rm -f .github/workflows/migrate-institution-data-layers-once.yml
          git commit -m "data: migrate institution rankings and generate audited layers"
          git pull --rebase origin feat/institution-auditable-data-layers
          git push origin HEAD:feat/institution-auditable-data-layers
