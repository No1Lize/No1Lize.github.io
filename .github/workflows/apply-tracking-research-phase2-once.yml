name: Apply tracked entity research phase two once

on:
  push:
    branches: [feat/tracking-research-brief-relations-20260805]
    paths:
      - .github/workflows/apply-tracking-research-phase2-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tracking-research-phase2-once
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracking-research-brief-relations-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply attention and research insight integration
        run: |
          python tools/patch_tracking_research_phase2.py
          python tools/patch_tracking_research_phase2_styles.py

      - name: Verify focused research behavior
        run: |
          node --import tsx --test \
            tests/tracking-capture.test.ts \
            tests/tracking-entity-research.test.ts \
            tests/tracking-entity-insights.test.ts

      - name: Verify application and static research routes
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json
          python - <<'PY'
          from pathlib import Path

          entity_pages = list(Path('out/tracking/entities').glob('*/*/index.html'))
          assert len(entity_pages) >= 200, len(entity_pages)
          sample = entity_pages[0].read_text(encoding='utf-8')
          assert '自动研究摘要' in sample
          assert '关系与共同赛道' in sample
          assert '关注等级' in sample or '重点观察' in sample or '新闻提醒' in sample
          print({'entityPages': len(entity_pages)})
          PY

      - name: Commit verified phase two integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/tracking-capture.ts \
            lib/tracking-entity-research.ts \
            components/intelligence-tracking-capture-controls.tsx \
            components/intelligence-tracking-capture-controls.module.css \
            components/tracking-capture-inbox.tsx \
            components/tracking-entity-directory.module.css \
            app/tracking/entities/[type]/[slug]/tracking-entity-detail.module.css \
            tests/tracking-capture.test.ts \
            tests/tracking-entity-research.test.ts
          git rm -f \
            tools/patch_tracking_research_phase2.py \
            tools/patch_tracking_research_phase2_styles.py
          git commit -m "feat: add attention levels and evidence-backed research insights"
          git pull --rebase origin feat/tracking-research-brief-relations-20260805
          git push origin HEAD:feat/tracking-research-brief-relations-20260805
