name: Inspect venture pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-venture-pages.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record relevant files and references
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo '===== FILES ====='
            (find app components lib data public tools tests config -maxdepth 5 -type f 2>/dev/null || true) | sort
            echo
            echo '===== MATCHES ====='
            grep -RInE '创业案例|投资机构|Sequoia Capital|OpenAI|startup|venture|investment institution' app components lib data public tools tests config 2>/dev/null | head -1200 || true
          } > diagnostics/venture-pages-structure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/venture-pages-structure.txt
          git commit -m 'ci: record startup and investment page structure'
          git pull --rebase origin main
          git push origin HEAD:main
