name: Verify idempotent company onboarding once

on:
  push:
    branches: [feat/automatic-company-onboarding-20260805]
    paths:
      - .github/workflows/apply-company-onboarding-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-company-onboarding-idempotency-once
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-company-onboarding-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotency patch
        run: python tools/patch_onboarding_merge_idempotency.py

      - name: Verify onboarding fixed point and application
        run: |
          python -m py_compile tools/onboard_company_candidates.py
          python -m unittest \
            tests.test_onboard_company_candidates \
            tests.test_company_registry \
            tests.test_company_candidates
          node --import tsx --test \
            tests/company-candidate-onboarding.test.ts \
            tests/company-candidate-review.test.ts
          python tools/company_registry.py --check
          python tools/onboard_company_candidates.py --check
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json

      - name: Commit idempotency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/onboard_company_candidates.py \
            tests/test_onboard_company_candidates.py
          git rm -f tools/patch_onboarding_merge_idempotency.py
          git commit -m "fix: make company candidate merges idempotent"
          git pull --rebase origin feat/automatic-company-onboarding-20260805
          git push origin HEAD:feat/automatic-company-onboarding-20260805
