name: Apply listed-company disclosure integration once

on:
  push:
    branches: [main]
    paths:
      - tools/apply_listed_disclosure_integration.py
      - .github/workflows/apply-listed-disclosure-integration-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: listed-disclosure-integration-once
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply repository patch with diagnostics
        run: |
          set +e
          python tools/apply_listed_disclosure_integration.py 2>&1 | tee /tmp/listed-disclosure-patch.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/listed-disclosure-patch.log diagnostics/listed-disclosure-integration-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/listed-disclosure-integration-failure.txt
            git commit -m "ci: record listed disclosure integration failure"
            git pull --rebase origin main
            git push origin HEAD:main
            exit "$status"
          fi
      - name: Validate crawler and routing
        run: |
          python -m py_compile \
            tools/crawl_listed_company_disclosures.py \
            tools/apply_listed_disclosure_integration.py
          python -m unittest tests.test_listed_company_disclosures
      - name: Validate TypeScript integration
        run: |
          npm run install:ci
          npx tsc --noEmit
      - name: Commit integration and remove one-time files
        id: update
        run: |
          rm -f \
            tools/apply_listed_disclosure_integration.py \
            .github/workflows/apply-listed-disclosure-integration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/companies/'[slug]'/page.tsx \
            tools/crawl_listed_company_disclosures.py \
            .github/workflows/scheduled-sync.yml \
            tools/apply_listed_disclosure_integration.py \
            .github/workflows/apply-listed-disclosure-integration-once.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat: integrate official exchange disclosures into company pages"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start formal disclosure refresh
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scheduled-sync.yml --ref main
          gh workflow run pages.yml --ref main
