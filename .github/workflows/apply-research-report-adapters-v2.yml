name: Apply all-market research report adapters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-research-report-adapters-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-research-report-adapters-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic crawler patch
        run: python tools/apply_research_report_adapters_v2.py
      - name: Run Python safeguards
        run: python -m unittest tests.test_research_reports
      - name: Commit patched crawler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/crawl_research_reports.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: activate SEC HKEX and investor-relations PDF adapters"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
