name: Tighten people identity resolution once

on:
  push:
    branches: [feature/tracked-people-research-20260725]
    paths:
      - '.github/workflows/fix-people-identity-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tracked-people-research-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic identity patch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tools/refresh_people_profiles.py')
          text = path.read_text()
          text = text.replace(
              'def fetch_wikipedia(aliases: list[str]) -> dict[str, str] | None:\n    queries = unique(aliases)',
              'def fetch_wikipedia(aliases: list[str], queries: list[str] | None = None) -> dict[str, str] | None:\n    queries = unique(queries or aliases)'
          )
          text = text.replace(
              '                "language": language,\n            }\n    return None\n\n\ndef wikidata_labels',
              '                "language": language,\n                "wikidataId": str((page.get("pageprops") or {}).get("wikibase_item") or ""),\n            }\n    return None\n\n\ndef wikidata_labels'
          )

          start = text.index('def fetch_wikidata(aliases: list[str])')
          end = text.index('\ndef material_type(', start)
          replacement = '''def fetch_wikidata_entity(entity_id: str, language: str = "zh") -> dict[str, Any] | None:\n    if not entity_id:\n        return None\n    entity_payload = request_json(f"https://www.wikidata.org/wiki/Special:EntityData/{entity_id}.json") or {}\n    entity = (entity_payload.get("entities") or {}).get(entity_id)\n    if not entity:\n        return None\n    descriptions = entity.get("descriptions") or {}\n    description = str(((descriptions.get(language) or descriptions.get("en") or {}).get("value")) or "")\n    grouped_ids = {\n        "roles": claim_ids(entity, "P106"),\n        "organizations": claim_ids(entity, "P108") + claim_ids(entity, "P1416"),\n        "works": claim_ids(entity, "P800"),\n        "education": claim_ids(entity, "P69"),\n    }\n    labels = wikidata_labels(unique(value for values in grouped_ids.values() for value in values), language)\n    return {\n        "id": entity_id,\n        "url": f"https://www.wikidata.org/wiki/{entity_id}",\n        "description": description,\n        **{key: unique(labels.get(value, "") for value in values) for key, values in grouped_ids.items()},\n    }\n\n\ndef fetch_wikidata(\n    aliases: list[str],\n    preferred_id: str = "",\n    queries: list[str] | None = None,\n    identity_terms: list[str] | None = None,\n) -> dict[str, Any] | None:\n    if preferred_id:\n        return fetch_wikidata_entity(preferred_id)\n    expected = [normalize(value) for value in unique(identity_terms or []) if len(normalize(value)) >= 3]\n    for language in ("zh", "en"):\n        for query in unique(queries or aliases)[:4]:\n            params = urllib.parse.urlencode({\n                "action": "wbsearchentities",\n                "search": query,\n                "language": language,\n                "uselang": language,\n                "type": "item",\n                "limit": 5,\n                "format": "json",\n                "origin": "*",\n            })\n            payload = request_json(f"https://www.wikidata.org/w/api.php?{params}") or {}\n            ranked: list[tuple[float, dict[str, Any]]] = []\n            for item in payload.get("search") or []:\n                score = candidate_score(str(item.get("label") or ""), aliases)\n                description = str(item.get("description") or "")\n                normalized_description = normalize(description)\n                identity_hits = sum(1 for term in expected if term and term in normalized_description)\n                lowered_description = description.casefold()\n                if any(marker in lowered_description for marker in ("company", "organization", "organisation", "公司", "组织")):\n                    score -= 60\n                if score >= 55 and identity_hits > 0:\n                    ranked.append((score + min(identity_hits, 3) * 8, item))\n            if not ranked:\n                continue\n            _, item = max(ranked, key=lambda pair: pair[0])\n            return fetch_wikidata_entity(str(item.get("id") or ""), language)\n    return None\n'''
          text = text[:start] + replacement + text[end:]

          old = '''    override = candidate["override"]\n    aliases = unique([candidate["name"], candidate["englishName"], *candidate["aliases"]])\n    wikipedia = None if offline else fetch_wikipedia(aliases)\n    wikidata = None if offline else fetch_wikidata(aliases)\n'''
          new = '''    override = candidate["override"]\n    aliases = unique([candidate["name"], candidate["englishName"], *candidate["aliases"]])\n    identity_queries = unique([*(override.get("wikipediaQueries") or []), *aliases])\n    identity_terms = unique([\n        *(override.get("organizationHints") or []),\n        str(override.get("roleHint") or ""),\n        *(override.get("productHints") or []),\n        *candidate.get("sectors", []),\n    ])\n    wikipedia = None if offline else fetch_wikipedia(aliases, identity_queries)\n    wikidata = None if offline else fetch_wikidata(\n        aliases,\n        preferred_id=str((wikipedia or {}).get("wikidataId") or ""),\n        queries=identity_queries,\n        identity_terms=identity_terms,\n    )\n'''
          if old not in text:
              raise SystemExit('enrichment block not found')
          text = text.replace(old, new)
          path.write_text(text)

          config_path = Path('config/person_profile_overrides.json')
          config = json.loads(config_path.read_text())
          queries = {
              'Sam Altman': ['Sam Altman OpenAI'],
              'Demis Hassabis': ['Demis Hassabis DeepMind'],
              '何恺明': ['何恺明 计算机视觉', 'Kaiming He computer vision'],
              '姚顺雨': ['姚顺雨 人工智能', 'Shunyu Yao artificial intelligence'],
              '埃隆·马斯克': ['埃隆·马斯克', 'Elon Musk'],
              '李飞飞': ['李飞飞 计算机视觉', 'Fei-Fei Li computer vision'],
              '梁文峰': ['梁文峰 DeepSeek', 'Liang Wenfeng DeepSeek'],
              '唐杰': ['唐杰 人工智能 清华大学', 'Jie Tang Tsinghua artificial intelligence'],
              '汪滔': ['汪滔 大疆', 'Frank Wang DJI'],
              '李泽湘': ['李泽湘 机器人 香港科技大学', 'Li Zexiang robotics'],
              '王兴兴': ['王兴兴 宇树科技', 'Wang Xingxing Unitree'],
              '杨钊': ['杨钊 能量奇点 聚变', 'Yang Zhao Energy Singularity fusion'],
              'Bob Mumgaard': ['Bob Mumgaard Commonwealth Fusion Systems'],
              'David Kirtley': ['David Kirtley Helion Energy'],
              'Michl Binderbauer': ['Michl Binderbauer TAE Technologies'],
          }
          for person in config.get('people', []):
              person['wikipediaQueries'] = queries.get(person.get('canonicalName'), [person.get('canonicalName')])
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Refresh and validate
        run: |
          python -m py_compile tools/refresh_people_profiles.py
          python tools/refresh_people_profiles.py --workers 6
          python tools/refresh_people_profiles.py --offline --validate-only
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit identity-safe profiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/refresh_people_profiles.py config/person_profile_overrides.json public/data/people.json
          git commit -m 'fix: bind person Wikidata profiles to verified identities' || true
          git pull --rebase origin feature/tracked-people-research-20260725
          git push origin HEAD:feature/tracked-people-research-20260725
