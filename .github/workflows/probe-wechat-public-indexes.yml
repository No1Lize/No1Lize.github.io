name: One-time probe public WeChat indexes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-wechat-public-indexes.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public index surfaces
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import http.cookiejar
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def fetch(name, url, referer=""):
              request = urllib.request.Request(url, headers={
                  "User-Agent": ua,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.6",
                  **({"Referer": referer} if referer else {}),
              })
              try:
                  with opener.open(request, timeout=15) as response:
                      body = response.read().decode(response.headers.get_content_charset() or "utf-8", errors="replace")
                      final_url = response.geturl()
                      status = response.status
              except Exception as exc:
                  return {"name": name, "url": url, "error": f"{type(exc).__name__}: {exc}"}
              lower = body.casefold()
              return {
                  "name": name,
                  "url": url,
                  "finalUrl": final_url,
                  "httpStatus": status,
                  "length": len(body),
                  "captcha": any(marker in body for marker in ("请输入验证码", "antispider", "正常行为不是自动程序", "VerifyCode")),
                  "wechatLinks": len(re.findall(r"https?://mp\.weixin\.qq\.com/(?:s|s\?)", body, flags=re.I)),
                  "sogouResultBlocks": lower.count("txt-box") + lower.count("news-list"),
                  "rssItems": lower.count("<item") + lower.count("<entry"),
                  "bingResultBlocks": lower.count("b_algo"),
                  "title": (re.search(r"<title[^>]*>(.*?)</title>", body, flags=re.I | re.S).group(1)[:160] if re.search(r"<title[^>]*>(.*?)</title>", body, flags=re.I | re.S) else ""),
                  "sample": re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", body))[:300],
              }

          keyword = urllib.parse.quote("量子位 大模型")
          account = urllib.parse.quote("量子位")
          probes = []
          probes.append(fetch("sogou-home", "https://weixin.sogou.com/"))
          probes.append(fetch("sogou-desktop", f"https://weixin.sogou.com/weixin?type=2&query={keyword}&page=1", "https://weixin.sogou.com/"))
          probes.append(fetch("sogou-wap", f"https://weixin.sogou.com/wap?type=2&query={keyword}", "https://weixin.sogou.com/wap"))
          simple_query = urllib.parse.quote('site:mp.weixin.qq.com/s "量子位"')
          probes.append(fetch("bing-rss-simple", f"https://www.bing.com/search?format=rss&q={simple_query}"))
          probes.append(fetch("bing-html-simple", f"https://www.bing.com/search?q={simple_query}"))
          Path("diagnostics/wechat-index-probe.json").write_text(json.dumps(probes, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-index-probe.json
          git commit -m "ci: record public WeChat index probe"
          git pull --rebase origin main
          git push origin HEAD:main
