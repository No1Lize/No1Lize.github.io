name: Apply entity resolution person index fix

on:
  push:
    branches: ["feat/entity-resolution-center"]
    paths:
      - .entity-resolution-person-index-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-resolution-center
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply production person index fix
        run: |
          python .fix-entity-resolution-person-index.py
          rm -f .fix-entity-resolution-person-index.py .entity-resolution-person-index-trigger
          npm ci
          node --import tsx --test tests/entity-resolution.test.ts
          python -m unittest tests.test_entity_resolution
      - name: Commit person index fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve configured production people before company candidates"
          git push origin HEAD:feat/entity-resolution-center
