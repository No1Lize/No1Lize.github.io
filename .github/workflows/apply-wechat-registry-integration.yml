name: One-time integrate WeChat source registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-wechat-registry-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/wechat_public_sources.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'from urllib.request import Request, urlopen\n'
          addition = '''from urllib.request import Request, urlopen\n\ntry:  # Imported by tests as tools.wechat_public_sources.\n    from . import wechat_source_registry\nexcept ImportError:  # Executed directly with python tools/...\n    import wechat_source_registry\n'''
          if 'import wechat_source_registry' not in text:
              if anchor not in text:
                  raise SystemExit('wechat import anchor not found')
              text = text.replace(anchor, addition, 1)

          pattern = re.compile(
              r'def generated_wechat_sources\(\n'
              r'    tracks: Sequence\[dict\[str, Any\]\], tracking: Any\n'
              r'\) -> list\[dict\[str, Any\]\]:\n'
              r'.*?\n\nclass WeChatPageParser',
              flags=re.DOTALL,
          )
          replacement = '''def generated_wechat_sources(\n    tracks: Sequence[dict[str, Any]], tracking: Any\n) -> list[dict[str, Any]]:\n    """Create whitelist-first WeChat discovery for every enabled track."""\n\n    return wechat_source_registry.generated_wechat_sources(tracks, tracking)\n\n\nclass WeChatPageParser'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('generated_wechat_sources block not replaced')

          old_account = '''    account = (\n        parser.account\n        or _js_value(body, ("nickname", "profile_nickname", "account_name"))\n        or spec.get("name", "")\n    )\n    author = parser.author or _js_value(body, ("author", "author_name"))'''
          new_account = '''    observed_account = (\n        parser.account\n        or _js_value(body, ("nickname", "profile_nickname", "account_name"))\n    )\n    if not wechat_source_registry.account_matches(spec, observed_account):\n        return None\n    account = observed_account or spec.get("name", "")\n    author = parser.author or _js_value(body, ("author", "author_name"))'''
          if old_account not in text:
              raise SystemExit('wechat account validation anchor not found')
          text = text.replace(old_account, new_account, 1)

          old_level = '        source_level="原始材料",\n        platform="微信",'
          new_level = '        source_level=spec.get("sourceLevel", "媒体报道"),\n        platform="微信",'
          if old_level not in text:
              raise SystemExit('wechat source level anchor not found')
          text = text.replace(old_level, new_level, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tools/crawl_with_source_categories.py')
          text = path.read_text(encoding='utf-8')
          rel_anchor = '    from . import tracking_taxonomy\n    from . import x_rate_limit\n'
          rel_new = '    from . import tracking_taxonomy\n    from . import wechat_public_sources\n    from . import x_rate_limit\n'
          if rel_anchor not in text:
              raise SystemExit('relative wrapper import anchor not found')
          text = text.replace(rel_anchor, rel_new, 1)
          direct_anchor = '    import tracking_taxonomy\n    import x_rate_limit\n'
          direct_new = '    import tracking_taxonomy\n    import wechat_public_sources\n    import x_rate_limit\n'
          if direct_anchor not in text:
              raise SystemExit('direct wrapper import anchor not found')
          text = text.replace(direct_anchor, direct_new, 1)
          main_anchor = '    _install_generic_adapter()\n    configure_crawler()\n'
          main_new = '    _install_generic_adapter()\n    wechat_public_sources.install(tracking)\n    configure_crawler()\n'
          if main_anchor not in text:
              raise SystemExit('wrapper main anchor not found')
          text = text.replace(main_anchor, main_new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/scheduled-sync.yml')
          text = path.read_text(encoding='utf-8')
          if '      - tools/wechat_source_registry.py\n' not in text:
              anchor = '      - tools/wechat_public_sources.py\n'
              if anchor not in text:
                  raise SystemExit('scheduled sync wechat path anchor not found')
              text = text.replace(
                  anchor,
                  anchor + '      - tools/wechat_source_registry.py\n',
                  1,
              )
          if '      - config/wechat_sources.json\n' not in text:
              anchor = '      - config/intelligence_sources.json\n'
              if anchor not in text:
                  raise SystemExit('scheduled sync config anchor not found')
              text = text.replace(
                  anchor,
                  anchor + '      - config/wechat_sources.json\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f tools/crawl_wechat_sources.py tests/test_wechat_sources.py

      - name: Verify WeChat configuration and crawler tests
        run: |
          python -m json.tool config/wechat_sources.json >/dev/null
          python -m unittest discover -s tests -p "test_*.py"

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_public_sources.py tools/wechat_source_registry.py \
            tools/crawl_with_source_categories.py config/wechat_sources.json \
            tests/test_wechat_public_sources.py tests/test_wechat_source_registry.py \
            .github/workflows/scheduled-sync.yml
          git add -u tools/crawl_wechat_sources.py tests/test_wechat_sources.py
          git commit -m "feat: integrate verified WeChat account discovery"
          git pull --rebase origin main
          git push origin HEAD:main
