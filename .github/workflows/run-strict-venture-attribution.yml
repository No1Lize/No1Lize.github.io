name: Run strict venture attribution rebuild

on:
  push:
    branches:
      - feature/venture-narrative-page-chrome-v3
    paths:
      - .github/workflows/run-strict-venture-attribution.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strict-venture-attribution-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/venture-narrative-page-chrome-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch attribution and rebuild from main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python tools/patch_venture_enrichment_idempotence.py
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/normalize_venture_profiles.py \
            tools/sanitize_venture_profiles.py \
            tools/sanitize_venture_narratives.py \
            tools/finalize_venture_profiles.py
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles

          git checkout origin/main -- public/data/venture_profiles.json
          python tools/enrich_venture_profiles.py
          python tools/normalize_venture_profiles.py
          python tools/finalize_venture_profiles.py
          python tools/finalize_venture_profiles.py --check
          python tools/crawl_venture_profiles.py --validate-only
          python tools/enrich_venture_profiles.py --validate-only
          git diff --check
      - name: Commit strict attribution result
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/patch_venture_enrichment_idempotence.py
          rm -f .github/workflows/run-strict-venture-attribution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: enforce strict venture article attribution"
          git push origin HEAD:feature/venture-narrative-page-chrome-v3
