name: Remove WeChat proxy records

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/clean_wechat_proxy_records.py
      - tools/wechat_fetch_compat.py
      - tools/wechat_original_redirect_bridge.py
      - tools/wechat_index_record_fallback.py
      - tools/refresh_wechat_snapshot.py
      - tests/test_wechat_fetch_compat.py
      - tests/test_wechat_original_redirect_bridge.py
      - tests/test_wechat_index_record_fallback.py
      - tests/test_refresh_wechat_snapshot.py
      - .github/workflows/clean-wechat-proxy-records.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: clean-wechat-proxy-records
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove non-original WeChat records
        run: python tools/clean_wechat_proxy_records.py
      - name: Validate original-only contract
        run: |
          python -m py_compile \
            tools/wechat_fetch_compat.py \
            tools/wechat_original_redirect_bridge.py \
            tools/wechat_index_record_fallback.py \
            tools/refresh_wechat_snapshot.py \
            tools/clean_wechat_proxy_records.py
          python -m unittest \
            tests.test_wechat_fetch_compat \
            tests.test_wechat_original_redirect_bridge \
            tests.test_wechat_index_record_fallback \
            tests.test_refresh_wechat_snapshot
          python tools/crawl_articles.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import refresh_wechat_snapshot as refresh

          payload = json.loads(Path("public/data/articles.json").read_text(encoding="utf-8"))
          bad = [
              article.get("id", "unknown")
              for article in payload.get("articles", [])
              if refresh._is_wechat_record(article)
              and not refresh._publishable_article(article)
          ]
          if bad:
              raise SystemExit(f"non-original WeChat records remain: {bad[:10]}")
          print("All published WeChat records resolve to original mp.weixin.qq.com pages.")
          PY
      - name: Commit cleaned snapshot
        id: update
        run: |
          if git diff --quiet -- public/data/articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json
          git commit -m "data: remove WeChat proxy pages from homepage"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish cleaned snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
