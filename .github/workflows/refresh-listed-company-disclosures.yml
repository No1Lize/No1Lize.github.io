name: Refresh listed-company disclosures

on:
  workflow_dispatch:
  schedule:
    - cron: "35 1 * * *"
  push:
    branches: [main]
    paths:
      - config/listed_company_disclosure_sources.json
      - config/user_tracking.json
      - tools/__init__.py
      - tools/bootstrap_listed_company_disclosures.py
      - tools/crawl_listed_company_disclosures.py
      - tools/cninfo_structured_disclosures.py
      - tools/sec_structured_disclosures.py
      - tools/sec_configured_disclosures.py
      - tools/us_ir_sec_disclosures.py
      - tests/test_listed_company_disclosures.py
      - tests/test_cninfo_structured_disclosures.py
      - tests/test_sec_structured_disclosures.py
      - tests/test_sec_configured_disclosures.py
      - tests/test_us_ir_sec_disclosures.py
      - lib/listed-company-disclosure-data.ts
      - lib/venture-profile-data-with-disclosures.ts
      - tsconfig.json
      - .github/workflows/refresh-listed-company-disclosures.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: listed-company-disclosure-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate disclosure crawlers
        run: |
          python -m py_compile \
            tools/bootstrap_listed_company_disclosures.py \
            tools/crawl_listed_company_disclosures.py \
            tools/cninfo_structured_disclosures.py \
            tools/sec_structured_disclosures.py \
            tools/sec_configured_disclosures.py \
            tools/us_ir_sec_disclosures.py
          python -m unittest \
            tests.test_listed_company_disclosures \
            tests.test_cninfo_structured_disclosures \
            tests.test_sec_structured_disclosures \
            tests.test_sec_configured_disclosures \
            tests.test_us_ir_sec_disclosures
      - name: Bootstrap verified official documents
        run: python tools/bootstrap_listed_company_disclosures.py
      - name: Refresh A-share and Hong Kong exchange disclosures
        run: python tools/crawl_listed_company_disclosures.py
      - name: Resolve A-share documents through CNINFO structured data
        run: python tools/cninfo_structured_disclosures.py --require-events
      - name: Validate A-share and Hong Kong coverage
        run: |
          python tools/crawl_listed_company_disclosures.py --validate-only --require-events
          python tools/cninfo_structured_disclosures.py --check --require-events
      - name: Resolve every US-listed company through official IR filing mirrors
        run: python -m tools.us_ir_sec_disclosures --require-events
      - name: Require complete listed-company coverage
        run: python -m tools.us_ir_sec_disclosures --check --require-events
      - name: Commit disclosure snapshot
        id: update
        run: |
          if git diff --quiet -- public/data/listed_company_disclosures.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/listed_company_disclosures.json
          git commit -m "data: refresh disclosures for all listed companies"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && \
              python -m tools.us_ir_sec_disclosures --check --require-events && \
              git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish company pages
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
