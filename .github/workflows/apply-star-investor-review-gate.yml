name: Apply STAR investor review gate

on:
  push:
    branches: [fix/star-investor-review-gate-20260804]
    paths:
      - .github/workflows/apply-star-investor-review-gate.yml

permissions:
  contents: write

concurrency:
  group: apply-star-investor-review-gate
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/star-investor-review-gate-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply conservative extraction and review gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"patch anchor not found: {label}")
              return text.replace(old, new, 1)

          path = Path("tools/crawl_star_market_investors.py")
          text = path.read_text(encoding="utf-8")

          constants_anchor = '''CONTACT_LABELS = (
              "注册地址",
              "住所",
              "主要经营场所",
              "办公地址",
              "联系地址",
              "联系电话",
              "电话",
              "电子邮箱",
              "邮箱",
              "互联网网址",
              "公司网址",
              "网站",
          )
          '''
          constants_replacement = constants_anchor + '''
          REVIEW_STATUSES = {"verified", "needs_review", "rejected"}
          GENERIC_LEGAL_FORM_NAMES = (
              "有限公司",
              "股份有限公司",
              "有限责任公司",
              "管理有限公司",
              "投资管理有限公司",
              "基金管理有限公司",
              "资本管理有限公司",
              "股权投资有限公司",
              "管理合伙企业（有限合伙）",
              "管理合伙企业(有限合伙)",
              "投资管理中心（有限合伙）",
              "投资管理中心(有限合伙)",
              "有限合伙",
              "有限合伙企业",
          )
          NARRATIVE_NAME_PREFIXES = (
              "整体变更",
              "事务合伙人为",
              "执行事务合伙人为",
              "伙人暨执行事务合伙人为",
              "普通合伙人为",
              "均为",
              "立群通过",
              "雨持有",
          )
          NARRATIVE_NAME_MARKERS = (
              "的董事长",
              "的普通合伙人",
              "的执行事务合伙人",
              "担任",
              "持有公司股票",
              "间接持有",
              "的出资额",
              "为发行人",
          )
          '''
          text = replace_once(text, constants_anchor, constants_replacement, "review constants")

          evidence_anchor = '''def evidence_for_match(text: str, start: int, end: int, limit: int = 220) -> str:
              line_start = text.rfind("\\n", 0, start) + 1
              line_end = text.find("\\n", end)
              if line_end < 0:
                  line_end = len(text)
              line = clean_text(text[line_start:line_end], limit * 2)
              if line and len(line) <= limit * 2:
                  return redact_private_text(line, limit)
              return redact_private_text(text[start : min(len(text), end + limit)], limit)


          def _candidate_name(raw: str, company_name: str) -> str:
          '''
          evidence_replacement = '''def evidence_for_match(text: str, start: int, end: int, limit: int = 220) -> str:
              line_start = text.rfind("\\n", 0, start) + 1
              line_end = text.find("\\n", end)
              if line_end < 0:
                  line_end = len(text)
              line = clean_text(text[line_start:line_end], limit * 2)
              if line and len(line) <= limit * 2:
                  return redact_private_text(line, limit)
              return redact_private_text(text[start : min(len(text), end + limit)], limit)


          def holding_context_for_match(text: str, start: int, end: int, limit: int = 180) -> str:
              """Return only the row-local text following a candidate name.

              Percentages from preceding prose or a later institution must never be
              attached to the current candidate. False negatives are preferred over
              cross-row holding attribution.
              """
              hard_end = min(len(text), end + limit)
              line_end = text.find("\\n", end, hard_end)
              boundary = line_end if line_end >= 0 else hard_end
              next_match = INSTITUTION_PATTERN.search(text, end, boundary)
              if next_match:
                  boundary = next_match.start()
              return clean_text(text[start:boundary], limit)


          def review_investor_candidate(
              name: str,
              evidence: str,
              *,
              shares: float | None,
              ownership: float | None,
          ) -> tuple[str, list[str]]:
              """Classify automatic extraction without claiming human verification."""
              reasons: list[str] = []
              name_key = normalized_name(name)
              evidence_key = normalized_name(evidence)
              generic_keys = {normalized_name(value) for value in GENERIC_LEGAL_FORM_NAMES}
              compact = re.sub(r"\\s+", "", name)

              if not name_key:
                  return "rejected", ["invalid-name"]
              if name_key in generic_keys:
                  return "rejected", ["generic-legal-form"]
              if compact.startswith(NARRATIVE_NAME_PREFIXES):
                  return "rejected", ["narrative-name-fragment"]
              if any(marker in compact for marker in NARRATIVE_NAME_MARKERS):
                  return "rejected", ["narrative-name-fragment"]
              if re.match(r"^(管理|投资管理|基金管理|资本管理)[（(]", compact):
                  return "rejected", ["generic-legal-form"]

              if not evidence_key or name_key not in evidence_key:
                  reasons.append("name-not-in-evidence")
              if shares is None and ownership is None:
                  reasons.append("no-row-local-holding")
              reasons.append("awaiting-human-review")
              return "needs_review", reasons


          def _candidate_name(raw: str, company_name: str) -> str:
          '''
          text = replace_once(text, evidence_anchor, evidence_replacement, "holding and review helpers")

          candidate_old = '''def _candidate_name(raw: str, company_name: str) -> str:
              value = clean_text(raw, 120)
              value = re.sub(r"^\\d+[、.．)）]?", "", value).strip()
              value = re.sub(r"^(股东|名称|机构股东)", "", value).strip(" ：:")
              if not value or len(value) < 3 or len(value) > 100:
                  return ""
              if normalized_name(value) == normalized_name(company_name):
                  return ""
              if any(fragment in value for fragment in BLOCKED_NAME_FRAGMENTS):
                  return ""
              if re.fullmatch(r"[A-Za-z]+", value) and len(value) < 5:
                  return ""
              return value
          '''
          candidate_new = '''def _candidate_name(raw: str, company_name: str) -> str:
              value = clean_text(raw, 120)
              value = re.sub(r"^\\d+[、.．)）]?", "", value).strip()
              value = re.sub(r"^(股东|名称|机构股东)", "", value).strip(" ：:")
              if not value or len(value) < 3 or len(value) > 100:
                  return ""
              candidate_key = normalized_name(value)
              company_key = normalized_name(company_name)
              if candidate_key == company_key:
                  return ""
              if company_key and len(company_key) >= 3 and company_key in candidate_key:
                  return ""
              if any(fragment in value for fragment in BLOCKED_NAME_FRAGMENTS):
                  return ""
              if re.fullmatch(r"[A-Za-z]+", value) and len(value) < 5:
                  return ""
              return value
          '''
          text = replace_once(text, candidate_old, candidate_new, "issuer-name exclusion")

          contact_old = '''def extract_investor_contact(pages: list[PdfPage], name: str) -> dict[str, Any]:
              for page in pages:
                  position = page.text.find(name)
                  if position < 0:
                      continue
                  block = _context(page.text, position, 700)
                  if not any(label in block for label in CONTACT_LABELS):
                      continue
                  address = _extract_labeled_value(
                      block,
                      ("注册地址", "住所", "主要经营场所", "办公地址"),
                      180,
                  )
                  phone = _safe_landline(block)
                  email = _safe_email(block)
                  website = _safe_website(block)
                  contact = {
                      key: value
                      for key, value in {
                          "officeAddress": address,
                          "phone": phone,
                          "email": email,
                          "website": website,
                      }.items()
                      if value
                  }
                  if contact:
                      contact["sourcePage"] = page.number
                      contact["scope"] = "招股说明书公开的机构级联系方式"
                      return contact
              return {}
          '''
          contact_new = '''def extract_investor_contact(pages: list[PdfPage], name: str) -> dict[str, Any]:
              for page in pages:
                  offset = 0
                  while True:
                      position = page.text.find(name, offset)
                      if position < 0:
                          break
                      offset = position + max(1, len(name))
                      block = clean_text(page.text[position : position + 700], 700)
                      label_positions = [block.find(label) for label in CONTACT_LABELS if block.find(label) >= 0]
                      if not label_positions:
                          continue
                      first_label = min(label_positions)
                      if first_label > 420:
                          continue
                      between = block[len(name) : first_label]
                      if INSTITUTION_PATTERN.search(between):
                          continue
                      address = _extract_labeled_value(
                          block,
                          ("注册地址", "住所", "主要经营场所", "办公地址"),
                          180,
                      )
                      phone = _safe_landline(block)
                      email = _safe_email(block)
                      website = _safe_website(block)
                      contact = {
                          key: value
                          for key, value in {
                              "officeAddress": address,
                              "phone": phone,
                              "email": email,
                              "website": website,
                          }.items()
                          if value
                      }
                      if contact:
                          contact["sourcePage"] = page.number
                          contact["scope"] = "招股说明书公开的机构级联系方式"
                          return contact
              return {}
          '''
          text = replace_once(text, contact_old, contact_new, "contact attribution scope")

          extraction_start = text.index("def extract_institutional_investors(")
          extraction_end = text.index("\n\ndef _official_prospectus_host", extraction_start)
          extraction_new = '''def extract_institutional_investors(
              pages: list[PdfPage],
              company_name: str,
              *,
              max_investors: int,
          ) -> list[dict[str, Any]]:
              candidates: dict[str, dict[str, Any]] = {}
              likely_pages = [
                  page
                  for page in pages
                  if any(term in page.text for term in SHAREHOLDER_PAGE_TERMS)
              ]
              status_rank = {"rejected": 0, "needs_review": 1, "verified": 2}

              def quality(item: dict[str, Any]) -> tuple[int, int, int]:
                  return (
                      status_rank.get(str(item.get("reviewStatus")), 0),
                      int("preIpoOwnershipPct" in item) + int("preIpoShares" in item),
                      len(str(item.get("evidence", ""))),
                  )

              for page in likely_pages:
                  for match in INSTITUTION_PATTERN.finditer(page.text):
                      name = _candidate_name(match.group("name"), company_name)
                      if not name:
                          continue
                      context = _context(page.text, match.start(), 260)
                      if any(term in context for term in ("保荐机构（主承销商）", "发行人律师", "审计机构")) and not any(
                          term in context for term in SHAREHOLDER_PAGE_TERMS
                      ):
                          continue
                      key = normalized_name(name)
                      if not key:
                          continue
                      evidence = evidence_for_match(page.text, match.start(), match.end(), 220)
                      holding_context = holding_context_for_match(
                          page.text,
                          match.start(),
                          match.end(),
                      )
                      shares, ownership = extract_holding(holding_context)
                      review_status, review_reasons = review_investor_candidate(
                          name,
                          evidence,
                          shares=shares,
                          ownership=ownership,
                      )
                      item = {
                          "id": "star-investor-" + hashlib.sha256(key.encode("utf-8")).hexdigest()[:18],
                          "name": name,
                          "normalizedName": key,
                          "institutional": True,
                          "investorType": classify_investor(name, context),
                          "sourcePage": page.number,
                          "sourceSection": next(
                              (term for term in SHAREHOLDER_PAGE_TERMS if term in page.text),
                              "股东情况",
                          ),
                          "evidence": evidence,
                          "reviewStatus": review_status,
                          "reviewReasons": review_reasons,
                      }
                      if shares is not None:
                          item["preIpoShares"] = round(shares, 4)
                      if ownership is not None:
                          item["preIpoOwnershipPct"] = round(ownership, 6)
                      current = candidates.get(key)
                      if current is None or quality(item) > quality(current):
                          candidates[key] = item

              result: list[dict[str, Any]] = []
              for item in candidates.values():
                  if item["reviewStatus"] != "rejected":
                      contact = extract_investor_contact(pages, item["name"])
                      if contact:
                          item["publicContact"] = contact
                          item["contactStatus"] = "prospectus-public"
                      else:
                          item["contactStatus"] = "not-disclosed-in-prospectus"
                  else:
                      item["contactStatus"] = "not-disclosed-in-prospectus"
                  result.append(item)

              result.sort(
                  key=lambda item: (
                      -status_rank.get(str(item.get("reviewStatus")), 0),
                      -float(item.get("preIpoOwnershipPct", -1)),
                      -float(item.get("preIpoShares", -1)),
                      item["name"],
                  )
              )
              return result[: max(1, max_investors)]


          def summarize_review_statuses(investors: Iterable[dict[str, Any]]) -> dict[str, int]:
              summary = {status: 0 for status in REVIEW_STATUSES}
              for investor in investors:
                  status = str(investor.get("reviewStatus") or "needs_review")
                  if status not in REVIEW_STATUSES:
                      status = "needs_review"
                  summary[status] += 1
              return summary
          '''
          text = text[:extraction_start] + extraction_new + text[extraction_end:]

          build_old = '''    issuer_contact = extract_issuer_contact(pages, listing.name)
              minimum = max(0, int(settings.get("minimumInvestorsPerCompany", 1)))
              status = "ok" if len(investors) >= minimum else "partial"
              errors = [] if status == "ok" else [f"only {len(investors)} institutional investors extracted"]
              return {
          '''
          build_new = '''    issuer_contact = extract_issuer_contact(pages, listing.name)
              review_summary = summarize_review_statuses(investors)
              candidate_count = review_summary["verified"] + review_summary["needs_review"]
              minimum = max(0, int(settings.get("minimumInvestorsPerCompany", 1)))
              status = "ok" if candidate_count >= minimum else "partial"
              errors = [] if status == "ok" else [f"only {candidate_count} non-rejected institutional candidates extracted"]
              return {
          '''
          text = replace_once(text, build_old, build_new, "company review summary")

          record_old = '''        "issuerInvestorRelations": issuer_contact,
                  "institutionalInvestorCount": len(investors),
                  "naturalPersonContactsPublished": False,
                  "investors": investors,
                  "errors": errors,
          '''
          record_new = '''        "issuerInvestorRelations": issuer_contact,
                  "extractedInvestorCount": len(investors),
                  "institutionalInvestorCount": candidate_count,
                  "reviewSummary": review_summary,
                  "naturalPersonContactsPublished": False,
                  "investors": investors,
                  "errors": errors,
          '''
          text = replace_once(text, record_old, record_new, "company record counts")

          validate_init_old = '''    investor_count = 0
              human_text = public_human_text(snapshot)
          '''
          validate_init_new = '''    investor_count = 0
              review_counts = {status: 0 for status in REVIEW_STATUSES}
              human_text = public_human_text(snapshot)
          '''
          text = replace_once(text, validate_init_old, validate_init_new, "validation review counts")

          validate_investor_old = '''            if int(investor.get("sourcePage", 0)) <= 0:
                          errors.append(f"{slug}: investor {name} missing source page")
                      investor_count += 1
          '''
          validate_investor_new = '''            if int(investor.get("sourcePage", 0)) <= 0:
                          errors.append(f"{slug}: investor {name} missing source page")
                      review_status = clean_text(investor.get("reviewStatus"), 30) or "needs_review"
                      if review_status not in REVIEW_STATUSES:
                          errors.append(f"{slug}: investor {name} has invalid review status {review_status}")
                      else:
                          review_counts[review_status] += 1
                      review_reasons = investor.get("reviewReasons")
                      if review_status == "rejected" and not (
                          isinstance(review_reasons, list) and any(str(reason).strip() for reason in review_reasons)
                      ):
                          errors.append(f"{slug}: rejected investor {name} missing review reason")
                      if review_status == "verified" and not any(
                          key in investor for key in ("preIpoShares", "preIpoOwnershipPct")
                      ):
                          errors.append(f"{slug}: verified investor {name} missing row-local holding fact")
                      investor_count += 1
          '''
          text = replace_once(text, validate_investor_old, validate_investor_new, "review validation")

          validate_end_old = '''    if int(snapshot.get("investorCount", -1)) != investor_count:
                  errors.append("investorCount mismatch")
              return errors
          '''
          validate_end_new = '''    if int(snapshot.get("investorCount", -1)) != investor_count:
                  errors.append("investorCount mismatch")
              snapshot_review = snapshot.get("reviewSummary")
              if isinstance(snapshot_review, dict):
                  for status, count in review_counts.items():
                      if int(snapshot_review.get(status, -1)) != count:
                          errors.append(f"reviewSummary mismatch for {status}")
              return errors
          '''
          text = replace_once(text, validate_end_old, validate_end_new, "snapshot review validation")

          snapshot_count_old = '''    investor_count = sum(
                  len(company.get("investors", []))
                  for company in companies.values()
                  if isinstance(company, dict)
              )
              return {
          '''
          snapshot_count_new = '''    all_investors = [
                  investor
                  for company in companies.values()
                  if isinstance(company, dict)
                  for investor in company.get("investors", [])
                  if isinstance(investor, dict)
              ]
              investor_count = len(all_investors)
              review_summary = summarize_review_statuses(all_investors)
              candidate_count = review_summary["verified"] + review_summary["needs_review"]
              return {
          '''
          text = replace_once(text, snapshot_count_old, snapshot_count_new, "snapshot review counts")

          snapshot_fields_old = '''        "companyCount": len(companies),
                  "investorCount": investor_count,
                  "scope": {
          '''
          snapshot_fields_new = '''        "companyCount": len(companies),
                  "investorCount": investor_count,
                  "candidateCount": candidate_count,
                  "reviewSummary": review_summary,
                  "scope": {
          '''
          text = replace_once(text, snapshot_fields_old, snapshot_fields_new, "snapshot fields")

          methodology_old = '''            "retention": "previous verified company record retained on source failure",
                  },
          '''
          methodology_new = '''            "retention": "previous verified company record retained on source failure",
                      "review": "automatic candidates default to needs_review; obvious sentence fragments are retained as rejected audit records and hidden from the public directory",
                  },
          '''
          text = replace_once(text, methodology_old, methodology_new, "methodology review note")

          print_old = '''                "investorCount": snapshot["investorCount"],
                          "sourceStatus": snapshot["sourceStatus"],
          '''
          print_new = '''                "investorCount": snapshot["investorCount"],
                          "candidateCount": snapshot["candidateCount"],
                          "reviewSummary": snapshot["reviewSummary"],
                          "sourceStatus": snapshot["sourceStatus"],
          '''
          text = replace_once(text, print_old, print_new, "CLI review output")

          path.write_text(text, encoding="utf-8")
          PY

          cat > lib/star-market-investor-data.ts <<'EOF'
          import rawSnapshot from "@/public/data/star_market_investors.json";
          import {
            institutionDirectory,
            type InstitutionDirectoryEntry,
          } from "@/lib/institution-ranking-data";

          export type StarInvestorReviewStatus = "verified" | "needs_review" | "rejected";

          export const starInvestorReviewLabels: Record<StarInvestorReviewStatus, string> = {
            verified: "已人工核验",
            needs_review: "待人工核验",
            rejected: "质量门已排除",
          };

          export const starInvestorReviewReasonLabels: Record<string, string> = {
            "awaiting-human-review": "等待人工核验",
            "generic-legal-form": "名称仅为通用法律形式",
            "narrative-name-fragment": "名称疑似正文句子片段",
            "name-not-in-evidence": "名称与证据摘录不一致",
            "no-row-local-holding": "同一证据行未提取到持股数或比例",
            "invalid-name": "名称不完整",
          };

          export type StarMarketInvestorContact = {
            officeAddress?: string;
            phone?: string;
            email?: string;
            website?: string;
            sourcePage: number;
            scope: string;
          };

          export type StarMarketInvestor = {
            id: string;
            name: string;
            normalizedName: string;
            institutional: true;
            investorType: string;
            sourcePage: number;
            sourceSection: string;
            evidence: string;
            preIpoShares?: number;
            preIpoOwnershipPct?: number;
            publicContact?: StarMarketInvestorContact;
            contactStatus: "prospectus-public" | "not-disclosed-in-prospectus";
            reviewStatus?: StarInvestorReviewStatus;
            reviewReasons?: string[];
          };

          export type ReviewedStarMarketInvestor = StarMarketInvestor & {
            reviewStatus: StarInvestorReviewStatus;
            reviewReasons: string[];
          };

          export type StarMarketCompanyInvestorProfile = {
            slug: string;
            name: string;
            ticker: string;
            exchange: string;
            sector: string;
            updatedAt: string;
            status: "ok" | "partial" | "retained";
            prospectus: {
              title: string;
              url: string;
              publishedAt: string;
              announcementId: string;
              pageCount: number;
              textPageCount: number;
              sha256: string;
              provider: string;
            };
            issuerInvestorRelations?: StarMarketInvestorContact;
            extractedInvestorCount?: number;
            institutionalInvestorCount: number;
            reviewSummary?: Partial<Record<StarInvestorReviewStatus, number>>;
            naturalPersonContactsPublished: false;
            investors: StarMarketInvestor[];
            errors: string[];
          };

          type StarMarketInvestorSnapshot = {
            schemaVersion: number;
            generatedAt: string;
            companyCount: number;
            investorCount: number;
            candidateCount?: number;
            reviewSummary?: Partial<Record<StarInvestorReviewStatus, number>>;
            scope: {
              market: string;
              listingRule: string;
              shareholderRule: string;
            };
            privacy: {
              naturalPersonShareholdersExcluded: boolean;
              personalPhonesExcluded: boolean;
              identityNumbersExcluded: boolean;
              contacts: string;
            };
            methodology: {
              prospectusProvider: string;
              pdfExtraction: string;
              retention: string;
              review?: string;
            };
            companies: Record<string, StarMarketCompanyInvestorProfile>;
            sourceStatus: {
              id: string;
              companySlug: string;
              ticker: string;
              status: string;
              investorCount: number;
              retainedPrevious: boolean;
              durationMs: number;
              errors: string[];
            }[];
          };

          export type StarMarketInvestorRecord = {
            company: StarMarketCompanyInvestorProfile;
            investor: ReviewedStarMarketInvestor;
            directoryInstitution?: InstitutionDirectoryEntry;
          };

          const snapshot = rawSnapshot as StarMarketInvestorSnapshot;

          export function normalizeStarInvestorName(value: string): string {
            return value
              .normalize("NFKC")
              .toLocaleLowerCase("zh-CN")
              .replace(/[\s·•・()（）\[\]【】{}<>《》,，.。:：;；'"“”‘’_\-/\\&+－—]/gu, "")
              .trim();
          }

          const genericLegalFormNames = new Set(
            [
              "有限公司",
              "股份有限公司",
              "有限责任公司",
              "管理有限公司",
              "投资管理有限公司",
              "基金管理有限公司",
              "资本管理有限公司",
              "股权投资有限公司",
              "管理合伙企业（有限合伙）",
              "投资管理中心（有限合伙）",
              "有限合伙",
              "有限合伙企业",
            ].map(normalizeStarInvestorName),
          );

          const narrativePrefixes = [
            "整体变更",
            "事务合伙人为",
            "执行事务合伙人为",
            "伙人暨执行事务合伙人为",
            "普通合伙人为",
            "均为",
            "立群通过",
            "雨持有",
          ];

          const narrativeMarkers = [
            "的董事长",
            "的普通合伙人",
            "的执行事务合伙人",
            "担任",
            "持有公司股票",
            "间接持有",
            "的出资额",
            "为发行人",
          ];

          export function deriveStarInvestorReview(
            investor: Pick<
              StarMarketInvestor,
              | "name"
              | "evidence"
              | "preIpoShares"
              | "preIpoOwnershipPct"
              | "reviewStatus"
              | "reviewReasons"
            >,
          ): { reviewStatus: StarInvestorReviewStatus; reviewReasons: string[] } {
            if (investor.reviewStatus) {
              return {
                reviewStatus: investor.reviewStatus,
                reviewReasons: [...(investor.reviewReasons ?? [])],
              };
            }

            const name = investor.name.normalize("NFKC").replace(/\s+/gu, "").trim();
            const nameKey = normalizeStarInvestorName(name);
            const evidenceKey = normalizeStarInvestorName(investor.evidence ?? "");

            if (!nameKey) {
              return { reviewStatus: "rejected", reviewReasons: ["invalid-name"] };
            }
            if (genericLegalFormNames.has(nameKey)) {
              return { reviewStatus: "rejected", reviewReasons: ["generic-legal-form"] };
            }
            if (
              narrativePrefixes.some((prefix) => name.startsWith(prefix)) ||
              narrativeMarkers.some((marker) => name.includes(marker))
            ) {
              return { reviewStatus: "rejected", reviewReasons: ["narrative-name-fragment"] };
            }
            if (/^(管理|投资管理|基金管理|资本管理)[（(]/u.test(name)) {
              return { reviewStatus: "rejected", reviewReasons: ["generic-legal-form"] };
            }

            const reviewReasons: string[] = [];
            if (!evidenceKey || !evidenceKey.includes(nameKey)) {
              reviewReasons.push("name-not-in-evidence");
            }
            if (
              investor.preIpoShares === undefined &&
              investor.preIpoOwnershipPct === undefined
            ) {
              reviewReasons.push("no-row-local-holding");
            }
            reviewReasons.push("awaiting-human-review");
            return { reviewStatus: "needs_review", reviewReasons };
          }

          function institutionIdentityTerms(entry: InstitutionDirectoryEntry): string[] {
            return [entry.name, entry.fullName ?? ""]
              .map(normalizeStarInvestorName)
              .filter(Boolean);
          }

          export function resolveStarInvestorInstitution(
            investor: Pick<StarMarketInvestor, "name" | "normalizedName">,
          ): InstitutionDirectoryEntry | undefined {
            const investorKey = investor.normalizedName || normalizeStarInvestorName(investor.name);
            if (!investorKey) return undefined;
            return institutionDirectory.find((entry) =>
              institutionIdentityTerms(entry).some((term) => {
                if (term === investorKey) return true;
                if (term.length < 4 || investorKey.length < 4) return false;
                return term.includes(investorKey) || investorKey.includes(term);
              }),
            );
          }

          export function starInvestorInstitutionHref(
            record: StarMarketInvestorRecord,
          ): string {
            const institution = record.directoryInstitution;
            if (institution?.profileSlug) return `/institutions/${institution.profileSlug}`;
            const query = institution?.name ?? record.investor.name;
            return `/institutions?institution=${encodeURIComponent(query)}`;
          }

          export const starMarketInvestorGeneratedAt = snapshot.generatedAt || "";
          export const starMarketInvestorScope = snapshot.scope;
          export const starMarketInvestorPrivacy = snapshot.privacy;
          export const starMarketInvestorMethodology = snapshot.methodology;

          export const starMarketInvestorCompanies = Object.values(snapshot.companies ?? {}).sort(
            (left, right) =>
              left.sector.localeCompare(right.sector, "zh-CN") ||
              left.ticker.localeCompare(right.ticker),
          );

          export const starMarketInvestorAllRecords: StarMarketInvestorRecord[] =
            starMarketInvestorCompanies
              .flatMap((company) =>
                company.investors.map((rawInvestor) => {
                  const review = deriveStarInvestorReview(rawInvestor);
                  const investor: ReviewedStarMarketInvestor = { ...rawInvestor, ...review };
                  return {
                    company,
                    investor,
                    directoryInstitution:
                      review.reviewStatus === "rejected"
                        ? undefined
                        : resolveStarInvestorInstitution(investor),
                  };
                }),
              )
              .sort((left, right) => {
                const rank: Record<StarInvestorReviewStatus, number> = {
                  verified: 2,
                  needs_review: 1,
                  rejected: 0,
                };
                return (
                  rank[right.investor.reviewStatus] - rank[left.investor.reviewStatus] ||
                  (right.investor.preIpoOwnershipPct ?? -1) -
                    (left.investor.preIpoOwnershipPct ?? -1) ||
                  left.company.sector.localeCompare(right.company.sector, "zh-CN") ||
                  left.investor.name.localeCompare(right.investor.name, "zh-CN")
                );
              });

          export const starMarketInvestorRecords = starMarketInvestorAllRecords.filter(
            (record) => record.investor.reviewStatus !== "rejected",
          );

          export const starMarketInvestorRejectedRecords = starMarketInvestorAllRecords.filter(
            (record) => record.investor.reviewStatus === "rejected",
          );

          export const starMarketInvestorStats = {
            companies: starMarketInvestorCompanies.length,
            extracted: starMarketInvestorAllRecords.length,
            investors: starMarketInvestorRecords.length,
            verified: starMarketInvestorRecords.filter(
              (record) => record.investor.reviewStatus === "verified",
            ).length,
            needsReview: starMarketInvestorRecords.filter(
              (record) => record.investor.reviewStatus === "needs_review",
            ).length,
            rejected: starMarketInvestorRejectedRecords.length,
            linkedInstitutions: starMarketInvestorRecords.filter(
              (record) => Boolean(record.directoryInstitution),
            ).length,
            prospectusContacts: starMarketInvestorRecords.filter(
              (record) => record.investor.contactStatus === "prospectus-public",
            ).length,
            sectors: new Set(starMarketInvestorCompanies.map((company) => company.sector)).size,
          };

          export function getStarMarketInvestorCompany(
            slug: string,
          ): StarMarketCompanyInvestorProfile | undefined {
            return snapshot.companies?.[slug];
          }
