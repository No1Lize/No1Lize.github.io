name: Validate CNINFO structured disclosures once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-cninfo-structured-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-cninfo-structured-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run observable CNINFO validation
        id: run
        shell: bash
        run: |
          set +e
          : > /tmp/cninfo-structured.log
          python -m py_compile \
            tools/bootstrap_listed_company_disclosures.py \
            tools/crawl_listed_company_disclosures.py \
            tools/cninfo_structured_disclosures.py \
            >> /tmp/cninfo-structured.log 2>&1
          compile_exit=$?
          python -m unittest \
            tests.test_listed_company_disclosures \
            tests.test_cninfo_structured_disclosures \
            >> /tmp/cninfo-structured.log 2>&1
          test_exit=$?
          python tools/bootstrap_listed_company_disclosures.py \
            >> /tmp/cninfo-structured.log 2>&1
          bootstrap_exit=$?
          python tools/crawl_listed_company_disclosures.py \
            >> /tmp/cninfo-structured.log 2>&1
          base_exit=$?
          python tools/cninfo_structured_disclosures.py --require-events \
            >> /tmp/cninfo-structured.log 2>&1
          structured_exit=$?
          python tools/crawl_listed_company_disclosures.py --validate-only --require-events \
            >> /tmp/cninfo-structured.log 2>&1
          base_check_exit=$?
          python tools/cninfo_structured_disclosures.py --check --require-events \
            >> /tmp/cninfo-structured.log 2>&1
          structured_check_exit=$?
          export compile_exit test_exit bootstrap_exit base_exit structured_exit base_check_exit structured_check_exit
          mkdir -p diagnostics
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          snapshot_path = Path("public/data/listed_company_disclosures.json")
          try:
              snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          except Exception as exc:
              snapshot = {"readError": f"{type(exc).__name__}: {exc}"}
          statuses = [
              {
                  key: row.get(key)
                  for key in (
                      "id",
                      "companySlug",
                      "market",
                      "ticker",
                      "status",
                      "accepted",
                      "structuredAttempted",
                      "structuredOrgIdResolved",
                      "structuredScanned",
                      "structuredAccepted",
                      "structuredErrors",
                  )
              }
              for row in snapshot.get("sourceStatus", [])
              if isinstance(row, dict) and row.get("market") == "A股"
          ]
          exit_codes = {
              key: int(os.environ[key])
              for key in (
                  "compile_exit",
                  "test_exit",
                  "bootstrap_exit",
                  "base_exit",
                  "structured_exit",
                  "base_check_exit",
                  "structured_check_exit",
              )
          }
          log_lines = Path("/tmp/cninfo-structured.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          report = {
              "generatedAt": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "passed": all(value == 0 for value in exit_codes.values()),
              "exitCodes": exit_codes,
              "snapshot": {
                  "generatedAt": snapshot.get("generatedAt"),
                  "companyCount": snapshot.get("companyCount"),
                  "eventCount": snapshot.get("eventCount"),
                  "cninfoStructured": snapshot.get("cninfoStructured"),
                  "aShareStatuses": statuses,
              },
              "logTail": log_lines[-160:],
          }
          Path("diagnostics/cninfo-structured-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit diagnostics, data and remove one-time workflow
        run: |
          rm -f .github/workflows/validate-cninfo-structured-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            diagnostics/cninfo-structured-validation.json \
            public/data/listed_company_disclosures.json \
            .github/workflows/validate-cninfo-structured-once.yml
          git commit -m "ci: record CNINFO structured disclosure validation"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
