name: One-time verify Sogou WeChat runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-wechat-sogou-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests and one-account probe
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > /tmp/wechat-sogou.log
          python -m py_compile tools/wechat_sogou_index.py tools/wechat_sogou_bridge.py tools/wechat_public_sources.py tools/wechat_registry_bridge.py tools/crawl_with_wechat_registry.py >>/tmp/wechat-sogou.log 2>&1
          COMPILE=$?
          python -m unittest tests.test_wechat_sogou_index tests.test_wechat_public_sources tests.test_wechat_source_registry >>/tmp/wechat-sogou.log 2>&1
          TESTS=$?
          npm install >>/tmp/wechat-sogou.log 2>&1
          INSTALL=$?
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit >>/tmp/wechat-sogou.log 2>&1
            TYPES=$?
          else
            TYPES=99
          fi
          python - <<'PY' >>/tmp/wechat-sogou.log 2>&1
          import json
          from pathlib import Path
          from tools import crawl_articles
          from tools import crawl_with_tracking
          from tools import wechat_public_sources
          from tools import wechat_registry_bridge
          from tools import wechat_sogou_bridge
          from tools import wechat_sogou_index
          from tools import wechat_source_registry

          tracking = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = wechat_source_registry.generated_wechat_sources(tracks, crawl_with_tracking)
          spec = next(
              item for item in specs
              if item.get('accountConfigId') == 'qbitai' and item.get('sector') == 'AI / AGI'
          )
          search_url = wechat_sogou_index.build_search_url(spec)
          body = wechat_sogou_index._request(search_url)
          rows = wechat_sogou_index.parse_search_results(body, search_url)
          probe = {
              'spec': {
                  'id': spec.get('id'),
                  'name': spec.get('name'),
                  'sector': spec.get('sector'),
                  'expectedAccounts': spec.get('expectedAccounts'),
              },
              'searchUrl': search_url,
              'candidateCount': len(rows),
              'candidates': [],
              'accepted': [],
          }
          wechat_registry_bridge.install(wechat_public_sources)
          wechat_sogou_bridge.install(wechat_public_sources)
          for row in rows[:2]:
              item = {
                  'title': row.get('title'),
                  'account': row.get('account'),
                  'publishedAt': row.get('publishedAt'),
                  'resultUrl': row.get('url'),
              }
              try:
                  direct = wechat_sogou_index.resolve_result_url(row['url'], search_url)
              except Exception as exc:
                  direct = ''
                  item['resolveError'] = f'{type(exc).__name__}: {exc}'
              item['directUrl'] = direct
              if direct:
                  try:
                      page = wechat_public_sources.fetch_public_wechat_page(direct, timeout=10, attempts=1)
                      parsed = wechat_public_sources.parse_wechat_article(
                          spec,
                          direct,
                          page,
                          crawl_articles,
                          fallback_title=row.get('title', ''),
                          fallback_summary=row.get('summary', ''),
                          fallback_date=row.get('publishedAt'),
                      )
                      item['pageLength'] = len(page)
                      item['parsed'] = bool(parsed)
                      if parsed:
                          probe['accepted'].append({
                              'title': parsed.get('title'),
                              'publishedAt': parsed.get('publishedAt'),
                              'wechatAccount': parsed.get('wechatAccount'),
                              'sector': parsed.get('sector'),
                              'company': parsed.get('company'),
                              'mentionedCompanies': parsed.get('mentionedCompanies', []),
                              'mentionedPeople': parsed.get('mentionedPeople', []),
                              'url': parsed.get('source', {}).get('url'),
                          })
                  except Exception as exc:
                      item['pageError'] = f'{type(exc).__name__}: {exc}'
              probe['candidates'].append(item)
          Path('/tmp/wechat-sogou-runtime.json').write_text(json.dumps(probe, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          RUNTIME=$?
          python - "$COMPILE" "$TESTS" "$INSTALL" "$TYPES" "$RUNTIME" <<'PY'
          import json, sys
          from pathlib import Path
          values = [int(value) for value in sys.argv[1:]]
          result = {
              'compileStatus': values[0],
              'testStatus': values[1],
              'installStatus': values[2],
              'typeStatus': values[3],
              'runtimeStatus': values[4],
              'passed': all(value == 0 for value in values),
          }
          try:
              result['runtime'] = json.loads(Path('/tmp/wechat-sogou-runtime.json').read_text(encoding='utf-8'))
          except Exception as exc:
              result['runtime'] = {'error': f'{type(exc).__name__}: {exc}'}
          result['logTail'] = Path('/tmp/wechat-sogou.log').read_text(errors='replace').splitlines()[-140:]
          Path('diagnostics/wechat-sogou-runtime.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-sogou-runtime.json
          git commit -m "ci: record Sogou WeChat runtime verification"
          git pull --rebase origin main
          git push origin HEAD:main
