name: One-time recommendation build diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production checks
        shell: bash
        run: |
          set +e
          : > pages-build-diagnostic.log
          npm install >> pages-build-diagnostic.log 2>&1
          install_status=$?
          unit_status=99
          build_status=99
          if [ "$install_status" -eq 0 ]; then
            npm run test:unit >> pages-build-diagnostic.log 2>&1
            unit_status=$?
          fi
          if [ "$install_status" -eq 0 ] && [ "$unit_status" -eq 0 ]; then
            npm run build:pages >> pages-build-diagnostic.log 2>&1
            build_status=$?
          fi
          export INSTALL_STATUS="$install_status"
          export UNIT_STATUS="$unit_status"
          export BUILD_STATUS="$build_status"
          export DIAGNOSTIC_SHA="$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = Path("pages-build-diagnostic.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          install_status = int(os.environ["INSTALL_STATUS"])
          unit_status = int(os.environ["UNIT_STATUS"])
          build_status = int(os.environ["BUILD_STATUS"])
          payload = {
              "commit": os.environ["DIAGNOSTIC_SHA"],
              "installStatus": install_status,
              "unitStatus": unit_status,
              "buildStatus": build_status,
              "passed": install_status == 0 and unit_status == 0 and build_status == 0,
              "logTail": lines[-160:],
          }
          target = Path("diagnostics/pages-build-status.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pages-build-status.json
          git commit -m "ci: record recommendation build diagnostic" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
