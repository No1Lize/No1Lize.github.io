name: Adaptive source pipeline diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adaptive-source-pipeline-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify adaptive user-source pipeline
        shell: bash
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          # diagnostic revision: final-social-native-search-v6
          set +e
          REPORT="diagnostics/adaptive-source-pipeline-report.txt"
          mkdir -p diagnostics
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "===== py_compile ====="
            python -m py_compile \
              tools/adaptive_public_sources.py \
              tools/robust_web_fallback.py \
              tools/probe_user_sources.py \
              tools/validate_user_source_coverage.py \
              tools/eastmoney_transport.py
            echo "exit_code=$?"
            echo
            echo "===== user_source_probe ====="
            python tools/probe_user_sources.py --workers 4
            echo "exit_code=$?"
            echo
            echo "===== full_unittest ====="
            python -m unittest discover -s tests -p "test_*.py"
            echo "exit_code=$?"
          } >"$REPORT" 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "ci: record adaptive source pipeline diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
