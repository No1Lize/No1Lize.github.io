name: Apply venture retention sanitizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-venture-retention-sanitizer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply retained-history sanitizers
        run: |
          python tools/apply_venture_retention_sanitizer_patch.py
          python -m py_compile tools/venture_profile_extraction.py tools/crawl_venture_profiles.py
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/venture_profile_extraction.py tools/crawl_venture_profiles.py
          git commit -m 'fix: sanitize retained venture profile history'
          git pull --rebase origin main
          python -m py_compile tools/venture_profile_extraction.py tools/crawl_venture_profiles.py
          git push origin HEAD:main
