name: Sanitize venture profiles now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sanitize-venture-now.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sanitize-venture-now
  cancel-in-progress: false

# trigger-immediate-sanitation
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sanitize committed venture snapshot
        run: |
          python tools/sanitize_venture_profiles.py
          python tools/sanitize_venture_profiles.py --check
          python -m unittest tests.test_venture_profile_postprocess
          git diff --check
      - name: Commit sanitized snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sanitize-venture-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/venture_profiles.json .github/workflows/sanitize-venture-now.yml
          if git diff --cached --quiet; then
            echo "Snapshot already sanitized."
            exit 0
          fi
          git commit -m "data: sanitize venture profile snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python tools/sanitize_venture_profiles.py
            git add public/data/venture_profiles.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Publish sanitized site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
