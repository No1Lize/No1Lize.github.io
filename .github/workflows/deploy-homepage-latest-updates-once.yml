name: Deploy homepage latest updates once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-homepage-latest-updates-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homepage-latest-updates-deploy-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Pages
        run: npm run build:pages
      - name: Verify rendered homepage
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          grep -q '显示最新 80 /' out/index.html
          grep -q '频道最新更新' out/index.html
          grep -q '聚合频道 02、03、04、06、07' out/index.html
          if grep -q '02 / SECTOR HEAT' out/index.html; then
            echo 'legacy sector heat panel remains in rendered homepage' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-homepage-latest-updates
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
