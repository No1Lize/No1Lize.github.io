name: Validate all listed-company disclosures once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sec_structured_disclosures.py
      - tests/test_sec_structured_disclosures.py
      - .github/workflows/validate-sec-listed-companies-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: validate-sec-listed-companies-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete disclosure validation and record result
        id: verify
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/sec-listed-company-validation.log

          python -m py_compile \
            tools/crawl_listed_company_disclosures.py \
            tools/cninfo_structured_disclosures.py \
            tools/sec_structured_disclosures.py \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          compile_exit=$?

          python -m unittest \
            tests.test_listed_company_disclosures \
            tests.test_cninfo_structured_disclosures \
            tests.test_sec_structured_disclosures \
            tests.test_scheduled_sync_workflow \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          test_exit=$?

          python tools/bootstrap_listed_company_disclosures.py \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          bootstrap_exit=$?
          python tools/crawl_listed_company_disclosures.py \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          exchange_exit=$?
          python tools/cninfo_structured_disclosures.py --require-events \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          cninfo_exit=$?
          python tools/sec_structured_disclosures.py --require-events \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          sec_exit=$?
          python tools/sec_structured_disclosures.py --check --require-events \
            >> diagnostics/sec-listed-company-validation.log 2>&1
          check_exit=$?

          COMPILE_EXIT=$compile_exit TEST_EXIT=$test_exit \
          BOOTSTRAP_EXIT=$bootstrap_exit EXCHANGE_EXIT=$exchange_exit \
          CNINFO_EXIT=$cninfo_exit SEC_EXIT=$sec_exit CHECK_EXIT=$check_exit \
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          snapshot_path = Path("public/data/listed_company_disclosures.json")
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          log = Path("diagnostics/sec-listed-company-validation.log").read_text(
              encoding="utf-8", errors="replace"
          )
          exit_codes = {
              "compile": int(os.environ["COMPILE_EXIT"]),
              "tests": int(os.environ["TEST_EXIT"]),
              "bootstrap": int(os.environ["BOOTSTRAP_EXIT"]),
              "exchange": int(os.environ["EXCHANGE_EXIT"]),
              "cninfo": int(os.environ["CNINFO_EXIT"]),
              "sec": int(os.environ["SEC_EXIT"]),
              "check": int(os.environ["CHECK_EXIT"]),
          }
          sec_statuses = [
              {
                  "id": status.get("id"),
                  "companySlug": status.get("companySlug"),
                  "ticker": status.get("ticker"),
                  "status": status.get("status"),
                  "cikResolved": status.get("cikResolved"),
                  "scanned": status.get("scanned", 0),
                  "accepted": status.get("accepted", 0),
                  "errors": status.get("errors", []),
              }
              for status in snapshot.get("sourceStatus", [])
              if str(status.get("id", "")).startswith("sec-disclosure-")
          ]
          passed = (
              all(code == 0 for code in exit_codes.values())
              and int(snapshot.get("companyCount", 0)) >= 15
              and len(sec_statuses) == 10
              and all(int(status.get("accepted", 0) or 0) > 0 for status in sec_statuses)
          )
          report = {
              "generatedAt": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "passed": passed,
              "exitCodes": exit_codes,
              "snapshot": {
                  "generatedAt": snapshot.get("generatedAt"),
                  "companyCount": snapshot.get("companyCount", 0),
                  "eventCount": snapshot.get("eventCount", 0),
                  "cninfoStructured": snapshot.get("cninfoStructured", {}),
                  "secStructured": snapshot.get("secStructured", {}),
                  "secStatuses": sec_statuses,
              },
              "logTail": log.splitlines()[-160:],
          }
          Path("diagnostics/sec-listed-company-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["snapshot"], ensure_ascii=False))
          print(f"passed={str(passed).lower()}")
          PY

          passed=$(python - <<'PY'
          import json
          print(str(json.load(open("diagnostics/sec-listed-company-validation.json"))["passed"]).lower())
          PY
          )
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validation result and formal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-sec-listed-companies-once.yml
          git add \
            diagnostics/sec-listed-company-validation.json \
            diagnostics/sec-listed-company-validation.log
          if [ "${{ steps.verify.outputs.passed }}" = "true" ]; then
            git add public/data/listed_company_disclosures.json
            message="data: publish disclosures for every listed company"
          else
            git restore public/data/listed_company_disclosures.json
            message="diagnostics: record SEC listed-company validation failure"
          fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Publish company pages
        if: steps.verify.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
