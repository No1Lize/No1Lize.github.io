name: Cleanup venture migration scaffolding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-venture-migration-scaffolding.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-venture-migration-scaffolding
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time venture migration files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            tools/patch_venture_entity_labels_v1.py \
            tools/patch_venture_person_sentence_names.py \
            tools/patch_venture_short_summary_fallback.py \
            tools/patch_venture_terminal_entity_contract.py \
            tools/patch_venture_short_technology_fallback.py \
            tools/patch_venture_noisy_technology_rebuild.py \
            tools/patch_venture_entity_incremental_v2.py \
            tools/patch_venture_quality_compat.py \
            tools/patch_venture_enrichment_idempotence.py \
            tools/patch_venture_structured_products.py \
            tools/patch_venture_narrative_prose.py \
            tools/patch_venture_finalizer_products.py \
            tools/patch_venture_normalizer_fixed_point.py \
            tools/patch_refine_venture_evidence_regressions.py \
            tools/migrate_venture_entity_attribution_v1.py \
            .github/workflows/patch-venture-entity-labels-v1.yml \
            .github/workflows/venture-entity-label-pr.yml \
            .github/workflows/venture-patch-diagnostic.yml \
            .github/workflows/venture-entity-v2-pr.yml \
            .github/workflows/venture-entity-v2-diagnostic.yml \
            .github/workflows/venture-entity-v2-final.yml \
            .github/workflows/patch-venture-normalizer-fixed-point.yml \
            .github/workflows/patch-refine-venture-evidence.yml \
            .github/workflows/normalize-venture-snapshot-now.yml \
            .github/workflows/issue-trigger-venture-sanitize.yml \
            .github/workflows/venture-sanitize-pr.yml \
            .github/workflows/sanitize-venture-now.yml \
            .github/workflows/cleanup-venture-migration-scaffolding.yml \
            .venture-sanitize-trigger \
            .venture-entity-label-trigger \
            .venture-patch-diagnostic-trigger \
            .venture-entity-v2-trigger \
            .venture-entity-v2-diagnostic-trigger \
            .venture-entity-v2-final-trigger
          rm -f diagnostics/venture-*.txt
          rmdir diagnostics 2>/dev/null || true
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No temporary venture files remain."
            exit 0
          fi
          git commit -m "chore: remove venture migration scaffolding"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
