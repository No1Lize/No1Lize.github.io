name: Normalize venture snapshot now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-venture-snapshot-now.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: venture-snapshot-normalization-now
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize, validate and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m py_compile \
              tools/venture_profile_extraction.py \
              tools/crawl_venture_profiles.py \
              tools/enrich_venture_profiles.py \
              tools/normalize_venture_profiles.py
            python -m unittest \
              tests.test_venture_profile_extraction \
              tests.test_venture_profile_noise_filters \
              tests.test_venture_profile_enrichment \
              tests.test_normalize_venture_profiles
            python tools/normalize_venture_profiles.py
            python tools/normalize_venture_profiles.py --check
            python tools/crawl_venture_profiles.py --validate-only
            python tools/enrich_venture_profiles.py --validate-only
            git diff --check

            git rm .github/workflows/normalize-venture-snapshot-now.yml
            git add public/data/venture_profiles.json
            git commit -m "data: normalize startup and institution profiles"
            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
