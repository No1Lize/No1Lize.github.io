name: Refresh WeChat coverage for all enabled tracks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - config/user_tracking.json
      - config/wechat_sources.json
      - config/wechat_public_indexes.json
      - tools/wechat_*.py
      - tools/refresh_wechat_snapshot.py
      - tests/test_wechat_*.py
      - tests/test_refresh_wechat_snapshot.py
      - .github/workflows/refresh-all-track-wechat.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: all-track-wechat-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every enabled track has a generic WeChat source
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import crawl_with_tracking
          from tools import refresh_wechat_snapshot

          tracking = crawl_with_tracking.load_tracking()
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = refresh_wechat_snapshot.configured_sources()
          enabled = [track["name"] for track in tracks]
          generic = {
              spec["sector"]: spec
              for spec in specs
              if spec.get("genericDiscovery")
          }
          missing = sorted(set(enabled) - set(generic))
          if missing:
              raise SystemExit(f"enabled tracks missing generic WeChat sources: {missing}")
          plan = {
              "enabledTrackCount": len(enabled),
              "generatedSourceCount": len(specs),
              "genericSourceCount": len(generic),
              "missingGenericTracks": missing,
              "tracks": [
                  {
                      "sector": sector,
                      "genericSourceId": generic[sector]["id"],
                      "keywords": generic[sector].get("keywords", []),
                      "trackedCompanies": generic[sector].get("trackedCompanies", []),
                      "trackedPeople": generic[sector].get("trackedPeople", []),
                      "publicIndexUrls": generic[sector].get("publicIndexUrls", []),
                      "accountSources": [
                          spec["id"]
                          for spec in specs
                          if spec.get("sector") == sector
                          and spec.get("discoveryScope") == "account"
                      ],
                  }
                  for sector in enabled
              ],
          }
          Path("diagnostics/wechat-all-track-source-plan.json").write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              f"validated {len(enabled)} tracks, {len(generic)} generic sources, "
              f"and {len(specs)} total WeChat sources"
          )
          PY

      - name: Refresh all generated WeChat sources
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python tools/refresh_wechat_snapshot.py

      - name: Validate refreshed snapshot and write coverage report
        run: |
          python -m py_compile \
            tools/wechat_source_registry.py \
            tools/wechat_public_sources.py \
            tools/wechat_fetch_compat.py \
            tools/wechat_sogou_index.py \
            tools/wechat_sogou_link_compat.py \
            tools/wechat_registry_bridge.py \
            tools/wechat_original_redirect_bridge.py \
            tools/wechat_index_record_fallback.py \
            tools/wechat_snapshot_quality.py \
            tools/refresh_wechat_snapshot.py
          python -m unittest \
            tests.test_wechat_source_registry \
            tests.test_wechat_sogou_index \
            tests.test_wechat_sogou_link_compat \
            tests.test_wechat_public_sources \
            tests.test_wechat_fetch_compat \
            tests.test_wechat_public_index_fallback \
            tests.test_wechat_original_redirect_bridge \
            tests.test_wechat_index_record_fallback \
            tests.test_wechat_snapshot_quality \
            tests.test_refresh_wechat_snapshot
          python tools/crawl_articles.py --validate-only
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from tools import crawl_with_tracking
          from tools import refresh_wechat_snapshot

          payload = json.loads(Path("public/data/articles.json").read_text(encoding="utf-8"))
          non_original = [
              article.get("id", "unknown")
              for article in payload.get("articles", [])
              if refresh_wechat_snapshot._is_wechat_record(article)
              and not refresh_wechat_snapshot._publishable_article(article)
          ]
          if non_original:
              raise SystemExit(
                  f"non-original WeChat records entered the snapshot: {non_original[:10]}"
              )

          tracking = crawl_with_tracking.load_tracking()
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = refresh_wechat_snapshot.configured_sources()
          source_to_sector = {spec["id"]: spec["sector"] for spec in specs}
          target_ids = set(source_to_sector)
          statuses = {
              str(item.get("id")): item
              for item in payload.get("sourceStatus", [])
              if str(item.get("id")) in target_ids
          }
          articles_by_sector = defaultdict(list)
          for article in payload.get("articles", []):
              source_id = str(article.get("sourceId", ""))
              sector = source_to_sector.get(source_id)
              if sector:
                  articles_by_sector[sector].append(article)

          rows = []
          for track in tracks:
              sector = track["name"]
              sector_specs = [spec for spec in specs if spec["sector"] == sector]
              sector_statuses = [
                  statuses[spec["id"]]
                  for spec in sector_specs
                  if spec["id"] in statuses
              ]
              articles = articles_by_sector.get(sector, [])
              rows.append(
                  {
                      "sector": sector,
                      "custom": bool(track.get("custom")),
                      "genericSourcePresent": any(
                          spec.get("genericDiscovery") for spec in sector_specs
                      ),
                      "sourceCount": len(sector_specs),
                      "statusCount": len(sector_statuses),
                      "acceptedThisRun": sum(
                          int(item.get("accepted", 0) or 0) for item in sector_statuses
                      ),
                      "retainedSourceCount": sum(
                          1 for item in sector_statuses if item.get("retainedPrevious")
                      ),
                      "snapshotArticleCount": len(articles),
                      "fullTextArticles": len(articles),
                      "indexOnlyArticles": 0,
                      "providers": dict(
                          Counter(
                              str(item.get("discoveryProvider", "unknown"))
                              for item in sector_statuses
                          )
                      ),
                      "sources": sector_statuses,
                  }
              )

          missing_status = [
              row["sector"]
              for row in rows
              if not row["genericSourcePresent"] or row["statusCount"] == 0
          ]
          if missing_status:
              raise SystemExit(
                  f"enabled tracks missing generated or executed WeChat source: {missing_status}"
              )

          report = {
              "snapshotGeneratedAt": payload.get("generatedAt"),
              "enabledTrackCount": len(rows),
              "generatedSourceCount": len(specs),
              "executedSourceCount": len(statuses),
              "tracksWithoutExecutedSource": missing_status,
              "originalUrlContractPassed": not non_original,
              "wechatIngestion": payload.get("wechatIngestion", {}),
              "tracks": rows,
          }
          Path("diagnostics/wechat-all-track-coverage.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit snapshot and coverage diagnostics
        id: update
        shell: bash
        run: |
          if git diff --quiet -- \
            public/data/articles.json \
            diagnostics/wechat-all-track-source-plan.json \
            diagnostics/wechat-all-track-coverage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/articles.json \
            diagnostics/wechat-all-track-source-plan.json \
            diagnostics/wechat-all-track-coverage.json
          git commit -m "data: refresh WeChat coverage for all enabled tracks"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
