name: Deploy unified people research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-people-research-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: people-research-deploy-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund > /tmp/install.log 2>&1
      - name: Run unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:unit > /tmp/tests.log 2>&1
      - name: Build Pages
        id: build
        if: steps.install.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: npm run build:pages > /tmp/build.log 2>&1
      - name: Record build result
        if: always()
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json,pathlib
          def tail(path):
              p=pathlib.Path(path); return p.read_text(errors='replace')[-12000:] if p.exists() else ''
          data={'sourceCommit':'${{ github.sha }}','runId':'${{ github.run_id }}',
              'install':'${{ steps.install.outcome }}','tests':'${{ steps.tests.outcome }}',
              'build':'${{ steps.build.outcome }}','deployOutcome':'pending','deployed':False,
              'installLog':tail('/tmp/install.log'),'testLog':tail('/tmp/tests.log'),'buildLog':tail('/tmp/build.log')}
          pathlib.Path('diagnostics/people-research-deploy.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/people-research-deploy.json
          git commit -m 'ci: record people research build' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail when build verification failed
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-people-research
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Confirm deployment
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('diagnostics/people-research-deploy.json')
          data=json.loads(path.read_text()) if path.exists() else {}
          data.update({'sourceCommit':'${{ github.sha }}','runId':'${{ github.run_id }}',
              'deployOutcome':'${{ steps.deployment.outcome }}',
              'pageUrl':'${{ steps.deployment.outputs.page_url }}',
              'deployed':'${{ steps.deployment.outcome }}' == 'success'})
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/people-research-deploy.json
          git commit -m 'ci: confirm people research deployment' || true
          git pull --rebase origin main
          git push origin HEAD:main
