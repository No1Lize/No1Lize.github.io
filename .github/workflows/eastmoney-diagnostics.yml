name: Diagnose Eastmoney pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/eastmoney-diagnostics.yml
      - tools/eastmoney_*.py
      - tools/refine_eastmoney_snapshot.py
      - tools/validate_eastmoney_snapshot.py
      - tools/migrate_article_entities.py
      - tools/crawl_official_with_tracking.py
      - tests/test_eastmoney*.py
      - tests/test_refine_eastmoney_snapshot.py
      - tests/test_migrate_specialized_media_statuses.py
      - tests/test_validate_eastmoney_pipeline_metadata.py

permissions:
  contents: write

concurrency:
  group: eastmoney-pipeline-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete static snapshot pipeline
        id: pipeline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/eastmoney-pipeline.log
          overall=0

          run_step() {
            name="$1"
            shift
            echo "===== ${name} =====" | tee -a /tmp/eastmoney-pipeline.log
            "$@" >> /tmp/eastmoney-pipeline.log 2>&1
            code=$?
            echo "exit_code=${code}" | tee -a /tmp/eastmoney-pipeline.log
            echo | tee -a /tmp/eastmoney-pipeline.log
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_step migrate python tools/migrate_article_entities.py
          run_step refine python tools/refine_eastmoney_snapshot.py
          run_step quality_validate python tools/crawl_articles.py --validate-only
          run_step eastmoney_validate python tools/validate_eastmoney_snapshot.py --require-attempt
          run_step full_unittest python -m unittest discover -s tests -p "test_*.py"

          echo "===== final_snapshot_summary =====" | tee -a /tmp/eastmoney-pipeline.log
          python - <<'PY' >> /tmp/eastmoney-pipeline.log 2>&1
          import json
          from pathlib import Path

          payload = json.loads(Path("public/data/articles.json").read_text(encoding="utf-8"))
          articles = [item for item in payload.get("articles", []) if isinstance(item, dict)]
          eastmoney = [
              item for item in articles
              if str(item.get("sourceId", "")).startswith(("official-user-东方财富", "user-source-"))
              and "eastmoney.com" in str((item.get("source") or {}).get("url", ""))
          ]
          statuses = [
              item for item in payload.get("sourceStatus", [])
              if isinstance(item, dict) and "东方财富" in " ".join(
                  str(item.get(key, "")) for key in ("id", "name", "company")
              )
          ]
          print(json.dumps({
              "generatedAt": payload.get("generatedAt"),
              "articleCount": payload.get("articleCount"),
              "eastmoneyDetailCount": len(eastmoney),
              "internalMarkerCount": sum("_eastmoneyBatchOrigin" in item for item in articles),
              "eastmoneyStatuses": statuses,
              "qualityPassed": (payload.get("qualityGate") or {}).get("passed"),
          }, ensure_ascii=False, indent=2))
          PY
          summary_code=$?
          echo "exit_code=${summary_code}" | tee -a /tmp/eastmoney-pipeline.log
          if [ "$summary_code" -ne 0 ]; then
            overall=1
          fi

          git checkout -- public/data/articles.json
          echo "overall_exit_code=${overall}" >> "$GITHUB_OUTPUT"
          exit "$overall"
      - name: Record diagnostic report
        if: always()
        env:
          PIPELINE_EXIT_CODE: ${{ steps.pipeline.outputs.overall_exit_code }}
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit_code=${PIPELINE_EXIT_CODE:-unknown}"
            echo
            cat /tmp/eastmoney-pipeline.log
          } > diagnostics/eastmoney-test-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/eastmoney-test-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record Eastmoney test diagnostics"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Fail when pipeline failed
        if: steps.pipeline.outputs.overall_exit_code != '0'
        run: exit 1
