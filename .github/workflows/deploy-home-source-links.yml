name: Deploy homepage source-link fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-home-source-links.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-home-source-link-fix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:unit
      - name: Build Next.js static site
        run: GITHUB_PAGES=true npx next build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record deployed commit
        run: |
          mkdir -p diagnostics
          printf '{"deployed":true,"sourceCommit":"%s","deployedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > diagnostics/home-source-link-deployed.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/home-source-link-deployed.json
          git commit -m 'ci: record homepage source-link deployment' || true
          git pull --rebase origin main
          git push origin HEAD:main
