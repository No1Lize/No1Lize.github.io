name: Apply professional media article capacity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-professional-media-capacity.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-professional-media-capacity
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raise snapshot capacity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/crawl_articles.py')
          body = path.read_text(encoding='utf-8')
          old = 'MAX_ARTICLES = 600'
          new = 'MAX_ARTICLES = 1200'
          if body.count(old) != 1:
              raise SystemExit('expected exactly one 600-article capacity declaration')
          path.write_text(body.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile tools/crawl_articles.py
          python - <<'PY'
          from tools import crawl_articles
          if crawl_articles.MAX_ARTICLES != 1200:
              raise SystemExit(f'unexpected article capacity: {crawl_articles.MAX_ARTICLES}')
          print({'articleCapacity': crawl_articles.MAX_ARTICLES})
          PY
      - name: Commit capacity and remove migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/apply-professional-media-capacity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/crawl_articles.py
          git add -u .github/workflows/apply-professional-media-capacity.yml
          git commit -m 'fix: expand formal article snapshot capacity'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 4
          done
          gh workflow run scheduled-sync.yml --ref main
