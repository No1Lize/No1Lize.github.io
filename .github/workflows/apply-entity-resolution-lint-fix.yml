name: Apply entity resolution lint fix

on:
  push:
    branches: ["feat/entity-resolution-center"]
    paths:
      - .entity-resolution-lint-fix-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-resolution-center
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply effect-free form refactor
        run: |
          python .fix-entity-resolution-lint.py
          rm -f .fix-entity-resolution-lint.py .entity-resolution-lint-fix-trigger
          npm ci
          npx eslint components/tracking-entity-resolution-review.tsx
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make entity resolution form effect-free"
          git push origin HEAD:feat/entity-resolution-center
