name: Temporary crawler diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-crawler-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - name: Capture crawler diagnostics
        run: npm run test:crawler > crawler-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: crawler-diagnostics
          path: crawler-diagnostics.txt
          if-no-files-found: error
