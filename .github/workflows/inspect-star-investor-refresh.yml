name: Inspect STAR investor production refresh

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-star-investor-refresh.yml"

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRODUCTION_SHA: a8a91a2d1773b7837e7b49f53cf5aacf9d36e02d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find or start the production refresh
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow star-market-investor-refresh.yml --limit 20 \
            --json databaseId,headSha,status,conclusion,event,createdAt \
            --jq '.[] | select(.headSha == env.PRODUCTION_SHA) | .databaseId' | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No push run found; dispatching the production workflow."
            gh workflow run star-market-investor-refresh.yml --ref main
            for _ in $(seq 1 30); do
              sleep 5
              run_id=$(gh run list --workflow star-market-investor-refresh.yml --limit 10 \
                --json databaseId,event,status,createdAt \
                --jq '.[] | select(.event == "workflow_dispatch") | .databaseId' | head -n 1)
              [ -n "$run_id" ] && break
            done
          fi
          if [ -z "$run_id" ]; then
            echo "Unable to locate or start STAR investor refresh" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run view "$run_id" --json databaseId,event,headSha,status,conclusion,createdAt,updatedAt

      - name: Wait for the refresh
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.locate.outputs.run_id }}'
          for _ in $(seq 1 300); do
            state=$(gh run view "$run_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
            echo "star_refresh=$state"
            if [ "${state%%:*}" = "completed" ]; then
              if [ "${state#*:}" != "success" ]; then
                gh run view "$run_id" --log-failed || true
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "STAR investor refresh timed out" >&2
          exit 1

      - name: Verify committed production data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --force origin/main
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("public/data/star_market_investors.json")
          snapshot = json.loads(path.read_text(encoding="utf-8"))
          companies = snapshot.get("companies", {})
          investors = [
              investor
              for company in companies.values()
              for investor in company.get("investors", [])
          ]
          assert snapshot.get("companyCount") == len(companies) > 0
          assert snapshot.get("investorCount") == len(investors) > 0
          assert all(str(company.get("ticker", "")).startswith("688") for company in companies.values())
          assert all(
              str(company.get("prospectus", {}).get("url", "")).startswith(
                  ("https://static.cninfo.com.cn/", "https://www.sse.com.cn/")
              )
              for company in companies.values()
          )
          serialized = json.dumps(snapshot, ensure_ascii=False)
          assert not re.search(r"(?<!\d)1[3-9]\d{9}(?!\d)", serialized)
          assert not re.search(r"(?<!\d)\d{17}[0-9Xx](?!\d)", serialized)
          print(json.dumps({
              "production_verified": True,
              "generatedAt": snapshot.get("generatedAt"),
              "companyCount": snapshot.get("companyCount"),
              "investorCount": snapshot.get("investorCount"),
              "companies": [
                  {
                      "name": company.get("name"),
                      "ticker": company.get("ticker"),
                      "sector": company.get("sector"),
                      "investorCount": company.get("institutionalInvestorCount"),
                      "prospectus": company.get("prospectus", {}).get("url"),
                  }
                  for company in companies.values()
              ],
          }, ensure_ascii=False, indent=2))
          PY
