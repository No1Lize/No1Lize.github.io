name: One-time admin save conflict verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-admin-save-conflict.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify
        shell: bash
        run: |
          set +e
          npm install > /tmp/verify.log 2>&1
          install_status=$?
          npm run test:unit >> /tmp/verify.log 2>&1
          test_status=$?
          npx tsc --noEmit >> /tmp/verify.log 2>&1
          type_status=$?
          python - <<PY
          import json
          from pathlib import Path
          log = Path('/tmp/verify.log').read_text(errors='replace').splitlines()
          result = {
              'installStatus': $install_status,
              'testStatus': $test_status,
              'typeStatus': $type_status,
              'passed': $install_status == 0 and $test_status == 0 and $type_status == 0,
              'logTail': log[-160:],
          }
          Path('diagnostics/admin-save-conflict.json').parent.mkdir(exist_ok=True)
          Path('diagnostics/admin-save-conflict.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Record result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/admin-save-conflict.json
          git commit -m "ci: record repeated admin save verification"
          git pull --rebase origin main
          git push origin HEAD:main
