name: Verify source governance PR

on:
  pull_request:
    paths:
      - tools/crawl_with_wechat_registry.py
      - tools/source_evidence.py
      - tools/source_health_runtime.py
      - tools/update_source_health.py
      - config/source_health_policy.json
      - lib/channel-updates.ts
      - components/channel-update-directory-client.tsx
      - components/channel-update-directory.module.css
      - tests/test_source_evidence.py
      - tests/test_source_health.py
      - tests/test_source_health_runtime.py
      - .github/workflows/verify-source-governance-pr.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test source evidence and health governance
        run: |
          python -m unittest \
            tests.test_source_evidence \
            tests.test_source_health \
            tests.test_source_health_runtime
          python -m py_compile \
            tools/crawl_with_wechat_registry.py \
            tools/source_evidence.py \
            tools/source_health_runtime.py \
            tools/update_source_health.py
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build Pages snapshot
        env:
          ALLOW_INCOMPLETE_TRACKING_COVERAGE: "true"
        run: npm run build:pages
