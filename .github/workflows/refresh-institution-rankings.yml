name: Refresh institution rankings

on:
  pull_request:
    paths:
      - "app/institutions/**"
      - "components/institution-directory*"
      - "lib/institution-ranking-data.ts"
      - "tools/crawl_institution_rankings.py"
      - "tests/institution-ranking-data.test.ts"
      - "tests/test_institution_ranking_crawler.py"
      - ".github/workflows/refresh-institution-rankings.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

concurrency:
  group: institution-rankings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ranking parser
        run: python -m unittest tests.test_institution_ranking_crawler
      - name: Validate Qingke and CVSource pages
        run: python tools/crawl_institution_rankings.py --report public/data/institution_ranking_status.json
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"
      - name: Collect pull-request diagnostics
        if: github.event_name == 'pull_request'
        run: |
          npm install
          npx tsc --noEmit > tsc-diagnostics.txt 2>&1 || true
          npm run test:unit > unit-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: institution-pr-diagnostics
          path: |
            tsc-diagnostics.txt
            unit-diagnostics.txt
          if-no-files-found: error
      - name: Commit source health report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/institution_ranking_status.json
          if git diff --cached --quiet; then
            echo "No institution ranking status changes."
            exit 0
          fi
          git commit -m "data: refresh institution ranking source status"
          for attempt in 1 2 3; do
            # During a rebase, "theirs" is this run's freshly generated report.
            git pull --rebase -X theirs origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
