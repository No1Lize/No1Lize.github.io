name: Deploy channel update filters once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-channel-updates-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: channel-update-filters-deploy-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund > /tmp/install.log 2>&1
      - name: Run unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:unit > /tmp/tests.log 2>&1
      - name: Build GitHub Pages
        id: build
        if: steps.install.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: npm run build:pages > /tmp/build.log 2>&1
      - name: Record build result
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path

          def tail(path: str) -> str:
              file = Path(path)
              return file.read_text(errors='replace')[-16000:] if file.exists() else ''

          result = {
              'sourceCommit': '${{ github.sha }}',
              'featureCommit': 'dd937d124f9a2aa3b80824fd1e2249add16f0eb0',
              'runId': '${{ github.run_id }}',
              'install': '${{ steps.install.outcome }}',
              'tests': '${{ steps.tests.outcome }}',
              'build': '${{ steps.build.outcome }}',
              'deployOutcome': 'pending',
              'deployed': False,
              'installLog': tail('/tmp/install.log'),
              'testLog': tail('/tmp/tests.log'),
              'buildLog': tail('/tmp/build.log'),
          }
          Path('diagnostics/channel-update-deploy.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/channel-update-deploy.json
          git commit -m 'ci: record channel update build' || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Enforce verified build
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-channel-updates
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm deployment
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('diagnostics/channel-update-deploy.json')
          result = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          result.update({
              'runId': '${{ github.run_id }}',
              'deployOutcome': '${{ steps.deployment.outcome }}',
              'pageUrl': '${{ steps.deployment.outputs.page_url }}',
              'deployed': '${{ steps.deployment.outcome }}' == 'success',
          })
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/channel-update-deploy.json
          git commit -m 'ci: confirm channel update deployment' || true
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
