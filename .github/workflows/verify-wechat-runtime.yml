name: One-time verify WeChat crawler runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-wechat-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests and public probes
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > /tmp/wechat-final.log
          python -m json.tool config/wechat_sources.json >/dev/null 2>>/tmp/wechat-final.log
          JSON_STATUS=$?
          python -m py_compile tools/wechat_public_sources.py tools/wechat_source_registry.py tools/wechat_registry_bridge.py tools/crawl_with_wechat_registry.py tools/crawl_with_source_categories.py >>/tmp/wechat-final.log 2>&1
          PYCOMPILE=$?
          python -m unittest tests.test_wechat_public_sources tests.test_wechat_source_registry >>/tmp/wechat-final.log 2>&1
          WECHAT_TESTS=$?
          python -m unittest discover -s tests -p "test_*.py" >>/tmp/wechat-final.log 2>&1
          PY_TESTS=$?
          npm install >>/tmp/wechat-final.log 2>&1
          INSTALL=$?
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit >>/tmp/wechat-final.log 2>&1
            TYPES=$?
          else
            TYPES=99
          fi

          python - <<'PY' >>/tmp/wechat-final.log 2>&1
          import json
          from pathlib import Path
          from tools import crawl_articles
          from tools import crawl_with_tracking
          from tools import wechat_public_sources
          from tools import wechat_registry_bridge
          from tools import wechat_source_registry

          wechat_registry_bridge.install(wechat_public_sources)
          tracking = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = wechat_source_registry.generated_wechat_sources(tracks, crawl_with_tracking)
          selected_ids = {'qbitai', 'icbank', 'gg-lithium'}
          selected = []
          for spec in specs:
              config_id = str(spec.get('accountConfigId') or '')
              if config_id in selected_ids and config_id not in {str(item.get('accountConfigId')) for item in selected}:
                  item = dict(spec)
                  item['maxItems'] = 1
                  selected.append(item)

          original_rows = wechat_public_sources._feed_rows
          original_fetch_page = wechat_public_sources.fetch_public_wechat_page
          wechat_public_sources._feed_rows = lambda body, crawler: original_rows(body, crawler)[:3]
          wechat_public_sources.fetch_public_wechat_page = lambda url: original_fetch_page(url, timeout=8, attempts=1)

          runtime = []
          for spec in selected:
              try:
                  articles, status = wechat_public_sources.crawl_wechat_source(
                      spec,
                      crawl_articles.DEFAULT_USER_AGENT,
                      crawl_articles,
                  )
                  runtime.append({
                      'accountConfigId': spec.get('accountConfigId'),
                      'name': spec.get('name'),
                      'sector': spec.get('sector'),
                      'status': status,
                      'samples': [
                          {
                              'title': article.get('title'),
                              'url': article.get('source', {}).get('url'),
                              'publishedAt': article.get('publishedAt'),
                              'wechatAccount': article.get('wechatAccount'),
                              'company': article.get('company'),
                              'mentionedCompanies': article.get('mentionedCompanies', []),
                              'mentionedPeople': article.get('mentionedPeople', []),
                          }
                          for article in articles[:2]
                      ],
                  })
              except Exception as exc:
                  runtime.append({
                      'accountConfigId': spec.get('accountConfigId'),
                      'name': spec.get('name'),
                      'sector': spec.get('sector'),
                      'status': {'status': 'error', 'error': f'{type(exc).__name__}: {exc}'},
                      'samples': [],
                  })

          payload = json.loads(Path('public/data/articles.json').read_text(encoding='utf-8'))
          current_articles = [
              article for article in payload.get('articles', [])
              if article.get('source', {}).get('platform') == '微信'
              or str(article.get('sourceId', '')).startswith(('wechat-', 'user-track-wechat-'))
          ]
          current_statuses = [
              status for status in payload.get('sourceStatus', [])
              if status.get('platform') == '微信'
              or str(status.get('id', '')).startswith(('wechat-', 'user-track-wechat-'))
          ]
          Path('/tmp/wechat-runtime.json').write_text(json.dumps({
              'configuredAccounts': len(wechat_source_registry.load_registry().get('accounts', [])),
              'generatedSources': len(specs),
              'runtimeProbes': runtime,
              'snapshotArticleCount': len(current_articles),
              'snapshotStatusCount': len(current_statuses),
              'snapshotSamples': [
                  {
                      'title': article.get('title'),
                      'sector': article.get('sector'),
                      'company': article.get('company'),
                      'wechatAccount': article.get('wechatAccount'),
                      'mentionedCompanies': article.get('mentionedCompanies', []),
                      'mentionedPeople': article.get('mentionedPeople', []),
                  }
                  for article in current_articles[:5]
              ],
              'snapshotStatuses': current_statuses[:12],
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          RUNTIME=$?

          python - "$JSON_STATUS" "$PYCOMPILE" "$WECHAT_TESTS" "$PY_TESTS" "$INSTALL" "$TYPES" "$RUNTIME" <<'PY'
          import json, sys
          from pathlib import Path
          names = ['jsonStatus','pycompileStatus','wechatTestStatus','pythonTestStatus','installStatus','typeStatus','runtimeStatus']
          values = [int(value) for value in sys.argv[1:]]
          result = dict(zip(names, values))
          result['passed'] = all(value == 0 for value in values[:6])
          try:
              result['runtime'] = json.loads(Path('/tmp/wechat-runtime.json').read_text(encoding='utf-8'))
          except Exception as exc:
              result['runtime'] = {'error': f'{type(exc).__name__}: {exc}'}
          result['logTail'] = Path('/tmp/wechat-final.log').read_text(errors='replace').splitlines()[-180:]
          Path('diagnostics/wechat-final.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-final.json
          git commit -m "ci: record final WeChat crawler verification"
          git pull --rebase origin main
          git push origin HEAD:main
