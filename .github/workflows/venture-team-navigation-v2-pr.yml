name: Validate extended venture team navigation filter

on:
  pull_request:
    branches: [main]
    paths:
      - .venture-team-navigation-v2-trigger
      - .github/workflows/venture-team-navigation-v2-pr.yml

permissions:
  contents: write

concurrency:
  group: venture-team-navigation-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extend navigation phrase vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/enforce_venture_entity_semantics.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''    "documentation", "docs", "community", "customers", "services", "technology",
              "for", "with", "and", "our", "your", "all", "using", "how", "why", "what",
          }
          '''
          new = '''    "documentation", "docs", "community", "customers", "services", "technology",
              "experience", "stories", "story", "launch", "research", "hub", "contact",
              "login", "portfolio", "jobs", "careers", "insights", "news", "updates",
              "for", "with", "and", "our", "your", "all", "using", "how", "why", "what",
          }
          '''
          if new not in source:
              if old not in source:
                  raise SystemExit('person navigation vocabulary block not found')
              source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_venture_semantic_rebase.py')
          test = test_path.read_text(encoding='utf-8')
          if 'test_rejects_portfolio_navigation_phrases_as_team_names' not in test:
              marker = '\n\nif __name__ == "__main__":\n'
              method = '''
              def test_rejects_portfolio_navigation_phrases_as_team_names(self) -> None:
                  self.assertFalse(semantics._valid_person_name("Experience Stories Launch Research"))
                  self.assertFalse(semantics._valid_person_name("Portfolio Insights Research Hub"))
                  self.assertTrue(semantics._valid_person_name("Sarah Guo"))
          '''
              if marker not in test:
                  raise SystemExit('team navigation v2 test marker not found')
              test_path.write_text(test.replace(marker, method + marker, 1), encoding='utf-8')
          PY
      - name: Run regressions and reprocess formal snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/enforce_venture_entity_semantics.py
          python -m unittest \
            tests.test_refine_venture_research_evidence \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics \
            tests.test_stabilize_venture_profiles \
            tests.test_venture_semantic_rebase
          converged=false
          for pass in $(seq 1 8); do
            cp public/data/venture_profiles.json /tmp/before.json
            python tools/refine_venture_research_evidence.py
            python tools/normalize_venture_profiles.py
            python tools/stabilize_venture_profiles.py
            if cmp -s /tmp/before.json public/data/venture_profiles.json; then
              converged=true
              break
            fi
          done
          test "$converged" = true
          python tools/refine_venture_research_evidence.py --check
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend
        run: |
          npm install
          node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
      - name: Commit permanent rule, test and data
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/venture-team-navigation-v2-pr.yml .venture-team-navigation-v2-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/enforce_venture_entity_semantics.py \
            tests/test_venture_semantic_rebase.py \
            public/data/venture_profiles.json
          git add -u .github/workflows/venture-team-navigation-v2-pr.yml .venture-team-navigation-v2-trigger
          git commit -m 'fix: reject portfolio navigation phrases as team names'
          git push origin HEAD:${{ github.head_ref }}
