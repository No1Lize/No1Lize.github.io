name: Publish reconciled tracking snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/verify-professional-venture-live.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile and validate tracking snapshot
        run: |
          python tools/enrich_tracking_snapshot.py
          node scripts/validate-tracking-snapshot.mjs
      - name: Publish snapshot to verification branch and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          publish_file() {
            local path="$1"
            local message="$2"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${path}"
            local sha
            sha="$(gh api "${endpoint}?ref=${TARGET_BRANCH}" --jq '.sha' 2>/dev/null || true)"
            local request
            request="$(mktemp)"
            python - "$path" "$message" "$sha" "$TARGET_BRANCH" "$request" <<'PY'
          import base64
          import json
          import sys

          path, message, sha, branch, request_path = sys.argv[1:]
          payload = {
              'message': message,
              'content': base64.b64encode(open(path, 'rb').read()).decode(),
              'branch': branch,
          }
          if sha:
              payload['sha'] = sha
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          PY
            gh api --method PUT "$endpoint" --input "$request" >/dev/null
            rm -f "$request"
          }

          publish_file \
            public/data/articles.json \
            'data: reconcile article snapshot with tracking configuration'

          workflow_path='.github/workflows/verify-professional-venture-live.yml'
          workflow_endpoint="repos/${GITHUB_REPOSITORY}/contents/${workflow_path}"
          workflow_sha="$(gh api "${workflow_endpoint}?ref=${TARGET_BRANCH}" --jq '.sha')"
          request="$(mktemp)"
          python - "$workflow_sha" "$TARGET_BRANCH" "$request" <<'PY'
          import json
          import sys

          sha, branch, request_path = sys.argv[1:]
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump({
                  'message': 'chore: remove temporary live verification workflow',
                  'sha': sha,
                  'branch': branch,
              }, handle)
          PY
          gh api --method DELETE "$workflow_endpoint" --input "$request" >/dev/null
          rm -f "$request"
