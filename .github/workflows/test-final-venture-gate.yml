name: Test final venture quality gate

on:
  push:
    branches:
      - feature/final-venture-quality-gate-20260726
    paths:
      - tools/finalize_venture_profiles.py
      - tests/test_finalize_venture_profiles.py
      - .github/workflows/test-final-venture-gate.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile finalizer
        run: python -m py_compile tools/finalize_venture_profiles.py
      - name: Run finalizer regression tests
        run: python -m unittest -v tests.test_finalize_venture_profiles
