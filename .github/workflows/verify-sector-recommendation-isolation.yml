name: One-time verify recommendation sector isolation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-sector-recommendation-isolation.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        shell: bash
        run: |
          set +e
          npm install > /tmp/sector-recommendation.log 2>&1
          INSTALL_STATUS=$?
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npm run test:unit >> /tmp/sector-recommendation.log 2>&1
            TEST_STATUS=$?
          else
            TEST_STATUS=99
          fi
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npx tsc --noEmit >> /tmp/sector-recommendation.log 2>&1
            TYPE_STATUS=$?
          else
            TYPE_STATUS=99
          fi
          node - <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync('/tmp/sector-recommendation.log', 'utf8');
          const installStatus = Number(process.env.INSTALL_STATUS ?? 0);
          NODE
          printf '{\n  "installStatus": %s,\n  "testStatus": %s,\n  "typeStatus": %s,\n  "passed": %s,\n  "logTail": %s\n}\n' \
            "$INSTALL_STATUS" "$TEST_STATUS" "$TYPE_STATUS" \
            "$([ "$INSTALL_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$TYPE_STATUS" -eq 0 ] && echo true || echo false)" \
            "$(tail -n 180 /tmp/sector-recommendation.log | python -c 'import json,sys; print(json.dumps(sys.stdin.read().splitlines(), ensure_ascii=False))')" \
            > diagnostics/sector-recommendation-isolation.json
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sector-recommendation-isolation.json
          git commit -m "ci: record recommendation sector isolation verification"
          git pull --rebase origin main
          git push origin HEAD:main
