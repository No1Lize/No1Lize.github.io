name: Verify strict STAR parser live once
# Reused workflow path so GitHub executes the owner-authorized review publication gate.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-star-strict-live-once.yml
      - config/star_market_investor_reviews.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-star-strict-live-once
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/star-market-strict-table-manual-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-star-investors.txt
          npm ci

      - name: Apply owner-authorized manifest to strict official-prospectus candidates
        run: |
          python - <<'PY'
          from tools.review_star_market_investors import load_review_manifest
          decisions = load_review_manifest()
          assert len(decisions) == 31, len(decisions)
          assert all(item['status'] == 'verified' for item in decisions.values())
          assert all(item['reviewer'] == 'VCIQ-authorized/OpenAI-assisted' for item in decisions.values())
          PY
          python tools/review_star_market_investors.py
          python tools/crawl_star_market_investors.py --check --require-companies
          python tools/review_star_market_investors.py --check
          node --import tsx scripts/build-institution-data-layers.ts

      - name: Verify authoritative relationship boundary and full site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('public/data/star_market_investors.json').read_text())
          investors = snapshot['companies']['cambricon']['investors']
          assert len(investors) == 31
          assert snapshot['verifiedInvestorCount'] == 31
          assert snapshot['needsReviewInvestorCount'] == 0
          assert snapshot['rejectedInvestorCount'] == 0
          assert snapshot['reviewManifestDecisionCount'] == 31
          assert all(item['reviewStatus'] == 'verified' for item in investors)
          assert all(item['reviewSource'] == 'manifest' for item in investors)
          assert all(item['reviewedBy'] == 'VCIQ-authorized/OpenAI-assisted' for item in investors)
          assert all(item.get('preIpoShares', 0) > 0 for item in investors)
          assert all(0 < item.get('preIpoOwnershipPct', 0) <= 100 for item in investors)
          assert not any(item.get('publicContact') for item in investors)

          equity = json.loads(Path('public/data/institution_equity_relationships.json').read_text())
          assert equity['verifiedRelationshipCount'] == 31
          assert equity['needsReviewCount'] == 0
          assert equity['rejectedCount'] == 0
          assert len(equity['relationships']) == 31
          assert all(row['review']['status'] == 'verified' for row in equity['relationships'])
          assert all(row['evidence']['prospectusUrl'].startswith('https://static.cninfo.com.cn/') for row in equity['relationships'])
          PY
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit reviewed snapshot and remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/star_market_investors.json \
            public/data/institution_entities.json \
            public/data/institution_events.json \
            public/data/institution_equity_relationships.json
          git rm -f \
            .github/workflows/verify-star-strict-live-once.yml \
            .github/workflows/apply-star-review-manifest-once.yml
          git commit -m "data: publish reviewed Cambricon institutional shareholders"
          git pull --rebase origin fix/star-market-strict-table-manual-review
          git push origin HEAD:fix/star-market-strict-table-manual-review
