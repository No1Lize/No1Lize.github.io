name: Verify tracked people research once

on:
  push:
    branches: [feature/tracked-people-research-20260725]
    paths:
      - '.github/workflows/verify-people-profiles-once.yml'
      - 'app/people/**'
      - 'lib/people-data.ts'
      - 'public/data/people.json'
      - 'config/person_profile_overrides.json'
      - 'tools/refresh_people_profiles.py'
      - 'tests/people-data.test.ts'
      - 'tests/test_refresh_people_profiles.py'
      - '.github/workflows/scheduled-sync.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tracked-people-research-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify
        id: verify
        continue-on-error: true
        run: |
          # Final verification rerun after identity and material classification fixes.
          set +e
          python -m py_compile tools/refresh_people_profiles.py > /tmp/python.log 2>&1
          python_compile=$?
          python -m unittest discover -s tests -p 'test_*.py' >> /tmp/python.log 2>&1
          python_tests=$?
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          install=$?
          if [ "$install" -eq 0 ]; then
            npm run test:unit > /tmp/unit.log 2>&1
            unit=$?
            npx tsc --noEmit > /tmp/types.log 2>&1
            types=$?
            GITHUB_PAGES=true npx next build > /tmp/build.log 2>&1
            build=$?
          else
            unit=99
            types=99
            build=99
          fi
          echo "python_compile=$python_compile" >> "$GITHUB_OUTPUT"
          echo "python_tests=$python_tests" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Record result
        if: always()
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json, os, pathlib
          def tail(path):
              item = pathlib.Path(path)
              return item.read_text(errors='replace')[-16000:] if item.exists() else ''
          statuses = {
              'pythonCompile': int('${{ steps.verify.outputs.python_compile || 99 }}'),
              'pythonTests': int('${{ steps.verify.outputs.python_tests || 99 }}'),
              'install': int('${{ steps.verify.outputs.install || 99 }}'),
              'unitTests': int('${{ steps.verify.outputs.unit || 99 }}'),
              'typescript': int('${{ steps.verify.outputs.types || 99 }}'),
              'build': int('${{ steps.verify.outputs.build || 99 }}'),
          }
          payload = {
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'passed': all(value == 0 for value in statuses.values()),
              **statuses,
              'pythonLog': tail('/tmp/python.log'),
              'installLog': tail('/tmp/install.log'),
              'unitLog': tail('/tmp/unit.log'),
              'typeLog': tail('/tmp/types.log'),
              'buildLog': tail('/tmp/build.log'),
          }
          pathlib.Path('diagnostics/people-profile-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2)
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/people-profile-verification.json
          git commit -m 'ci: record people profile verification' || true
          git pull --rebase origin feature/tracked-people-research-20260725
          git push origin HEAD:feature/tracked-people-research-20260725
