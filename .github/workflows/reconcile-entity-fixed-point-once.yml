name: Reconcile entity fixed point once

on:
  push:
    branches:
      - fix/pages-entity-resolution-fixed-point

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-entity-resolution-fixed-point
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate fixed-point derived data
        run: |
          python tools/reconcile_entity_resolution.py
          python tools/build_resolved_company_candidates.py
      - name: Verify Pages preflight fixed point
        run: |
          python tools/run_pipeline.py check
          python tools/reconcile_entity_resolution.py --check
          python tools/build_resolved_company_candidates.py --check
          python tools/company_profile_refresh_queue.py --check
          python tools/crawl_articles.py --validate-only
          python tools/validate_eastmoney_snapshot.py
      - name: Commit only regenerated derived data
        run: |
          rm .github/workflows/reconcile-entity-fixed-point-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/user_tracking.json config/tracking_capture_inbox.json public/data/company_candidates.json .github/workflows/reconcile-entity-fixed-point-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reconcile entity resolution derived data'
          git push origin HEAD:fix/pages-entity-resolution-fixed-point
