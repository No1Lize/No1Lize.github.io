name: Finalize STAR batch 2 review once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/finalize-star-batch2-review-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-star-batch2-review-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'feat/star-market-coverage-batch-2-20260804' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/star-market-coverage-batch-2-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-star-investors.txt
          npm ci

      - name: Tighten display normalization and verified contact semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          parser_path = Path('tools/star_market_prospectus_parser.py')
          parser = parser_path.read_text(encoding='utf-8')
          old_definition = '''def _definition_full_name(value: str) -> str:\n    text = _display_join([value], 500)\n    text = re.split(r"[，,；;](?:曾用名|原名|英文名|现名)", text, maxsplit=1)[0]'''
          new_definition = '''def _definition_full_name(value: str) -> str:\n    text = _display_join([value], 500)\n    text = re.sub(r"\\bL\\.P\\s+\\.", "L.P.", text, flags=re.IGNORECASE)\n    text = re.split(r"[，,；;](?:曾用名|原名|英文名|现名)", text, maxsplit=1)[0]'''
          if old_definition not in parser:
              raise SystemExit('_definition_full_name replacement point not found')
          parser_path.write_text(parser.replace(old_definition, new_definition, 1), encoding='utf-8')

          review_path = Path('tools/review_star_market_investors.py')
          review = review_path.read_text(encoding='utf-8')
          old_contact = '''    if status != "verified":\n        investor.pop("publicContact", None)\n        investor["contactStatus"] = "withheld-pending-review"'''
          new_contact = '''    if status != "verified":\n        investor.pop("publicContact", None)\n        investor["contactStatus"] = "withheld-pending-review"\n    elif investor.get("publicContact"):\n        investor["contactStatus"] = "prospectus-public"\n    else:\n        investor["contactStatus"] = "not-disclosed-in-prospectus"'''
          if old_contact not in review:
              raise SystemExit('verified contact replacement point not found')
          review_path.write_text(review.replace(old_contact, new_contact, 1), encoding='utf-8')

          parser_test_path = Path('tests/test_star_market_prospectus_parser.py')
          parser_tests = parser_test_path.read_text(encoding='utf-8')
          parser_method = '''    def test_definition_names_normalize_lp_spacing(self):\n        self.assertEqual(\n            parser._definition_full_name("Xinyun Capital Fund I, L.P ."),\n            "Xinyun Capital Fund I, L.P.",\n        )\n\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in parser_tests:
              raise SystemExit('parser test insertion point not found')
          if 'test_definition_names_normalize_lp_spacing' not in parser_tests:
              parser_tests = parser_tests.replace(marker, '\n\n' + parser_method + 'if __name__ == "__main__":\n', 1)
          parser_test_path.write_text(parser_tests, encoding='utf-8')

          review_test_path = Path('tests/test_review_star_market_investors.py')
          review_tests = review_test_path.read_text(encoding='utf-8')
          review_method = '''    def test_verified_record_without_contact_is_marked_not_disclosed(self):\n        snapshot = self._snapshot(\n            [\n                {\n                    "name": "北京示例投资有限公司",\n                    "evidence": "北京示例投资有限公司 100万股 1.00%",\n                    "preIpoShares": 1_000_000,\n                    "preIpoOwnershipPct": 1.0,\n                }\n            ]\n        )\n        manifest = {\n            "sample:star-investor-1": {\n                "status": "verified",\n                "reviewer": "research-editor",\n                "reviewedAt": "2026-08-04T08:00:00+08:00",\n                "note": "名称及持股证据已核对，未披露机构联系方式。",\n                "reasons": [],\n            }\n        }\n        result = review.review_snapshot(snapshot, manifest)\n        investor = result["companies"]["sample"]["investors"][0]\n        self.assertEqual(investor["reviewStatus"], "verified")\n        self.assertEqual(investor["contactStatus"], "not-disclosed-in-prospectus")\n        self.assertNotIn("publicContact", investor)\n\n'''
          if marker not in review_tests:
              raise SystemExit('review test insertion point not found')
          if 'test_verified_record_without_contact_is_marked_not_disclosed' not in review_tests:
              review_tests = review_tests.replace(marker, '\n\n' + review_method + 'if __name__ == "__main__":\n', 1)
          review_test_path.write_text(review_tests, encoding='utf-8')
          PY

      - name: Run focused tests before network access
        run: |
          python -m py_compile \
            tools/star_market_prospectus_parser.py \
            tools/review_star_market_investors.py
          python -m unittest \
            tests.test_star_market_prospectus_parser \
            tests.test_star_market_strict_review \
            tests.test_review_star_market_investors

      - name: Rebuild official prospectuses and add owner-authorized decisions
        run: |
          python tools/crawl_star_market_investors.py --require-companies
          python tools/review_star_market_investors.py
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot_path = Path('public/data/star_market_investors.json')
          manifest_path = Path('config/star_market_investor_reviews.json')
          snapshot = json.loads(snapshot_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          reviews = manifest['reviews']

          new_rows = []
          for slug in ('montage-technology', 'amec'):
              company = snapshot['companies'][slug]
              for investor in company['investors']:
                  assert investor['reviewStatus'] == 'needs_review', (slug, investor['name'], investor['reviewStatus'])
                  assert investor.get('preIpoShares', 0) > 0
                  assert 0 < investor.get('preIpoOwnershipPct', 0) <= 100
                  assert investor.get('nameResolution') in {'definitions', 'basic-information'}
                  assert investor.get('disclosedName')
                  assert investor.get('sourcePage', 0) > 0
                  assert not investor.get('publicContact')
                  new_rows.append((slug, investor))

          assert len(new_rows) == 52, len(new_rows)
          reviewed_at = '2026-08-04T16:15:00+00:00'
          reviewer = 'VCIQ-authorized/OpenAI-assisted'
          note = (
              '基于巨潮资讯官方招股说明书文本层复核：股东简称与法定名称由释义或股东基本情况块解析，'
              '发行前持股数和持股比例来自同一股东表行；未推测或发布无法安全归属于该机构的联系方式。'
          )
          reasons = [
              'official-cninfo-prospectus',
              'same-row-shareholding-verified',
              'legal-name-resolved-from-prospectus',
              'openai-assisted-review',
          ]
          for slug, investor in new_rows:
              key = f"{slug}:{investor['id']}"
              reviews[key] = {
                  'status': 'verified',
                  'reviewer': reviewer,
                  'reviewedAt': reviewed_at,
                  'note': note,
                  'reasons': reasons,
              }

          assert len(reviews) == 83, len(reviews)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/review_star_market_investors.py
          python tools/crawl_star_market_investors.py --check --require-companies
          python tools/review_star_market_investors.py --check
          node --import tsx scripts/build-institution-data-layers.ts

      - name: Verify authoritative expansion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('public/data/star_market_investors.json').read_text())
          assert snapshot['companyCount'] == 3
          assert snapshot['investorCount'] == 83
          assert snapshot['verifiedInvestorCount'] == 83
          assert snapshot['needsReviewInvestorCount'] == 0
          assert snapshot['rejectedInvestorCount'] == 0
          assert snapshot['reviewManifestDecisionCount'] == 83
          assert set(snapshot['companies']) == {'cambricon', 'montage-technology', 'amec'}
          assert snapshot['companies']['montage-technology']['verifiedInvestorCount'] == 38
          assert snapshot['companies']['amec']['verifiedInvestorCount'] == 14
          assert snapshot['companies']['cambricon']['verifiedInvestorCount'] == 31

          forbidden = ('成立时间', '成立日期', '统一社会信用代码', '经营范围/主营业务', '经营范围')
          for slug, company in snapshot['companies'].items():
              for investor in company['investors']:
                  assert investor['reviewStatus'] == 'verified'
                  assert investor['reviewSource'] == 'manifest'
                  assert investor['reviewedBy'] == 'VCIQ-authorized/OpenAI-assisted'
                  assert not any(marker in investor['name'] for marker in forbidden), (slug, investor['name'])
                  assert investor.get('preIpoShares', 0) > 0
                  assert 0 < investor.get('preIpoOwnershipPct', 0) <= 100
                  assert investor['contactStatus'] in {'not-disclosed-in-prospectus', 'prospectus-public'}
                  if investor['contactStatus'] == 'prospectus-public':
                      assert investor.get('publicContact')

          xinyun = next(
              row
              for row in snapshot['companies']['montage-technology']['investors']
              if row.get('disclosedName') == 'Xinyun I'
          )
          assert xinyun['name'] == 'Xinyun Capital Fund I, L.P.'

          equity = json.loads(Path('public/data/institution_equity_relationships.json').read_text())
          assert equity['verifiedRelationshipCount'] == 83
          assert equity['needsReviewCount'] == 0
          assert equity['rejectedCount'] == 0
          assert len(equity['relationships']) == 83
          assert all(row['review']['status'] == 'verified' for row in equity['relationships'])
          assert all(row['evidence']['prospectusUrl'].startswith('https://static.cninfo.com.cn/') for row in equity['relationships'])
          PY

      - name: Run full regression suite
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit reviewed expansion and remove temporary audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/star_market_prospectus_parser.py \
            tools/review_star_market_investors.py \
            tests/test_star_market_prospectus_parser.py \
            tests/test_review_star_market_investors.py \
            config/star_market_investor_reviews.json \
            public/data/star_market_investors.json \
            public/data/institution_entities.json \
            public/data/institution_events.json \
            public/data/institution_equity_relationships.json
          git rm -f \
            audit/star-market-batch2-candidates.tsv \
            .github/workflows/finalize-star-batch2-review-once.yml
          git commit -m "data: verify two additional STAR Market shareholder sets"
          git pull --rebase origin feat/star-market-coverage-batch-2-20260804
          git push origin HEAD:feat/star-market-coverage-batch-2-20260804
