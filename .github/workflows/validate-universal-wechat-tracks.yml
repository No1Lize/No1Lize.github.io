name: Validate universal WeChat track generation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-universal-wechat-tracks.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run universal WeChat tests
        run: |
          python -m py_compile \
            tools/wechat_source_registry.py \
            tools/wechat_sogou_index.py \
            tools/wechat_public_sources.py \
            tools/wechat_registry_bridge.py \
            tools/refresh_wechat_snapshot.py
          python -m unittest \
            tests.test_wechat_source_registry \
            tests.test_wechat_sogou_index \
            tests.test_wechat_public_sources \
            tests.test_wechat_snapshot_quality \
            tests.test_refresh_wechat_snapshot

      - name: Record generated source coverage
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote_plus
          from tools import crawl_with_tracking
          from tools import refresh_wechat_snapshot
          from tools import wechat_source_registry
          from tools import wechat_sogou_index

          tracking = crawl_with_tracking.load_tracking()
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = refresh_wechat_snapshot.configured_sources()
          enabled = [track["name"] for track in tracks]
          generic = {
              spec["sector"]: spec
              for spec in specs
              if spec.get("genericDiscovery")
          }
          missing = sorted(set(enabled) - set(generic))
          if missing:
              raise SystemExit(f"missing generic sources: {missing}")

          synthetic = {
              "slug": "validation-empty-custom-track",
              "name": "验证新增赛道",
              "enabled": True,
              "custom": True,
              "keywords": [],
              "people": [],
              "sampleCompanies": [],
          }
          generated = wechat_source_registry.generated_wechat_sources(
              [synthetic], object()
          )
          if len(generated) != 1 or not generated[0].get("genericDiscovery"):
              raise SystemExit("empty custom track did not create a generic source")
          if "验证新增赛道" not in unquote_plus(generated[0]["url"]):
              raise SystemExit("empty custom track query does not contain its track name")
          if "微信公众号" in wechat_sogou_index._query_term(generated[0]):
              raise SystemExit("generic Sogou query leaked display-only prefix")

          report = {
              "enabledTrackCount": len(enabled),
              "generatedSourceCount": len(specs),
              "genericSourceCount": len(generic),
              "missingGenericTracks": missing,
              "syntheticEmptyCustomTrack": {
                  "passed": True,
                  "sourceId": generated[0]["id"],
                  "bingQuery": unquote_plus(generated[0]["url"]),
                  "sogouQuery": wechat_sogou_index._query_term(generated[0]),
              },
              "tracks": [
                  {
                      "sector": sector,
                      "genericSourceId": generic[sector]["id"],
                      "genericQuery": unquote_plus(generic[sector]["url"]),
                      "accountSourceCount": sum(
                          1
                          for spec in specs
                          if spec.get("sector") == sector
                          and spec.get("discoveryScope") == "account"
                      ),
                  }
                  for sector in enabled
              ],
          }
          Path("diagnostics/universal-wechat-track-validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path(".github/workflows/validate-universal-wechat-tracks.yml").unlink()
          PY

      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: record universal WeChat track validation"
          git pull --rebase origin main
          python -m unittest \
            tests.test_wechat_source_registry \
            tests.test_wechat_sogou_index
          git push origin HEAD:main
