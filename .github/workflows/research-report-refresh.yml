name: Refresh all listed-company research PDFs

on:
  schedule:
  # PDF archives are comparatively heavy and change less frequently.
  - cron: "15 11 * * 2,5"
    timezone: "Asia/Taipei"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-report-refresh.yml
      - tools/crawl_research_reports.py
      - tools/research_report_adapters.py
      - tests/test_research_reports.py
      - tests/research-report-data.test.ts
      - lib/research-report-data.ts
      - components/research-report-library.tsx
      - app/reports/**
      - app/ipo/**

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RESEARCH_REPORTS_PER_COMPANY: "3"
      RESEARCH_REPORTS_MAX_TOTAL: "48"
      RESEARCH_REPORT_MAX_BYTES: "16777216"
      RESEARCH_REPORT_MAX_ARCHIVE_BYTES: "125829120"
      RESEARCH_REPORT_SEARCH_RESULTS: "14"
      RESEARCH_REPORT_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate report crawler entry points before network access
        run: |
          python -m py_compile \
            tools/crawl_research_reports.py \
            tools/research_report_adapters.py \
            tools/research_report_registry.py
      - name: Install locked project dependencies before network access
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .github/diagnostics
          npm ci 2>&1 | tee .github/diagnostics/research-report-npm.log
      - name: Run observable all-market PDF refresh
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python tools/crawl_research_reports.py > .github/diagnostics/research-report-crawl.log 2>&1
          CRAWL=$?
          python -m unittest tests.test_research_reports > .github/diagnostics/research-report-python-tests.log 2>&1
          PYTEST=$?
          NPM=0
          node --import tsx --test tests/research-report-data.test.ts > .github/diagnostics/research-report-ts-tests.log 2>&1
          TSTEST=$?
          GITHUB_PAGES=true npx next build > .github/diagnostics/research-report-build-full.log 2>&1
          BUILD=$?
          tail -n 220 .github/diagnostics/research-report-build-full.log > .github/diagnostics/research-report-build.log
          rm .github/diagnostics/research-report-build-full.log
          read -r REPORTS TRACKED ASTOCK HKSTOCK USSTOCK AREPORT HKREPORT USREPORT ARCHIVEBYTES <<EOF
          $(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public/data/research_reports.json')
          try:
              payload = json.loads(path.read_text(encoding='utf-8'))
              counts = payload.get('marketCounts', {})
              reports = payload.get('reports', [])
              report_counts = {
                  market: sum(1 for report in reports if report.get('market') == market)
                  for market in ('A股', '港股', '美股')
              }
              print(
                  len(reports),
                  payload.get('trackedCompanies', 0),
                  counts.get('A股', 0),
                  counts.get('港股', 0),
                  counts.get('美股', 0),
                  report_counts['A股'],
                  report_counts['港股'],
                  report_counts['美股'],
                  payload.get('archiveBytes', 0),
              )
          except Exception:
              print(0, 0, 0, 0, 0, 0, 0, 0, 0)
          PY
          )
          EOF
          cat > .github/diagnostics/research-report-refresh.json <<EOF
          {
            "crawl": $CRAWL,
            "pythonTests": $PYTEST,
            "npmInstall": $NPM,
            "typescriptTests": $TSTEST,
            "pagesBuild": $BUILD,
            "reports": $REPORTS,
            "trackedCompanies": $TRACKED,
            "marketCounts": {"A股": $ASTOCK, "港股": $HKSTOCK, "美股": $USSTOCK},
            "reportMarketCounts": {"A股": $AREPORT, "港股": $HKREPORT, "美股": $USREPORT},
            "archiveBytes": $ARCHIVEBYTES,
            "commit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID"
          }
          EOF
          echo "crawl=$CRAWL" >> "$GITHUB_OUTPUT"
          echo "pytest=$PYTEST" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM" >> "$GITHUB_OUTPUT"
          echo "tstest=$TSTEST" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "reports=$REPORTS" >> "$GITHUB_OUTPUT"
          echo "tracked=$TRACKED" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostics and validated PDF archive
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/research-report-refresh.json \
            .github/diagnostics/research-report-crawl.log \
            .github/diagnostics/research-report-python-tests.log \
            .github/diagnostics/research-report-npm.log \
            .github/diagnostics/research-report-ts-tests.log \
            .github/diagnostics/research-report-build.log
          VALID=false
          if [ "${{ steps.check.outputs.crawl }}" = "0" ] && \
             [ "${{ steps.check.outputs.pytest }}" = "0" ] && \
             [ "${{ steps.check.outputs.npm }}" = "0" ] && \
             [ "${{ steps.check.outputs.tstest }}" = "0" ] && \
             [ "${{ steps.check.outputs.build }}" = "0" ] && \
             [ "${{ steps.check.outputs.tracked }}" -gt "0" ]; then
            git add public/data/research_reports.json
            if [ -d public/research-reports ]; then
              git add public/research-reports
            fi
            VALID=true
          else
            git checkout -- public/data/research_reports.json
            if [ -d public/research-reports ]; then
              git clean -fd public/research-reports
            fi
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "valid=$VALID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh research PDFs for all listed companies"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "valid=$VALID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
      - name: Fail when all-market PDF archive is invalid
        if: steps.check.outputs.crawl != '0' || steps.check.outputs.pytest != '0' || steps.check.outputs.npm != '0' || steps.check.outputs.tstest != '0' || steps.check.outputs.build != '0' || steps.check.outputs.tracked == '0'
        run: exit 1
