name: One-time company sector recommendation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-company-sector-recommendation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact recommendation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/tracking-recommendations.ts')
          text = path.read_text()

          old = '''} from "@/lib/tracking-sector-policy";\nimport type { LiveIntelligenceEvent } from "@/lib/use-articles";'''
          new = '''} from "@/lib/tracking-sector-policy";\nimport {\n  companyRecommendationAllowedForSector,\n  companySourceAllowedForSector,\n} from "@/lib/tracking-company-sector-policy";\nimport type { LiveIntelligenceEvent } from "@/lib/use-articles";'''
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = '''function companyCandidates(\n  articles: LiveIntelligenceEvent[],\n  existing: Set<string>,\n): TrackingRecommendation[] {'''
          new = '''function companyCandidates(\n  articles: LiveIntelligenceEvent[],\n  selectedSector: string,\n  existing: Set<string>,\n): TrackingRecommendation[] {'''
          if old not in text:
              raise SystemExit('company signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''  return [...groups.values()]\n    .map((candidate) => ({'''
          new = '''  return [...groups.values()]\n    .filter((candidate) =>\n      companyRecommendationAllowedForSector(\n        candidate.label,\n        candidate.articles,\n        selectedSector,\n      ),\n    )\n    .map((candidate) => ({'''
          if old not in text:
              raise SystemExit('company filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''      article.source.platform === "X" ||\n      article.source.level === "待交叉验证"\n    ) {'''
          new = '''      article.source.platform === "X" ||\n      article.source.level === "待交叉验证" ||\n      !companySourceAllowedForSector(article, selectedSector)\n    ) {'''
          if old not in text:
              raise SystemExit('source filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''    companies: companyCandidates(sectorArticles, companySet),'''
          new = '''    companies: companyCandidates(sectorArticles, selectedSector, companySet),'''
          if old not in text:
              raise SystemExit('company call anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > tests/tracking-company-sector-recommendations.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { recommendTrackingAdditions } from "../lib/tracking-recommendations";
          import type { LiveIntelligenceEvent } from "../lib/use-articles";

          const base = {
            type: "公司动态" as const,
            region: "美国" as const,
            publishedAt: "2099-01-03",
            importance: 82,
            qualityScore: 88,
          };

          test("known AI companies cannot be recommended to commercial space even when an article is misclassified", () => {
            const articles: LiveIntelligenceEvent[] = [
              {
                ...base,
                id: "misclassified-anthropic-space",
                sourceId: "anthropic-official",
                title: "Anthropic publishes a new model update",
                summary: "Claude model and agent capabilities update.",
                sector: "商业航天",
                company: "Anthropic",
                companySlug: "anthropic",
                source: {
                  name: "Anthropic 官方来源",
                  url: "https://www.anthropic.com/news/model-update",
                  level: "官方披露",
                  platform: "官方网站",
                },
              },
            ];

            const result = recommendTrackingAdditions(articles, "商业航天");
            assert.ok(!result.companies.some((item) => item.value === "Anthropic"));
            assert.ok(!result.sources.some((item) => item.label.includes("Anthropic")));
          });

          test("known commercial-space companies remain eligible in commercial space", () => {
            const articles: LiveIntelligenceEvent[] = [
              {
                ...base,
                id: "spacex-space",
                sourceId: "spacex-official",
                title: "SpaceX announces a Starship flight update",
                summary: "The company published a commercial launch and Starship mission update.",
                sector: "商业航天",
                company: "SpaceX",
                companySlug: "spacex",
                source: {
                  name: "SpaceX 官方来源",
                  url: "https://www.spacex.com/updates/starship",
                  level: "官方披露",
                  platform: "官方网站",
                },
              },
            ];

            const result = recommendTrackingAdditions(articles, "商业航天");
            assert.ok(result.companies.some((item) => item.value === "SpaceX"));
          });
          EOF

      - name: Verify
        shell: bash
        run: |
          npm install
          npm run test:unit
          npx tsc --noEmit
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tracking-recommendations.ts tests/tracking-company-sector-recommendations.test.ts
          git commit -m "fix: prevent companies leaking across recommendation sectors"
          git pull --rebase origin main
          git push origin HEAD:main
