name: Validate sourced venture product descriptions

on:
  pull_request:
    branches: [main]
    paths:
      - .venture-sourced-product-trigger
      - .github/workflows/venture-sourced-product-pr.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require traceable historical product descriptions
        run: |
          python - <<'PY'
          from pathlib import Path

          refiner = Path('tools/refine_venture_research_evidence.py')
          text = refiner.read_text(encoding='utf-8')
          old = '''        old = existing.get(_compact(name), {})
                  if not description:
                      old_description = sanitize_narrative(old.get("description", ""), limit=420)
                      if old_description and any(
                          _alias_in_text(alias, old_description) for alias in aliases
                      ):
                          description = old_description
          '''
          new = '''        old = existing.get(_compact(name), {})
                  if not description:
                      old_description = sanitize_narrative(old.get("description", ""), limit=420)
                      old_source_url = normalize_url(old.get("sourceUrl", ""))
                      if (
                          old_description
                          and old_source_url
                          and _contains_any(old_description, TECH_TERMS)
                          and any(_alias_in_text(alias, old_description) for alias in aliases)
                          and "尚未识别到可独立核对的技术说明" not in old_description
                          and "具体技术参数以原始来源为准" not in old_description
                      ):
                          description = old_description
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('historical product fallback block not found')
              refiner.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_venture_semantic_rebase.py')
          test = test_path.read_text(encoding='utf-8')
          if 'test_unsourced_catalog_description_is_not_a_technical_highlight' not in test:
              marker = '\n\nif __name__ == "__main__":\n'
              method = '''
              def test_unsourced_catalog_description_is_not_a_technical_highlight(self) -> None:
                  profile = {
                      "name": "智元机器人",
                      "slug": "agibot",
                      "products": ["灵犀"],
                      "technologyProducts": [{
                          "name": "灵犀",
                          "category": "机器人 / 硬件",
                          "description": "核心技术与产品包括远征、灵犀、A2 旗舰版。",
                          "technicalHighlights": ["核心技术与产品包括远征、灵犀、A2 旗舰版。"],
                          "sourceUrl": "",
                      }],
                  }
                  refined = refiner._refine_products(profile, [])
                  self.assertIn("尚未识别", refined[0]["description"])
                  self.assertEqual(refined[0]["technicalHighlights"], [])
                  self.assertEqual(refined[0]["sourceUrl"], "")
          '''
              if marker not in test:
                  raise SystemExit('test insertion marker not found')
              test_path.write_text(test.replace(marker, method + marker, 1), encoding='utf-8')
          PY
      - name: Run all venture tests and publication gates
        run: |
          python -m py_compile tools/refine_venture_research_evidence.py
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_refine_venture_research_evidence \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics \
            tests.test_stabilize_venture_profiles \
            tests.test_venture_semantic_rebase
          for pass in $(seq 1 8); do
            cp public/data/venture_profiles.json /tmp/before.json
            python tools/refine_venture_research_evidence.py
            python tools/normalize_venture_profiles.py
            python tools/stabilize_venture_profiles.py
            cmp -s /tmp/before.json public/data/venture_profiles.json && break
          done
          python tools/refine_venture_research_evidence.py --check
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend
        run: |
          npm install
          node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
      - name: Commit source only
        run: |
          rm -f .github/workflows/venture-sourced-product-pr.yml .venture-sourced-product-trigger
          git restore public/data/venture_profiles.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/refine_venture_research_evidence.py tests/test_venture_semantic_rebase.py
          git add -u .github/workflows/venture-sourced-product-pr.yml .venture-sourced-product-trigger
          git commit -m 'fix: require sources for inherited product descriptions'
          git push origin HEAD:${{ github.head_ref }}
