name: Deploy homepage source links once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-source-links-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: home-source-links-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install > /tmp/install.log 2>&1
      - name: Run unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:unit > /tmp/tests.log 2>&1
      - name: Build static site
        id: build
        if: steps.install.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: GITHUB_PAGES=true npx next build > /tmp/build.log 2>&1
      - name: Record build diagnosis
        if: always()
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json, pathlib
          def tail(path):
              p = pathlib.Path(path)
              return p.read_text(errors='replace')[-12000:] if p.exists() else ''
          data = {
              'sourceCommit': '${{ github.sha }}',
              'install': '${{ steps.install.outcome }}',
              'tests': '${{ steps.tests.outcome }}',
              'build': '${{ steps.build.outcome }}',
              'deployed': False,
              'installLog': tail('/tmp/install.log'),
              'testLog': tail('/tmp/tests.log'),
              'buildLog': tail('/tmp/build.log'),
          }
          pathlib.Path('diagnostics/home-source-link-deploy.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2)
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/home-source-link-deploy.json
          git commit -m 'ci: record homepage source-link build' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail when verification failed
        if: always()
        run: |
          test '${{ steps.install.outcome }}' = 'success'
          test '${{ steps.tests.outcome }}' = 'success'
          test '${{ steps.build.outcome }}' = 'success'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-home-source-links
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark deployed revision
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('diagnostics/home-source-link-deploy.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          data.update({
              'sourceCommit': '${{ github.sha }}',
              'deployed': True,
              'deployedAt': '${{ github.event.head_commit.timestamp }}',
          })
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/home-source-link-deploy.json
          git commit -m 'ci: confirm homepage source-link deployment' || true
          git pull --rebase origin main
          git push origin HEAD:main
