name: Refresh lockfile once

on:
  push:
    branches:
      - perf/search-shell-favorites-store

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/search-shell-favorites-store
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock from declared dependencies and overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          rm .github/workflows/refresh-lockfile-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/refresh-lockfile-once.yml
          git commit -m 'chore: refresh dependency lockfile'
          git push origin HEAD:perf/search-shell-favorites-store
