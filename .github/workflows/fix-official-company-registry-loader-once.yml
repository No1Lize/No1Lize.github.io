name: Fix official company registry loader once

on:
  push:
    branches: [feat/automatic-company-onboarding-20260805]
    paths:
      - .github/workflows/fix-official-company-registry-loader-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-official-company-registry-loader-once
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-company-onboarding-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply official registry loader migration
        run: python tools/patch_official_company_registry_loader.py

      - name: Verify registry coverage and onboarding application
        run: |
          python -m py_compile \
            tools/crawl_official_companies.py \
            tools/company_registry.py \
            tools/onboard_company_candidates.py
          python -m unittest \
            tests.test_official_company_registry_dynamic \
            tests.test_official_company_registry_production \
            tests.test_company_registry \
            tests.test_onboard_company_candidates \
            tests.test_company_candidates
          node --import tsx --test \
            tests/company-candidate-onboarding.test.ts \
            tests/company-candidate-review.test.ts
          python tools/company_registry.py --check
          python tools/onboard_company_candidates.py --check
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json

      - name: Confirm full crawler has no registry migration failure
        id: crawler
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:crawler 2>&1 | tee /tmp/full-crawler.log
          code=${PIPESTATUS[0]}
          if grep -q "could not locate the companies array in catalog-data.ts" /tmp/full-crawler.log; then
            echo "Official company crawler still depends on the removed TypeScript array." >&2
            exit 2
          fi
          if grep -q "test_official_company_registry_production" /tmp/full-crawler.log; then
            echo "Official company registry production test still failed." >&2
            exit 3
          fi
          if [ "$code" -ne 0 ] && ! grep -q "venture publication gates entered a cycle" /tmp/full-crawler.log; then
            echo "Full crawler failed for an unexpected reason." >&2
            exit "$code"
          fi
          exit 0

      - name: Commit loader fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/crawl_official_companies.py \
            tests/test_official_company_registry_dynamic.py
          git rm -f \
            tools/patch_official_company_registry_loader.py \
            .github/workflows/fix-official-company-registry-loader-once.yml
          git commit -m "fix: load official company coverage from JSON registry"
          git pull --rebase origin feat/automatic-company-onboarding-20260805
          git push origin HEAD:feat/automatic-company-onboarding-20260805
