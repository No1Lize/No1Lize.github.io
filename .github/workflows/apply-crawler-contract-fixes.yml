name: Apply crawler contract fixes

on:
  pull_request:
    paths:
      - .crawler-contract-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply contract fixes
        run: python tools/patch_crawler_contract_fixes.py
      - name: Run focused crawler contracts
        run: |
          python -m unittest \
            tests.test_refine_venture_project_stability \
            tests.test_wechat_public_sources \
            tests.test_wechat_registry_bridge
      - name: Run full crawler suite
        run: npm run test:crawler
      - name: Commit validated crawler contracts
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/refine_venture_research_evidence.py \
            tools/wechat_public_sources.py \
            tests/test_wechat_public_sources.py \
            tests/test_wechat_registry_bridge.py
          git commit -m "fix: align stable crawler source contracts"
          git push origin "HEAD:${HEAD_REF}"
