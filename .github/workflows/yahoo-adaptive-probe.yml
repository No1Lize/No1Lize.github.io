name: Yahoo adaptive probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yahoo-adaptive-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Yahoo Taiwan
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set +e
          mkdir -p diagnostics
          python - <<'PY' > diagnostics/yahoo-adaptive-probe.json 2>&1
          import json
          import os
          from pathlib import Path
          from tools import adaptive_public_sources as adaptive
          from tools import crawl_articles as crawler
          from tools import crawl_with_source_categories as categories
          from tools import crawl_with_tracking as tracking
          from tools import generic_web_sources as generic
          from tools import robust_web_fallback as robust
          from tools import strict_tracking_config

          config = strict_tracking_config.sanitize_tracking_config(
              json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          )
          tracks = tracking._enabled_tracks(config)
          specs, _ = categories._custom_sources(config, tracks)
          spec = next(
              item for item in specs
              if adaptive.profile_for(str(item.get('sourceUrl', ''))).id == 'yahoo-tw'
          )
          items, status = adaptive.crawl_adaptive_source(
              spec,
              os.environ.get('SEC_USER_AGENT', '') or crawler.DEFAULT_USER_AGENT,
              crawler,
              generic,
              robust,
          )
          print(json.dumps({
              'spec': {
                  'id': spec.get('id'),
                  'name': spec.get('name'),
                  'sourceUrl': spec.get('sourceUrl'),
                  'sourceLanguage': spec.get('sourceLanguage'),
              },
              'status': status,
              'articles': [
                  {
                      'title': item.get('title'),
                      'publishedAt': item.get('publishedAt'),
                      'url': (item.get('source') or {}).get('url'),
                  }
                  for item in items
              ],
          }, ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/yahoo-adaptive-probe.json
          git commit -m "ci: record Yahoo adaptive probe"
          git pull --rebase origin main
          git push origin HEAD:main
