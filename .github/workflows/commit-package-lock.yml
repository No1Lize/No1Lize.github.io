name: Commit generated package lock

on:
  push:
    branches:
      - optimize/backend-refresh-resilience-20260729
    paths:
      - .github/workflows/commit-package-lock.yml

permissions:
  contents: write

jobs:
  commit-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/backend-refresh-resilience-20260729
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate package lock
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "const lock=require('./package-lock.json'); if (lock.lockfileVersion !== 3 || !lock.packages) process.exit(1)"
      - name: Commit lockfile to the optimization branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lock"
          git push origin HEAD:optimize/backend-refresh-resilience-20260729
