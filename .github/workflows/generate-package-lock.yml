name: Generate package lock for review

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/generate-package-lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate generated lockfile
        run: |
          node -e "const lock=require('./package-lock.json'); if (lock.lockfileVersion !== 3 || !lock.packages) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit generated lockfile to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lock"
          git push origin HEAD:${{ github.head_ref }}
