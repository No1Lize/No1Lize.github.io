name: One-time probe WeChat after URL fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-wechat-after-url-fix.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe one verified account
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import crawl_articles
          from tools import crawl_with_tracking
          from tools import wechat_public_sources
          from tools import wechat_registry_bridge
          from tools import wechat_sogou_index
          from tools import wechat_source_registry

          tracking = json.loads(Path('config/user_tracking.json').read_text(encoding='utf-8'))
          specs = wechat_source_registry.generated_wechat_sources(
              crawl_with_tracking._enabled_tracks(tracking), crawl_with_tracking
          )
          spec = next(
              item for item in specs
              if item.get('accountConfigId') == 'qbitai' and item.get('sector') == 'AI / AGI'
          )
          wechat_registry_bridge.install(wechat_public_sources)
          search_url = wechat_sogou_index.build_search_url(spec)
          rows = wechat_sogou_index.parse_search_results(
              wechat_sogou_index._request(search_url), search_url
          )
          result = {'searchUrl': search_url, 'candidateCount': len(rows), 'candidates': []}
          for row in rows[:2]:
              item = {
                  'title': row.get('title'),
                  'account': row.get('account'),
                  'publishedAt': row.get('publishedAt'),
              }
              try:
                  direct = wechat_sogou_index.resolve_result_url(row['url'], search_url)
                  item['directUrl'] = direct
                  page = wechat_public_sources.fetch_public_wechat_page(direct, timeout=10, attempts=1)
                  item['pageLength'] = len(page)
                  article = wechat_public_sources.parse_wechat_article(
                      spec,
                      direct,
                      page,
                      crawl_articles,
                      fallback_title=row.get('title', ''),
                      fallback_summary=row.get('summary', ''),
                      fallback_date=row.get('publishedAt'),
                  )
                  item['parsed'] = bool(article)
                  if article:
                      item['article'] = {
                          'title': article.get('title'),
                          'publishedAt': article.get('publishedAt'),
                          'wechatAccount': article.get('wechatAccount'),
                          'sector': article.get('sector'),
                          'company': article.get('company'),
                          'mentionedCompanies': article.get('mentionedCompanies', []),
                          'mentionedPeople': article.get('mentionedPeople', []),
                          'summary': article.get('summary'),
                          'url': article.get('source', {}).get('url'),
                      }
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'
              result['candidates'].append(item)
          Path('diagnostics/wechat-after-url-fix.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-after-url-fix.json
          git commit -m "ci: record WeChat parsing after URL fix"
          git pull --rebase origin main
          git push origin HEAD:main
