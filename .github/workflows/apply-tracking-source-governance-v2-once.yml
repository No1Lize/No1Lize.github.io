name: Apply tracking source governance v2 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/apply-tracking-source-governance-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tracking-source-governance-v2-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/tracking-source-recursion-20260804' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tracking-source-recursion-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply code and workflow migrations
        run: |
          python tools/apply_tracking_source_governance_v2_patch.py
          python tools/apply_tracking_source_workflow_patch.py

      - name: Apply governance to current registry and health state
        run: |
          python tools/tracking_source_governance.py | tee /tmp/source-governance.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/source-governance.json'))
          assert result['changed'] is True
          assert result['errors'] == []
          assert result['sourceCountAfter'] < result['sourceCountBefore']
          assert result['duplicatesRemoved'] >= 5, result
          assert result['recursiveDuplicatesRemoved'] >= 2, result
          assert result['renamed'] >= 2, result
          assert result['healthRowsRemoved'] >= 5, result
          PY
          python tools/tracking_source_governance.py --check

      - name: Run focused governance tests
        run: |
          python -m py_compile \
            tools/tracking_source_governance.py \
            tools/expand_tracking_entities.py \
            tools/update_source_health.py
          python -m unittest \
            tests.test_tracking_source_governance \
            tests.test_source_health
          npm run validate:tracking
          npm run validate:taxonomy

      - name: Run complete regression suite
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit governance implementation and export workflow patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cp .github/workflows/tracking-discovery.yml audit/tracking-discovery.patched.yml
          cp .github/workflows/scheduled-sync.yml audit/scheduled-sync.patched.yml
          git restore \
            .github/workflows/tracking-discovery.yml \
            .github/workflows/scheduled-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/tracking_source_governance.py \
            tools/expand_tracking_entities.py \
            tools/update_source_health.py \
            tests/test_tracking_source_governance.py \
            tests/test_source_health.py \
            config/user_tracking.json \
            config/tracking_auto_discovery.json \
            public/data/source_health.json \
            audit/tracking-discovery.patched.yml \
            audit/scheduled-sync.patched.yml
          git rm -f \
            tools/apply_tracking_source_governance_v2_patch.py \
            tools/apply_tracking_source_workflow_patch.py
          git commit -m "fix: govern and deduplicate automatic tracking sources"
          git pull --rebase origin fix/tracking-source-recursion-20260804
          git push origin HEAD:fix/tracking-source-recursion-20260804
