name: Reprocess venture semantics once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reprocess-venture-semantics-once.yml

permissions:
  contents: write
  actions: write

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source snapshot revision
        id: snapshot-before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/public/data/venture_profiles.json?ref=main" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Verify and reprocess current real snapshot
        run: |
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/refine_venture_research_evidence.py \
            tools/normalize_venture_profiles.py \
            tools/finalize_venture_profiles.py \
            tools/enforce_venture_entity_semantics.py \
            tools/stabilize_venture_profiles.py
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_refine_venture_research_evidence \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics \
            tests.test_stabilize_venture_profiles \
            tests.test_venture_semantic_rebase
          for pass in $(seq 1 8); do
            cp public/data/venture_profiles.json /tmp/venture-before.json
            python tools/refine_venture_research_evidence.py
            python tools/normalize_venture_profiles.py
            python tools/stabilize_venture_profiles.py
            cmp -s /tmp/venture-before.json public/data/venture_profiles.json && break
          done
          python tools/refine_venture_research_evidence.py --check
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
          python tools/crawl_venture_profiles.py --validate-only
          python tools/enrich_venture_profiles.py --validate-only
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend data consumption
        run: |
          npm install
          node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
      - name: Publish only if no newer snapshot has landed
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_BEFORE: ${{ steps.snapshot-before.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="repos/${GITHUB_REPOSITORY}/contents/public/data/venture_profiles.json"
          CURRENT_SHA="$(gh api "$ENDPOINT?ref=main" --jq .sha)"
          if [ "$CURRENT_SHA" != "$SNAPSHOT_BEFORE" ]; then
            echo "A newer venture snapshot landed during validation; keeping it."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REQUEST="$(mktemp)"
          python -c 'import base64,json,sys; path,sha,out=sys.argv[1:]; json.dump({"message":"data: apply stable venture semantic gates","content":base64.b64encode(open(path,"rb").read()).decode(),"sha":sha,"branch":"main"},open(out,"w",encoding="utf-8"))' \
            public/data/venture_profiles.json "$CURRENT_SHA" "$REQUEST"
          gh api --method PUT "$ENDPOINT" --input "$REQUEST" >/dev/null
          rm -f "$REQUEST"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish updated site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
