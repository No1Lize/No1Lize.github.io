name: Venture entity-label PR runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .venture-entity-label-trigger

permissions:
  contents: write

concurrency:
  group: venture-entity-label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply venture semantic patches
        run: |
          python tools/patch_venture_entity_labels_v1.py
          python tools/patch_venture_person_sentence_names.py
          python tools/patch_venture_short_summary_fallback.py
          python tools/patch_venture_terminal_entity_contract.py
          python tools/patch_venture_short_technology_fallback.py
      - name: Run semantic and terminal regressions
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            python -m py_compile \
              tools/enforce_venture_entity_semantics.py \
              tools/finalize_venture_profiles.py \
              tools/stabilize_venture_profiles.py
            python -m unittest -v \
              tests.test_venture_entity_semantics \
              tests.test_stabilize_venture_profiles
          } > diagnostics/venture-terminal-regressions.txt 2>&1
          status=$?
          cat diagnostics/venture-terminal-regressions.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/venture-terminal-regressions.txt
            git commit -m "ci: record terminal venture regression failure"
            git push origin "HEAD:${HEAD_REF}"
          fi
          exit "$status"
      - name: Apply semantic cleanup directly
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            python tools/enforce_venture_entity_semantics.py
            python - <<'PY'
          import json
          from tools.enforce_venture_entity_semantics import (
              CATALOG_PATH,
              SNAPSHOT_PATH,
              _valid_person_name,
              _valid_product,
              parse_catalog,
          )

          payload = json.loads(SNAPSHOT_PATH.read_text(encoding="utf-8"))
          companies, institutions = parse_catalog(CATALOG_PATH.read_text(encoding="utf-8"))
          company_aliases = {item.slug: item.aliases for item in companies}
          forbidden_products = {"英特尔深化智能生态合作"}
          forbidden_team_names = {
              "Spotlight Megan Holston-Alexander Hear",
              "Chris Lyons. The Next",
              "Chris Lyons. Black History",
          }

          for slug, profile in payload.get("companies", {}).items():
              aliases = (profile.get("name", ""), slug, *company_aliases.get(slug, ()))
              products = profile.get("products", [])
              team_names = [
                  row.get("name", "") for row in profile.get("team", [])
                  if isinstance(row, dict)
              ]
              invalid_products = [item for item in products if not _valid_product(item, aliases)]
              invalid_people = [name for name in team_names if not _valid_person_name(name)]
              assert forbidden_products.isdisjoint(products), f"{slug} known product noise remains"
              assert forbidden_team_names.isdisjoint(team_names), f"{slug} known team noise remains"
              assert not invalid_products, f"{slug} invalid products: {invalid_products}"
              assert not invalid_people, f"{slug} invalid team: {invalid_people}"

          for slug, profile in payload.get("institutions", {}).items():
              team_names = [
                  row.get("name", "") for row in profile.get("team", [])
                  if isinstance(row, dict)
              ]
              invalid_people = [name for name in team_names if not _valid_person_name(name)]
              assert forbidden_team_names.isdisjoint(team_names), f"{slug} known team noise remains"
              assert not invalid_people, f"{slug} invalid team: {invalid_people}"
          PY
          } > diagnostics/venture-entity-assertions.txt 2>&1
          status=$?
          cat diagnostics/venture-entity-assertions.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/venture-entity-assertions.txt
            git commit -m "ci: record full venture entity assertion failure"
            git push origin "HEAD:${HEAD_REF}"
          fi
          exit "$status"
      - name: Reach shared terminal fixed point
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python tools/stabilize_venture_profiles.py \
            > diagnostics/venture-cross-gate-diff.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY' >> diagnostics/venture-cross-gate-diff.txt 2>&1
          import json
          from tools.enforce_venture_entity_semantics import enforce_snapshot
          from tools.finalize_venture_profiles import finalize_snapshot
          from tools.stabilize_venture_profiles import CATALOG_PATH, SNAPSHOT_PATH

          def differences(left, right, path="$"):
              rows = []
              if type(left) is not type(right):
                  return [(path, left, right)]
              if isinstance(left, dict):
                  for key in sorted(set(left) | set(right)):
                      if key not in left or key not in right:
                          rows.append((f"{path}.{key}", left.get(key), right.get(key)))
                      else:
                          rows.extend(differences(left[key], right[key], f"{path}.{key}"))
              elif isinstance(left, list):
                  if left != right:
                      rows.append((path, left, right))
              elif left != right:
                  rows.append((path, left, right))
              return rows

          payload = json.loads(SNAPSHOT_PATH.read_text(encoding="utf-8"))
          catalog = CATALOG_PATH.read_text(encoding="utf-8")
          structural, _ = finalize_snapshot(payload, catalog)
          semantic, _ = enforce_snapshot(structural, catalog)
          structural_again, _ = finalize_snapshot(semantic, catalog)
          semantic_again, _ = enforce_snapshot(semantic, catalog)
          for label, left, right in (
              ("input_to_structural", payload, structural),
              ("structural_to_semantic", structural, semantic),
              ("semantic_to_structural_check", semantic, structural_again),
              ("semantic_to_semantic_check", semantic, semantic_again),
          ):
              print(f"=== {label} ===")
              for row in differences(left, right)[:120]:
                  print(json.dumps(row, ensure_ascii=False, default=str))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/venture-cross-gate-diff.txt
            git commit -m "ci: record venture cross-gate differences"
            git push origin "HEAD:${HEAD_REF}"
            cat diagnostics/venture-cross-gate-diff.txt
            exit "$status"
          fi
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
          git diff --check
      - name: Recheck cleaned production data
        run: |
          python - <<'PY'
          import json
          from tools.enforce_venture_entity_semantics import SNAPSHOT_PATH

          payload = json.loads(SNAPSHOT_PATH.read_text(encoding="utf-8"))
          product_names = {
              item
              for profile in payload.get("companies", {}).values()
              for item in profile.get("products", [])
          }
          team_names = {
              row.get("name", "")
              for collection in (payload.get("companies", {}), payload.get("institutions", {}))
              for profile in collection.values()
              for row in profile.get("team", [])
              if isinstance(row, dict)
          }
          assert "英特尔深化智能生态合作" not in product_names
          assert "Spotlight Megan Holston-Alexander Hear" not in team_names
          assert "Chris Lyons. The Next" not in team_names
          assert "Chris Lyons. Black History" not in team_names
          checks = payload.get("qualityGate", {}).get("checks", {})
          assert checks.get("entitySemanticConsistency", {}).get("passed") is True
          PY
      - name: Commit validated files to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .venture-entity-label-trigger
          rm -rf diagnostics
          git add \
            tools/enforce_venture_entity_semantics.py \
            tools/finalize_venture_profiles.py \
            tests/test_venture_entity_semantics.py \
            tests/test_stabilize_venture_profiles.py \
            public/data/venture_profiles.json
          git commit -m "fix: reject venture editorial labels as entities"
          git push origin "HEAD:${HEAD_REF}"
