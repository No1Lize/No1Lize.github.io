name: Publish enriched market profiles v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-enriched-market-profiles.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-enriched-market-profiles
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run observable market publication checks
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python tools/refresh_market_profiles_enriched.py > .github/diagnostics/enriched-market-crawl.log 2>&1
          CRAWL=$?
          python -m unittest tests.test_market_profiles tests.test_market_profile_transport tests.test_market_profile_enrichment > .github/diagnostics/enriched-market-tests.log 2>&1
          TESTS=$?
          python tools/validate_market_profiles.py > .github/diagnostics/enriched-market-validator.log 2>&1
          VALIDATOR=$?
          cat > .github/diagnostics/enriched-market-publication.json <<EOF
          {
            "crawl": $CRAWL,
            "tests": $TESTS,
            "validator": $VALIDATOR,
            "commit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID"
          }
          EOF
          echo "crawl=$CRAWL" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "validator=$VALIDATOR" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostics and valid snapshot
        id: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/enriched-market-publication.json \
            .github/diagnostics/enriched-market-crawl.log \
            .github/diagnostics/enriched-market-tests.log \
            .github/diagnostics/enriched-market-validator.log
          if [ "${{ steps.check.outputs.crawl }}" = "0" ] && \
             [ "${{ steps.check.outputs.tests }}" = "0" ] && \
             [ "${{ steps.check.outputs.validator }}" = "0" ]; then
            git add public/data/market_profiles.json
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -- public/data/market_profiles.json
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: publish observable enriched market profile result"
          git pull --rebase origin main
          if [ "${{ steps.check.outputs.crawl }}" = "0" ] && \
             [ "${{ steps.check.outputs.tests }}" = "0" ] && \
             [ "${{ steps.check.outputs.validator }}" = "0" ]; then
            python tools/refresh_market_profiles_enriched.py
            python -m unittest tests.test_market_profiles tests.test_market_profile_transport tests.test_market_profile_enrichment
            python tools/validate_market_profiles.py
            git add public/data/market_profiles.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages
        if: steps.data.outputs.changed == 'true' && steps.data.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Fail when dedicated market checks failed
        if: steps.check.outputs.crawl != '0' || steps.check.outputs.tests != '0' || steps.check.outputs.validator != '0'
        run: exit 1
