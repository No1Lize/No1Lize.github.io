name: Dependency security
on:
  schedule:
    - cron: "41 3 * * 1"
  pull_request:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Audit production and pinned development dependencies
        run: node scripts/audit-dependencies.mjs
