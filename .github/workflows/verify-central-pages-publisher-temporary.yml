name: Verify central Pages publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/verify-central-pages-publisher-temporary.yml

permissions:
  contents: read
  actions: write

jobs:
  verify:
    if: github.head_ref == 'ops/verify-central-pages-publisher-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: https://vciq.github.io/companies/
    steps:
      - name: Dispatch and capture the central publisher
        id: publisher
        shell: bash
        run: |
          set -euo pipefail
          run_url=$(gh workflow run publish-validated-data.yml --ref main)
          echo "$run_url"
          run_id="${run_url##*/}"
          case "$run_id" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run view "$run_id" \
            --json databaseId,createdAt,status,conclusion,headSha,event,url \
            > /tmp/publisher-run.json
          cat /tmp/publisher-run.json

      - name: Wait for the central publisher
        env:
          RUN_ID: ${{ steps.publisher.outputs.run_id }}
        run: gh run watch "$RUN_ID" --exit-status

      - name: Follow the latest main Pages deployment
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          selected_run=""
          for attempt in $(seq 1 180); do
            latest_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')
            gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,createdAt,status,conclusion,headSha,event,url \
              > /tmp/pages-runs.json

            python - "$latest_sha" <<'PY' > /tmp/latest-pages.json
          import json
          import sys
          from pathlib import Path

          latest_sha = sys.argv[1]
          rows = json.loads(Path('/tmp/pages-runs.json').read_text(encoding='utf-8'))
          matches = [row for row in rows if row.get('headSha') == latest_sha]
          matches.sort(key=lambda row: row.get('createdAt', ''), reverse=True)
          print(json.dumps(matches[0] if matches else {}, ensure_ascii=False))
          PY
            cat /tmp/latest-pages.json

            selected_run=$(python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(Path('/tmp/latest-pages.json').read_text(encoding='utf-8'))
          if row.get('status') == 'completed' and row.get('conclusion') == 'success':
              print(row.get('databaseId', ''))
          else:
              print('')
          PY
            )
            if [ -n "$selected_run" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$selected_run" ]; then
            echo "No successful Pages deployment was found for the latest main commit." >&2
            gh run list \
              --workflow pages.yml \
              --branch main \
              --limit 10 \
              --json databaseId,createdAt,status,conclusion,headSha,event,url
            exit 1
          fi
          echo "run_id=$selected_run" >> "$GITHUB_OUTPUT"
          gh run view "$selected_run" \
            --json databaseId,createdAt,status,conclusion,headSha,event,url

      - name: Verify the live page remains healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}?central_publisher_verify=${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/companies.html
            if grep -Fq '增量档案刷新' /tmp/companies.html && \
               grep -Fq '待处理公司' /tmp/companies.html && \
               grep -Fq '下一批' /tmp/companies.html && \
               grep -Fq '最近处理' /tmp/companies.html; then
              exit 0
            fi
            sleep 10
          done
          exit 1
