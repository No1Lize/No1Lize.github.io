name: Check venture profile refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-venture-profile-refresh.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record refresh status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # status revision: filtered-data-v6
          mkdir -p diagnostics
          gh run list \
            --workflow refresh-venture-profiles.yml \
            --limit 10 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > diagnostics/venture-profile-refresh-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/venture-profile-refresh-status.json
          git commit -m 'ci: record venture profile refresh status'
          git pull --rebase origin main
          git push origin HEAD:main
