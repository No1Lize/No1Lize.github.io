name: One-time venture project background sanitation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-venture-team-shape.yml

permissions:
  contents: write

concurrency:
  group: one-time-venture-project-background
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch, test and commit
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/venture-profile-data.ts")
          text = path.read_text(encoding="utf-8")
          old = '''function normalizeProjectBackground(value: unknown): VentureProjectBackground | undefined {
            if (!value || typeof value !== "object") return undefined;
            const row = value as Record<string, unknown>;
            const summary = clean(row.summary, 900);
            if (!summary) return undefined;
            return {
              summary,
              problemSolved: clean(row.problemSolved, 520) || undefined,
              marketOpportunity: clean(row.marketOpportunity, 520) || undefined,
            };
          }'''
          new = '''function normalizeProjectBackground(value: unknown): VentureProjectBackground | undefined {
            if (!value || typeof value !== "object") return undefined;
            const row = value as Record<string, unknown>;
            const summary = sanitizeVentureNarrative(row.summary, 900);
            if (!summary) return undefined;
            return {
              summary,
              problemSolved: sanitizeVentureNarrative(row.problemSolved, 520) || undefined,
              marketOpportunity: sanitizeVentureNarrative(row.marketOpportunity, 520) || undefined,
            };
          }'''
          if old not in text:
              raise SystemExit("normalizeProjectBackground block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          npm install
          node --import tsx --test \
            tests/venture-profile-data.test.ts \
            tests/catalog.test.ts
          GITHUB_PAGES=true npx next build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/venture-profile-data.ts
          git commit -m "fix: sanitize structured project background narratives"
          git pull --rebase origin main
          git push origin HEAD:main
