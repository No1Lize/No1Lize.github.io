name: One-time venture project background fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-venture-team-shape.yml

permissions:
  contents: write

concurrency:
  group: one-time-venture-project-background
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch, test and commit
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/venture-profile-data.ts")
          text = path.read_text(encoding="utf-8")
          old = '''function normalizeCompanyProfile(raw: CompanyVentureProfile): CompanyVentureProfile {
            const projectBackground = normalizeProjectBackground(raw.projectBackground);
            return {
              slug: clean(raw.slug, 100),
              name: clean(raw.name, 120),
              updatedAt: clean(raw.updatedAt, 40),
              status: raw.status || "fallback",
              background: projectBackground?.summary || sanitizeVentureNarrative(raw.background, 900),
              projectBackground,'''
          new = '''function normalizeCompanyProfile(raw: CompanyVentureProfile): CompanyVentureProfile {
            const fallbackBackground = sanitizeVentureNarrative(raw.background, 900);
            const projectBackground =
              normalizeProjectBackground(raw.projectBackground) ??
              (Number(raw.researchModelVersion) >= 2
                ? {
                    summary:
                      fallbackBackground ||
                      "当前公开来源未提供可核对的项目背景说明。",
                  }
                : undefined);
            return {
              slug: clean(raw.slug, 100),
              name: clean(raw.name, 120),
              updatedAt: clean(raw.updatedAt, 40),
              status: raw.status || "fallback",
              background: projectBackground?.summary || fallbackBackground,
              projectBackground,'''
          if old not in text:
              raise SystemExit("normalizeCompanyProfile project background block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          npm install
          node --import tsx --test \
            tests/venture-profile-data.test.ts \
            tests/catalog.test.ts
          GITHUB_PAGES=true npx next build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/venture-profile-data.ts
          git commit -m "fix: preserve structured project background fallback"
          git pull --rebase origin main
          git push origin HEAD:main
