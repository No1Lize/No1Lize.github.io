name: Refresh semiconductor and energy WeChat coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-semiconductor-energy-wechat.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-article-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh semiconductor and energy WeChat sources
        run: |
          python tools/refresh_wechat_snapshot.py \
            --account icbank \
            --account ijiwei \
            --account gg-lithium \
            --account cbea-battery

      - name: Verify crawler, fallback, and snapshot quality
        run: |
          python -m py_compile \
            tools/refresh_wechat_snapshot.py \
            tools/wechat_public_sources.py \
            tools/wechat_index_record_fallback.py \
            tools/wechat_snapshot_quality.py
          python -m unittest \
            tests.test_wechat_public_sources \
            tests.test_wechat_public_index_fallback \
            tests.test_wechat_snapshot_quality \
            tests.test_refresh_wechat_snapshot
          python tools/crawl_articles.py --validate-only

      - name: Commit refreshed snapshot
        id: update
        shell: bash
        run: |
          if git diff --quiet -- public/data/articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json
          git commit -m "data: refresh semiconductor and energy WeChat coverage"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python tools/refresh_wechat_snapshot.py \
              --account icbank \
              --account ijiwei \
              --account gg-lithium \
              --account cbea-battery
            python -m unittest \
              tests.test_wechat_public_sources \
              tests.test_wechat_public_index_fallback \
              tests.test_wechat_snapshot_quality \
              tests.test_refresh_wechat_snapshot
            python tools/crawl_articles.py --validate-only
            git add public/data/articles.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
