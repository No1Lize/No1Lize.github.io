name: One-time strict entity recommendation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-entity-recommendations.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact entity filtering patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("lib/tracking-recommendations.ts")
          source = source_path.read_text(encoding="utf-8")

          source = source.replace(
              '  "vp",\n  "the",',
              '  "vp",\n  "agent",\n  "inference",\n  "rocket",\n  "the",',
          )
          source = source.replace(
              '\nconst TITLECASE_PATTERN = /\\b[A-Z][a-z]{3,15}\\b/g;\n',
              '\n',
          )
          source = source.replace(
              '  collect(article.title, true, TITLECASE_PATTERN);\n',
              '',
          )
          source = source.replace(
              '      if (existing.has(key) || blockedEntities.has(key)) continue;\n'
              '      if (!mentionHasTechnicalContext(text, extracted.label)) continue;',
              '      if (existing.has(key) || blockedEntities.has(key)) continue;\n'
              '      if (!extracted.strongShape) continue;\n'
              '      if (!mentionHasTechnicalContext(text, extracted.label)) continue;',
          )

          required_absent = [
              "TITLECASE_PATTERN",
              "collect(article.title, true, TITLECASE_PATTERN)",
          ]
          for marker in required_absent:
              if marker in source:
                  raise SystemExit(f"failed to remove dynamic ordinary-word path: {marker}")
          for marker in ['  "agent",', '  "inference",', '  "rocket",', "if (!extracted.strongShape) continue;"]:
              if marker not in source:
                  raise SystemExit(f"missing strict entity marker: {marker}")

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/tracking-recommendations.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("ordinary technical concepts are not promoted to named entities"'
          if marker not in tests:
              tests += r'''

const ordinaryConceptArticles: LiveIntelligenceEvent[] = [
  ["Inference", "半导体", "chip inference architecture"],
  ["Rocket", "商业航天", "rocket satellite launch system"],
  ["Agent", "AI / AGI", "agent model training framework"],
].flatMap(([label, sector, context]) =>
  [1, 2, 3].map((index) => ({
    id: `ordinary-${label.toLowerCase()}-${index}`,
    sourceId: `ordinary-source-${label.toLowerCase()}-${index}`,
    title: `${label} advances in ${context}`,
    summary: `${label} is repeatedly used here as a general technical concept, not a named product or method.`,
    type: "媒体报道" as const,
    region: "全球" as const,
    sector,
    company: "科技产业",
    publishedAt: `2099-02-0${index}`,
    importance: 75,
    qualityScore: 82,
    source: {
      name: `Independent Source ${index}`,
      url: `https://${label.toLowerCase()}-${index}.example.com/article`,
      level: "媒体报道" as const,
      platform: "网站",
    },
  })),
);

test("ordinary technical concepts are not promoted to named entities", () => {
  for (const [sector, forbidden] of [
    ["半导体", "Inference"],
    ["商业航天", "Rocket"],
    ["AI / AGI", "Agent"],
  ] as const) {
    const result = recommendTrackingAdditions(ordinaryConceptArticles, sector);
    assert.ok(
      !result.keywords.some((item) => item.value === forbidden),
      `${forbidden} is a concept, not a named entity`,
    );
  }
});
'''
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install and run unit tests
        run: npm install && npm run test:unit
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tracking-recommendations.ts tests/tracking-recommendations.test.ts
          git commit -m "fix: reject ordinary concepts from entity recommendations"
          git pull --rebase origin main
          git push origin HEAD:main
