name: One-time clean existing WeChat snapshot quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-existing-wechat-snapshot.yml

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean current snapshot
        run: python tools/clean_existing_wechat_snapshot.py
      - name: Verify cleanup
        run: |
          python -m py_compile \
            tools/clean_existing_wechat_snapshot.py \
            tools/wechat_snapshot_quality.py
          python -m unittest \
            tests.test_clean_existing_wechat_snapshot \
            tests.test_wechat_snapshot_quality
          python tools/crawl_articles.py --validate-only
      - name: Commit corrected snapshot
        id: update
        shell: bash
        run: |
          if git diff --quiet -- public/data/articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json
          git commit -m "data: clean WeChat sectors and person entities"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python tools/clean_existing_wechat_snapshot.py
            python -m unittest \
              tests.test_clean_existing_wechat_snapshot \
              tests.test_wechat_snapshot_quality
            python tools/crawl_articles.py --validate-only
            git add public/data/articles.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish corrected snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
