name: Temporary fix frontend baseline

on:
  push:
    branches:
      - fix/frontend-baseline-checks-clean-20260727
    paths:
      - ".github/workflows/temporary-fix-frontend-baseline.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-baseline-checks-clean-20260727
          fetch-depth: 0
      - name: Apply baseline fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          favorite_path = Path("components/homepage-favorite-controls.tsx")
          favorite = favorite_path.read_text(encoding="utf-8")
          old_observe = '    observer?.observe(eventList, { childList: true });\n'
          new_observe = '    if (eventList && observer) {\n      observer.observe(eventList, { childList: true });\n    }\n'
          if old_observe in favorite:
              favorite_path.write_text(favorite.replace(old_observe, new_observe, 1), encoding="utf-8")
          elif new_observe not in favorite:
              raise SystemExit("favorite observer marker not found")

          catalog_path = Path("lib/catalog-data.ts")
          catalog = catalog_path.read_text(encoding="utf-8")
          if 'slug:"google"' not in catalog:
              marker = "export const companies: Company[] = [\n"
              entry = '  { slug:"google", name:"Google", region:"美国", sector:"AI / AGI", stage:"已上市", status:"已上市", founded:"1998", headquarters:"Mountain View", summary:"开发搜索、云计算、人工智能与面向消费者和企业的软件服务。", product:"Google Search、Google Cloud、Gemini 与相关 AI 产品。", source:official("Google","https://about.google/"), confidence:0.99 },\n'
              if marker not in catalog:
                  raise SystemExit("companies catalog marker not found")
              catalog_path.write_text(catalog.replace(marker, marker + entry, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/homepage-favorite-controls.tsx lib/catalog-data.ts
          git diff --cached --quiet || git commit -m "fix: restore frontend baseline checks"
          git push origin HEAD:fix/frontend-baseline-checks-clean-20260727
