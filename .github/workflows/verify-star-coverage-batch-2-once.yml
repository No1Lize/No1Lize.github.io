name: Verify STAR coverage batch 2 once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - config/star_market_investor_sources.json
      - requirements-star-investors.txt
      - .github/workflows/verify-star-coverage-batch-2-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-star-coverage-batch-2-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'feat/star-market-coverage-batch-2-20260804' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/star-market-coverage-batch-2-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-star-investors.txt
          npm ci

      - name: Rebuild all configured STAR prospectus records
        run: |
          python tools/crawl_star_market_investors.py --require-companies
          python tools/review_star_market_investors.py
          python tools/crawl_star_market_investors.py --check --require-companies
          python tools/review_star_market_investors.py --check
          node --import tsx scripts/build-institution-data-layers.ts

      - name: Verify expansion and publication boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('public/data/star_market_investors.json').read_text())
          assert snapshot['companyCount'] == 3, snapshot['companyCount']
          assert set(snapshot['companies']) == {'cambricon', 'montage-technology', 'amec'}

          cambricon = snapshot['companies']['cambricon']
          assert cambricon['verifiedInvestorCount'] == 31
          assert all(row['reviewStatus'] == 'verified' for row in cambricon['investors'])

          for slug in ('montage-technology', 'amec'):
              company = snapshot['companies'][slug]
              investors = company['investors']
              assert company['status'] == 'ok', (slug, company['status'], company.get('errors'))
              assert investors, slug
              assert all(row.get('preIpoShares', 0) > 0 for row in investors)
              assert all(0 < row.get('preIpoOwnershipPct', 0) <= 100 for row in investors)
              assert all(row.get('sourcePage', 0) > 0 for row in investors)
              assert all(row.get('nameResolution') in {'definitions', 'basic-information'} for row in investors)
              assert all(row.get('disclosedName') for row in investors)
              assert all(row.get('reviewStatus') in {'needs_review', 'rejected'} for row in investors)
              assert not any(row.get('publicContact') for row in investors)

          assert snapshot['investorCount'] == (
              snapshot['verifiedInvestorCount']
              + snapshot['needsReviewInvestorCount']
              + snapshot['rejectedInvestorCount']
          )
          assert snapshot['verifiedInvestorCount'] == 31
          assert snapshot['needsReviewInvestorCount'] > 0

          equity = json.loads(Path('public/data/institution_equity_relationships.json').read_text())
          assert equity['verifiedRelationshipCount'] == 31
          assert equity['needsReviewCount'] == snapshot['needsReviewInvestorCount']
          assert equity['rejectedCount'] == snapshot['rejectedInvestorCount']
          PY

      - name: Run full regression suite
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit candidate snapshots and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/star_market_investors.json \
            public/data/institution_entities.json \
            public/data/institution_events.json \
            public/data/institution_equity_relationships.json
          git rm -f .github/workflows/verify-star-coverage-batch-2-once.yml
          git commit -m "data: add two STAR Market prospectus review queues"
          git pull --rebase origin feat/star-market-coverage-batch-2-20260804
          git push origin HEAD:feat/star-market-coverage-batch-2-20260804
