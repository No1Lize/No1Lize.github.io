name: One-time add WeChat person entities

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-wechat-person-entities.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add contextual entity discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/wechat_public_sources.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _specific_keywords(values: Sequence[str]) -> list[str]:\n    return [\n        value\n        for value in _unique(values, 80)\n        if value.casefold() not in GENERIC_DISCOVERY_TERMS\n        and not re.fullmatch(r"[A-Za-z]{1,2}", value)\n        and len(value) >= 2\n    ]\n\n\n'''
          addition = '''def _specific_keywords(values: Sequence[str]) -> list[str]:\n    return [\n        value\n        for value in _unique(values, 80)\n        if value.casefold() not in GENERIC_DISCOVERY_TERMS\n        and not re.fullmatch(r"[A-Za-z]{1,2}", value)\n        and len(value) >= 2\n    ]\n\n\nPERSON_CONTEXT_PATTERN = re.compile(\n    r"创始人|联合创始人|首席|CEO|CTO|研究员|科学家|教授|博士|作者|"\n    r"负责人|贡献者|宣布|表示|指出|认为|加入|离职|任命|担任|领导",\n    flags=re.IGNORECASE,\n)\nPERSON_STOP_WORDS = {\n    "Artificial Intelligence",\n    "Machine Learning",\n    "Deep Learning",\n    "Open Source",\n    "United States",\n    "New York",\n    "San Francisco",\n    "Cycle Double Cover",\n}\n\n\ndef _dynamic_people(text: str) -> list[str]:\n    result: list[str] = []\n    for match in re.finditer(\n        r"(?<![A-Za-z])([A-Z][a-zA-Z'.-]{1,24}(?:\\s+[A-Z][a-zA-Z'.-]{1,24}){1,2})(?![A-Za-z])",\n        text,\n    ):\n        name = _clean(match.group(1), 100)\n        window = text[max(0, match.start() - 55) : match.end() + 55]\n        if name in PERSON_STOP_WORDS or not PERSON_CONTEXT_PATTERN.search(window):\n            continue\n        result.append(name)\n\n    chinese_patterns = (\n        r"(?:第一作者|通讯作者|作者|教授|研究员|科学家|博士|创始人|联合创始人|负责人)[：:、，,\\s]+([\\u4e00-\\u9fff·]{2,5})",\n        r"([\\u4e00-\\u9fff·]{2,5})(?:教授|博士|研究员|科学家)(?:表示|指出|认为|称)?",\n    )\n    for pattern in chinese_patterns:\n        result.extend(match.group(1) for match in re.finditer(pattern, text))\n    return _unique(result, 12)\n\n\ndef _known_companies(text: str, crawler: Any) -> list[str]:\n    result: list[str] = []\n    for aliases, company in getattr(crawler, "COMPANY_ALIASES", ()):\n        name = str(company[0])\n        if any(_contains_phrase(text, alias, crawler) for alias in aliases):\n            result.append(name)\n    return _unique(result, 24)\n\n\n'''
          if anchor not in text:
              raise SystemExit('entity helper anchor not found')
          text = text.replace(anchor, addition, 1)

          old = '''    companies = _matched(spec.get("trackedCompanies", []), text, crawler)\n    company_keys = {_clean(value, 120).casefold() for value in companies}\n    people = [\n        value\n        for value in _matched(spec.get("trackedPeople", []), text, crawler)\n        if _clean(value, 120).casefold() not in company_keys\n    ]\n    keywords = _matched(_specific_keywords(spec.get("keywords", [])), text, crawler)'''
          new = '''    companies = _unique(\n        [\n            *_matched(spec.get("trackedCompanies", []), text, crawler),\n            *_known_companies(text, crawler),\n        ],\n        24,\n    )\n    company_keys = {_clean(value, 120).casefold() for value in companies}\n    people = [\n        value\n        for value in _unique(\n            [\n                *_matched(spec.get("trackedPeople", []), text, crawler),\n                *_dynamic_people(text),\n            ],\n            16,\n        )\n        if _clean(value, 120).casefold() not in company_keys\n    ]\n    keywords = _matched(_specific_keywords(spec.get("keywords", [])), text, crawler)'''
          if old not in text:
              raise SystemExit('relevance entity anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_wechat_public_sources.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if 'test_discovers_contextual_people_not_preconfigured' not in test_text:
              test = '''\n    def test_discovers_contextual_people_not_preconfigured(self) -> None:\n        body = """\n        <html><head>\n          <meta property="og:title" content="OpenAI首席未来学家Joshua Achiam宣布离职" />\n          <meta property="article:published_time" content="2026-07-25" />\n        </head><body>\n          <a id="js_name">量子位</a>\n          <div id="js_content">\n            <p>OpenAI首席未来学家 Joshua Achiam 在X上宣布离职。</p>\n            <p>研究员 Noam Brown 表示这一变化值得关注。</p>\n            <p>论文第一作者 黄佳诺 介绍了新的推理模型。</p>\n          </div>\n        </body></html>\n        """\n        spec = {\n            "id": "user-track-wechat-qbitai-ai",\n            "name": "量子位",\n            "sector": "AI / AGI",\n            "region": "中国",\n            "keywords": ["推理模型"],\n            "trackedCompanies": ["OpenAI"],\n            "trackedPeople": [],\n            "sourceLevel": "媒体报道",\n        }\n        article = wechat.parse_wechat_article(\n            spec,\n            "https://mp.weixin.qq.com/s?__biz=test&mid=1",\n            body,\n            crawl_articles,\n        )\n        self.assertIsNotNone(article)\n        assert article is not None\n        self.assertIn("Joshua Achiam", article["mentionedPeople"])\n        self.assertIn("Noam Brown", article["mentionedPeople"])\n        self.assertIn("黄佳诺", article["mentionedPeople"])\n        self.assertIn("OpenAI", article["mentionedCompanies"])\n        self.assertNotIn("OpenAI", article["mentionedPeople"])\n'''
              if marker not in test_text:
                  raise SystemExit('test insertion anchor not found')
              tests.write_text(test_text.replace(marker, test + marker, 1), encoding='utf-8')
          PY
      - name: Verify WeChat entity tests
        run: |
          python -m py_compile tools/wechat_public_sources.py
          python -m unittest tests.test_wechat_public_sources tests.test_wechat_sogou_index tests.test_wechat_source_registry
      - name: Commit verified entity extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_public_sources.py tests/test_wechat_public_sources.py
          git commit -m "feat: extract contextual people from WeChat articles"
          git pull --rebase origin main
          git push origin HEAD:main
