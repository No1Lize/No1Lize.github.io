name: Apply venture normalizer fixed-point patch

on:
  push:
    branches: [main]
    paths:
      - tools/patch_venture_normalizer_fixed_point.py
      - .github/workflows/patch-venture-normalizer-fixed-point.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-venture-normalizer-fixed-point
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply normalizer convergence patch
        run: python tools/patch_venture_normalizer_fixed_point.py
      - name: Verify normalizer and venture regressions
        run: |
          python -m py_compile tools/normalize_venture_profiles.py
          python -m unittest \
            tests.test_normalize_venture_profiles \
            tests.test_refine_venture_project_stability \
            tests.test_venture_entity_semantics
          git diff --check
      - name: Commit permanent fix
        shell: bash
        run: |
          set -euo pipefail
          rm tools/patch_venture_normalizer_fixed_point.py
          rm .github/workflows/patch-venture-normalizer-fixed-point.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: converge venture normalizer quality state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
