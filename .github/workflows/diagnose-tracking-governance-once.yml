name: Apply source health summary fix once

on:
  push:
    branches:
      - fix/tracking-governance-fixed-point

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tracking-governance-fixed-point
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pure summary patch
        run: python tools/apply_source_health_summary_fix_once.py
      - name: Validate canonical source health behavior
        run: |
          python -m py_compile \
            tools/source_health_summary.py \
            tools/tracking_source_governance.py \
            tools/update_source_health.py
          python -m unittest \
            tests.test_source_health_summary \
            tests.test_source_health \
            tests.test_tracking_source_governance \
            tests.test_source_health_runtime \
            tests.test_source_health_performance
          python tools/source_health_summary.py --check
          python tools/tracking_source_governance.py --check
      - name: Commit ordinary source and test files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/source_health_summary.py \
            tools/tracking_source_governance.py \
            tools/update_source_health.py \
            tests/test_source_health_summary.py \
            tests/test_source_health.py
          git commit -m 'fix: canonicalize source health aggregate summary'
          git push origin HEAD:fix/tracking-governance-fixed-point
