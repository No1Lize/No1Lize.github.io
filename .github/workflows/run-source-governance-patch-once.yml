name: Run source governance patch once

on:
  push:
    branches: [feat/source-evidence-health-governance]
    paths:
      - .github/workflows/run-source-governance-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-evidence-health-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic patch
        run: python tools/apply_source_governance_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Verify source governance
        run: |
          python -m unittest \
            tests.test_source_evidence \
            tests.test_source_health \
            tests.test_source_health_runtime
          python -m py_compile \
            tools/crawl_articles.py \
            tools/crawl_with_tracking.py \
            tools/source_evidence.py \
            tools/source_health_runtime.py \
            tools/update_source_health.py
          npm run lint
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/crawl_articles.py \
            tools/crawl_with_tracking.py \
            tools/source_evidence.py \
            tools/source_health_runtime.py \
            tools/update_source_health.py \
            config/source_health_policy.json \
            lib/channel-updates.ts \
            components/channel-update-directory-client.tsx \
            components/channel-update-directory.module.css \
            tests/test_source_evidence.py \
            tests/test_source_health.py \
            tests/test_source_health_runtime.py \
            .github/workflows/scheduled-sync.yml
          git rm -f \
            .github/workflows/apply-source-evidence-health-governance-once.yml \
            .github/workflows/run-source-governance-patch-once.yml \
            tools/apply_source_governance_patch.py
          git commit -m "feat: grade sources and quarantine persistent failures"
          git pull --rebase origin feat/source-evidence-health-governance
          git push origin HEAD:feat/source-evidence-health-governance
