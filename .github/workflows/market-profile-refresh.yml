name: Initial three-market profile refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-profile-refresh.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: initial-market-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl listed market profiles
        run: python tools/crawl_market_profiles.py
      - name: Verify three-market parser and fallback behavior
        run: python -m unittest tests.test_market_profiles
      - name: Commit market snapshot
        id: snapshot
        run: |
          if git diff --quiet -- public/data/market_profiles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market_profiles.json
          git commit -m "data: initialize three-market company profiles"
          git pull --rebase origin main
          python tools/crawl_market_profiles.py
          python -m unittest tests.test_market_profiles
          git add public/data/market_profiles.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
