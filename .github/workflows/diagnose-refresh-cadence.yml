name: Diagnose intelligence refresh cadence

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-refresh-cadence.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect recent refresh runs
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run list \
            --workflow scheduled-sync.yml \
            --limit 40 \
            --json databaseId,runNumber,status,conclusion,event,headSha,createdAt,startedAt,updatedAt,url,displayTitle \
            > diagnostics/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runs=json.loads(Path('diagnostics/runs.json').read_text())
          for run in runs:
              print(run)
          scheduled=[r for r in runs if r.get('event')=='schedule']
          Path('diagnostics/scheduled.json').write_text(json.dumps(scheduled,ensure_ascii=False,indent=2)+'\n')
          latest=next((r for r in runs if r.get('status') in {'queued','in_progress','pending'}), runs[0] if runs else None)
          if latest:
              Path('diagnostics/latest-run-id.txt').write_text(str(latest['databaseId']))
          PY
          if [ -s diagnostics/latest-run-id.txt ]; then
            run_id=$(cat diagnostics/latest-run-id.txt)
            gh run view "$run_id" --json databaseId,runNumber,status,conclusion,event,createdAt,startedAt,updatedAt,url,jobs > diagnostics/latest-run.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-cadence-diagnostics
          path: diagnostics
          if-no-files-found: error
