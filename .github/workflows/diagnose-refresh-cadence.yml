name: Diagnose intelligence refresh cadence

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-refresh-cadence.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Print final publication failure tail
        run: |
          set -euo pipefail
          gh run view 30319309292 --log-failed > failed.log
          tail -n 75 failed.log
