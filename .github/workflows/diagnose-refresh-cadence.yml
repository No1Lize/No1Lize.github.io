name: Diagnose intelligence refresh cadence

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-refresh-cadence.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Show scheduled runs and current backend state
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run list \
            --workflow scheduled-sync.yml \
            --limit 60 \
            --json databaseId,number,status,conclusion,event,headSha,createdAt,startedAt,updatedAt,url,displayTitle \
            > diagnostics/runs.json
          python - <<'PY' | tee diagnostics/summary.txt
          import json
          from pathlib import Path
          runs=json.loads(Path('diagnostics/runs.json').read_text())
          print('=== SCHEDULED RUNS ===')
          for run in runs:
              if run.get('event') == 'schedule':
                  print(json.dumps(run, ensure_ascii=False, sort_keys=True))
          print('=== ACTIVE OR PENDING RUNS ===')
          for run in runs:
              if run.get('status') in {'queued','in_progress','pending'}:
                  print(json.dumps(run, ensure_ascii=False, sort_keys=True))
          PY
          echo '=== FAILED PUBLISH TAIL (RUN 682) ===' | tee diagnostics/failure-tail.txt
          gh run view 30319309292 --log-failed | tail -n 180 | tee -a diagnostics/failure-tail.txt
          echo '=== CURRENT RUN 683 ===' | tee diagnostics/current-run.txt
          gh run view 30341476399 --json databaseId,number,status,conclusion,event,createdAt,startedAt,updatedAt,url,jobs \
            | tee -a diagnostics/current-run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-cadence-diagnostics-focused
          path: diagnostics
          if-no-files-found: error
