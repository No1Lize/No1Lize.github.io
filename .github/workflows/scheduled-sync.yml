name: Refresh public intelligence

on:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/user_tracking.json
      - config/tracking_source_governance.json
      - config/source_registry.json
      - config/professional_media_sources.json
      - config/official_company_sources.json
      - config/listed_companies.json
      - tools/**
      - .github/workflows/scheduled-sync.yml

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: single

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source, disclosure, retention and automation plans
        run: |
          python -m py_compile \
            tools/build_source_registry.py \
            tools/source_health_summary.py \
            tools/tracking_source_governance.py \
            tools/start_full_refresh.py \
            tools/finalize_full_refresh.py \
            tools/refresh_article_quality_gate.py \
            tools/run_pipeline.py \
            tools/crawl_articles.py \
            tools/crawl_with_wechat_registry.py \
            tools/validate_professional_media_snapshot.py \
            tools/crawl_listed_company_disclosures.py \
            tools/cninfo_structured_disclosures.py \
            tools/us_ir_baseline_disclosures.py \
            tools/eastmoney_transport.py \
            tools/migrate_entity_attribution.py \
            tools/refine_eastmoney_snapshot.py \
            tools/backfill_tracking_sectors.py \
            tools/refresh_people_profiles_with_video.py \
            tools/snapshot_retention.py \
            tools/validate_full_refresh.py \
            tools/update_source_health.py \
            tools/validate_snapshot_retention.py \
            tools/validate_data.py \
            tools/validate_source_coverage.py \
            tools/validate_eastmoney_snapshot.py \
            tools/validate_user_source_coverage.py \
            tools/validate_market_profiles.py
          python -m unittest \
            tests.test_source_health_summary \
            tests.test_refresh_article_quality_gate \
            tests.test_scheduled_sync_workflow
          python tools/run_pipeline.py check
      - name: Require a normalized automatic source registry
        run: |
          python tools/build_source_registry.py
          python tools/build_source_registry.py --check
      - name: Start a clean full-source status ledger
        env:
          PIPELINE_RUN_ID: gha:${{ github.run_id }}:${{ github.run_attempt }}:public-intelligence-full-refresh
          PIPELINE_CODE_SHA: ${{ github.sha }}
          PIPELINE_SOURCE_REF: ${{ github.ref }}
        run: python tools/start_full_refresh.py
      - name: Crawl core, tracking, professional media, X and WeChat sources
        run: python tools/crawl_with_wechat_registry.py --source all
      - name: Require executed professional media groups and original-domain articles
        run: python tools/validate_professional_media_snapshot.py --require-articles
      - name: Crawl A-share and Hong Kong exchange disclosures
        run: python tools/crawl_listed_company_disclosures.py
      - name: Resolve A-share documents through CNINFO structured data
        run: python tools/cninfo_structured_disclosures.py --require-events
      - name: Validate A-share and Hong Kong disclosure coverage
        run: python tools/validate_listed_company_disclosures.py
      - name: Publish verified US filing baselines
        run: python -m tools.publish_us_ir_baselines
      - name: Refresh US filings through live official sources
        run: python -m tools.us_ir_baseline_disclosures
      - name: Require complete listed-company disclosure coverage
        run: python -m tools.us_ir_baseline_disclosures --check --require-events
      - name: Crawl all fixed and user-configured official company sources
        run: python tools/crawl_official_company_sources.py
      - name: Crawl listed market profiles trends and quote metrics
        run: python tools/crawl_market_profiles.py
      - name: Migrate legacy entity attribution
        run: python tools/migrate_entity_attribution.py
      - name: Refine Eastmoney snapshot
        run: python tools/refine_eastmoney_snapshot.py
      - name: Backfill tracking sectors and coverage
        run: python tools/backfill_tracking_sectors.py
      - name: Refresh tracked people profiles and public videos
        run: python tools/refresh_people_profiles_with_video.py
      - name: Apply rolling newest-first article retention
        run: python tools/snapshot_retention.py
      - name: Finalize full refresh audit
        env:
          PIPELINE_RUN_ID: gha:${{ github.run_id }}:${{ github.run_attempt }}:public-intelligence-full-refresh
          PIPELINE_CODE_SHA: ${{ github.sha }}
          PIPELINE_SOURCE_REF: ${{ github.ref }}
        run: |
          python tools/refresh_article_quality_gate.py
          python tools/finalize_full_refresh.py
      - name: Update cross-run source health
        run: python tools/update_source_health.py
      - name: Require canonical source health summary
        id: source-health
        run: python tools/source_health_summary.py --check --issue-body /tmp/source-health-issue.md --github-output "$GITHUB_OUTPUT"
      - name: Validate rolling article retention
        run: python tools/validate_snapshot_retention.py
      - name: Validate data quality
        run: python tools/validate_data.py
      - name: Validate complete source coverage
        run: python tools/validate_source_coverage.py
      - name: Validate Eastmoney snapshot
        run: python tools/validate_eastmoney_snapshot.py
      - name: Validate user source coverage
        run: python tools/validate_user_source_coverage.py
      - name: Validate listed market profiles
        run: python tools/validate_market_profiles.py
      - name: Validate tracked people profiles
        run: python tools/refresh_people_profiles_with_video.py --offline --validate-only
      - name: Test crawler
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Commit semantically changed public data
        id: data-update
        env:
          PIPELINE_RUN_ID: gha:${{ github.run_id }}:${{ github.run_attempt }}:public-intelligence-full-refresh
          PIPELINE_CODE_SHA: ${{ github.sha }}
          PIPELINE_SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          DATA_PATHS=(
            public/data/articles.json
            public/data/source_health.json
            public/data/refresh_audit.json
            public/data/data_lineage.json
            public/data/pipeline_health.json
            public/data/market_profiles.json
            public/data/people_profiles.json
            public/data/listed_company_disclosures.json
            public/data/us_ir_disclosures.json
          )
          CONTROL_PATHS=(
            config/source_registry.json
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DATA_PATHS[@]}" "${CONTROL_PATHS[@]}"
          if git diff --cached --quiet; then
            echo "No semantic public-data changes; publishing the completed full-crawl audit."
          else
            git commit -m "data: refresh public intelligence with source health"
          fi

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/build_source_registry.py
            python tools/source_health_summary.py
            python tools/tracking_source_governance.py --check
            python tools/snapshot_retention.py
            python tools/refresh_article_quality_gate.py
            python tools/finalize_full_refresh.py
            python tools/validate_snapshot_retention.py
            python tools/validate_data.py
            python tools/validate_source_coverage.py
            python tools/validate_eastmoney_snapshot.py
            python tools/validate_user_source_coverage.py
            python tools/validate_market_profiles.py
            python tools/refresh_people_profiles_with_video.py --offline --validate-only
            python -m unittest discover -s tests -p "test_*.py"
            python tools/run_pipeline.py finalize \
              public-intelligence-full-refresh \
              --quality-gate passed
            git add "${DATA_PATHS[@]}" "${CONTROL_PATHS[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Sync persistent source health issue
        if: always() && steps.source-health.outcome == 'success' && steps.data-update.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.source-health.outputs.active_count }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[自动告警] 关键情报源连续异常'
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --json number,title \
            --jq '.[] | select(.title == "[自动告警] 关键情报源连续异常") | .number' \
            | head -n 1)

          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --body-file /tmp/source-health-issue.md
            else
              gh issue create --title "$TITLE" --body-file /tmp/source-health-issue.md
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body '所有持续异常来源均已恢复，自动关闭告警。'
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
      - name: Continue through entity reconciliation before publication
        if: always() && steps.data-update.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Full refresh passed its publication gate; reconcile committed entity state before Pages."
          gh workflow run company-candidate-discovery.yml --ref main \
            -f publish_after_reconciliation=true
