name: Refresh public intelligence

on:
  push:
    branches: [main]
    paths:
      - tools/crawl_articles.py
      - tools/crawl_listed_company_disclosures.py
      - tools/snapshot_retention.py
      - tools/crawl_with_tracking.py
      - tools/crawl_tracked_articles.py
      - tools/crawl_with_source_categories.py
      - tools/crawl_with_wechat_registry.py
      - tools/professional_media_sources.py
      - tools/validate_professional_media_snapshot.py
      - tools/adaptive_public_sources.py
      - tools/generic_web_sources.py
      - tools/wechat_public_sources.py
      - tools/wechat_registry_bridge.py
      - tools/wechat_index_context_guard.py
      - tools/wechat_index_record_fallback.py
      - tools/wechat_source_registry.py
      - tools/wechat_sogou_index.py
      - tools/wechat_sogou_bridge.py
      - tools/robust_web_fallback.py
      - tools/prepare_full_refresh.py
      - tools/finalize_full_refresh.py
      - tools/validate_full_refresh.py
      - tools/validate_user_source_coverage.py
      - tools/tracking_taxonomy.py
      - tools/enrich_tracking_snapshot.py
      - tools/tracking_quality.py
      - tools/crawl_market_profiles.py
      - tools/refresh_market_profiles.py
      - tools/refresh_market_profiles_enriched.py
      - tools/market_profile_enrichment.py
      - tools/validate_market_profiles.py
      - tools/refresh_people_profiles.py
      - tools/refresh_people_profiles_with_video.py
      - tools/person_video_discovery.py
      - tools/crawl_official_companies.py
      - tools/crawl_official_with_tracking.py
      - tools/crawl_official_with_source_categories.py
      - tools/eastmoney_transport.py
      - tools/eastmoney_entities.py
      - tools/refine_eastmoney_snapshot.py
      - tools/validate_eastmoney_snapshot.py
      - tools/migrate_article_entities.py
      - lib/listed-company-disclosure-data.ts
      - lib/venture-profile-data-with-disclosures.ts
      - tsconfig.json
      - tests/**/*.py
      - config/intelligence_sources.json
      - config/listed_company_disclosure_sources.json
      - config/professional_technology_media_sources.json
      - config/wechat_sources.json
      - config/wechat_public_indexes.json
      - config/official_company_sources.json
      - config/person_profile_overrides.json
      - config/user_tracking.json
      - .github/workflows/scheduled-sync.yml
  schedule:
    - cron: "0 7-23/2 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-article-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source, disclosure and retention plans
        run: |
          python -m py_compile \
            tools/professional_media_sources.py \
            tools/validate_professional_media_snapshot.py \
            tools/crawl_listed_company_disclosures.py \
            tools/snapshot_retention.py \
            tools/crawl_with_wechat_registry.py
          python -m unittest \
            tests.test_professional_media_sources \
            tests.test_listed_company_disclosures \
            tests.test_scheduled_sync_workflow \
            tests.test_snapshot_retention
      - name: Start a clean full-source status ledger
        run: python tools/prepare_full_refresh.py
      - name: Crawl core, tracking, professional media, X and WeChat sources
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python tools/crawl_with_wechat_registry.py --source all
      - name: Require executed professional media groups and original-domain articles
        run: python tools/validate_professional_media_snapshot.py --require-articles
      - name: Crawl official exchange and designated disclosure sources
        run: python tools/crawl_listed_company_disclosures.py
      - name: Require verified listed-company disclosure events
        run: python tools/crawl_listed_company_disclosures.py --validate-only --require-events
      - name: Crawl all fixed and user-configured official company sources
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python tools/eastmoney_transport.py
      - name: Crawl listed market profiles trends and quote metrics
        run: python tools/refresh_market_profiles_enriched.py
      - name: Migrate legacy entity attribution
        run: python tools/migrate_article_entities.py
      - name: Refine Eastmoney snapshot
        run: python tools/refine_eastmoney_snapshot.py
      - name: Backfill tracking sectors and coverage
        run: python tools/enrich_tracking_snapshot.py
      - name: Refresh tracked people profiles and public videos
        run: python tools/refresh_people_profiles_with_video.py
      - name: Apply rolling newest-first article retention
        run: python tools/snapshot_retention.py
      - name: Finalize full refresh audit
        run: python tools/finalize_full_refresh.py
      - name: Validate rolling article retention
        run: python tools/snapshot_retention.py --check
      - name: Validate data quality
        run: python tools/crawl_articles.py --validate-only
      - name: Validate complete source coverage
        run: python tools/validate_full_refresh.py
      - name: Validate Eastmoney snapshot
        run: python tools/validate_eastmoney_snapshot.py
      - name: Validate user source coverage
        run: python tools/validate_user_source_coverage.py
      - name: Validate listed market profiles
        run: python tools/validate_market_profiles.py
      - name: Validate tracked people profiles
        run: python tools/refresh_people_profiles_with_video.py --offline --validate-only
      - name: Test crawler
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Commit changed public data
        id: data-update
        run: |
          if git diff --quiet -- \
            public/data/articles.json \
            public/data/listed_company_disclosures.json \
            public/data/market_profiles.json \
            public/data/people.json; then
            echo "No public data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/articles.json \
            public/data/listed_company_disclosures.json \
            public/data/market_profiles.json \
            public/data/people.json
          git commit -m "data: refresh all public intelligence sources"
          for attempt in 1 2 3; do
            git pull --rebase origin main

            # Re-run deterministic enrichment at the rebased HEAD. Network source
            # statuses remain the fresh ledger produced by this workflow run.
            python tools/refresh_market_profiles_enriched.py
            python tools/migrate_article_entities.py
            python tools/refine_eastmoney_snapshot.py
            python tools/enrich_tracking_snapshot.py
            python tools/refresh_people_profiles_with_video.py
            python tools/snapshot_retention.py
            python tools/finalize_full_refresh.py
            python tools/snapshot_retention.py --check
            python tools/crawl_listed_company_disclosures.py --validate-only --require-events
            python tools/validate_professional_media_snapshot.py --require-articles
            python tools/crawl_articles.py --validate-only
            python tools/validate_full_refresh.py
            python tools/validate_eastmoney_snapshot.py
            python tools/validate_user_source_coverage.py
            python tools/validate_market_profiles.py
            python tools/refresh_people_profiles_with_video.py --offline --validate-only
            python -m unittest discover -s tests -p "test_*.py"
            git add \
              public/data/articles.json \
              public/data/listed_company_disclosures.json \
              public/data/market_profiles.json \
              public/data/people.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the updated snapshot
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
