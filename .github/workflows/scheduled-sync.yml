name: Refresh public intelligence

on:
  push:
    branches: [main]
    paths:
      - tools/crawl_articles.py
      - config/intelligence_sources.json
      - .github/workflows/scheduled-sync.yml
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Source to refresh
        required: false
        type: choice
        default: all
        options: [all, news, company, feeds, x, papers, discovery, sec]

permissions:
  contents: write
  actions: write

concurrency:
  group: public-article-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl public sources
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python tools/crawl_articles.py --source "${{ inputs.source || 'all' }}"
      - name: Validate data quality
        run: python tools/crawl_articles.py --validate-only
      - name: Test crawler
        run: python -m unittest tests/test_crawler.py
      - name: Commit changed public data
        id: data-update
        run: |
          if git diff --quiet -- public/data/articles.json; then
            echo "No article changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json
          git commit -m "data: refresh public articles"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the updated snapshot
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
