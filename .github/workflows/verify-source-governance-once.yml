name: Verify source governance once

on:
  push:
    branches: [feat/source-evidence-health-governance]
    paths:
      - .github/workflows/verify-source-governance-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-evidence-health-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run verification
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/source-governance
          : > /tmp/source-governance/status.env
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/source-governance/${name}.log" 2>&1
            code=$?
            echo "${name}=${code}" >> /tmp/source-governance/status.env
          }
          run_check install timeout 8m npm ci
          run_check python timeout 8m python -m unittest \
            tests.test_source_evidence \
            tests.test_source_health \
            tests.test_source_health_runtime
          run_check compile timeout 3m python -m py_compile \
            tools/crawl_with_wechat_registry.py \
            tools/source_evidence.py \
            tools/source_health_runtime.py \
            tools/update_source_health.py
          run_check lint timeout 8m npm run lint
          run_check typescript timeout 8m npx tsc --noEmit
          run_check build timeout 20m env ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          python - <<'PY'
          from pathlib import Path
          status = {}
          for line in Path('/tmp/source-governance/status.env').read_text().splitlines():
              key, value = line.split('=', 1)
              status[key] = int(value)
          raise SystemExit(0 if status and all(value == 0 for value in status.values()) else 1)
          PY
      - name: Record result and remove workflow
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = {}
          path = Path('/tmp/source-governance/status.env')
          if path.exists():
              for line in path.read_text().splitlines():
                  key, value = line.split('=', 1)
                  status[key] = int(value)
          logs = {}
          for log in Path('/tmp/source-governance').glob('*.log'):
              logs[log.stem] = log.read_text(errors='replace')[-12000:]
          output = Path('diagnostics/source-governance-verification.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              'sourceCommit': os.environ.get('GITHUB_SHA', ''),
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'outcome': '${{ steps.checks.outcome }}',
              'status': status,
              'logs': logs,
          }, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/source-governance-verification.json
          git rm -f .github/workflows/verify-source-governance-once.yml
          git commit -m "ci: record source governance verification"
          git pull --rebase origin feat/source-evidence-health-governance
          git push origin HEAD:feat/source-evidence-health-governance
      - name: Fail on verification errors
        if: always()
        run: test '${{ steps.checks.outcome }}' = 'success'
