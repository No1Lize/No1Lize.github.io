name: Apply refresh audit repair once

on:
  push:
    branches:
      - fix/intelligence-refresh-audit-quality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intelligence-refresh-audit-quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repository patch
        run: python tools/apply_refresh_audit_patch_once.py
      - name: Validate targeted Python contracts
        run: |
          python -m py_compile \
            tools/crawl_articles.py \
            tools/frequent_refresh_due.py \
            tools/finalize_frequent_refresh.py \
            tools/finalize_full_refresh.py \
            tools/snapshot_retention.py
          python -m unittest \
            tests.test_refresh_audit_contract \
            tests.test_frequent_refresh_workflow \
            tests.test_frequent_refresh_audit \
            tests.test_scheduled_sync_workflow \
            tests.test_entity_resolution_workflow \
            tests.test_snapshot_retention
      - name: Validate frontend contracts
        run: |
          npm ci
          npm run lint
          npm run test:unit
      - name: Commit non-workflow repair files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore \
            .github/workflows/frequent-intelligence-refresh.yml \
            .github/workflows/scheduled-sync.yml \
            .github/workflows/company-candidate-discovery.yml
          git add app components lib tools tests
          if git diff --cached --quiet; then
            echo 'No non-workflow changes to persist.'
            exit 0
          fi
          git commit -m 'fix: preserve refresh audits and prioritize trusted homepage evidence'
          git push origin HEAD:fix/intelligence-refresh-audit-quality
