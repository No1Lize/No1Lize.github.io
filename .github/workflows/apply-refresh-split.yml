name: Apply refresh cadence split

on:
  pull_request:
    paths:
      - .github/workflows/apply-refresh-split.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliable-two-hour-intelligence-refresh-20260729
          fetch-depth: 0
      - name: Move the heavy full refresh to a daily UTC schedule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/scheduled-sync.yml')
          text = path.read_text(encoding='utf-8')
          old = '''  schedule:
    - cron: "17 4-22/2 * * *"
      timezone: "Asia/Taipei"
'''
          new = '''  schedule:
    # 19:17 UTC = 03:17 Asia/Taipei. The lightweight workflow handles two-hour checks.
    - cron: "17 19 * * *"
'''
          if text.count(old) != 1:
              raise SystemExit('expected full-refresh schedule block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the cadence split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/scheduled-sync.yml
          git commit -m "ci: run heavy public intelligence refresh daily"
          git push origin HEAD:fix/reliable-two-hour-intelligence-refresh-20260729
