name: Temporary fix LinkedIn regex

on:
  push:
    branches:
      - fix/frontend-baseline-checks-clean-20260727
    paths:
      - ".github/workflows/temporary-fix-linkedin-regex.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-baseline-checks-clean-20260727
          fetch-depth: 0
      - name: Accept www LinkedIn profile URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/enrich_tracking_people_from_sample_companies.py")
          content = path.read_text(encoding="utf-8")
          old = '("LinkedIn", re.compile(r"https?://(?:[a-z]{2}\\.)?linkedin\\.com/in/([^/?#]+)", re.I)),'
          new = '("LinkedIn", re.compile(r"https?://(?:(?:www|[a-z]{2})\\.)?linkedin\\.com/in/([^/?#]+)", re.I)),'
          if old in content:
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          elif new not in content:
              raise SystemExit("LinkedIn pattern marker not found")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/enrich_tracking_people_from_sample_companies.py
          git diff --cached --quiet || git commit -m "fix: recognize www LinkedIn person profiles"
          git push origin HEAD:fix/frontend-baseline-checks-clean-20260727
