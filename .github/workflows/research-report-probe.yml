name: Probe public research report PDF source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-report-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-report-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler probe
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python tools/crawl_research_reports.py > .github/diagnostics/research-report-probe.log 2>&1
          CRAWL=$?
          python -m unittest tests.test_research_reports > .github/diagnostics/research-report-probe-tests.log 2>&1
          TESTS=$?
          REPORTS=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(len(json.loads(Path('public/data/research_reports.json').read_text(encoding='utf-8')).get('reports', [])))
          except Exception:
              print(0)
          PY
          )
          cat > .github/diagnostics/research-report-probe.json <<EOF
          {"crawl":$CRAWL,"tests":$TESTS,"reports":$REPORTS,"commit":"$GITHUB_SHA","runId":"$GITHUB_RUN_ID"}
          EOF
          exit 0
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/research-report-probe.json \
            .github/diagnostics/research-report-probe.log \
            .github/diagnostics/research-report-probe-tests.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record research report PDF source probe"
          git pull --rebase origin main
          git push origin HEAD:main
