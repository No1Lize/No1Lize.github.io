name: Port strict STAR prospectus parser once

on:
  push:
    branches: [fix/star-market-strict-table-manual-review]
    paths:
      - .github/workflows/port-star-strict-parser-once.yml

permissions:
  contents: write

concurrency:
  group: port-star-strict-parser-once
  cancel-in-progress: false

jobs:
  port-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/star-market-strict-table-manual-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Port conservative parser and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            fix/conservative-star-shareholder-table-parser-20260729:refs/remotes/origin/fix/conservative-star-shareholder-table-parser-20260729
          git show \
            origin/fix/conservative-star-shareholder-table-parser-20260729:tools/star_market_prospectus_parser.py \
            > tools/star_market_prospectus_parser.py
          git show \
            origin/fix/conservative-star-shareholder-table-parser-20260729:tests/test_star_market_prospectus_parser.py \
            > tests/test_star_market_prospectus_parser.py

      - name: Integrate strict parser with current review gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          crawler_path = Path('tools/crawl_star_market_investors.py')
          crawler = crawler_path.read_text(encoding='utf-8')
          if 'star_market_prospectus_parser as prospectus_parser' not in crawler:
              crawler = crawler.replace(
                  '    from . import crawl_listed_company_disclosures as listed\n',
                  '    from . import crawl_listed_company_disclosures as listed\n    from . import star_market_prospectus_parser as prospectus_parser\n',
                  1,
              )
              crawler = crawler.replace(
                  '    import crawl_listed_company_disclosures as listed\n',
                  '    import crawl_listed_company_disclosures as listed\n    import star_market_prospectus_parser as prospectus_parser\n',
                  1,
              )
          if 'text = re.sub(r"<[^>]+>", "", text)' not in crawler:
              crawler = crawler.replace(
                  '    text = str(value or "").replace("\\u3000", " ").replace("\\xa0", " ")\n',
                  '    text = str(value or "")\n    text = re.sub(r"<[^>]+>", "", text)\n    text = text.replace("\\u3000", " ").replace("\\xa0", " ")\n',
                  1,
              )
          replacement = '''def extract_institutional_investors(\n    pages: list[PdfPage],\n    company_name: str,\n    *,\n    max_investors: int,\n) -> list[dict[str, Any]]:\n    return prospectus_parser.extract_institutional_investors(\n        pages,\n        company_name,\n        max_investors=max_investors,\n    )\n\n\ndef _official_prospectus_host'''
          if 'return prospectus_parser.extract_institutional_investors(' not in crawler:
              crawler, count = re.subn(
                  r'def extract_institutional_investors\(.*?\n\ndef _official_prospectus_host',
                  replacement,
                  crawler,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('failed to replace broad STAR investor extractor')
          crawler = crawler.replace(
              '    issuer_contact = extract_issuer_contact(pages, listing.name)\n',
              '    issuer_contact: dict[str, Any] = {}\n',
              1,
          )
          crawler = crawler.replace(
              '            for key in ("name", "investorType", "sourceSection", "evidence"):\n',
              '            for key in ("name", "disclosedName", "investorType", "sourceSection", "evidence", "nameResolution"):\n',
              1,
          )
          official_anchor = '        if not _official_prospectus_host(str(prospectus.get("url", ""))):\n            errors.append(f"{slug}: prospectus URL is not official")\n'
          official_new = official_anchor + '        if re.search(r"<[^>]+>", str(prospectus.get("title", ""))):\n            errors.append(f"{slug}: prospectus title contains HTML markup")\n'
          if 'prospectus title contains HTML markup' not in crawler:
              crawler = crawler.replace(official_anchor, official_new, 1)
          validation_anchor = '''            if int(investor.get("sourcePage", 0)) <= 0:\n                errors.append(f"{slug}: investor {name} missing source page")\n            investor_count += 1\n'''
          validation_replacement = '''            if int(investor.get("sourcePage", 0)) <= 0:\n                errors.append(f"{slug}: investor {name} missing source page")\n            evidence = clean_text(investor.get("evidence"), 500)\n            if not evidence:\n                errors.append(f"{slug}: investor {name} missing table-row evidence")\n            try:\n                shares = float(investor.get("preIpoShares", 0))\n                ownership = float(investor.get("preIpoOwnershipPct", 0))\n            except (TypeError, ValueError):\n                shares = 0\n                ownership = 0\n            if shares <= 0 or not (0 < ownership <= 100):\n                errors.append(f"{slug}: investor {name} missing valid same-row holding facts")\n            if investor.get("nameResolution") not in {"definitions", "basic-information"}:\n                errors.append(f"{slug}: investor {name} lacks prospectus name resolution")\n            if any(fragment in name for fragment in prospectus_parser.NARRATIVE_NAME_FRAGMENTS):\n                errors.append(f"{slug}: narrative phrase published as investor: {name}")\n            if name in prospectus_parser.GENERIC_NAMES:\n                errors.append(f"{slug}: generic institution name published: {name}")\n            company_name = clean_text(company.get("name"), 120)\n            if (\n                company_name\n                and prospectus_parser.normalize_name(company_name)\n                in prospectus_parser.normalize_name(name)\n            ):\n                errors.append(f"{slug}: issuer published as its own investor: {name}")\n            investor_count += 1\n'''
          if 'missing valid same-row holding facts' not in crawler:
              if validation_anchor not in crawler:
                  raise SystemExit('strict validation insertion point not found')
              crawler = crawler.replace(validation_anchor, validation_replacement, 1)
          methodology_anchor = '            "pdfExtraction": "pypdf text extraction; OCR and access-control bypass are not used",\n'
          methodology_new = methodology_anchor + '            "shareholderEvidence": "Only explicit pre/post-IPO shareholder table rows with same-row shares and ownership are published",\n            "nameResolution": "Prospectus definitions or the exact shareholder basic-information block",\n            "contactEvidence": "Only fields inside the exact shareholder basic-information block; publication still requires manifest verification",\n'
          if '"shareholderEvidence"' not in crawler:
              crawler = crawler.replace(methodology_anchor, methodology_new, 1)
          crawler_path.write_text(crawler, encoding='utf-8')

          quality_path = Path('tools/star_investor_quality.py')
          quality = quality_path.read_text(encoding='utf-8')
          if 'STRICT_TABLE_HOLDING_PATTERN' not in quality:
              quality = quality.replace(
                  'SHARES_PATTERN = re.compile(r"(?<!\\d)([\\d,]+(?:\\.\\d+)?)\\s*(万)?\\s*股")\n',
                  'SHARES_PATTERN = re.compile(r"(?<!\\d)([\\d,]+(?:\\.\\d+)?)\\s*(万)?\\s*股")\nSTRICT_TABLE_HOLDING_PATTERN = re.compile(\n    r"^\\s*(?P<shares>\\d[\\d,]*(?:\\.\\d+)?)\\s+"\n    r"(?P<pct>\\d{1,3}(?:\\.\\d+)?)\\s*%?(?=\\s|$)"\n)\n',
                  1,
              )
              old = '''    tail = _tail_after_name(evidence, name)\n    reasons: list[str] = []\n\n    percent_matches = list(PERCENT_PATTERN.finditer(tail))\n'''
              new = '''    tail = _tail_after_name(evidence, name)\n    reasons: list[str] = []\n\n    strict_row = STRICT_TABLE_HOLDING_PATTERN.match(tail)\n    if strict_row:\n        shares = float(strict_row.group("shares").replace(",", ""))\n        ownership = float(strict_row.group("pct"))\n        if shares > 0 and 0 < ownership <= 100:\n            return shares, ownership, reasons\n\n    percent_matches = list(PERCENT_PATTERN.finditer(tail))\n'''
              if old not in quality:
                  raise SystemExit('strict row quality insertion point not found')
              quality = quality.replace(old, new, 1)
          quality_path.write_text(quality, encoding='utf-8')

          review_path = Path('tools/review_star_market_investors.py')
          review = review_path.read_text(encoding='utf-8')
          old_apply = '''    name = str(investor.get("name", ""))\n    evidence = str(investor.get("evidence", ""))\n    key = review_key(company_slug, investor)\n'''
          new_apply = '''    name = str(investor.get("name", ""))\n    evidence_name = str(investor.get("disclosedName") or name)\n    evidence = str(investor.get("evidence", ""))\n    key = review_key(company_slug, investor)\n'''
          if 'evidence_name = str(investor.get("disclosedName") or name)' not in review:
              if old_apply not in review:
                  raise SystemExit('review alias insertion point not found')
              review = review.replace(old_apply, new_apply, 1)
              review = review.replace(
                  '    shares, ownership_pct, holding_reasons = extract_same_line_holding(evidence, name)\n',
                  '    shares, ownership_pct, holding_reasons = extract_same_line_holding(evidence, evidence_name)\n',
                  1,
              )
              review = review.replace(
                  '        name=name,\n        company_name=str(company.get("name", "")),\n        evidence=evidence,\n',
                  '        name=evidence_name,\n        company_name=str(company.get("name", "")),\n        evidence=evidence,\n',
                  1,
              )
              validation_call = '''            independent_status, independent_reasons = derive_review(\n                name=name,\n                company_name=str(company.get("name", "")),\n                evidence=str(investor.get("evidence", "")),\n'''
              validation_new = '''            evidence_name = str(investor.get("disclosedName") or name)\n            independent_status, independent_reasons = derive_review(\n                name=evidence_name,\n                company_name=str(company.get("name", "")),\n                evidence=str(investor.get("evidence", "")),\n'''
              if validation_call not in review:
                  raise SystemExit('review independent validation insertion point not found')
              review = review.replace(validation_call, validation_new, 1)
          review_path.write_text(review, encoding='utf-8')

          workflow_path = Path('.github/workflows/star-market-investor-refresh.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          for old, new in (
              ('      - tools/crawl_star_market_investors.py\n', '      - tools/crawl_star_market_investors.py\n      - tools/star_market_prospectus_parser.py\n'),
              ('      - tests/test_star_market_investors.py\n', '      - tests/test_star_market_investors.py\n      - tests/test_star_market_prospectus_parser.py\n      - tests/test_star_market_strict_review.py\n'),
              ('            tools/crawl_star_market_investors.py \\\n', '            tools/crawl_star_market_investors.py \\\n            tools/star_market_prospectus_parser.py \\\n'),
              ('            tests.test_star_market_investors \\\n', '            tests.test_star_market_investors \\\n            tests.test_star_market_prospectus_parser \\\n            tests.test_star_market_strict_review \\\n'),
          ):
              if new not in workflow:
                  workflow = workflow.replace(old, new, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Add strict review compatibility tests
        run: |
          cat > tests/test_star_market_strict_review.py <<'PY'
          import unittest

          from tools.review_star_market_investors import review_snapshot
          from tools.star_investor_quality import extract_same_line_holding


          class StrictTableHoldingCompatibilityTests(unittest.TestCase):
              def test_primary_table_row_without_percent_symbols_is_bound(self):
                  shares, pct, reasons = extract_same_line_holding(
                      "5 国投基金 14,124,730 3.92 14,124,730 3.53",
                      "国投基金",
                  )
                  self.assertEqual(shares, 14124730)
                  self.assertEqual(pct, 3.92)
                  self.assertEqual(reasons, [])

              def test_resolved_legal_name_uses_disclosed_alias_for_row_evidence(self):
                  snapshot = {
                      "companies": {
                          "cambricon": {
                              "name": "中科寒武纪科技股份有限公司",
                              "investors": [
                                  {
                                      "id": "star-investor-sample",
                                      "name": "国投（上海）科技成果转化创业投资基金企业（有限合伙）",
                                      "disclosedName": "国投基金",
                                      "normalizedName": "国投上海科技成果转化创业投资基金企业有限合伙",
                                      "institutional": True,
                                      "investorType": "股权投资机构",
                                      "sourcePage": 93,
                                      "sourceSection": "公司本次发行前后股本情况",
                                      "evidence": "5 国投基金 14,124,730 3.92 14,124,730 3.53",
                                      "nameResolution": "definitions",
                                      "preIpoShares": 14124730,
                                      "preIpoOwnershipPct": 3.92,
                                  }
                              ],
                          }
                      }
                  }
                  reviewed = review_snapshot(snapshot, {})
                  investor = reviewed["companies"]["cambricon"]["investors"][0]
                  self.assertEqual(investor["reviewStatus"], "needs_review")
                  self.assertEqual(investor["preIpoShares"], 14124730)
                  self.assertEqual(investor["preIpoOwnershipPct"], 3.92)

              def test_related_party_sentence_is_not_fabricated_as_holding_row(self):
                  shares, pct, reasons = extract_same_line_holding(
                      "湖北长江招银产业基金管理有限公司 董事长 关联方",
                      "湖北长江招银产业基金管理有限公司",
                  )
                  self.assertIsNone(shares)
                  self.assertIsNone(pct)
                  self.assertEqual(reasons, [])


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Install dependencies and validate before live refresh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-star-investors.txt
          npm ci
          python -m py_compile \
            tools/crawl_star_market_investors.py \
            tools/star_market_prospectus_parser.py \
            tools/star_investor_quality.py \
            tools/review_star_market_investors.py
          python -m unittest \
            tests.test_star_market_investors \
            tests.test_star_market_prospectus_parser \
            tests.test_review_star_market_investors \
            tests.test_star_market_strict_review

      - name: Refresh Cambricon from official prospectus
        run: |
          python tools/crawl_star_market_investors.py \
            --listing cambricon \
            --require-companies
          python tools/review_star_market_investors.py
          python tools/crawl_star_market_investors.py --check --require-companies
          python tools/review_star_market_investors.py --check
          node --import tsx scripts/build-institution-data-layers.ts

      - name: Verify public result and full site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('public/data/star_market_investors.json').read_text())
          company = snapshot['companies']['cambricon']
          investors = company['investors']
          assert len(investors) == 31, len(investors)
          assert snapshot['reviewCandidateCount'] == 31
          assert snapshot['rejectedInvestorCount'] == 0
          assert all(item['reviewStatus'] == 'needs_review' for item in investors)
          assert all(item.get('preIpoShares', 0) > 0 for item in investors)
          assert all(0 < item.get('preIpoOwnershipPct', 0) <= 100 for item in investors)
          assert all(item.get('nameResolution') in {'definitions', 'basic-information'} for item in investors)
          assert not any(item.get('publicContact') for item in investors)
          assert '<' not in company['prospectus']['title']
          equity = json.loads(Path('public/data/institution_equity_relationships.json').read_text())
          assert equity['verifiedRelationshipCount'] == 0
          assert equity['needsReviewCount'] == 31
          assert equity['rejectedCount'] == 0
          PY
          npm run lint
          npm run test:unit
          npm run test:crawler
          npx tsc --noEmit
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit strict parser snapshot and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/star_market_prospectus_parser.py \
            tools/crawl_star_market_investors.py \
            tools/star_investor_quality.py \
            tools/review_star_market_investors.py \
            tests/test_star_market_prospectus_parser.py \
            tests/test_star_market_strict_review.py \
            .github/workflows/star-market-investor-refresh.yml \
            public/data/star_market_investors.json \
            public/data/institution_entities.json \
            public/data/institution_events.json \
            public/data/institution_equity_relationships.json
          git rm -f .github/workflows/port-star-strict-parser-once.yml
          git commit -m "fix: extract STAR shareholders only from strict table rows"
          git pull --rebase origin fix/star-market-strict-table-manual-review
          git push origin HEAD:fix/star-market-strict-table-manual-review
