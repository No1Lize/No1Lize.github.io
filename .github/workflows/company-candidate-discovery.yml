name: Discover candidate companies

on:
  schedule:
    - cron: "45 7 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_company_candidates.py
      - tools/build_resolved_company_candidates.py
      - tools/entity_resolution.py
      - tools/reconcile_entity_resolution.py
      - tools/resolved_company_captures.py
      - tools/resolve_company_entities.py
      - config/company_candidate_decisions.json
      - config/entity_resolution_decisions.json
      - config/official_company_sources.json
      - config/tracking_capture_inbox.json
      - config/user_tracking.json
      - tests/test_company_candidates.py
      - tests/test_entity_resolution.py
      - tests/test_entity_resolution_workflow.py
      - tests/test_resolved_company_candidates.py
      - .github/workflows/company-candidate-discovery.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: vciq-repository-writer-${{ github.ref }}
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate entity resolution and candidate discovery
        run: |
          python -m py_compile \
            tools/build_company_candidates.py \
            tools/build_resolved_company_candidates.py \
            tools/entity_resolution.py \
            tools/reconcile_entity_resolution.py \
            tools/resolved_company_captures.py
          python -m unittest \
            tests.test_company_candidates \
            tests.test_entity_resolution \
            tests.test_entity_resolution_workflow \
            tests.test_resolved_company_candidates
      - name: Detect pushed tracking inputs
        id: push-inputs
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tracking_inputs_changed=false
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            config/user_tracking.json \
            config/tracking_capture_inbox.json \
            config/official_company_sources.json \
            | grep -q .; then
            tracking_inputs_changed=true
          fi
          echo "changed=$tracking_inputs_changed" >> "$GITHUB_OUTPUT"
      - name: Reconcile entity types and build private candidate review snapshot
        run: |
          python tools/reconcile_entity_resolution.py
          python tools/build_resolved_company_candidates.py \
            --output config/company_candidate_review_queue.json
          python tools/reconcile_entity_resolution.py --check
          python tools/build_resolved_company_candidates.py \
            --output config/company_candidate_review_queue.json \
            --check
      - name: Commit resolved tracking and private candidate evidence
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=(
            config/user_tracking.json
            config/tracking_capture_inbox.json
            config/company_candidate_review_queue.json
          )
          if git diff --quiet -- "${changed_paths[@]}"; then
            echo "No semantic entity-resolution or candidate changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tracking_changed=false" >> "$GITHUB_OUTPUT"
            echo "candidate_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${changed_paths[@]}"
          git commit -m "data: reconcile captured entities and private company candidates"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/reconcile_entity_resolution.py
            python tools/build_resolved_company_candidates.py \
              --output config/company_candidate_review_queue.json
            python tools/reconcile_entity_resolution.py --check
            python tools/build_resolved_company_candidates.py \
              --output config/company_candidate_review_queue.json \
              --check
            git add "${changed_paths[@]}"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              tracking_changed=false
              candidate_changed=false
              if git diff-tree --no-commit-id --name-only -r HEAD -- config/user_tracking.json \
                | grep -qx 'config/user_tracking.json'; then
                tracking_changed=true
              fi
              if git diff-tree --no-commit-id --name-only -r HEAD -- config/company_candidate_review_queue.json \
                | grep -qx 'config/company_candidate_review_queue.json'; then
                candidate_changed=true
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "tracking_changed=$tracking_changed" >> "$GITHUB_OUTPUT"
              echo "candidate_changed=$candidate_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Continue review, refresh or deploy after reconciliation
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_CHANGED: ${{ steps.publish.outputs.tracking_changed }}
          CANDIDATE_CHANGED: ${{ steps.publish.outputs.candidate_changed }}
          PUSH_TRACKING_INPUTS_CHANGED: ${{ steps.push-inputs.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CANDIDATE_CHANGED:-false}" = "true" ]; then
            echo "Private candidate review queue changed; continue reviewed onboarding reconciliation."
            gh workflow run company-candidate-onboarding.yml --ref main
          fi
          if [ "${TRACKING_CHANGED:-false}" = "true" ] || [ "${PUSH_TRACKING_INPUTS_CHANGED:-false}" = "true" ]; then
            echo "Tracking inputs changed; rebuild the article snapshot before Pages."
            gh workflow run scheduled-sync.yml --ref main
          else
            echo "Tracking scope is fixed after reconciliation; deploy the committed public snapshot."
            gh workflow run pages.yml --ref main
          fi
