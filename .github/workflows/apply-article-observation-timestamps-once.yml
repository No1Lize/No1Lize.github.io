name: Apply article observation timestamps once

on:
  push:
    branches: [feat/article-observation-timestamps]
    paths:
      - .github/workflows/apply-article-observation-timestamps-once.yml

permissions:
  contents: write

concurrency:
  group: apply-article-observation-timestamps-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/article-observation-timestamps
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch crawler and channel presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: patch target not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: applied')

          crawler = Path('tools/crawl_articles.py')
          replace_once(
              crawler,
              'from typing import Any, Iterable, Sequence\n',
              '''from typing import Any, Iterable, Sequence\n\ntry:\n    from .article_observation import (\n        apply_incoming_observations,\n        prepare_existing_articles,\n        validate_observation_metadata,\n    )\nexcept ImportError:\n    from article_observation import (\n        apply_incoming_observations,\n        prepare_existing_articles,\n        validate_observation_metadata,\n    )\n''',
              'crawler observation imports',
          )
          replace_once(
              crawler,
              '''    if not (0 <= int(article.get("importance", -1)) <= 100):\n        errors.append("invalid:importance")\n    return errors\n''',
              '''    if not (0 <= int(article.get("importance", -1)) <= 100):\n        errors.append("invalid:importance")\n    errors.extend(validate_observation_metadata(article))\n    return errors\n''',
              'crawler observation validation',
          )
          replace_once(
              crawler,
              '''    config = load_config()\n    payload = load_existing_payload()\n    if args.validate_only:\n''',
              '''    config = load_config()\n    payload = load_existing_payload()\n    observation_at = datetime.now(UTC).replace(microsecond=0).isoformat()\n    existing_articles = prepare_existing_articles(\n        payload.get("articles", []), payload.get("generatedAt")\n    )\n    if args.validate_only:\n''',
              'crawler observation anchor',
          )
          replace_once(
              crawler,
              '''    if args.offline:\n        merged = merge_articles([], payload.get("articles", []))\n    else:\n        merged = replace_source_batches(\n            payload.get("articles", []), incoming, new_statuses\n        )\n''',
              '''    if args.offline:\n        merged = merge_articles([], existing_articles)\n    else:\n        incoming = apply_incoming_observations(\n            existing_articles, incoming, observation_at\n        )\n        merged = replace_source_batches(\n            existing_articles, incoming, new_statuses\n        )\n''',
              'crawler observation merge',
          )

          updates = Path('lib/channel-updates.ts')
          replace_once(
              updates,
              '''  sortAt: string;\n  keywords: string[];\n};\n''',
              '''  sortAt: string;\n  keywords: string[];\n  firstSeenAt?: string;\n  firstSeenEstimated?: boolean;\n  lastVerifiedAt?: string;\n  lastVerifiedEstimated?: boolean;\n};\n''',
              'channel item observation fields',
          )
          replace_once(
              updates,
              '''  publishedAt: string;\n  importance?: number;\n  source: {\n''',
              '''  publishedAt: string;\n  importance?: number;\n  firstSeenAt?: string;\n  firstSeenEstimated?: boolean;\n  lastVerifiedAt?: string;\n  lastVerifiedEstimated?: boolean;\n  source: {\n''',
              'article observation fields',
          )
          replace_once(
              updates,
              '''    sortAt: normalizedDate.sortAt,\n    keywords: uniqueKeywords([article.type, ...additionalKeywords]),\n  };\n''',
              '''    sortAt: normalizedDate.sortAt,\n    keywords: uniqueKeywords([article.type, ...additionalKeywords]),\n    firstSeenAt: article.firstSeenAt,\n    firstSeenEstimated: article.firstSeenEstimated,\n    lastVerifiedAt: article.lastVerifiedAt,\n    lastVerifiedEstimated: article.lastVerifiedEstimated,\n  };\n''',
              'channel observation mapping',
          )

          client = Path('components/channel-update-directory-client.tsx')
          replace_once(
              client,
              '''  collectChannelUpdateKeywords,\n  countChannelUpdatesForSnapshotDay,\n  filterAndSortChannelUpdates,\n''',
              '''  collectChannelUpdateKeywords,\n  countChannelUpdatesFirstSeenForSnapshotDay,\n  countChannelUpdatesForSnapshotDay,\n  filterAndSortChannelUpdates,\n''',
              'client observation import',
          )
          replace_once(
              client,
              '''  const snapshotDayItemCount = useMemo(\n    () => countChannelUpdatesForSnapshotDay(allItems, directory.generatedAt),\n    [allItems, directory.generatedAt],\n  );\n  const latestDatedItemId = useMemo(() => {\n''',
              '''  const firstSeenItemCount = useMemo(\n    () => countChannelUpdatesFirstSeenForSnapshotDay(allItems, directory.generatedAt),\n    [allItems, directory.generatedAt],\n  );\n  const snapshotDayItemCount = useMemo(\n    () => countChannelUpdatesForSnapshotDay(allItems, directory.generatedAt),\n    [allItems, directory.generatedAt],\n  );\n  const latestDatedItemId = useMemo(() => {\n''',
              'client first-seen count',
          )
          replace_once(
              client,
              '''          <small title="按来源事件日期与当前数据快照日期相同计算">\n            快照日事件 {snapshotDayItemCount} 条\n          </small>\n''',
              '''          <small title="首次收录按精确 firstSeenAt 计算；快照日事件按来源事件日期计算">\n            今日首次收录 {firstSeenItemCount} · 快照日事件 {snapshotDayItemCount}\n          </small>\n''',
              'client snapshot labels',
          )
          PY

      - name: Verify observation semantics and site build
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/article-observation
          : > /tmp/article-observation/status.env
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/article-observation/${name}.log" 2>&1
            code=$?
            echo "${name}=${code}" >> /tmp/article-observation/status.env
          }
          run_check install timeout 8m npm ci
          run_check lint timeout 8m npm run lint
          run_check ts_tests timeout 8m node --import tsx --test tests/channel-update-observation.test.ts
          run_check py_tests timeout 8m python -m unittest tests.test_article_observation
          run_check crawler_compile timeout 3m python -m py_compile tools/crawl_articles.py tools/article_observation.py
          run_check typescript timeout 8m npx tsc --noEmit
          run_check build timeout 20m env ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          python - <<'PY'
          from pathlib import Path
          status = {}
          for line in Path('/tmp/article-observation/status.env').read_text().splitlines():
              key, value = line.split('=', 1)
              status[key] = int(value)
          raise SystemExit(0 if status and all(value == 0 for value in status.values()) else 1)
          PY

      - name: Commit patch, diagnostics and remove one-time workflow
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = {}
          status_path = Path('/tmp/article-observation/status.env')
          if status_path.exists():
              for line in status_path.read_text().splitlines():
                  key, value = line.split('=', 1)
                  status[key] = int(value)
          logs = {}
          for path in Path('/tmp/article-observation').glob('*.log'):
              logs[path.stem] = path.read_text(errors='replace')[-12000:]
          result = {
              'sourceCommit': os.environ.get('GITHUB_SHA', ''),
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'outcome': '${{ steps.verify.outcome }}',
              'status': status,
              'logs': logs,
          }
          path = Path('diagnostics/article-observation-verification.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/crawl_articles.py \
            tools/article_observation.py \
            lib/channel-updates.ts \
            lib/channel-update-filter.ts \
            components/channel-update-directory-client.tsx \
            tests/test_article_observation.py \
            tests/channel-update-observation.test.ts \
            diagnostics/article-observation-verification.json
          git rm -f .github/workflows/apply-article-observation-timestamps-once.yml
          git commit -m "feat: distinguish article ingestion from event dates"
          git pull --rebase origin feat/article-observation-timestamps
          git push origin HEAD:feat/article-observation-timestamps

      - name: Fail when verification failed
        if: always()
        run: test '${{ steps.verify.outcome }}' = 'success'
