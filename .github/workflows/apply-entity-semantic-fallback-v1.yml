name: Apply entity semantic fallback v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-entity-semantic-fallback-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-entity-semantic-fallback-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/venture-layered-evidence-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch, test and rewrite layered snapshot
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          (
            set -euo pipefail
            python tools/patch_entity_semantic_research_fallback.py
            python -m py_compile tools/enforce_venture_entity_semantics.py
            python -m unittest -v \
              tests.test_venture_entity_semantics \
              tests.test_finalize_venture_profiles \
              tests.test_venture_profile_enrichment \
              tests.test_refine_venture_research_evidence
            python tools/enforce_venture_entity_semantics.py
            python tools/enforce_venture_entity_semantics.py --check
            python tools/finalize_venture_profiles.py --check
            python tools/refine_venture_research_evidence.py --check
            python tools/enrich_venture_profiles.py --validate-only
            git diff --check
          ) > diagnostics/entity-semantic-fallback-v1.txt 2>&1
          STATUS=$?
          cat diagnostics/entity-semantic-fallback-v1.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS" -eq 0 ]; then
            rm -f diagnostics/entity-semantic-fallback-v1.txt
            git add -A
            git commit -m "data: finalize canonical and research venture layers"
          else
            git add -A
            git commit -m "ci: record entity semantic fallback failure"
          fi
          git push origin HEAD:feature/venture-layered-evidence-v4
          exit "$STATUS"
      - name: Remove one-time dispatcher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-entity-semantic-v1 origin/main
          git rm .github/workflows/apply-entity-semantic-fallback-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove entity semantic fallback dispatcher"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
