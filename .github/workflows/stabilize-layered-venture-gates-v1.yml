name: Stabilize layered venture gates v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stabilize-layered-venture-gates-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stabilize-layered-venture-gates-v1
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/venture-layered-evidence-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch workflow, stabilize snapshot and validate
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          (
            set -euo pipefail
            python - <<'PY'
            from pathlib import Path

            path = Path(".github/workflows/refresh-venture-profiles.yml")
            text = path.read_text(encoding="utf-8")
            text = text.replace(
                "      - tools/enforce_venture_entity_semantics.py\n",
                "      - tools/enforce_venture_entity_semantics.py\n      - tools/stabilize_venture_profiles.py\n",
                1,
            )
            text = text.replace(
                "      - tests/test_venture_entity_semantics.py\n",
                "      - tests/test_venture_entity_semantics.py\n      - tests/test_stabilize_venture_profiles.py\n",
                1,
            )
            text = text.replace(
                "            tools/enforce_venture_entity_semantics.py\n",
                "            tools/enforce_venture_entity_semantics.py \\\n            tools/stabilize_venture_profiles.py\n",
                1,
            )
            text = text.replace(
                "            tests.test_venture_entity_semantics\n",
                "            tests.test_venture_entity_semantics \\\n            tests.test_stabilize_venture_profiles\n",
                1,
            )
            old_gates = '''      - name: Apply structural venture quality gate
        run: |
          python tools/finalize_venture_profiles.py
          python tools/finalize_venture_profiles.py --check
      - name: Apply entity-semantic quality gate
        run: |
          python tools/enforce_venture_entity_semantics.py
          python tools/enforce_venture_entity_semantics.py --check
'''
            new_gates = '''      - name: Apply shared terminal venture quality gate
        run: |
          python tools/stabilize_venture_profiles.py
          python tools/stabilize_venture_profiles.py --check
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
'''
            if old_gates not in text and new_gates not in text:
                raise RuntimeError("terminal gate workflow block not found")
            text = text.replace(old_gates, new_gates, 1)
            text = text.replace(
                "          python tools/finalize_venture_profiles.py --check\n          python tools/enforce_venture_entity_semantics.py --check\n",
                "          python tools/stabilize_venture_profiles.py --check\n          python tools/finalize_venture_profiles.py --check\n          python tools/enforce_venture_entity_semantics.py --check\n",
                1,
            )
            second_test = "            tests.test_venture_entity_semantics\n"
            replacement = "            tests.test_venture_entity_semantics \\\n            tests.test_stabilize_venture_profiles\n"
            if text.count("tests.test_stabilize_venture_profiles") < 2:
                index = text.rfind(second_test)
                if index < 0:
                    raise RuntimeError("validation test list marker not found")
                text = text[:index] + replacement + text[index + len(second_test):]
            path.write_text(text, encoding="utf-8")
            PY

            python -m py_compile \
              tools/finalize_venture_profiles.py \
              tools/enforce_venture_entity_semantics.py \
              tools/stabilize_venture_profiles.py
            python -m unittest -v \
              tests.test_finalize_venture_profiles \
              tests.test_venture_entity_semantics \
              tests.test_stabilize_venture_profiles
            python tools/stabilize_venture_profiles.py
            python tools/stabilize_venture_profiles.py --check
            python tools/finalize_venture_profiles.py --check
            python tools/enforce_venture_entity_semantics.py --check
            python tools/refine_venture_research_evidence.py --check
            python tools/enrich_venture_profiles.py --validate-only
            python -m unittest \
              tests.test_venture_profile_extraction \
              tests.test_venture_profile_noise_filters \
              tests.test_venture_profile_enrichment \
              tests.test_refine_venture_research_evidence \
              tests.test_normalize_venture_profiles \
              tests.test_venture_profile_postprocess \
              tests.test_venture_narrative_sanitizer \
              tests.test_finalize_venture_profiles \
              tests.test_venture_entity_semantics \
              tests.test_stabilize_venture_profiles
            git diff --check
          ) > diagnostics/stabilize-layered-venture-gates-v1.txt 2>&1
          STATUS=$?
          cat diagnostics/stabilize-layered-venture-gates-v1.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS" -eq 0 ]; then
            rm -rf diagnostics
            git add -A
            git commit -m "data: stabilize layered venture publication gates"
          else
            git add -A
            git commit -m "ci: record layered venture stabilizer failure"
          fi
          git push origin HEAD:feature/venture-layered-evidence-v4
          exit "$STATUS"
      - name: Remove one-time dispatcher
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-layered-stabilizer-v1 origin/main
          git rm .github/workflows/stabilize-layered-venture-gates-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove layered venture stabilizer dispatcher"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
