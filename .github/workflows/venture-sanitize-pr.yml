name: Venture sanitation PR runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .venture-sanitize-trigger

permissions:
  contents: write

concurrency:
  group: venture-sanitize-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile venture pipeline
        run: |
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/normalize_venture_profiles.py \
            tools/sanitize_venture_profiles.py \
            tools/sanitize_venture_narratives.py
      - name: Run venture unit tests
        run: |
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer
      - name: Enrich current snapshot
        run: python tools/enrich_venture_profiles.py
      - name: Normalize cross-entity consistency
        run: python tools/normalize_venture_profiles.py
      - name: Sanitize structured fields
        run: python tools/sanitize_venture_profiles.py
      - name: Sanitize narrative fields
        run: python tools/sanitize_venture_narratives.py
      - name: Check normalizer idempotence
        run: python tools/normalize_venture_profiles.py --check
      - name: Check structured sanitizer idempotence
        run: python tools/sanitize_venture_profiles.py --check
      - name: Check narrative sanitizer idempotence
        run: python tools/sanitize_venture_narratives.py --check
      - name: Validate crawler quality gate
        run: python tools/crawl_venture_profiles.py --validate-only
      - name: Validate enrichment quality gate
        run: python tools/enrich_venture_profiles.py --validate-only
      - name: Check generated diff
        run: git diff --check
      - name: Commit sanitized data to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .venture-sanitize-trigger
          git add public/data/venture_profiles.json
          git commit -m "data: normalize startup and institution profiles"
          git push origin "HEAD:${HEAD_REF}"
