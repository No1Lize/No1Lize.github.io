name: Venture sanitation PR runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .venture-sanitize-trigger

permissions:
  contents: write

concurrency:
  group: venture-sanitize-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pending venture source patches
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            if [ -f tools/patch_venture_quality_compat.py ]; then
              python tools/patch_venture_quality_compat.py
            fi
            if [ -f tools/patch_venture_enrichment_idempotence.py ]; then
              python tools/patch_venture_enrichment_idempotence.py
            fi
            if [ -f tools/patch_venture_structured_products.py ]; then
              python tools/patch_venture_structured_products.py
            fi
            if [ -f tools/patch_venture_finalizer_products.py ]; then
              python tools/patch_venture_finalizer_products.py
            fi
          } > diagnostics/venture-pr-patch.txt 2>&1
          status=$?
          cat diagnostics/venture-pr-patch.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/venture-pr-patch.txt
            git commit -m "ci: record venture migration failure"
            git push origin "HEAD:${HEAD_REF}"
          fi
          exit "$status"
      - name: Compile venture pipeline
        run: |
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/normalize_venture_profiles.py \
            tools/sanitize_venture_profiles.py \
            tools/sanitize_venture_narratives.py \
            tools/finalize_venture_profiles.py
      - name: Run venture unit tests
        run: |
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles
      - name: Enrich current snapshot
        run: python tools/enrich_venture_profiles.py
      - name: Normalize cross-entity consistency
        run: python tools/normalize_venture_profiles.py
      - name: Apply final venture quality gate
        run: python tools/finalize_venture_profiles.py
      - name: Check finalizer idempotence
        run: python tools/finalize_venture_profiles.py --check
      - name: Validate crawler quality gate
        run: python tools/crawl_venture_profiles.py --validate-only
      - name: Validate enrichment quality gate
        run: python tools/enrich_venture_profiles.py --validate-only
      - name: Check generated diff
        run: git diff --check
      - name: Commit validated data to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .venture-sanitize-trigger
          rm -f diagnostics/venture-pr-patch.txt
          rm -f diagnostics/venture-pr-compile.txt
          rm -f diagnostics/venture-pr-enrichment-test.txt
          rm -f diagnostics/venture-pr-normalizer-test.txt
          rm -f diagnostics/venture-pr-structured-test.txt
          rm -f diagnostics/venture-pr-narrative-test.txt
          rm -f diagnostics/venture-pr-normalizer-check.txt
          rm -f tools/patch_venture_quality_compat.py
          rm -f tools/patch_venture_enrichment_idempotence.py
          rm -f tools/patch_venture_structured_products.py
          rm -f tools/patch_venture_finalizer_products.py
          rm -f tools/patch_venture_narrative_prose.py
          git add -A
          git commit -m "data: normalize startup and institution profiles"
          git push origin "HEAD:${HEAD_REF}"
