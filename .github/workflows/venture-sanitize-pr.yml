name: Venture sanitation PR runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .venture-sanitize-trigger

permissions:
  contents: write

concurrency:
  group: venture-sanitize-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pending evidence migration
        run: |
          if [ -f tools/patch_refine_venture_evidence_regressions.py ]; then
            python tools/patch_refine_venture_evidence_regressions.py
          fi
      - name: Compile production venture pipeline
        run: |
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py \
            tools/enrich_venture_profiles.py \
            tools/refine_venture_research_evidence.py \
            tools/normalize_venture_profiles.py \
            tools/sanitize_venture_profiles.py \
            tools/sanitize_venture_narratives.py \
            tools/finalize_venture_profiles.py \
            tools/enforce_venture_entity_semantics.py
      - name: Run complete venture regressions
        run: |
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters \
            tests.test_venture_profile_enrichment \
            tests.test_refine_venture_research_evidence \
            tests.test_normalize_venture_profiles \
            tests.test_venture_profile_postprocess \
            tests.test_venture_narrative_sanitizer \
            tests.test_finalize_venture_profiles \
            tests.test_venture_entity_semantics
      - name: Enrich current production snapshot
        run: python tools/enrich_venture_profiles.py
      - name: Align research fields to entity evidence
        run: |
          python tools/refine_venture_research_evidence.py
          python tools/refine_venture_research_evidence.py --check
      - name: Normalize cross-entity consistency
        run: python tools/normalize_venture_profiles.py
      - name: Apply structural quality gate
        run: |
          python tools/finalize_venture_profiles.py
          python tools/finalize_venture_profiles.py --check
      - name: Apply entity-semantic quality gate
        run: |
          python tools/enforce_venture_entity_semantics.py
          python tools/enforce_venture_entity_semantics.py --check
      - name: Validate all publication gates
        run: |
          python tools/crawl_venture_profiles.py --validate-only
          python tools/enrich_venture_profiles.py --validate-only
          python tools/finalize_venture_profiles.py --check
          python tools/enforce_venture_entity_semantics.py --check
          git diff --check
      - name: Commit validated production snapshot
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .venture-sanitize-trigger
          rm -rf diagnostics
          rm -f tools/patch_venture_quality_compat.py
          rm -f tools/patch_venture_enrichment_idempotence.py
          rm -f tools/patch_venture_structured_products.py
          rm -f tools/patch_venture_finalizer_products.py
          rm -f tools/patch_venture_narrative_prose.py
          rm -f tools/migrate_venture_entity_attribution_v1.py
          rm -f tools/patch_refine_venture_evidence_regressions.py
          rm -f .github/workflows/patch-refine-venture-evidence.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No venture snapshot changes were required."
            exit 0
          fi
          git commit -m "data: enforce entity-semantic venture profiles"
          git push origin "HEAD:${HEAD_REF}"
