name: Deploy professional venture UI once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-professional-venture-ui-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: professional-venture-ui-deploy-once
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build GitHub Pages
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/professional-venture-data.test.ts
          npm run build:pages
      - name: Verify rendered professional venture UI
        run: |
          page='out/companies/deepseek/index.html'
          test -f "$page"
          grep -Fq '股权、股东与工商变更核验' "$page"
          grep -Fq '专业来源执行状态' "$page"
          grep -Fq '企查查' "$page"
          grep -Fq '天眼查' "$page"
          grep -Fq '鲸准' "$page"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          source = Path('diagnostics/professional-venture-source-refresh.json')
          refresh = json.loads(source.read_text(encoding='utf-8')) if source.exists() else {}
          report = {
              'generatedAt': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'typecheck': 'success',
              'frontendBoundaryTest': 'success',
              'build': 'success',
              'renderedAssertions': [
                  '股权、股东与工商变更核验',
                  '专业来源执行状态',
                  '企查查',
                  '天眼查',
                  '鲸准',
              ],
              'deployOutcome': 'success',
              'deployed': True,
              'pageUrl': os.environ.get('DEPLOYED_URL') or 'https://no1lize.github.io/',
              'professionalRefresh': refresh,
          }
          Path('diagnostics/professional-venture-ui-deployment.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          publish_file() {
            local path="$1"
            local message="$2"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${path}"
            local sha
            sha="$(gh api "${endpoint}?ref=main" --jq '.sha' 2>/dev/null || true)"
            local request
            request="$(mktemp)"
            python - "$path" "$message" "$sha" "$request" <<'PY'
          import base64
          import json
          import sys

          path, message, sha, request_path = sys.argv[1:]
          payload = {
              'message': message,
              'content': base64.b64encode(open(path, 'rb').read()).decode(),
              'branch': 'main',
          }
          if sha:
              payload['sha'] = sha
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          PY
            gh api --method PUT "$endpoint" --input "$request" >/dev/null
            rm -f "$request"
          }

          publish_file \
            diagnostics/professional-venture-ui-deployment.json \
            'diagnostics: confirm professional venture UI deployment'

          workflow_path='.github/workflows/deploy-professional-venture-ui-once.yml'
          endpoint="repos/${GITHUB_REPOSITORY}/contents/${workflow_path}"
          sha="$(gh api "${endpoint}?ref=main" --jq '.sha')"
          request="$(mktemp)"
          python - "$sha" "$request" <<'PY'
          import json
          import sys

          sha, request_path = sys.argv[1:]
          with open(request_path, 'w', encoding='utf-8') as handle:
              json.dump({
                  'message': 'chore: remove one-time professional venture deployment',
                  'sha': sha,
                  'branch': 'main',
              }, handle)
          PY
          gh api --method DELETE "$endpoint" --input "$request" >/dev/null
          rm -f "$request"
