name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "public/research-reports/**"
      - "diagnostics/**"
      - ".github/diagnostics/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:crawler
      - run: npm run build:pages
