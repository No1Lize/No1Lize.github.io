name: One-time install WeChat snapshot quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-wechat-snapshot-quality.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply quality integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          refresh = Path('tools/refresh_wechat_snapshot.py')
          text = refresh.read_text(encoding='utf-8')
          text = text.replace(
              '''    from . import wechat_sogou_bridge\nexcept ImportError:''',
              '''    from . import wechat_sogou_bridge\n    from . import wechat_snapshot_quality\nexcept ImportError:''',
              1,
          )
          text = text.replace(
              '''    import wechat_sogou_bridge\n\nROOT =''',
              '''    import wechat_sogou_bridge\n    import wechat_snapshot_quality\n\nROOT =''',
              1,
          )
          old = '''    return incoming, statuses\n\n\ndef merge_wechat_snapshot'''
          new = '''    incoming = wechat_snapshot_quality.resolve_cross_sector_articles(\n        incoming,\n        tracking.load_tracking(),\n    )\n    return incoming, statuses\n\n\ndef merge_wechat_snapshot'''
          if old not in text:
              raise SystemExit('refresh return anchor not found')
          refresh.write_text(text.replace(old, new, 1), encoding='utf-8')

          entry = Path('tools/crawl_with_wechat_registry.py')
          text = entry.read_text(encoding='utf-8')
          text = text.replace(
              '''    from . import wechat_sogou_bridge\nexcept ImportError:''',
              '''    from . import wechat_sogou_bridge\n    from . import wechat_snapshot_quality\nexcept ImportError:''',
              1,
          )
          text = text.replace(
              '''    import wechat_sogou_bridge\n\n\ndef main()''',
              '''    import wechat_sogou_bridge\n    import wechat_snapshot_quality\n\n\ndef _install_snapshot_quality() -> None:\n    original = base.tracking.crawler.replace_source_batches\n    if getattr(original, "_wechat_snapshot_quality", False):\n        return\n\n    def replace_source_batches(existing, incoming, statuses):\n        wechat_rows = [\n            article\n            for article in incoming\n            if article.get("source", {}).get("platform") == "微信"\n        ]\n        other_rows = [\n            article\n            for article in incoming\n            if article.get("source", {}).get("platform") != "微信"\n        ]\n        resolved = wechat_snapshot_quality.resolve_cross_sector_articles(\n            wechat_rows,\n            base.tracking.load_tracking(),\n        )\n        return original(existing, [*other_rows, *resolved], statuses)\n\n    setattr(replace_source_batches, "_wechat_snapshot_quality", True)\n    base.tracking.crawler.replace_source_batches = replace_source_batches\n\n\ndef main()''',
              1,
          )
          old = '''    wechat_sogou_bridge.install(wechat_public_sources)\n    return base.main()'''
          new = '''    wechat_sogou_bridge.install(wechat_public_sources)\n    _install_snapshot_quality()\n    return base.main()'''
          if old not in text:
              raise SystemExit('entrypoint main anchor not found')
          entry.write_text(text.replace(old, new, 1), encoding='utf-8')

          for workflow_name in ('.github/workflows/scheduled-sync.yml', '.github/workflows/wechat-sync.yml'):
              workflow = Path(workflow_name)
              text = workflow.read_text(encoding='utf-8')
              if '      - tools/wechat_snapshot_quality.py\n' not in text:
                  anchor = '      - tools/wechat_sogou_bridge.py\n'
                  if anchor not in text:
                      raise SystemExit(f'workflow anchor missing: {workflow_name}')
                  text = text.replace(anchor, anchor + '      - tools/wechat_snapshot_quality.py\n', 1)
              workflow.write_text(text, encoding='utf-8')
          PY
      - name: Verify quality controls
        run: |
          python -m py_compile tools/wechat_snapshot_quality.py tools/refresh_wechat_snapshot.py tools/crawl_with_wechat_registry.py
          python -m unittest tests.test_wechat_snapshot_quality tests.test_wechat_public_sources tests.test_wechat_sogou_index tests.test_refresh_wechat_snapshot
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_snapshot_quality.py tools/refresh_wechat_snapshot.py \
            tools/crawl_with_wechat_registry.py tests/test_wechat_snapshot_quality.py \
            .github/workflows/scheduled-sync.yml .github/workflows/wechat-sync.yml
          git commit -m "fix: deduplicate WeChat sectors and clean person entities"
          git pull --rebase origin main
          git push origin HEAD:main
