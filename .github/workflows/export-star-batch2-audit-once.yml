name: Export STAR batch 2 audit once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/export-star-batch2-audit-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'feat/star-market-coverage-batch-2-20260804' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/star-market-coverage-batch-2-20260804
          fetch-depth: 0
      - name: Export compact review table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('public/data/star_market_investors.json').read_text())
          header = [
              'company', 'ticker', 'id', 'name', 'disclosedName', 'sourcePage',
              'preIpoShares', 'preIpoOwnershipPct', 'nameResolution',
              'definitionSourcePage', 'evidence',
          ]
          rows = ['\t'.join(header)]
          for slug in ('montage-technology', 'amec'):
              company = snapshot['companies'][slug]
              for investor in company['investors']:
                  values = [
                      company['name'],
                      company['ticker'],
                      investor['id'],
                      investor['name'],
                      investor.get('disclosedName', investor['name']),
                      investor['sourcePage'],
                      investor['preIpoShares'],
                      investor['preIpoOwnershipPct'],
                      investor.get('nameResolution', ''),
                      investor.get('definitionSourcePage', ''),
                      investor['evidence'],
                  ]
                  rows.append('\t'.join(str(value).replace('\t', ' ').replace('\n', ' ') for value in values))
          output = Path('audit/star-market-batch2-candidates.tsv')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(json.dumps({'rows': len(rows) - 1, 'output': str(output)}, ensure_ascii=False))
          PY
      - name: Commit audit table and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/star-market-batch2-candidates.tsv
          git rm -f .github/workflows/export-star-batch2-audit-once.yml
          git commit -m "audit: export STAR batch 2 candidate review table"
          git pull --rebase origin feat/star-market-coverage-batch-2-20260804
          git push origin HEAD:feat/star-market-coverage-batch-2-20260804
