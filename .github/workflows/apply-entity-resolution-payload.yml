name: Apply entity resolution payload

on:
  push:
    branches: ["feat/entity-resolution-center"]
    paths:
      - .entity-resolution-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/entity-resolution-center
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .entity-resolution-payload.part00 \
              .entity-resolution-payload.part01 \
              .entity-resolution-payload.part02 \
              .entity-resolution-payload.part03 \
            | base64 --decode > /tmp/entity-resolution-payload.tar.gz
          echo "380e14a6168bf746994fce2021a614a4ccedc0fd6ba112bfe742e04e82e2c3f5  /tmp/entity-resolution-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/entity-resolution-payload.tar.gz
          rm -f \
            .entity-resolution-apply-trigger \
            .entity-resolution-payload.part00 \
            .entity-resolution-payload.part01 \
            .entity-resolution-payload.part02 \
            .entity-resolution-payload.part03
          python -m py_compile \
            tools/entity_resolution.py \
            tools/reconcile_entity_resolution.py \
            tools/resolved_company_captures.py \
            tools/build_resolved_company_candidates.py
          python -m unittest \
            tests.test_entity_resolution \
            tests.test_resolved_company_candidates \
            tests.test_entity_resolution_workflow
      - name: Commit implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add entity resolution and disambiguation center"
          git push origin HEAD:feat/entity-resolution-center
