name: Refresh STAR Market investors

on:
  push:
    branches: [main]
    paths:
      - tools/crawl_star_market_investors.py
      - tools/star_market_prospectus_parser.py
      - config/star_market_investor_sources.json
      - requirements-star-investors.txt
      - public/data/star_market_investors.json
      - lib/star-market-investor-data.ts
      - components/star-market-investor-directory.tsx
      - components/star-market-investor-directory.module.css
      - app/institutions/star-market/**
      - app/institutions/page.tsx
      - app/institutions/page.module.css
      - tests/test_star_market_investors.py
      - tests/test_star_market_investor_privacy_scope.py
      - tests/test_star_market_prospectus_parser.py
      - tests/star-market-investor-data.test.ts
      - .github/workflows/star-market-investor-refresh.yml
  schedule:
    # Sunday 20:37 UTC = Monday 04:37 Asia/Taipei.
    - cron: "37 20 * * 0"
  workflow_dispatch:
    inputs:
      listing:
        description: "Optional 688xxx ticker or catalog slug"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: star-market-investor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-star-investors.txt

      - name: Install pinned prospectus parser
        run: python -m pip install --disable-pip-version-check -r requirements-star-investors.txt

      - name: Validate crawler before network access
        run: |
          python -m py_compile \
            tools/crawl_star_market_investors.py \
            tools/star_market_prospectus_parser.py \
            tools/cninfo_structured_disclosures.py \
            tools/crawl_listed_company_disclosures.py
          python -m unittest \
            tests.test_star_market_investors \
            tests.test_star_market_investor_privacy_scope \
            tests.test_star_market_prospectus_parser

      - name: Refresh official prospectus investor directory
        env:
          LISTING_FILTER: ${{ inputs.listing || '' }}
        run: |
          args=(--require-companies)
          if [ -n "$LISTING_FILTER" ]; then
            args+=(--listing "$LISTING_FILTER")
          fi
          python tools/crawl_star_market_investors.py "${args[@]}"

      - name: Validate privacy and official-source constraints
        run: python tools/crawl_star_market_investors.py --check --require-companies

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run deterministic site gates
        run: |
          npm run lint
          npm run test:unit
          npm run test:crawler
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages

      - name: Commit changed prospectus directory
        id: data-update
        shell: bash
        run: |
          set -euo pipefail
          path=public/data/star_market_investors.json
          if git diff --quiet -- "$path"; then
            echo "No STAR Market investor data change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "data: refresh STAR Market prospectus investors"

          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            python tools/crawl_star_market_investors.py --check --require-companies
            npm run test:unit
            ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
            git add "$path"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages after changed data
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
