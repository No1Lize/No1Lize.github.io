name: Apply venture catalog retention filter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-venture-crawler-catalog-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter stale venture snapshot entities
        run: |
          python tools/apply_venture_catalog_filter_patch.py
          python -m py_compile tools/crawl_venture_profiles.py tools/venture_profile_extraction.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/crawl_venture_profiles.py
          git commit -m 'fix: discard stale venture profile catalog entries'
          git pull --rebase origin main
          git push origin HEAD:main
