name: Verify key events Pages deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/verify-key-events-pages-deploy.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-key-events-pages-20260803-1909'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://vciq.github.io/
    steps:
      - name: Verify production homepage content
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            cache_buster="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}?deploy_verify=${cache_buster}" \
              --output /tmp/homepage.html

            python - <<'PY'
          import html
          import re
          from pathlib import Path

          source = Path('/tmp/homepage.html').read_text(encoding='utf-8')
          text = html.unescape(re.sub(r'<[^>]+>', ' ', source))
          text = re.sub(r'\s+', ' ', text)
          markers = ('当前展示', '滚动总库', '今日新增')
          if all(marker in text for marker in markers) and '当前展示 200 条' in text:
              match = re.search(r'当前展示 200 条；滚动总库 \d+ 条；今日新增 \d+ 条', text)
              print(match.group(0) if match else '当前展示 200 条；滚动总库/今日新增标记已发布')
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            result=$?
            if [ "$result" -eq 0 ]; then
              echo "Production verification passed."
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for the 200-item homepage deployment."
            sleep 10
          done
          echo "Production homepage did not expose the expected 200-item statistics in time." >&2
          exit 1
