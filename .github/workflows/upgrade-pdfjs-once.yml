name: Upgrade PDF.js once

on:
  push:
    branches:
      - perf/search-shell-favorites-store

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/search-shell-favorites-store
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade locked PDF.js dependency
        run: npm install --save-exact --ignore-scripts pdfjs-dist@6.2.108
      - name: Sync vendored PDF.js browser assets
        run: |
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/vendor/pdf.worker.min.mjs
          rm -rf public/vendor/cmaps public/vendor/standard_fonts
          cp -R node_modules/pdfjs-dist/cmaps public/vendor/cmaps
          cp -R node_modules/pdfjs-dist/standard_fonts public/vendor/standard_fonts
      - name: Commit generated lockfile and assets
        run: |
          rm .github/workflows/upgrade-pdfjs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/vendor .github/workflows/upgrade-pdfjs-once.yml
          git commit -m 'security: upgrade pdfjs-dist to 6.2.108'
          git push origin HEAD:perf/search-shell-favorites-store
