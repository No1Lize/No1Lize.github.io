name: Regenerate nanoid lockfile (temporary)

on:
  push:
    branches: [fix/nanoid-3-3-17]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/update-nanoid-lock-temp.yml

permissions:
  contents: write

concurrency:
  group: nanoid-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nanoid-3-3-17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify resolved nanoid
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const row = lock.packages?.['node_modules/nanoid'];
          if (!row || row.version !== '3.3.17') {
            throw new Error(`expected nanoid 3.3.17, got ${row?.version ?? 'missing'}`);
          }
          console.log(`nanoid ${row.version}: ${row.resolved}`);
          NODE
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: resolve nanoid 3.3.17"
          git push origin HEAD:fix/nanoid-3-3-17
