name: Update schedule contract tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/update-schedule-contract-tests.yml

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'ops/schedule-stabilization-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-stabilization-20260803
          fetch-depth: 0
      - name: Align workflow contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'tests/test_frequent_refresh_workflow.py',
              '''    def test_primary_and_recovery_schedules_are_staggered(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn('cron: "17 */2 * * *"', text)
                  self.assertIn('cron: "47 */2 * * *"', text)
                  self.assertNotIn("timezone:", text)
          ''',
              '''    def test_lightweight_schedule_reserves_the_full_refresh_window(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn('cron: "17 0,2,4,8,10,12,14,16,18,20,22 * * *"', text)
                  self.assertIn('timezone: "Asia/Taipei"', text)
                  self.assertNotIn('cron: "47 */2 * * *"', text)
          ''',
          )
          replace(
              'tests/test_frequent_refresh_workflow.py',
              '''    def test_lightweight_refresh_shares_article_concurrency(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("group: public-article-refresh", text)
                  self.assertIn("cancel-in-progress: false", text)
          ''',
              '''    def test_lightweight_refresh_uses_the_repository_writer_queue(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("group: vciq-repository-writer-${{ github.ref }}", text)
                  self.assertIn("queue: max", text)
                  self.assertNotIn("cancel-in-progress:", text)
          ''',
          )
          replace(
              'tests/test_frequent_refresh_workflow.py',
              '''    def test_successful_check_is_always_published(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn('git commit -m "data: refresh public intelligence (two-hour check)"', text)
                  self.assertIn("gh workflow run pages.yml --ref main", text)
          ''',
              '''    def test_semantic_change_uses_the_single_push_deploy_path(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("python tools/semantic_data_diff.py", text)
                  self.assertIn('git commit -m "data: refresh public intelligence (two-hour check)"', text)
                  self.assertNotIn("gh workflow run pages.yml --ref main", text)
          ''',
          )

          replace(
              'tests/test_scheduled_sync_workflow.py',
              '''    def test_complete_refresh_is_queued_not_cancelled(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("group: public-article-refresh", text)
                  self.assertIn("cancel-in-progress: false", text)
                  self.assertNotIn("cancel-in-progress: true", text)
          ''',
              '''    def test_complete_refresh_uses_the_repository_writer_queue(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("group: vciq-repository-writer-${{ github.ref }}", text)
                  self.assertIn("queue: max", text)
                  self.assertNotIn("cancel-in-progress:", text)
          ''',
          )
          replace(
              'tests/test_scheduled_sync_workflow.py',
              '''    def test_full_refresh_runs_once_daily_outside_peak_minute(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn('cron: "17 19 * * *"', text)
                  self.assertNotIn("timezone:", text)
                  self.assertNotIn("4-22/2", text)
          ''',
              '''    def test_full_refresh_runs_once_daily_after_the_us_close(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn('cron: "30 6 * * *"', text)
                  self.assertIn('timezone: "Asia/Taipei"', text)
                  self.assertNotIn("4-22/2", text)
          ''',
          )
          replace(
              'tests/test_scheduled_sync_workflow.py',
              '''    def test_tracking_admin_writes_do_not_start_a_full_refresh(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertNotIn("      - config/user_tracking.json", text)
          ''',
              '''    def test_tracking_config_changes_start_one_full_refresh(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("      - config/user_tracking.json", text)
          ''',
          )

          replace(
              'tests/test_tracking_discovery_workflow.py',
              '''    def test_refresh_dispatch_only_follows_successful_push(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  push = text.index("if git push origin HEAD:main; then")
                  dispatch = text.index("gh workflow run scheduled-sync.yml --ref main")
                  self.assertGreater(dispatch, push)
          ''',
              '''    def test_successful_push_relies_on_the_full_refresh_push_trigger(self) -> None:
                  text = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn("if git push origin HEAD:main; then", text)
                  self.assertNotIn("gh workflow run scheduled-sync.yml --ref main", text)
          ''',
          )

          replace(
              'tests/test_market_quote_news.py',
              '''    def test_market_profile_refresh_runs_daily_at_seven_taipei(self):
                  text = (ROOT / ".github" / "workflows" / "market-profile-refresh.yml").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn('cron: "0 7 * * *"', text)
                  self.assertIn('timezone: "Asia/Taipei"', text)
                  self.assertIn("tests.test_market_quote_news", text)
          ''',
              '''    def test_market_profile_refresh_is_an_explicit_maintenance_task(self):
                  text = (ROOT / ".github" / "workflows" / "market-profile-refresh.yml").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn("workflow_dispatch:", text)
                  self.assertNotIn("  schedule:", text)
                  self.assertNotIn("  push:", text)
                  self.assertIn("tests.test_market_quote_news", text)
          ''',
          )
          PY
      - name: Run updated workflow contract tests
        run: |
          python -m unittest \
            tests.test_frequent_refresh_workflow \
            tests.test_scheduled_sync_workflow \
            tests.test_tracking_discovery_workflow \
            tests.test_market_quote_news
      - name: Commit updated tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_frequent_refresh_workflow.py \
            tests/test_scheduled_sync_workflow.py \
            tests/test_tracking_discovery_workflow.py \
            tests/test_market_quote_news.py
          git commit -m "test: align workflow contracts with stable schedules"
          git push origin HEAD:ops/schedule-stabilization-20260803
