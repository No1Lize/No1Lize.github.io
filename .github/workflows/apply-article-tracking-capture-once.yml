name: Apply article tracking capture once

on:
  push:
    branches: [feat/article-tracking-capture-20260805]
    paths:
      - .github/workflows/apply-article-tracking-capture-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-article-tracking-capture-once
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/article-tracking-capture-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link article capture records to company candidates
        run: python tools/patch_tracking_capture_candidate_link.py

      - name: Verify capture model and candidate linkage
        run: |
          python -m py_compile tools/build_company_candidates.py
          python -m unittest tests.test_company_candidates
          python tools/build_company_candidates.py
          python tools/build_company_candidates.py --check
          node --import tsx --test tests/tracking-capture.test.ts

      - name: Verify application
        run: |
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json

      - name: Commit candidate linkage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/build_company_candidates.py \
            tests/test_company_candidates.py \
            public/data/company_candidates.json
          if git diff --cached --quiet; then
            echo "No generated or source changes to commit."
            exit 0
          fi
          git commit -m "feat: route captured companies into candidate review"
          git pull --rebase origin feat/article-tracking-capture-20260805
          git push origin HEAD:feat/article-tracking-capture-20260805
