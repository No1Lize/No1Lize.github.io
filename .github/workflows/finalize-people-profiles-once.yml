name: Finalize tracked people profiles once

on:
  push:
    branches: [feature/tracked-people-research-20260725]
    paths:
      - '.github/workflows/finalize-people-profiles-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tracked-people-research-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow pending profiles without source material
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('tools/refresh_people_profiles.py')
          script = script_path.read_text()
          old = '    invalid = [item["slug"] for item in payload["people"] if not item.get("name") or not item.get("materials")]\n'
          new = '''    invalid = [\n        str(item.get("slug") or item.get("name") or "unknown")\n        for item in payload["people"]\n        if not item.get("slug") or not item.get("name") or not item.get("sectors")\n    ]\n'''
          if old not in script:
              raise SystemExit('profile validation expression not found')
          script = script.replace(old, new)
          script = script.replace(
              'Profiles missing required identity/materials:',
              'Profiles missing required identity/sector fields:'
          )
          script_path.write_text(script)

          test_path = Path('tests/test_refresh_people_profiles.py')
          test = test_path.read_text()
          old_assertions = '''        for person in payload["people"]:\n            self.assertTrue(person["slug"])\n            self.assertTrue(person["name"])\n            self.assertTrue(person["sectors"])\n            self.assertTrue(person["materials"])\n'''
          new_assertions = '''        for person in payload["people"]:\n            self.assertTrue(person["slug"])\n            self.assertTrue(person["name"])\n            self.assertTrue(person["sectors"])\n            self.assertIn(person["status"], {"complete", "partial", "pending"})\n            self.assertIsInstance(person["materials"], list)\n'''
          if old_assertions not in test:
              raise SystemExit('offline profile assertions not found')
          test = test.replace(old_assertions, new_assertions)
          marker = '''    def test_offline_generation_keeps_every_real_tracked_person(self):\n'''
          addition = '''    def test_unknown_person_without_sources_still_gets_pending_profile(self):\n        candidate = {\n            "slug": "future-researcher",\n            "name": "Future Researcher",\n            "englishName": "Future Researcher",\n            "aliases": ["Future Researcher"],\n            "handles": [],\n            "sectors": ["未来赛道"],\n            "override": {},\n        }\n        person = MODULE.enrich_candidate(candidate, None, [], offline=True)\n        self.assertEqual(person["status"], "pending")\n        self.assertEqual(person["materials"], [])\n        self.assertEqual(person["sectors"], ["未来赛道"])\n\n'''
          if addition not in test:
              test = test.replace(marker, addition + marker)
          test_path.write_text(test)
          PY
      - name: Run final verification
        id: verify
        continue-on-error: true
        run: |
          set +e
          python -m py_compile tools/refresh_people_profiles.py > /tmp/python.log 2>&1
          python_compile=$?
          python tools/refresh_people_profiles.py --offline --validate-only >> /tmp/python.log 2>&1
          profile_validation=$?
          python -m unittest discover -s tests -p 'test_*.py' >> /tmp/python.log 2>&1
          python_tests=$?
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          install=$?
          if [ "$install" -eq 0 ]; then
            npm run test:unit > /tmp/unit.log 2>&1
            unit=$?
            npx tsc --noEmit > /tmp/types.log 2>&1
            types=$?
            GITHUB_PAGES=true npx next build > /tmp/build.log 2>&1
            build=$?
          else
            unit=99
            types=99
            build=99
          fi
          echo "python_compile=$python_compile" >> "$GITHUB_OUTPUT"
          echo "profile_validation=$profile_validation" >> "$GITHUB_OUTPUT"
          echo "python_tests=$python_tests" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Commit code and final diagnosis
        if: always()
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json, os, pathlib
          def tail(path):
              item = pathlib.Path(path)
              return item.read_text(errors='replace')[-18000:] if item.exists() else ''
          statuses = {
              'pythonCompile': int('${{ steps.verify.outputs.python_compile || 99 }}'),
              'profileValidation': int('${{ steps.verify.outputs.profile_validation || 99 }}'),
              'pythonTests': int('${{ steps.verify.outputs.python_tests || 99 }}'),
              'install': int('${{ steps.verify.outputs.install || 99 }}'),
              'unitTests': int('${{ steps.verify.outputs.unit || 99 }}'),
              'typescript': int('${{ steps.verify.outputs.types || 99 }}'),
              'build': int('${{ steps.verify.outputs.build || 99 }}'),
          }
          payload = {
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'passed': all(value == 0 for value in statuses.values()),
              **statuses,
              'pythonLog': tail('/tmp/python.log'),
              'installLog': tail('/tmp/install.log'),
              'unitLog': tail('/tmp/unit.log'),
              'typeLog': tail('/tmp/types.log'),
              'buildLog': tail('/tmp/build.log'),
          }
          pathlib.Path('diagnostics/final-people-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2)
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/refresh_people_profiles.py tests/test_refresh_people_profiles.py diagnostics/final-people-verification.json
          git commit -m 'fix: keep pending tracked people profiles publishable' || true
          git pull --rebase origin feature/tracked-people-research-20260725
          git push origin HEAD:feature/tracked-people-research-20260725
      - name: Fail when final verification failed
        if: always()
        run: |
          test '${{ steps.verify.outputs.python_compile }}' = '0'
          test '${{ steps.verify.outputs.profile_validation }}' = '0'
          test '${{ steps.verify.outputs.python_tests }}' = '0'
          test '${{ steps.verify.outputs.install }}' = '0'
          test '${{ steps.verify.outputs.unit }}' = '0'
          test '${{ steps.verify.outputs.types }}' = '0'
          test '${{ steps.verify.outputs.build }}' = '0'
