name: Patch final venture noise filters v2

on:
  push:
    branches:
      - feature/final-venture-noise-v2-20260726
    paths:
      - .github/workflows/patch-final-venture-noise-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-venture-noise-v2-20260726
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch rules and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          finalizer = Path("tools/finalize_venture_profiles.py")
          text = finalizer.read_text(encoding="utf-8")

          old_constants = '''PURE_RESEARCH_LABELS = {
              "research",
              "ai research",
              "ai safety research",
              "safety research",
              "研究",
              "安全研究",
              "人工智能研究",
              "ai安全研究",
          }
          '''
          new_constants = old_constants + '''
          PRODUCT_NOISE_TERMS = (
              "terms of service",
              "data processing agreement",
              "privacy policy",
              "investor relations",
              "transfer agent",
              "annual report",
              "earnings",
              "contact",
              "careers",
              "招聘",
              "投资者关系",
              "联系方式",
          )
          PRODUCT_PERIOD_RE = re.compile(
              r"^(?:q[1-4]|fy)\\s*20\\d{2}$|^20\\d{2}\\s*(?:q[1-4]|年度|年报)$",
              re.IGNORECASE,
          )
          TEAM_NAME_NOISE_TERMS = (
              "investor relations",
              "transfer agent",
              "email",
              "contact",
              "careers",
              "privacy",
              "management team",
              "board of directors",
              "投资者关系",
              "联系方式",
              "管理团队",
              "董事会",
          )
          '''
          if old_constants not in text:
              raise RuntimeError("product constants anchor not found")
          text = text.replace(old_constants, new_constants, 1)

          old_capital = '''CAPITAL_EVIDENCE_RE = re.compile(
              r"\\b(?:ipo|listed|listing|went public|acquired|acquisition|merger|"
              r"nasdaq|nyse|hkex|stock exchange)\\b|"
              r"(?:上市|挂牌|并购|收购|退出|退市|交易所|公开市场)",
              re.IGNORECASE,
          )
          '''
          new_capital = '''CAPITAL_EVIDENCE_RE = re.compile(
              r"\\b(?:ipo|initial public offering|went public|listed on|listing on|"
              r"acquired by|acquisition|merger|delisted)\\b|"
              r"(?:完成上市|正式上市|申请上市|挂牌|并购|收购|完成退出|退市|公开市场)",
              re.IGNORECASE,
          )
          '''
          if old_capital not in text:
              raise RuntimeError("capital evidence anchor not found")
          text = text.replace(old_capital, new_capital, 1)

          old_products = '''def finalize_products(values: Sequence[Any], catalog_product: str) -> list[str]:
              normalized_catalog = re.sub(r"\\s*与\\s*", "、", catalog_product)
              products = sanitize_products(values, normalized_catalog)
              return [
                  item
                  for item in products
                  if _compact(item) not in {_compact(label) for label in PURE_RESEARCH_LABELS}
              ][:10]
          '''
          new_products = '''def _split_product_values(values: Sequence[Any]) -> list[str]:
              result: list[str] = []
              for raw in values:
                  value = clean_text(raw, 800)
                  result.extend(
                      clean_text(part, 180).strip(" >›→-|｜。.!！")
                      for part in re.split(
                          r"[、，,;/]|\\s*与\\s*|\\s+and\\s+",
                          value,
                          flags=re.IGNORECASE,
                      )
                      if clean_text(part, 180).strip(" >›→-|｜。.!！")
                  )
              return result


          def _product_noise(value: Any) -> bool:
              item = clean_text(value, 240).strip()
              lowered = item.casefold()
              compact = _compact(item)
              if compact in {_compact(label) for label in PURE_RESEARCH_LABELS}:
                  return True
              if any(term in lowered for term in PRODUCT_NOISE_TERMS):
                  return True
              return bool(PRODUCT_PERIOD_RE.fullmatch(item))


          def finalize_products(values: Sequence[Any], catalog_product: str) -> list[str]:
              normalized_values = _split_product_values(values)
              normalized_catalog = "、".join(_split_product_values([catalog_product]))
              products = sanitize_products(normalized_values, normalized_catalog)
              return [item for item in products if not _product_noise(item)][:10]
          '''
          if old_products not in text:
              raise RuntimeError("finalize_products anchor not found")
          text = text.replace(old_products, new_products, 1)

          old_team_loop = '''    for row in sanitize_team_members(values, aliases):
                  original = originals.get(clean_text(row.get("name"), 120).casefold(), {})
                  result.append(
          '''
          new_team_loop = '''    for row in sanitize_team_members(values, aliases):
                  name = clean_text(row.get("name"), 120)
                  if any(term in name.casefold() for term in TEAM_NAME_NOISE_TERMS):
                      continue
                  original = originals.get(name.casefold(), {})
                  result.append(
          '''
          if old_team_loop not in text:
              raise RuntimeError("team loop anchor not found")
          text = text.replace(old_team_loop, new_team_loop, 1)
          text = text.replace('"name": clean_text(row.get("name"), 120),', '"name": name,', 1)
          finalizer.write_text(text, encoding="utf-8")

          tests = Path("tests/test_finalize_venture_profiles.py")
          test_text = tests.read_text(encoding="utf-8")
          old_assertions = '''        self.assertIn("Claude Platform", products)
                  self.assertNotIn("安全研究。", products)
          '''
          new_assertions = '''        self.assertIn("Claude Platform", products)
                  self.assertNotIn("安全研究。", products)
                  self.assertNotIn("企业 API 与安全研究。", products)
          '''
          if old_assertions not in test_text:
              raise RuntimeError("product assertion anchor not found")
          test_text = test_text.replace(old_assertions, new_assertions, 1)

          anchor = '''    def test_financing_rejects_round_like_product_copy(self) -> None:
          '''
          additions = '''    def test_products_reject_reporting_and_investor_relations_labels(self) -> None:
                  products = finalizer.finalize_products(
                      ["Q1 2026", "Transfer Agent", "Aurora Driver"],
                      "",
                  )
                  self.assertEqual(products, ["Aurora Driver"])

              def test_team_rejects_investor_relations_fragments(self) -> None:
                  team = finalizer.finalize_team(
                      [
                          {
                              "name": "Chris Urmson",
                              "role": "CEO",
                              "sourceUrl": "https://example.com/company",
                          },
                          {
                              "name": "Investor Relations Email Transfer",
                              "role": "President",
                              "sourceUrl": "https://example.com/investors",
                          },
                      ],
                      ("Aurora Innovation", "Aurora"),
                  )
                  self.assertEqual([item["name"] for item in team], ["Chris Urmson"])

              def test_capital_markets_require_transaction_not_exchange_boilerplate(self) -> None:
                  rows = finalizer.finalize_capital_markets(
                      [
                          {
                              "type": "资本市场",
                              "title": "Autonomous trucking report",
                              "summary": "Aurora (Nasdaq: AUR) develops autonomous driving technology.",
                              "sourceUrl": "https://example.com/report",
                          },
                          {
                              "date": "2024-01-01",
                              "type": "上市",
                              "title": "Example went public",
                              "summary": "Example went public through an initial public offering.",
                              "sourceUrl": "https://example.com/ipo",
                          },
                      ]
                  )
                  self.assertEqual([item["title"] for item in rows], ["Example went public"])

          '''
          if anchor not in test_text:
              raise RuntimeError("test insertion anchor not found")
          test_text = test_text.replace(anchor, additions + anchor, 1)
          tests.write_text(test_text, encoding="utf-8")
          PY

          mkdir -p diagnostics
          set +e
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "checkedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python -m py_compile tools/finalize_venture_profiles.py
            COMPILE_STATUS=$?
            echo "compile=$COMPILE_STATUS"
            python -m unittest -v tests.test_finalize_venture_profiles
            TEST_STATUS=$?
            echo "tests=$TEST_STATUS"
          } > diagnostics/final-venture-noise-v2.txt 2>&1
          STATUS=$((COMPILE_STATUS || TEST_STATUS))
          set -e
          cat diagnostics/final-venture-noise-v2.txt

          if [ "$STATUS" -eq 0 ]; then
            rm .github/workflows/patch-final-venture-noise-v2.yml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/finalize_venture_profiles.py tests/test_finalize_venture_profiles.py diagnostics/final-venture-noise-v2.txt .github/workflows/patch-final-venture-noise-v2.yml
          git commit -m "fix: reject residual venture profile noise"
          git push origin HEAD:feature/final-venture-noise-v2-20260726
          exit "$STATUS"
