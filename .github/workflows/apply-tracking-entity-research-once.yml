name: Apply tracked entity research once

on:
  push:
    branches: [feat/tracking-entity-research-timeline-20260805]
    paths:
      - .github/workflows/apply-tracking-entity-research-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tracking-entity-research-once
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracking-entity-research-timeline-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply research intent and inbox integration
        run: python tools/install_tracking_entity_research.py

      - name: Run focused tracked entity tests
        run: |
          node --import tsx --test \
            tests/tracking-capture.test.ts \
            tests/tracking-entity-research.test.ts

      - name: Run application verification
        run: |
          npm run lint
          npm run test:unit
          npx tsc --noEmit
          npm run validate:tracking
          npm run validate:taxonomy
          python tools/enrich_tracking_snapshot.py
          ALLOW_INCOMPLETE_TRACKING_COVERAGE=true npm run build:pages
          git restore public/data/articles.json

      - name: Verify generated research routes
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('out/tracking/entities')
          assert root.exists(), root
          pages = list(root.glob('*/*/index.html'))
          assert pages, 'no tracked entity detail pages were generated'
          assert Path('out/tracking/entities/index.html').exists()
          print({'trackedEntityPages': len(pages)})
          PY

      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/tracking-capture.ts \
            components/intelligence-tracking-capture-controls.tsx \
            components/intelligence-tracking-capture-controls.module.css \
            components/tracking-capture-inbox.tsx \
            components/tracking-capture-inbox.module.css \
            tests/tracking-capture.test.ts
          git rm -f \
            tools/install_tracking_entity_research.py \
            .github/workflows/apply-tracking-entity-research-once.yml
          git commit -m "feat: add tracked entity research reasons and timeline links"
          git pull --rebase origin feat/tracking-entity-research-timeline-20260805
          git push origin HEAD:feat/tracking-entity-research-timeline-20260805
