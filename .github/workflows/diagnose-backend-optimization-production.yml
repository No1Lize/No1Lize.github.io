name: Diagnose backend optimization production

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-backend-optimization-production.yml

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch and verify the lightweight refresh
        run: |
          set -euo pipefail
          before=$(gh run list --workflow frequent-intelligence-refresh.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run frequent-intelligence-refresh.yml --ref main

          run_id=""
          for _ in $(seq 1 30); do
            candidate=$(gh run list --workflow frequent-intelligence-refresh.yml --limit 1 --json databaseId,event --jq '.[0] | select(.event == "workflow_dispatch") | .databaseId // empty')
            if [ -n "$candidate" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'Could not locate dispatched lightweight refresh run.' >&2
            exit 1
          fi
          echo "frequent_run_id=$run_id"

          for _ in $(seq 1 100); do
            state=$(gh run view "$run_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
            echo "$state"
            case "$state" in
              completed:success) break ;;
              completed:*) gh run view "$run_id" --log-failed || true; exit 1 ;;
            esac
            sleep 30
          done
          final=$(gh run view "$run_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
          [ "$final" = "completed:success" ] || { echo "Timed out waiting for $run_id: $final" >&2; exit 1; }

          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('public/data/articles.json').read_text(encoding='utf-8'))
          audit = payload.get('refreshAudit') or {}
          result = {
              'generatedAt': payload.get('generatedAt'),
              'articleCount': payload.get('articleCount'),
              'refreshAudit': audit,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if audit.get('mode') != 'frequent':
              raise SystemExit('latest production snapshot was not stamped by the frequent refresh')
          if audit.get('pipelineCompleted') is not True:
              raise SystemExit('frequent refresh did not mark pipeline completion')
          if not audit.get('completedAt'):
              raise SystemExit('frequent refresh did not publish completedAt')
          PY

          pages_id=$(gh run list --workflow pages.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          for _ in $(seq 1 30); do
            pages_state=$(gh run view "$pages_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
            echo "pages=$pages_state"
            case "$pages_state" in
              completed:success) exit 0 ;;
              completed:*) gh run view "$pages_id" --log-failed || true; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Pages run $pages_id" >&2
          exit 1
