name: Deploy event-label filters once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-event-label-filters-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: event-label-filters-deploy-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run focused tests
        run: node --import tsx --test tests/channel-updates.test.ts
      - name: Build Pages
        run: npm run build:pages
      - name: Verify rendered event-label controls
        shell: bash
        run: |
          set -euo pipefail
          for page in technology companies institutions reports people; do
            file="out/${page}/index.html"
            test -f "$file"
            grep -q '按事件类型筛选' "$file"
            grep -q '全部事件' "$file"
            if grep -q '按关键词分类' "$file"; then
              echo "legacy keyword UI remains in $file" >&2
              exit 1
            fi
          done
      - name: Record build result
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > diagnostics/event-label-filter-deploy.json <<'JSON'
          {
            "sourceCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "install": "success",
            "typecheck": "success",
            "tests": "success",
            "build": "success",
            "rendered": "success",
            "deployOutcome": "pending",
            "deployed": false
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/event-label-filter-deploy.json
          git commit -m 'ci: record event-label filter build' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-event-label-filters
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('diagnostics/event-label-filter-deploy.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          data.update({
              'sourceCommit': '${{ github.sha }}',
              'runId': '${{ github.run_id }}',
              'deployOutcome': '${{ steps.deployment.outcome }}',
              'deployed': '${{ steps.deployment.outcome }}' == 'success',
              'pageUrl': '${{ steps.deployment.outputs.page_url }}',
              'renderedAssertions': ['按事件类型筛选', '全部事件'],
              'legacyKeywordUiAbsent': True,
          })
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/event-label-filter-deploy.json
          git commit -m 'ci: confirm event-label filter deployment'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 5
          done
          exit 1
