name: Venture patch diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .venture-patch-diagnostic-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base entity labels
        run: python tools/patch_venture_entity_labels_v1.py
      - name: Editorial and person labels
        run: python tools/patch_venture_person_sentence_names.py
      - name: Short summary fallbacks
        run: python tools/patch_venture_short_summary_fallback.py
      - name: Shared terminal entity contract
        run: python tools/patch_venture_terminal_entity_contract.py
      - name: Technology fallbacks and rebuild
        run: python tools/patch_venture_short_technology_fallback.py
      - name: Compile patched pipeline
        run: |
          python -m py_compile \
            tools/enforce_venture_entity_semantics.py \
            tools/finalize_venture_profiles.py \
            tools/stabilize_venture_profiles.py
