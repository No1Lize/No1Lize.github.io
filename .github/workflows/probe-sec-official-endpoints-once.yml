name: Probe official SEC fallback endpoints once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-sec-official-endpoints-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe SEC endpoints with bounded requests
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          ua = os.environ.get("SEC_USER_AGENT", "").strip() or (
              "No1LizeResearchBot/1.0 No1Lize@users.noreply.github.com "
              "https://github.com/No1Lize/No1Lize.github.io"
          )
          cik = "0001824920"
          cik_compact = str(int(cik))
          endpoints = {
              "submissions": f"https://data.sec.gov/submissions/CIK{cik}.json",
              "atom": (
                  "https://www.sec.gov/cgi-bin/browse-edgar?"
                  f"action=getcompany&CIK={cik}&type=&dateb=&owner=exclude&count=100&output=atom"
              ),
              "browse": f"https://www.sec.gov/edgar/browse/?CIK={cik}&owner=exclude",
              "archive_index": f"https://www.sec.gov/Archives/edgar/data/{cik_compact}/index.json",
          }
          results = {}
          for name, url in endpoints.items():
              request = Request(
                  url,
                  headers={
                      "User-Agent": ua,
                      "Accept": "application/json,application/atom+xml,text/html,*/*",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Accept-Encoding": "identity",
                      "Connection": "close",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      body = response.read(1000)
                      results[name] = {
                          "url": url,
                          "ok": True,
                          "status": getattr(response, "status", 200),
                          "contentType": response.headers.get("Content-Type", ""),
                          "sample": body.decode("utf-8", errors="replace")[:600],
                      }
              except HTTPError as exc:
                  body = exc.read(600).decode("utf-8", errors="replace")
                  results[name] = {
                      "url": url,
                      "ok": False,
                      "status": exc.code,
                      "error": f"HTTPError:{exc}",
                      "sample": body,
                  }
              except (URLError, TimeoutError, OSError) as exc:
                  results[name] = {
                      "url": url,
                      "ok": False,
                      "status": 0,
                      "error": f"{type(exc).__name__}:{exc}",
                      "sample": "",
                  }
          report = {
              "generatedAt": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "cik": cik,
              "results": results,
          }
          Path("diagnostics/sec-official-endpoint-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Commit endpoint diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-sec-official-endpoints-once.yml
          git add diagnostics/sec-official-endpoint-probe.json
          git commit -m "diagnostics: record official SEC endpoint probe"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
