name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile derived public data with the latest config
        run: |
          python tools/migrate_article_entities.py
          python tools/build_company_candidates.py
          python tools/company_profile_refresh_queue.py --select-limit 10 --force-write
          python tools/company_profile_refresh_queue.py --check
          python tools/refine_eastmoney_snapshot.py
          python tools/enrich_tracking_snapshot.py
          python tools/crawl_articles.py --validate-only
          python tools/validate_eastmoney_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - run: npm run test:unit
      - name: Build deployable Pages snapshot
        env:
          ALLOW_INCOMPLETE_TRACKING_COVERAGE: "true"
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy without replacing the last good version on build failure
        id: deployment
        uses: actions/deploy-pages@v4
