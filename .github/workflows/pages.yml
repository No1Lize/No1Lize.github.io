name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed public data
        run: |
          python tools/reconcile_entity_resolution.py --check
          python tools/build_resolved_company_candidates.py --check
          python tools/company_profile_refresh_queue.py --check
          python tools/crawl_articles.py --validate-only
          python tools/validate_eastmoney_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Verify build inputs match the source commit
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code -- config public/data
      - name: Build deployable Pages snapshot
        run: npm run build:pages
      - name: Verify the build stayed read-only
        run: git diff --exit-code -- config public/data
      - name: Record build provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceSha": os.environ["GITHUB_SHA"],
              "sourceRef": os.environ["GITHUB_REF"],
          }
          Path("out/build-provenance.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy without replacing the last good version on build failure
        id: deployment
        uses: actions/deploy-pages@v4
