name: Tracking entity discovery

# Expands the tracking config from public web sources and verified company
# profiles: related keywords, founders/core team, public social accounts,
# communities, media columns, companies and official-site sources for every
# enabled track. Auto-added entries the owner later deletes become tombstones
# and are never re-added.

on:
  push:
    branches: [main]
    paths:
      - config/user_tracking.json
      - public/data/venture_profiles.json
      - public/data/people.json
      - tools/expand_tracking_entities.py
      - tools/enrich_tracking_people_from_sample_companies.py
      - tools/enrich_tracking_person_channels.py
      - tests/test_tracking_sample_company_people.py
      - tests/test_tracking_person_channels.py
      - .github/workflows/tracking-discovery.yml
  schedule:
    - cron: "30 13 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = team/social/channel discovery + entity rotation; seed-only = team/social/channel discovery + new tracks"
        default: "full"
        type: choice
        options: [full, seed-only]

permissions:
  contents: write
  actions: write

concurrency:
  group: tracking-discovery
  cancel-in-progress: false

jobs:
  discover:
    # A push made by this workflow's own commit must not restart it.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[auto-discovery]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sample-company people and public-channel discovery
        run: |
          python -m py_compile tools/enrich_tracking_people_from_sample_companies.py
          python -m py_compile tools/enrich_tracking_person_channels.py
          python -m unittest \
            tests.test_tracking_sample_company_people \
            tests.test_tracking_person_channels
      - name: Discover founders, core team and public social accounts
        id: team
        run: |
          set -euo pipefail
          python tools/enrich_tracking_people_from_sample_companies.py \
            --max-tracks 30 \
            --max-requests 120 | tee /tmp/team-discovery.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/team-discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Register public communities and media columns
        id: channels
        run: |
          set -euo pipefail
          python tools/enrich_tracking_person_channels.py \
            --max-tracks 30 | tee /tmp/channel-discovery.json
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/channel-discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Expand tracking entities from public web sources
        id: expand
        run: |
          set -euo pipefail
          MODE="full"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Config pushes (admin edits) only seed brand-new tracks after the
            # sample-company team/channel passes; tool/workflow pushes run full.
            if python - <<'PYEOF'
          import json, os, sys
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          files = []
          for commit in event.get("commits", []):
              files += commit.get("modified", []) + commit.get("added", [])
          sys.exit(0 if "config/user_tracking.json" in files else 1)
          PYEOF
            then
              MODE="seed-only"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "seed-only" ]; then
            python tools/expand_tracking_entities.py --seed-new-only | tee /tmp/discovery.json
          else
            python tools/expand_tracking_entities.py --max-tracks 12 --max-requests 420 | tee /tmp/discovery.json
          fi
          CHANGED=$(python -c "import json;print(str(json.load(open('/tmp/discovery.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Consolidate discovery changes
        id: changes
        run: |
          if [ "${{ steps.team.outputs.changed }}" = "true" ] || \
             [ "${{ steps.channels.outputs.changed }}" = "true" ] || \
             [ "${{ steps.expand.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Validate the expanded config before committing
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install
          npm run validate:tracking
          npm run validate:taxonomy
      - name: Commit expanded config and trigger a full refresh
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_MODE: ${{ steps.expand.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_current_config() {
            git add config/user_tracking.json config/tracking_auto_discovery.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "config: expand tracking entities from public web sources [auto-discovery]"
          }

          regenerate_from_latest_main() {
            git fetch origin main
            git reset --hard origin/main

            python tools/enrich_tracking_people_from_sample_companies.py \
              --max-tracks 30 \
              --max-requests 120 | tee /tmp/team-discovery-replay.json
            python tools/enrich_tracking_person_channels.py \
              --max-tracks 30 | tee /tmp/channel-discovery-replay.json
            if [ "$DISCOVERY_MODE" = "seed-only" ]; then
              python tools/expand_tracking_entities.py --seed-new-only | tee /tmp/discovery-replay.json
            else
              python tools/expand_tracking_entities.py \
                --max-tracks 12 \
                --max-requests 420 | tee /tmp/discovery-replay.json
            fi

            npm run validate:tracking
            npm run validate:taxonomy
          }

          if ! commit_current_config; then
            echo "nothing to commit"
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              gh workflow run scheduled-sync.yml --ref main
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "main advanced; replaying discovery from latest main (attempt $((attempt + 1))/3)"
            regenerate_from_latest_main
            if ! commit_current_config; then
              echo "latest main already contains all discovery changes"
              exit 0
            fi
          done
