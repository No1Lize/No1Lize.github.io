name: Check venture research validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-venture-research-validation.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record latest validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh run list \
            --workflow one-time-validate-venture-research.yml \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > diagnostics/venture-research-validation-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/venture-research-validation-status.json
          git commit -m "ci: record rerun venture validation status"
          git pull --rebase origin main
          git push origin HEAD:main
