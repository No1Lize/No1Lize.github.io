name: Check venture research validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-venture-research-validation.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Record latest workflow status and failure log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/venture-status
          STATUS=/tmp/venture-status/venture-refresh-status.json
          FAILURE=/tmp/venture-status/venture-refresh-failure.txt
          gh run list \
            --workflow refresh-venture-profiles.yml \
            --limit 8 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > "$STATUS"
          latest_id="$(python -c 'import json,sys; rows=json.load(open(sys.argv[1])); print(rows[0]["databaseId"] if rows else "")' "$STATUS")"
          latest_conclusion="$(python -c 'import json,sys; rows=json.load(open(sys.argv[1])); print(rows[0].get("conclusion","") if rows else "")' "$STATUS")"
          if [ -n "$latest_id" ] && [ "$latest_conclusion" = "failure" ]; then
            gh run view "$latest_id" --log-failed 2>&1 | tail -n 260 > "$FAILURE" || true
          else
            printf 'No completed failed refresh run. Latest run id=%s conclusion=%s\n' "$latest_id" "$latest_conclusion" > "$FAILURE"
          fi

          publish_file() {
            local repo_path="$1"
            local local_path="$2"
            local message="$3"
            local endpoint="repos/${GITHUB_REPOSITORY}/contents/${repo_path}"
            local current_sha
            local request
            current_sha="$(gh api "$endpoint?ref=main" --jq .sha 2>/dev/null || true)"
            request="$(mktemp)"
            python -c 'import base64,json,sys; path,sha,message,out=sys.argv[1:]; payload={"message":message,"content":base64.b64encode(open(path,"rb").read()).decode(),"branch":"main"}; payload.update({"sha":sha} if sha else {}); json.dump(payload,open(out,"w",encoding="utf-8"))' "$local_path" "$current_sha" "$message" "$request"
            gh api --method PUT "$endpoint" --input "$request" >/dev/null
            rm -f "$request"
          }

          publish_file \
            diagnostics/venture-refresh-status.json \
            "$STATUS" \
            "ci: record evidence-aligned venture refresh status"
          publish_file \
            diagnostics/venture-refresh-failure.txt \
            "$FAILURE" \
            "ci: record evidence-aligned venture refresh failure"
