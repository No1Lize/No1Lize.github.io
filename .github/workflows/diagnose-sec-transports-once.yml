name: Diagnose SEC disclosure transports once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-sec-transports-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe every configured SEC submissions endpoint
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from tools import crawl_listed_company_disclosures as base
          from tools import sec_configured_disclosures as configured
          from tools import sec_structured_disclosures as sec

          listings = sec.load_us_listings()
          config = base.load_config()
          ticker_ciks, registry = configured.resolve_ticker_ciks(listings, config)
          snapshot = base.load_previous(sec.OUTPUT_PATH)
          enriched = sec.enrich_snapshot(
              snapshot,
              listings,
              ticker_ciks,
              config["settings"],
              submissions_fetcher=configured.verified_submissions_fetcher(ticker_ciks),
          )
          statuses = [
              {
                  "companySlug": status.get("companySlug"),
                  "ticker": status.get("ticker"),
                  "cik": status.get("cik"),
                  "cikResolved": status.get("cikResolved"),
                  "scanned": status.get("scanned", 0),
                  "accepted": status.get("accepted", 0),
                  "errors": status.get("errors", []),
              }
              for status in enriched.get("sourceStatus", [])
              if str(status.get("id", "")).startswith("sec-disclosure-")
          ]
          report = {
              "generatedAt": datetime.now(UTC).replace(microsecond=0).isoformat(),
              "configuredRegistry": registry,
              "statusCount": len(statuses),
              "acceptedSourceCount": sum(1 for status in statuses if int(status["accepted"] or 0) > 0),
              "statuses": statuses,
          }
          Path("diagnostics/sec-transport-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Commit transport diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-sec-transports-once.yml
          git add diagnostics/sec-transport-probe.json
          git commit -m "diagnostics: record SEC transport probe"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
