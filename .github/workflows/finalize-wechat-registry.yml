name: One-time finalize WeChat registry integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-wechat-registry.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate registry into the active crawler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/wechat_public_sources.py')
          text = path.read_text(encoding='utf-8')

          if 'import wechat_source_registry' not in text:
              anchor = 'from urllib.request import Request, urlopen\n'
              addition = '''from urllib.request import Request, urlopen\n\ntry:  # Imported by tests as tools.wechat_public_sources.\n    from . import wechat_source_registry\nexcept ImportError:  # Executed directly with python tools/...\n    import wechat_source_registry\n'''
              if anchor not in text:
                  raise SystemExit('registry import anchor missing')
              text = text.replace(anchor, addition, 1)

          pattern = re.compile(
              r'def generated_wechat_sources\(\n'
              r'    tracks: Sequence\[dict\[str, Any\]\], tracking: Any\n'
              r'\) -> list\[dict\[str, Any\]\]:\n'
              r'.*?\n\nclass WeChatPageParser',
              flags=re.DOTALL,
          )
          replacement = '''def generated_wechat_sources(\n    tracks: Sequence[dict[str, Any]], tracking: Any\n) -> list[dict[str, Any]]:\n    """Create whitelist-first discovery and fallback coverage per track."""\n\n    return wechat_source_registry.generated_wechat_sources(tracks, tracking)\n\n\nclass WeChatPageParser'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('generated source block not replaced')

          old = '''    account = (\n        parser.account\n        or _js_value(body, ("nickname", "profile_nickname", "account_name"))\n        or spec.get("name", "")\n    )\n    author = parser.author or _js_value(body, ("author", "author_name"))'''
          new = '''    observed_account = (\n        parser.account\n        or _js_value(body, ("nickname", "profile_nickname", "account_name"))\n    )\n    if not wechat_source_registry.account_matches(spec, observed_account):\n        return None\n    account = observed_account or spec.get("name", "")\n    author = parser.author or _js_value(body, ("author", "author_name"))'''
          if old not in text:
              raise SystemExit('account validation anchor missing')
          text = text.replace(old, new, 1)

          old = '        source_level="原始材料",\n        platform="微信",'
          new = '        source_level=spec.get("sourceLevel", "媒体报道"),\n        platform="微信",'
          if old not in text:
              raise SystemExit('source level anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/scheduled-sync.yml')
          text = workflow.read_text(encoding='utf-8')
          if '      - tools/wechat_source_registry.py\n' not in text:
              anchor = '      - tools/wechat_public_sources.py\n'
              if anchor not in text:
                  raise SystemExit('scheduled tool path anchor missing')
              text = text.replace(anchor, anchor + '      - tools/wechat_source_registry.py\n', 1)
          if '      - config/wechat_sources.json\n' not in text:
              anchor = '      - config/intelligence_sources.json\n'
              if anchor not in text:
                  raise SystemExit('scheduled config path anchor missing')
              text = text.replace(anchor, anchor + '      - config/wechat_sources.json\n', 1)
          workflow.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_wechat_public_sources.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if 'test_rejects_wrong_account_for_whitelisted_source' not in test_text:
              addition = '''\n    def test_rejects_wrong_account_for_whitelisted_source(self) -> None:\n        body = """\n        <html><head>\n          <meta property="og:title" content="OpenAI发布新推理模型" />\n          <meta name="description" content="OpenAI发布推理模型和智能体更新。" />\n          <meta property="article:published_time" content="2026-07-25" />\n        </head><body>\n          <a id="js_name">无关科技媒体</a>\n          <div id="js_content"><p>OpenAI发布推理模型和智能体更新。</p></div>\n        </body></html>\n        """\n        spec = {\n            "id": "user-track-wechat-qbitai-ai",\n            "name": "量子位",\n            "expectedAccounts": ["量子位", "qbitai"],\n            "sector": "AI / AGI",\n            "region": "中国",\n            "keywords": ["推理模型", "智能体"],\n            "trackedCompanies": ["OpenAI"],\n            "trackedPeople": [],\n            "sourceLevel": "媒体报道",\n        }\n        self.assertIsNone(\n            wechat.parse_wechat_article(\n                spec,\n                "https://mp.weixin.qq.com/s/wrong-account",\n                body,\n                crawl_articles,\n            )\n        )\n'''
              if marker not in test_text:
                  raise SystemExit('test insertion anchor missing')
              test_text = test_text.replace(marker, addition + marker, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY

          git rm -f --ignore-unmatch tools/crawl_wechat_sources.py tests/test_wechat_sources.py

      - name: Verify complete implementation
        run: |
          python -m json.tool config/wechat_sources.json >/dev/null
          python -m py_compile tools/wechat_public_sources.py tools/wechat_source_registry.py tools/crawl_with_source_categories.py
          python -m unittest tests.test_wechat_public_sources tests.test_wechat_source_registry
          python -m unittest discover -s tests -p "test_*.py"
          npm install
          npx tsc --noEmit
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_public_sources.py tools/wechat_source_registry.py \
            tools/crawl_with_source_categories.py config/wechat_sources.json \
            tests/test_wechat_public_sources.py tests/test_wechat_source_registry.py \
            .github/workflows/scheduled-sync.yml
          git add -u tools/crawl_wechat_sources.py tests/test_wechat_sources.py
          git commit -m "feat: finalize whitelist-first WeChat intelligence crawling"
          git pull --rebase origin main
          git push origin HEAD:main
