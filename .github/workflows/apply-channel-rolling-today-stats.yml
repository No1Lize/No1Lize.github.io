name: Apply channel rolling and today statistics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-channel-rolling-today-stats.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/channel-rolling-today-stats-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/channel-rolling-today-stats-20260803
          fetch-depth: 0

      - name: Update channel statistics UI and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          component = 'components/channel-update-directory-client.tsx'
          replace(component, '  Clock3,\n', '')
          replace(
              component,
              '  collectChannelUpdateKeywords,\n  filterAndSortChannelUpdates,\n',
              '  collectChannelUpdateKeywords,\n  countChannelUpdatesForSnapshotDay,\n  filterAndSortChannelUpdates,\n',
          )
          replace(
              component,
              '''  const latestDatedItemId = useMemo(() => {
          ''',
              '''  const todayItemCount = useMemo(
                () => countChannelUpdatesForSnapshotDay(allItems, directory.generatedAt),
                [allItems, directory.generatedAt],
              );
              const latestDatedItemId = useMemo(() => {
          ''',
          )
          replace(
              component,
              '''        <div className={styles.snapshot}>
                    <span>{isFiltered ? "筛选结果" : "公开资料快照"}</span>
                    <strong>{visibleItems.length}</strong>
                    <small>
                      <Clock3 size={12} aria-hidden="true" />
                      {directory.generatedAt.slice(0, 10) || "等待更新"}
                    </small>
                  </div>
          ''',
              '''        <div className={styles.snapshot}>
                    <span>滚动总库</span>
                    <strong>{allItems.length}</strong>
                    <small>今日新增 {todayItemCount} 条</small>
                  </div>
          ''',
          )

          tests = 'tests/channel-updates.test.ts'
          replace(
              tests,
              '  collectChannelUpdateKeywords,\n  filterAndSortChannelUpdates,\n',
              '  collectChannelUpdateKeywords,\n  countChannelUpdatesForSnapshotDay,\n  filterAndSortChannelUpdates,\n',
          )
          replace(
              tests,
              'test("normalizes exact, relative and undated source labels", () => {\n',
              '''test("channel snapshot counts exact and relative updates on the generated day", () => {
                const sample = getChannelUpdateDirectory("technology").items[0];
                assert.ok(sample);
                const items = [
                  { ...sample, id: "today-exact", sortAt: "2026-08-03T10:00:00.000Z", datePrecision: "exact" as const },
                  { ...sample, id: "today-relative", sortAt: "2026-08-03T00:00:00.000Z", datePrecision: "approximate" as const },
                  { ...sample, id: "yesterday", sortAt: "2026-08-02T23:59:59.000Z", datePrecision: "exact" as const },
                  { ...sample, id: "undated", sortAt: UNDATED_CHANNEL_UPDATE_SORT_AT, datePrecision: "undated" as const },
                ];

                assert.equal(
                  countChannelUpdatesForSnapshotDay(items, "2026-08-03T12:17:00.000Z"),
                  2,
                );
                assert.equal(countChannelUpdatesForSnapshotDay(items, "等待更新"), 0);
              });

              test("normalizes exact, relative and undated source labels", () => {
          ''',
          )
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run channel directory checks
        run: |
          npm ci
          node --import tsx --test tests/channel-updates.test.ts
          npx eslint \
            components/channel-update-directory-client.tsx \
            lib/channel-update-filter.ts \
            tests/channel-updates.test.ts
          npx tsc --noEmit

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/channel-update-directory-client.tsx \
            tests/channel-updates.test.ts
          git commit -m "feat: show rolling and today counts in channel snapshots"
          git push origin HEAD:feat/channel-rolling-today-stats-20260803
