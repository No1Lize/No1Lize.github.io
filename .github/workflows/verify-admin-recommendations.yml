name: One-time admin recommendation verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-admin-recommendations.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit and type checks
        shell: bash
        run: |
          set +e
          npm install > admin-verify.log 2>&1
          install_status=$?
          test_status=99
          type_status=99
          if [ "$install_status" -eq 0 ]; then
            npm run test:unit >> admin-verify.log 2>&1
            test_status=$?
            npx tsc --noEmit >> admin-verify.log 2>&1
            type_status=$?
          fi
          export INSTALL_STATUS="$install_status"
          export TEST_STATUS="$test_status"
          export TYPE_STATUS="$type_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = Path("admin-verify.log").read_text(encoding="utf-8", errors="replace").splitlines()
          result = {
              "installStatus": int(os.environ["INSTALL_STATUS"]),
              "testStatus": int(os.environ["TEST_STATUS"]),
              "typeStatus": int(os.environ["TYPE_STATUS"]),
              "passed": all(int(os.environ[key]) == 0 for key in ["INSTALL_STATUS", "TEST_STATUS", "TYPE_STATUS"]),
              "logTail": lines[-140:],
          }
          target = Path("diagnostics/admin-recommendation-verification.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/admin-recommendation-verification.json
          git commit -m "ci: record admin recommendation verification"
          git pull --rebase origin main
          git push origin HEAD:main
