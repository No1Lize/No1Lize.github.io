name: One-time verify current multi-sector WeChat sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-wechat-multisector-current.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe three sectors
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import crawl_articles
          from tools import crawl_with_tracking
          from tools import wechat_index_context_guard
          from tools import wechat_public_sources
          from tools import wechat_registry_bridge
          from tools import wechat_sogou_bridge

          wechat_registry_bridge._INDEX_CACHE.clear()
          wechat_registry_bridge.install(wechat_public_sources)
          wechat_index_context_guard.install(wechat_registry_bridge)
          wechat_sogou_bridge.install(wechat_public_sources)

          tracking = crawl_with_tracking.load_tracking()
          tracks = crawl_with_tracking._enabled_tracks(tracking)
          specs = wechat_public_sources.generated_wechat_sources(
              tracks, crawl_with_tracking
          )
          targets = [
              ("qbitai", "AI / AGI"),
              ("icbank", "半导体"),
              ("gg-lithium", "新能源"),
          ]
          results = []
          for account_id, sector in targets:
              spec = next(
                  item
                  for item in specs
                  if item.get("accountConfigId") == account_id
                  and item.get("sector") == sector
              )
              articles, status = wechat_public_sources.crawl_wechat_source(
                  spec,
                  crawl_articles.DEFAULT_USER_AGENT,
                  crawl_articles,
              )
              results.append(
                  {
                      "accountConfigId": account_id,
                      "name": spec.get("name"),
                      "sector": sector,
                      "publicIndexes": spec.get("publicIndexUrls", []),
                      "status": status,
                      "articles": [
                          {
                              "title": item.get("title"),
                              "wechatAccount": item.get("wechatAccount"),
                              "sector": item.get("sector"),
                              "companies": item.get("mentionedCompanies", []),
                              "people": item.get("mentionedPeople", []),
                              "url": item.get("source", {}).get("url"),
                          }
                          for item in articles[:3]
                      ],
                  }
              )
          Path('diagnostics/wechat-multisector-current.json').write_text(
              json.dumps(
                  {
                      "configuredSources": len(specs),
                      "whitelistedSources": sum(
                          1 for item in specs if item.get("expectedAccounts")
                      ),
                      "results": results,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/wechat-multisector-current.json
          git commit -m "ci: record current multi-sector WeChat verification"
          git pull --rebase origin main
          git push origin HEAD:main
