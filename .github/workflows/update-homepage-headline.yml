name: One-time homepage headline update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-homepage-headline.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace homepage headline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/dashboard.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<h1>把公开信息，变成可追溯的判断依据。</h1>'
          new = '<h1>科技投资，每一天进步一点点！</h1>'
          if old not in text:
              raise SystemExit('homepage headline anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard.tsx
          git commit -m "copy: update homepage investment slogan"
          git pull --rebase origin main
          git push origin HEAD:main
