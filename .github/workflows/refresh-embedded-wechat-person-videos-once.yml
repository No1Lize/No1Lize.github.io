name: Refresh embedded WeChat person videos once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-embedded-wechat-person-videos-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-embedded-wechat-person-videos-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify focused regressions
        run: |
          python -m unittest -v \
            tests.test_person_video_discovery \
            tests.test_wechat_channel_card_discovery \
            tests.test_refresh_people_profiles_with_video
      - name: Refresh and publish the latest snapshot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python tools/refresh_people_profiles_with_video.py --workers 4
            python tools/refresh_people_profiles_with_video.py --offline --validate-only
            python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.')
          payload = json.loads((root / 'public/data/people.json').read_text(encoding='utf-8'))
          rows = []
          people_with_channels = set()
          for person in payload.get('people') or []:
              for item in person.get('materials') or []:
                  url = str(item.get('url') or '')
                  parsed = urlsplit(url)
                  host = (parsed.hostname or '').casefold()
                  is_channel = host == 'channels.weixin.qq.com' or (
                      host == 'weixin.qq.com' and parsed.path.casefold().startswith('/sph')
                  )
                  if not is_channel:
                      continue
                  people_with_channels.add(str(person.get('name') or ''))
                  rows.append({
                      'person': person.get('name'),
                      'title': item.get('title'),
                      'url': url,
                      'source': item.get('source'),
                  })
          report = {
              'generatedAt': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'personCount': payload.get('personCount', len(payload.get('people') or [])),
              'wechatChannelsCount': len(rows),
              'peopleWithWechatChannels': sorted(value for value in people_with_channels if value),
              'samples': rows[:20],
          }
          path = root / 'diagnostics/person-wechat-video-refresh.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY

            rm -f .github/workflows/refresh-embedded-wechat-person-videos-once.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/people.json diagnostics/person-wechat-video-refresh.json
            git add -u .github/workflows/refresh-embedded-wechat-person-videos-once.yml
            git commit -m 'data: refresh people with embedded WeChat video cards'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 6
          done
          exit 1
