name: Inspect central Pages runs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/inspect-central-pages-temporary.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.head_ref == 'ops/verify-central-pages-publisher-20260804'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Inspect latest main and Pages runs
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')
          echo "latest_main=$latest_sha"
          gh run list \
            --workflow pages.yml \
            --branch main \
            --limit 12 \
            --json databaseId,createdAt,updatedAt,status,conclusion,headSha,event,url \
            > /tmp/pages.json
          cat /tmp/pages.json
          python - <<'PY' > /tmp/run-ids.txt
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/pages.json').read_text(encoding='utf-8'))
          for row in rows[:6]:
              print(row['databaseId'])
          PY
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh run view "$run_id" \
              --json databaseId,createdAt,updatedAt,status,conclusion,headSha,event,url,jobs
          done < /tmp/run-ids.txt
