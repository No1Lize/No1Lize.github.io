name: Clear redundant production refresh

on:
  pull_request:
    paths:
      - .github/workflows/list-production-refresh-runs.yml

permissions:
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel the redundant post-merge full refresh
        run: |
          set -euo pipefail
          run_id=30426379711
          state=$(gh run view "$run_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
          echo "before=$state"
          if [ "${state%%:*}" != "completed" ]; then
            gh run cancel "$run_id"
          fi
          for _ in $(seq 1 20); do
            state=$(gh run view "$run_id" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
            echo "full=$state"
            [ "${state%%:*}" = "completed" ] && break
            sleep 5
          done
          echo 'FREQUENT'
          gh run list --workflow frequent-intelligence-refresh.yml --limit 5 \
            --json databaseId,number,status,conclusion,event,headSha,createdAt,startedAt,updatedAt,url
