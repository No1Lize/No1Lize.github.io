name: Apply venture quality hardening

on:
  push:
    branches: [main]
    paths:
      - tools/patch_venture_quality_v2.py
      - .github/workflows/patch-venture-quality-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: venture-quality-hardening-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        run: python tools/patch_venture_quality_v2.py
      - name: Verify extraction and snapshot
        run: |
          python -m py_compile \
            tools/venture_profile_extraction.py \
            tools/crawl_venture_profiles.py
          python -m unittest \
            tests.test_venture_profile_extraction \
            tests.test_venture_profile_noise_filters
          python tools/crawl_venture_profiles.py --validate-only
          git diff --check
      - name: Commit hardened rules and sanitized data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm tools/patch_venture_quality_v2.py
          rm .github/workflows/patch-venture-quality-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes."
            exit 0
          fi
          git commit -m "fix: harden venture profile semantic extraction"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Publish hardened site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
