name: Professional venture source checks

on:
  pull_request:
    paths:
      - "tools/enrich_professional_venture_sources.py"
      - "tests/test_professional_venture_sources.py"
      - "lib/professional-venture-data.ts"
      - "components/company-equity-evidence.tsx"
      - "app/companies/**"
      - "tests/professional-venture-data.test.ts"
      - ".github/workflows/professional-venture-source-checks.yml"
  push:
    branches: [main]
    paths:
      - "tools/enrich_professional_venture_sources.py"
      - "tests/test_professional_venture_sources.py"
      - "lib/professional-venture-data.ts"
      - "components/company-equity-evidence.tsx"
      - "app/companies/**"
      - "tests/professional-venture-data.test.ts"
      - ".github/workflows/professional-venture-source-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile professional source adapter
        run: python -m py_compile tools/enrich_professional_venture_sources.py
      - name: Verify QCC authentication
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_qcc_auth_header_matches_documented_signature
      - name: Verify QCC company and equity parsing
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_qcc_company_parser_extracts_shareholders_and_equity_changes
      - name: Verify QCC financing parsing
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_qcc_financing_parser_preserves_round_amount_and_investors
      - name: Verify Tianyancha parsing
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_tianyancha_parsers_extract_holders_changes_and_beneficiaries
      - name: Verify Jingdata public discovery
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_jingdata_discovery_accepts_only_identity_matched_public_pages
      - name: Verify cross-source equity merge
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_equity_merge_combines_sources_without_overwriting_existing_facts
      - name: Verify paid-source opt-in guard
        if: always()
        run: python -m unittest -v tests.test_professional_venture_sources.ProfessionalVentureSourceTests.test_paid_sources_stay_disabled_without_explicit_opt_in
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check professional venture UI
        run: npx tsc --noEmit
      - name: Verify professional venture frontend boundary
        run: node --import tsx --test tests/professional-venture-data.test.ts
      - name: Build static site
        id: static-build
        continue-on-error: true
        shell: bash
        run: npm run build > professional-build.log 2>&1
      - name: Upload static build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-venture-build-log
          path: professional-build.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce static build result
        if: steps.static-build.outcome != 'success'
        run: exit 1
