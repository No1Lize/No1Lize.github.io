name: One-time probe Sogou WeChat links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-sogou-wechat-links.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect result and redirect pages
        shell: bash
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import html
          import http.cookiejar
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def get(url, referer=""):
              request = urllib.request.Request(url, headers={
                  "User-Agent": ua,
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.6",
                  **({"Referer": referer} if referer else {}),
              })
              with opener.open(request, timeout=15) as response:
                  return response.status, response.geturl(), response.read().decode(response.headers.get_content_charset() or "utf-8", errors="replace")

          home = "https://weixin.sogou.com/"
          get(home)
          search_url = "https://weixin.sogou.com/weixin?type=2&query=" + urllib.parse.quote("量子位 大模型") + "&page=1"
          status, final_url, body = get(search_url, home)
          link_pattern = re.compile(r'<a[^>]+href="([^"]+)"[^>]+(?:id="sogou_vr_11002601_title_\d+"|uigs="article_title_\d+")[^>]*>(.*?)</a>', re.I | re.S)
          links = []
          for href, title_html in link_pattern.findall(body)[:3]:
              absolute = urllib.parse.urljoin(search_url, html.unescape(href))
              title = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", html.unescape(title_html))).strip()
              links.append({"url": absolute, "title": title})

          result = {
              "searchStatus": status,
              "searchFinalUrl": final_url,
              "resultCount": len(links),
              "results": [],
          }
          for item in links:
              row = dict(item)
              try:
                  link_status, link_final, link_body = get(item["url"], search_url)
                  strings = re.findall(r"['\"]((?:https?:\\?/\\?/|/s\\?|https?:/)[^'\"]{8,})['\"]", link_body, flags=re.I)
                  concatenated = re.findall(r"(?:url|jump_url)\s*\+?=\s*['\"](.*?)['\"]", link_body, flags=re.I | re.S)
                  direct_urls = re.findall(r"https?://mp\.weixin\.qq\.com/(?:s|s\?)[^'\"<>\s]+", html.unescape(link_body), flags=re.I)
                  row.update({
                      "httpStatus": link_status,
                      "finalUrl": link_final,
                      "length": len(link_body),
                      "captcha": any(marker in link_body for marker in ("请输入验证码", "antispider", "VerifyCode")),
                      "directUrls": direct_urls[:3],
                      "jsStrings": strings[:8],
                      "concatenated": concatenated[:12],
                      "scriptSample": re.sub(r"\s+", " ", link_body)[:1200],
                  })
              except Exception as exc:
                  row["error"] = f"{type(exc).__name__}: {exc}"
              result["results"].append(row)
          Path("diagnostics/sogou-wechat-links.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sogou-wechat-links.json
          git commit -m "ci: record Sogou WeChat link probe"
          git pull --rebase origin main
          git push origin HEAD:main
