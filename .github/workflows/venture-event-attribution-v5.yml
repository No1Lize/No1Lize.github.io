name: Venture event attribution v5

on:
  push:
    branches: [feature/venture-product-noise-v4]
    paths:
      - .venture-event-attribution-v5

permissions:
  contents: write

concurrency:
  group: venture-event-attribution-v5
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate strict event attribution and formal snapshot
        env:
          HEAD_BRANCH: feature/venture-product-noise-v4
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          (
            set -euo pipefail
            echo '=== apply event patch ==='
            python tools/patch_venture_event_attribution_v5.py

            echo '=== compile and regressions ==='
            python -m py_compile \
              tools/venture_profile_extraction.py \
              tools/refine_venture_research_evidence.py \
              tools/normalize_venture_profiles.py \
              tools/finalize_venture_profiles.py \
              tools/enforce_venture_entity_semantics.py \
              tools/stabilize_venture_profiles.py
            python -m unittest -v \
              tests.test_venture_profile_extraction \
              tests.test_venture_profile_noise_filters \
              tests.test_venture_profile_enrichment \
              tests.test_refine_venture_research_evidence \
              tests.test_normalize_venture_profiles \
              tests.test_venture_profile_postprocess \
              tests.test_venture_narrative_sanitizer \
              tests.test_finalize_venture_profiles \
              tests.test_venture_entity_semantics \
              tests.test_stabilize_venture_profiles

            echo '=== reprocess formal snapshot ==='
            python tools/refine_venture_research_evidence.py
            python tools/refine_venture_research_evidence.py --check
            python tools/normalize_venture_profiles.py
            python tools/stabilize_venture_profiles.py
            python tools/stabilize_venture_profiles.py --check
            python tools/finalize_venture_profiles.py --check
            python tools/enforce_venture_entity_semantics.py --check
            python tools/crawl_venture_profiles.py --validate-only
            python tools/enrich_venture_profiles.py --validate-only

            echo '=== strict formal assertions ==='
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('public/data/venture_profiles.json').read_text(encoding='utf-8'))
          companies = payload.get('companies', {})
          assert companies['form-energy'].get('financing', []) == []
          assert companies['anthropic'].get('capitalMarkets', []) == []
          assert companies['anthropic'].get('researchTechnology') == 'Claude 模型、企业 API 与安全研究。'
          assert companies['figure-ai'].get('products') == [
              'Figure 人形机器人',
              'Helix 视觉—语言—行动模型',
          ]
          assert companies['anduril'].get('background') == '开发自主系统、传感器和国防软件平台。'
          checks = payload.get('qualityGate', {}).get('checks', {})
          assert checks.get('entitySemanticConsistency', {}).get('passed') is True
          print(json.dumps({
              'companies': len(companies),
              'institutions': len(payload.get('institutions', {})),
              'anthropicCapitalMarkets': companies['anthropic'].get('capitalMarkets', []),
              'formEnergyFinancing': companies['form-energy'].get('financing', []),
          }, ensure_ascii=False))
          PY

            echo '=== frontend consumption ==='
            npm install
            node --import tsx --test tests/venture-profile-data.test.ts tests/catalog.test.ts
          ) > diagnostics/venture-event-attribution-v5.txt 2>&1
          status=$?
          cat diagnostics/venture-event-attribution-v5.txt
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics/venture-event-attribution-v5.txt
            git commit -m 'ci: record venture event attribution failure'
            git push origin HEAD:${HEAD_BRANCH}
          fi
          exit "$status"
      - name: Commit validated permanent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .venture-event-attribution-v5
          rm -f tools/patch_venture_event_attribution_v5.py
          rm -f .github/workflows/venture-event-attribution-v5.yml
          rm -rf diagnostics
          git add \
            tools/enforce_venture_entity_semantics.py \
            tests/test_venture_entity_semantics.py \
            public/data/venture_profiles.json
          git add -u \
            .venture-event-attribution-v5 \
            tools/patch_venture_event_attribution_v5.py \
            .github/workflows/venture-event-attribution-v5.yml
          git commit -m 'fix: require direct venture event subject evidence'
          git push origin HEAD:feature/venture-product-noise-v4
