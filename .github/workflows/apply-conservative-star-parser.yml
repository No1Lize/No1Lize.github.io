name: Apply conservative STAR shareholder parser

on:
  pull_request:
    paths:
      - ".github/workflows/apply-conservative-star-parser.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/conservative-star-shareholder-table-parser-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Wire conservative parser into production crawler
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/crawl_star_market_investors.py")
          text = path.read_text(encoding="utf-8")

          old_import = '''try:
              from . import cninfo_structured_disclosures as cninfo
              from . import crawl_listed_company_disclosures as listed
          except ImportError:
              import cninfo_structured_disclosures as cninfo
              import crawl_listed_company_disclosures as listed
          '''
          new_import = '''try:
              from . import cninfo_structured_disclosures as cninfo
              from . import crawl_listed_company_disclosures as listed
              from . import star_market_prospectus_parser as prospectus_parser
          except ImportError:
              import cninfo_structured_disclosures as cninfo
              import crawl_listed_company_disclosures as listed
              import star_market_prospectus_parser as prospectus_parser
          '''
          if old_import not in text and new_import not in text:
              raise SystemExit("import block not found")
          text = text.replace(old_import, new_import, 1)

          old_clean = '''def clean_text(value: Any, limit: int = 2000) -> str:
              text = str(value or "").replace("\\u3000", " ").replace("\\xa0", " ")
              text = re.sub(r"[\\t\\r]+", " ", text)
          '''
          new_clean = '''def clean_text(value: Any, limit: int = 2000) -> str:
              text = str(value or "")
              text = re.sub(r"<[^>]+>", "", text)
              text = text.replace("\\u3000", " ").replace("\\xa0", " ")
              text = re.sub(r"[\\t\\r]+", " ", text)
          '''
          if old_clean not in text and new_clean not in text:
              raise SystemExit("clean_text block not found")
          text = text.replace(old_clean, new_clean, 1)

          wrapper = '''def extract_institutional_investors(
              pages: list[PdfPage],
              company_name: str,
              *,
              max_investors: int,
          ) -> list[dict[str, Any]]:
              return prospectus_parser.extract_institutional_investors(
                  pages,
                  company_name,
                  max_investors=max_investors,
              )


          '''
          pattern = re.compile(
              r"def extract_institutional_investors\(.*?\n\ndef _official_prospectus_host",
              flags=re.DOTALL,
          )
          if "return prospectus_parser.extract_institutional_investors" not in text:
              match = pattern.search(text)
              if not match:
                  raise SystemExit("extract_institutional_investors region not found")
              text = text[: match.start()] + wrapper + "def _official_prospectus_host" + text[match.end() :]

          text = text.replace(
              "    issuer_contact = extract_issuer_contact(pages, listing.name)\n",
              "    issuer_contact: dict[str, Any] = {}\n",
              1,
          )

          text = text.replace(
              '            "pdfExtraction": "pypdf text extraction; OCR and access-control bypass are not used",\n'
              '            "retention": "previous verified company record retained on source failure",',
              '            "pdfExtraction": "pypdf text extraction; OCR and access-control bypass are not used",\n'
              '            "shareholderEvidence": "Only explicit pre/post-IPO shareholder table rows with same-row shares and ownership are published",\n'
              '            "nameResolution": "Prospectus definitions or the exact shareholder basic-information block",\n'
              '            "contactEvidence": "Only fields inside the exact shareholder basic-information block",\n'
              '            "retention": "previous verified company record retained on source failure",',
              1,
          )

          text = text.replace(
              '            for key in ("name", "investorType", "sourceSection", "evidence"):',
              '            for key in ("name", "disclosedName", "investorType", "sourceSection", "evidence", "nameResolution"):',
              1,
          )

          prospectus_anchor = '''        if not _official_prospectus_host(str(prospectus.get("url", ""))):
              errors.append(f"{slug}: prospectus URL is not official")
          '''
          prospectus_checks = '''        if not _official_prospectus_host(str(prospectus.get("url", ""))):
              errors.append(f"{slug}: prospectus URL is not official")
              title = str(prospectus.get("title", ""))
              if re.search(r"<[^>]+>", title):
                  errors.append(f"{slug}: prospectus title contains HTML markup")
          '''
          if "prospectus title contains HTML markup" not in text:
              if prospectus_anchor not in text:
                  raise SystemExit("prospectus validation anchor not found")
              text = text.replace(prospectus_anchor, prospectus_checks, 1)

          investor_anchor = '''            if int(investor.get("sourcePage", 0)) <= 0:
                  errors.append(f"{slug}: investor {name} missing source page")
              investor_count += 1
          '''
          investor_checks = '''            if int(investor.get("sourcePage", 0)) <= 0:
                  errors.append(f"{slug}: investor {name} missing source page")
              evidence = clean_text(investor.get("evidence"), 500)
              if not evidence:
                  errors.append(f"{slug}: investor {name} missing table-row evidence")
              try:
                  shares = float(investor.get("preIpoShares", 0))
                  ownership = float(investor.get("preIpoOwnershipPct", 0))
              except (TypeError, ValueError):
                  shares = 0
                  ownership = 0
              if shares <= 0 or not (0 < ownership <= 100):
                  errors.append(f"{slug}: investor {name} missing valid same-row holding facts")
              if investor.get("nameResolution") not in {"definitions", "basic-information"}:
                  errors.append(f"{slug}: investor {name} lacks prospectus name resolution")
              if any(fragment in name for fragment in prospectus_parser.NARRATIVE_NAME_FRAGMENTS):
                  errors.append(f"{slug}: narrative phrase published as investor: {name}")
              if name in prospectus_parser.GENERIC_NAMES:
                  errors.append(f"{slug}: generic institution name published: {name}")
              company_name = clean_text(company.get("name"), 120)
              if company_name and prospectus_parser.normalize_name(company_name) in prospectus_parser.normalize_name(name):
                  errors.append(f"{slug}: issuer published as its own investor: {name}")
              investor_count += 1
          '''
          if "missing valid same-row holding facts" not in text:
              if investor_anchor not in text:
                  raise SystemExit("investor validation anchor not found")
              text = text.replace(investor_anchor, investor_checks, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile \
            tools/crawl_star_market_investors.py \
            tools/star_market_prospectus_parser.py
          python -m unittest \
            tests.test_star_market_investors \
            tests.test_star_market_investor_privacy_scope \
            tests.test_star_market_prospectus_parser

      - name: Update dedicated production workflow gates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/star-market-investor-refresh.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "            tools/crawl_star_market_investors.py \\\n              tools/cninfo_structured_disclosures.py",
              "            tools/crawl_star_market_investors.py \\\n              tools/star_market_prospectus_parser.py \\\n              tools/cninfo_structured_disclosures.py",
              1,
          )
          text = text.replace(
              "          python -m unittest tests.test_star_market_investors",
              "          python -m unittest \\\n            tests.test_star_market_investors \\\n            tests.test_star_market_investor_privacy_scope \\\n            tests.test_star_market_prospectus_parser",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit parser integration
        run: |
          if git diff --quiet; then
            echo "No integration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/crawl_star_market_investors.py \
            .github/workflows/star-market-investor-refresh.yml
          git commit -m "fix: require structured STAR shareholder evidence"
          git push origin HEAD:${{ github.head_ref }}
