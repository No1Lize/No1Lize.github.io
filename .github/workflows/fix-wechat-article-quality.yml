name: One-time improve WeChat article quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-wechat-article-quality.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          parser = Path('tools/wechat_public_sources.py')
          text = parser.read_text(encoding='utf-8')
          old = '''    companies = _matched(spec.get("trackedCompanies", []), text, crawler)\n    people = _matched(spec.get("trackedPeople", []), text, crawler)\n    keywords = _matched(_specific_keywords(spec.get("keywords", [])), text, crawler)'''
          new = '''    companies = _matched(spec.get("trackedCompanies", []), text, crawler)\n    company_keys = {_clean(value, 120).casefold() for value in companies}\n    people = [\n        value\n        for value in _matched(spec.get("trackedPeople", []), text, crawler)\n        if _clean(value, 120).casefold() not in company_keys\n    ]\n    keywords = _matched(_specific_keywords(spec.get("keywords", [])), text, crawler)'''
          if old not in text:
              raise SystemExit('entity filter anchor not found')
          text = text.replace(old, new, 1)

          old = '''    content = parser.content\n    summary = _clean(\n        parser.meta.get("description")\n        or parser.meta.get("og:description")\n        or parser.meta.get("twitter:description")\n        or content[:650]\n        or fallback_summary,\n        500,\n    )'''
          new = '''    content = parser.content\n    meta_summary = _clean(\n        parser.meta.get("description")\n        or parser.meta.get("og:description")\n        or parser.meta.get("twitter:description"),\n        500,\n    )\n    summary = (\n        meta_summary\n        if len(meta_summary) >= 80\n        else _clean(content[:650] or fallback_summary or meta_summary, 500)\n    )'''
          if old not in text:
              raise SystemExit('summary anchor not found')
          text = text.replace(old, new, 1)

          old = '''    article["sector"] = spec.get("sector") or article.get("sector")\n    article["wechatAccount"] = account'''
          new = '''    article["sector"] = spec.get("sector") or article.get("sector")\n    if isinstance(article.get("source"), dict):\n        # Preserve the signed public URL exactly. The generic normalizer treats\n        # ``&timestamp`` as the HTML entity ``&times`` when no semicolon is present.\n        article["source"]["url"] = url\n    article["wechatAccount"] = account'''
          if old not in text:
              raise SystemExit('source URL anchor not found')
          text = text.replace(old, new, 1)
          parser.write_text(text, encoding='utf-8')

          sogou = Path('tools/wechat_sogou_index.py')
          text = sogou.read_text(encoding='utf-8')
          old = 'return f"https://weixin.sogou.com/weixin?type=2&query={quote(_query_term(spec))}&page={max(1, page)}&ie=utf8"'
          new = 'return f"https://weixin.sogou.com/weixin?type=2&query={quote(_query_term(spec))}&page={max(1, page)}&ie=utf8&tsn=1"'
          if old not in text:
              raise SystemExit('Sogou recency anchor not found')
          sogou.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_wechat_public_sources.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '"trackedPeople": ["埃隆·马斯克"],',
              '"trackedPeople": ["埃隆·马斯克", "SpaceX"],',
              1,
          )
          anchor = '''        self.assertIn("埃隆·马斯克", article["mentionedPeople"])\n        self.assertEqual(article["source"]["platform"], "微信")'''
          replacement = '''        self.assertIn("埃隆·马斯克", article["mentionedPeople"])\n        self.assertNotIn("SpaceX", article["mentionedPeople"])\n        self.assertEqual(article["source"]["platform"], "微信")'''
          if anchor not in text:
              raise SystemExit('entity test anchor not found')
          text = text.replace(anchor, replacement, 1)
          tests.write_text(text, encoding='utf-8')

          sogou_tests = Path('tests/test_wechat_sogou_index.py')
          text = sogou_tests.read_text(encoding='utf-8')
          anchor = '        self.assertIn("type=2", url)\n'
          if anchor not in text:
              raise SystemExit('Sogou URL test anchor not found')
          text = text.replace(anchor, anchor + '        self.assertIn("tsn=1", url)\n', 1)
          sogou_tests.write_text(text, encoding='utf-8')
          PY
      - name: Verify WeChat suite
        run: |
          python -m py_compile tools/wechat_public_sources.py tools/wechat_sogou_index.py tools/wechat_sogou_bridge.py
          python -m unittest tests.test_wechat_sogou_index tests.test_wechat_public_sources tests.test_wechat_source_registry
      - name: Commit verified quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_public_sources.py tools/wechat_sogou_index.py \
            tests/test_wechat_public_sources.py tests/test_wechat_sogou_index.py
          git commit -m "fix: improve WeChat summaries, entities and signed links"
          git pull --rebase origin main
          git push origin HEAD:main
