name: Refresh package lock with maintenance backports

on:
  pull_request:
    paths:
      - package.json
      - scripts/audit-dependencies.mjs
      - .github/workflows/refresh-package-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          node scripts/audit-dependencies.mjs
          node -e "const lock=require('./package-lock.json'); if (lock.lockfileVersion !== 3 || !lock.packages) process.exit(1)"
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "build: pin compatible dependency security backports"
          git push origin HEAD:${{ github.head_ref }}
