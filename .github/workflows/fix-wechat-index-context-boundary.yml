name: One-time fix WeChat index context boundaries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-wechat-index-context-boundary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact context-boundary patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/wechat_registry_bridge.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _context(parser: PublicIndexParser, position: int) -> str:\n    start = max(0, position - 4)\n    end = min(len(parser.text_parts), position + 10)\n    return _clean(" ".join(parser.text_parts[start:end]), 1200)'''
          new = '''def _context(\n    parser: PublicIndexParser,\n    position: int,\n    next_position: int | None = None,\n) -> str:\n    start = max(0, position)\n    natural_end = min(len(parser.text_parts), position + 10)\n    end = min(natural_end, next_position) if next_position is not None else natural_end\n    return _clean(" ".join(parser.text_parts[start:end]), 1200)'''
          if old not in text:
              raise SystemExit('context function anchor not found')
          text = text.replace(old, new, 1)

          old = '''    for link in parser.links:\n        url = crawler.normalize_url(str(link.get("url", "")))'''
          new = '''    for index, link in enumerate(parser.links):\n        url = crawler.normalize_url(str(link.get("url", "")))'''
          if old not in text:
              raise SystemExit('link loop anchor not found')
          text = text.replace(old, new, 1)

          old = '''        context = _context(parser, int(link.get("position", 0)))'''
          new = '''        position = int(link.get("position", 0))\n        next_position = (\n            int(parser.links[index + 1].get("position", 0))\n            if index + 1 < len(parser.links)\n            else None\n        )\n        context = _context(parser, position, next_position)'''
          if old not in text:
              raise SystemExit('context call anchor not found')
          text = text.replace(old, new, 1)

          old = '''            parser, int(link.get("position", 0)), str(link.get("title", ""))'''
          new = '''            parser, position, str(link.get("title", ""))'''
          if old not in text:
              raise SystemExit('title position anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify WeChat pipeline
        run: |
          python -m py_compile \
            tools/wechat_registry_bridge.py \
            tools/wechat_sogou_index.py \
            tools/wechat_sogou_bridge.py \
            tools/crawl_with_wechat_registry.py
          python -m unittest \
            tests.test_wechat_public_sources \
            tests.test_wechat_source_registry \
            tests.test_wechat_registry_bridge \
            tests.test_wechat_public_index_fallback
          python -m unittest discover -s tests -p "test_*.py"
      - name: Commit verified boundary fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wechat_registry_bridge.py tests/test_wechat_public_index_fallback.py
          git commit -m "fix: isolate account context for WeChat index rows"
          git pull --rebase origin main
          git push origin HEAD:main
