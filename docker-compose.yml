services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lize
      POSTGRES_USER: lize
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lize"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://lize:local-only-password@postgres:5432/lize
      INTERNAL_SYNC_SECRET: local-development-secret
      SEC_USER_AGENT: LizeRoadOne local@example.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
