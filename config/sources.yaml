sources:
  - id: company-news
    name: 公司官网与投资者关系
    source_type: company
    base_url: config/intelligence_sources.json
    access_method: public_html
    reliability_level: 2
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: OpenAI、Anthropic、Figure、xAI、Pony.ai、WeRide、Rocket Lab、IonQ、CATL
  - id: sec
    name: SEC EDGAR
    source_type: regulator
    base_url: https://data.sec.gov/
    access_method: public_json
    reliability_level: 1
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
  - id: finance-and-venture-media
    name: 金融、创投与科技媒体
    source_type: media
    base_url: config/intelligence_sources.json
    access_method: rss_or_public_json
    reliability_level: 3
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: TechCrunch、VentureBeat、钛媒体、雷峰网、新浪财经、PR Newswire
  - id: official-blogs
    name: AI 官方博客
    source_type: company
    base_url: config/intelligence_sources.json
    access_method: rss
    reliability_level: 2
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: Google DeepMind、Google AI
  - id: x-public-profiles
    name: X 公开资料页
    source_type: social
    base_url: https://syndication.twitter.com/
    access_method: public_syndication
    reliability_level: 2
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: 仅收录机构或本人公开发文的元数据、短摘要和原帖链接
  - id: open-papers
    name: OpenAlex 与 arXiv
    source_type: database
    base_url: config/intelligence_sources.json
    access_method: public_api_or_atom
    reliability_level: 4
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
  - id: wechat-public-index
    name: 微信公众号公开索引
    source_type: media
    base_url: https://www.bing.com/search?format=rss
    access_method: public_search_index
    reliability_level: 6
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: 只接受最终链接为 mp.weixin.qq.com 的公开结果；无结果时显示 empty，不伪造内容
  - id: finance-media-index
    name: 金融媒体公开索引
    source_type: media
    base_url: https://www.bing.com/search?format=rss
    access_method: public_search_index
    reliability_level: 3
    update_frequency: every_2_hours
    is_enabled: true
    requires_api_key: false
    notes: 最终链接必须命中配置中的严格域名白名单
